<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>toG 家长端 · 学习反馈 Demo</title>
<style>
:root {
  --ink: #183044;
  --muted: #7c8d9d;
  --line: #e8eef2;
  --paper: #f4f8f8;
  --card: #ffffff;
  --brand: #13a38e;
  --brand-dark: #087e70;
  --brand-soft: #e4f6f1;
  --blue: #4489da;
  --blue-soft: #eaf3ff;
  --orange: #f2a45e;
  --orange-soft: #fff2e3;
  --purple: #8c75d8;
  --purple-soft: #f2effc;
  --danger: #db806d;
  --shadow: 0 12px 30px rgba(25, 55, 72, .07);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #edf3f2 0%, #f7f7f2 100%);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
}
button, input { font: inherit; }
button { border: 0; cursor: pointer; }

.demo-shell { min-height: 100vh; display: flex; justify-content: center; padding: 28px 16px; }
.phone {
  position: relative;
  width: min(100%, 408px);
  min-height: 812px;
  max-height: 920px;
  overflow: hidden;
  background: var(--paper);
  border: 8px solid #263945;
  border-radius: 38px;
  box-shadow: 0 28px 70px rgba(23, 49, 65, .2);
}
.phone::before { content: ''; position: absolute; z-index: 20; top: 0; left: 50%; transform: translateX(-50%); width: 112px; height: 24px; background: #263945; border-radius: 0 0 16px 16px; }
.statusbar { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 10px 18px 0; color: #667987; font-size: 11px; font-weight: 700; }
.status-icons { display: flex; gap: 7px; align-items: center; }
.signal { width: 14px; height: 9px; display: inline-flex; align-items: flex-end; gap: 1px; }
.signal i { width: 2px; background: currentColor; border-radius: 1px; }
.signal i:nth-child(1) { height: 3px; }.signal i:nth-child(2) { height: 5px; }.signal i:nth-child(3) { height: 7px; }.signal i:nth-child(4) { height: 9px; }
.battery { width: 18px; height: 9px; border: 1px solid currentColor; border-radius: 3px; position: relative; }.battery::after { content: ''; position: absolute; right: -3px; top: 2px; width: 2px; height: 4px; background: currentColor; border-radius: 0 1px 1px 0; }.battery span { display: block; width: 12px; height: 5px; margin: 1px; border-radius: 2px; background: var(--brand); }

.app { height: calc(100vh - 56px); min-height: 770px; max-height: 878px; overflow: hidden; position: relative; }
.view { height: 100%; overflow-y: auto; padding: 16px 17px 94px; scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 17px; }
.brand-lockup { display: flex; align-items: center; gap: 9px; }
.brand-mark { width: 30px; height: 30px; background: linear-gradient(135deg, var(--brand), #5dc7b1); color: #fff; border-radius: 11px; display: grid; place-items: center; font-size: 14px; font-weight: 800; box-shadow: 0 5px 10px rgba(19, 163, 142, .2); }
.topbar h1 { margin: 0; font-size: 19px; letter-spacing: -.5px; }
.topbar-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 12px; background: #fff; color: #7c8d9d; box-shadow: 0 3px 12px rgba(30, 55, 68, .05); position: relative; }
.icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); border: 2px solid #fff; }
.eyebrow { color: var(--brand-dark); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
.title { margin: 5px 0 0; font-size: 24px; letter-spacing: -.7px; }
.subtle { color: var(--muted); font-size: 12px; line-height: 1.65; }
.muted { color: var(--muted); }

.student-card { margin: 18px 0 15px; padding: 17px; border-radius: 22px; background: linear-gradient(135deg, #173e4c 0%, #236a70 100%); color: #fff; position: relative; overflow: hidden; box-shadow: 0 16px 24px rgba(24, 74, 82, .18); }
.student-card::after { content: ''; position: absolute; width: 160px; height: 160px; border: 1px solid rgba(255,255,255,.14); border-radius: 50%; right: -54px; top: -60px; box-shadow: 0 0 0 20px rgba(255,255,255,.04), 0 0 0 42px rgba(255,255,255,.03); }
.student-row { display: flex; align-items: center; gap: 11px; position: relative; z-index: 1; }
.avatar { width: 43px; height: 43px; border-radius: 15px; background: linear-gradient(145deg, #ffd6ad, #e99d80); display: grid; place-items: center; color: #8d4e48; font-weight: 800; font-size: 17px; }
.student-name { font-size: 17px; font-weight: 800; }.student-school { margin-top: 3px; font-size: 11px; color: rgba(255,255,255,.7); }
.student-card .updated { position: relative; z-index: 1; margin-top: 18px; display: flex; justify-content: space-between; font-size: 10px; color: rgba(255,255,255,.65); }.updated strong { color: #d3f5e9; font-weight: 600; }

.section-head { display: flex; align-items: center; justify-content: space-between; margin: 21px 1px 10px; }.section-head h2 { margin: 0; font-size: 16px; letter-spacing: -.3px; }.section-head button { background: transparent; color: var(--brand-dark); font-size: 12px; padding: 4px 0; }
.card { background: var(--card); border: 1px solid rgba(221, 232, 233, .7); border-radius: 18px; box-shadow: var(--shadow); }
.overview { padding: 16px; }.overview-head { display: flex; align-items: center; justify-content: space-between; }.overview-head strong { font-size: 14px; }.period-chip { background: var(--brand-soft); color: var(--brand-dark); padding: 5px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; }.overview-range { display: flex; gap: 6px; margin-top: 13px; }.overview-range button { flex: 1; padding: 7px 4px; border-radius: 9px; background: #f3f7f6; color: var(--muted); font-size: 10px; font-weight: 800; }.overview-range button.active { color: var(--brand-dark); background: var(--brand-soft); }
.metric-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; margin-top: 15px; }.metric { padding: 12px; background: #f8fbfa; border-radius: 14px; min-height: 78px; }.metric-label { color: var(--muted); font-size: 11px; }.metric-value { display: flex; align-items: baseline; gap: 3px; margin-top: 6px; font-size: 23px; font-weight: 800; letter-spacing: -.8px; }.metric-unit { font-size: 10px; color: var(--muted); font-weight: 600; }.metric-diff { font-size: 10px; margin-top: 4px; }.up { color: var(--brand-dark); }.down { color: var(--danger); }.neutral { color: var(--muted); }

.task-card { padding: 15px; }.task-card .card-title, .content-card .card-title { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 800; }.count-pill { padding: 4px 8px; color: var(--brand-dark); background: var(--brand-soft); border-radius: 999px; font-size: 10px; }.progress-row { display: flex; align-items: center; gap: 10px; margin: 15px 0 7px; }.progress-track { height: 8px; flex: 1; background: #edf2f1; border-radius: 8px; overflow: hidden; }.progress-fill { height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--brand), #69cab5); }.progress-value { font-size: 12px; font-weight: 800; }.card-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }.card-link { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--brand-dark); font-size: 11px; font-weight: 700; }

.dual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }.content-card { padding: 14px; min-height: 142px; }.content-card.ai { background: linear-gradient(145deg, #fff, #fbf9ff); }.content-card .card-title { align-items: flex-start; gap: 8px; }.mini-icon { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 10px; background: var(--orange-soft); color: #d98b3e; font-size: 14px; flex-shrink: 0; }.ai .mini-icon { background: var(--purple-soft); color: var(--purple); }.card-title-text { flex: 1; }.card-title-text small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; font-weight: 500; }.big-number { margin-top: 17px; font-size: 22px; font-weight: 800; }.big-number span { font-size: 10px; color: var(--muted); font-weight: 600; }.mini-caption { margin-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.5; }.content-card button { margin-top: 11px; background: transparent; color: var(--brand-dark); font-size: 10px; font-weight: 700; padding: 0; }

.report-banner { display: flex; align-items: center; gap: 12px; padding: 14px; margin-top: 14px; background: linear-gradient(135deg, #e6f7f2, #f8fcf9); border: 1px solid #ccece2; border-radius: 17px; }.report-symbol { width: 35px; height: 35px; border-radius: 12px; background: #fff; display: grid; place-items: center; font-size: 17px; box-shadow: 0 5px 12px rgba(19, 163, 142, .1); }.report-copy { flex: 1; }.report-copy strong { display: block; font-size: 12px; }.report-copy span { display: block; margin-top: 3px; font-size: 10px; color: var(--muted); }.report-banner button { background: var(--brand); color: #fff; border-radius: 10px; padding: 8px 10px; font-size: 10px; font-weight: 800; white-space: nowrap; }

.bottom-nav { position: absolute; z-index: 8; bottom: 0; left: 0; right: 0; height: 76px; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(255,255,255,.94); border-top: 1px solid rgba(224,234,233,.8); backdrop-filter: blur(14px); padding: 9px 8px 7px; }.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; background: transparent; color: #9aabb5; font-size: 10px; font-weight: 700; }.nav-item .nav-icon { width: 31px; height: 27px; display: grid; place-items: center; border-radius: 11px; font-size: 17px; }.nav-item.active { color: var(--brand-dark); }.nav-item.active .nav-icon { background: var(--brand-soft); }

.segmented { display: flex; padding: 4px; background: #eaf0ef; border-radius: 12px; }.segmented button { flex: 1; padding: 8px 4px; background: transparent; color: var(--muted); border-radius: 9px; font-size: 11px; font-weight: 700; }.segmented button.active { background: #fff; color: var(--brand-dark); box-shadow: 0 3px 8px rgba(31,65,72,.08); }
.trend-card { padding: 15px; margin-top: 13px; }.trend-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }.trend-card h3 { margin: 0; font-size: 14px; }.trend-caption { margin-top: 4px; font-size: 10px; color: var(--muted); }.subject-filter { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 12px; }.subject-filter button { padding: 5px 8px; border-radius: 8px; background: #f3f7f6; color: var(--muted); font-size: 9px; font-weight: 800; }.subject-filter button.active { color: var(--brand-dark); background: var(--brand-soft); }.trend-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }.trend-metric { padding: 9px 10px; background: #f8fbfa; border-radius: 11px; }.trend-metric b { display: block; font-size: 17px; }.trend-metric span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }.bars { height: 125px; display: flex; align-items: flex-end; gap: 12px; padding: 20px 8px 0; border-bottom: 1px solid var(--line); }.bar-col { height: 100%; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; }.bar { width: 20px; min-height: 10px; border-radius: 7px 7px 3px 3px; background: linear-gradient(180deg, #61cbb6, #13a38e); }.bar-label { font-size: 9px; color: var(--muted); }.bar-value { font-size: 9px; color: var(--brand-dark); font-weight: 800; }.trend-foot { display: flex; justify-content: space-between; padding-top: 10px; font-size: 10px; color: var(--muted); }.trend-foot strong { color: var(--brand-dark); }
.tab-row { display: flex; gap: 19px; margin-top: 18px; border-bottom: 1px solid var(--line); }.tab { padding: 0 0 10px; color: var(--muted); font-size: 13px; font-weight: 700; background: transparent; border-bottom: 2px solid transparent; }.tab.active { color: var(--brand-dark); border-color: var(--brand); }
.list { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }.list-item { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: 0 4px 16px rgba(33, 62, 74, .04); }.list-row { display: flex; align-items: center; gap: 10px; }.subject-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); }.subject-dot.math { background: var(--purple); }.subject-dot.eng { background: var(--orange); }.list-title { flex: 1; font-size: 13px; font-weight: 800; }.tag { padding: 4px 7px; border-radius: 7px; font-size: 9px; font-weight: 800; }.tag.done { background: var(--brand-soft); color: var(--brand-dark); }.tag.pending { background: var(--orange-soft); color: #ba7732; }.list-desc { margin: 9px 0 0 19px; color: var(--muted); font-size: 10px; }.list-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px solid #f0f3f3; color: var(--muted); font-size: 10px; }.list-bottom strong { color: var(--ink); font-size: 12px; }.list-item.clickable { cursor: pointer; transition: transform .18s, box-shadow .18s; }.list-item.clickable:active { transform: scale(.985); }.self-card { padding: 15px; }.self-card + .self-card { margin-top: 10px; }.self-card h3 { margin: 0; font-size: 13px; }.self-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 13px; }.self-stat { background: #f7faf9; border-radius: 11px; padding: 10px 6px; text-align: center; }.self-stat b { display: block; font-size: 16px; }.self-stat span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }.knowledge { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }.knowledge span { padding: 6px 8px; border-radius: 8px; background: var(--blue-soft); color: #4a7bbc; font-size: 10px; }.method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }.method-card { min-height: 132px; padding: 12px; border-radius: 16px; background: #fff; border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(33, 62, 74, .04); cursor: pointer; }.method-card:active { transform: scale(.985); }.method-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 10px; background: var(--orange-soft); color: #c77c36; font-size: 15px; }.method-card:nth-child(2) .method-icon { background: var(--blue-soft); color: var(--blue); }.method-card:nth-child(3) .method-icon { background: var(--purple-soft); color: var(--purple); }.method-card h3 { margin: 10px 0 4px; font-size: 11px; }.method-card p { margin: 0; color: var(--muted); font-size: 9px; line-height: 1.45; }.method-card strong { display: block; margin-top: 9px; color: var(--brand-dark); font-size: 11px; }.method-card.detail { min-height: 116px; }.method-card.detail h3 { font-size: 12px; }.method-subjects { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }.method-subjects span { padding: 4px 5px; border-radius: 6px; background: #f6f9f8; color: var(--muted); font-size: 8px; }.knowledge-map { padding: 15px; margin-top: 10px; }.knowledge-map h3 { margin: 0; font-size: 14px; }.knowledge-map p { margin: 5px 0 0; color: var(--muted); font-size: 10px; }.knowledge-subjects { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 13px; }.knowledge-subject { padding: 10px 4px; border-radius: 11px; background: #f7faf9; text-align: center; cursor: pointer; }.knowledge-subject:active { transform: scale(.97); }.knowledge-subject b { display: block; font-size: 13px; }.knowledge-subject span { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; }.knowledge-subject i { display: block; margin: 7px auto 0; width: 31px; height: 5px; border-radius: 5px; background: var(--blue); }.knowledge-subject:nth-child(2) i { background: var(--orange); }.knowledge-subject:nth-child(3) i { background: var(--purple); }.knowledge-subject:nth-child(4) i { background: var(--brand); }

.report-head { padding: 17px; background: linear-gradient(135deg, #17444f, #29776e); border-radius: 21px; color: #fff; box-shadow: 0 16px 24px rgba(24, 74, 82, .16); }.report-head h2 { margin: 7px 0 5px; font-size: 21px; letter-spacing: -.5px; }.report-head p { margin: 0; color: rgba(255,255,255,.7); font-size: 11px; }.report-head .report-period { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 10px; color: rgba(255,255,255,.7); }.report-head strong { color: #d6f8ec; }.report-quote { margin-top: 15px; padding: 13px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.12); border-radius: 13px; font-size: 12px; line-height: 1.6; color: #f1fffb; }.report-section { padding: 15px; margin-top: 12px; }.report-section-title { display: flex; align-items: center; justify-content: space-between; }.report-section-title h3 { margin: 0; font-size: 14px; }.report-section-title span { color: var(--brand-dark); font-size: 11px; font-weight: 800; }.report-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 13px; }.report-metric { background: #f7faf9; border-radius: 11px; padding: 10px 5px; text-align: center; }.report-metric b { display: block; font-size: 18px; }.report-metric span { display: block; margin-top: 3px; font-size: 9px; color: var(--muted); }.report-note { margin-top: 12px; font-size: 10px; line-height: 1.65; color: var(--muted); }.highlight { display: flex; gap: 8px; margin-top: 11px; padding: 11px; background: #fbfcf8; border-radius: 11px; font-size: 11px; line-height: 1.55; }.highlight i { color: var(--brand); font-style: normal; }.data-note { margin-top: 15px; padding: 10px 12px; border-radius: 11px; background: #eef4f4; color: var(--muted); font-size: 10px; line-height: 1.55; }

.profile-card { padding: 17px; }.profile-main { display: flex; gap: 11px; align-items: center; }.profile-list { margin-top: 15px; border-top: 1px solid var(--line); }.profile-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--line); font-size: 12px; }.profile-row:last-child { border-bottom: 0; }.profile-row .left { display: flex; gap: 9px; align-items: center; }.profile-row .picon { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 9px; background: #f1f6f6; color: var(--brand-dark); }.chevron { color: #a9b7be; font-size: 16px; }.switch { width: 38px; height: 22px; border-radius: 14px; padding: 3px; background: #d5dfe0; transition: .2s; }.switch::after { content: ''; display: block; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.12); transition: .2s; }.switch.on { background: var(--brand); }.switch.on::after { transform: translateX(16px); }.bind-button { width: 100%; padding: 12px; margin-top: 13px; border-radius: 12px; background: var(--brand-soft); color: var(--brand-dark); font-size: 11px; font-weight: 800; }

.drawer-mask { position: absolute; z-index: 15; inset: 0; background: rgba(21, 40, 50, .32); display: flex; align-items: flex-end; }.drawer { width: 100%; max-height: 80%; overflow-y: auto; padding: 12px 17px 25px; background: #fff; border-radius: 25px 25px 0 0; animation: rise .2s ease-out; }.drawer-grip { width: 38px; height: 4px; border-radius: 4px; background: #dbe3e5; margin: 0 auto 16px; }.drawer-head { display: flex; align-items: center; justify-content: space-between; }.drawer-head h2 { margin: 0; font-size: 17px; }.close { width: 29px; height: 29px; border-radius: 50%; background: #f1f5f5; color: var(--muted); }.drawer-content { margin-top: 16px; }.detail-row { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 11px; }.detail-row span { color: var(--muted); }.detail-row strong { font-size: 12px; }.wrong-box { margin-top: 13px; padding: 12px; border-radius: 13px; background: #fff8f3; color: #ac734d; font-size: 11px; line-height: 1.6; }.bind-panel { padding: 8px 2px 5px; }.bind-panel h2 { margin: 0; font-size: 19px; }.bind-panel p { margin: 8px 0 17px; }.bind-input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 12px; outline: 0; color: var(--ink); }.bind-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(19,163,142,.1); }.primary-btn { width: 100%; padding: 12px; margin-top: 12px; border-radius: 12px; color: #fff; background: var(--brand); font-size: 12px; font-weight: 800; }.secondary-btn { width: 100%; padding: 11px; margin-top: 8px; border-radius: 12px; color: var(--brand-dark); background: var(--brand-soft); font-size: 12px; font-weight: 800; }
.toast { position: absolute; z-index: 30; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(10px); max-width: 80%; padding: 10px 14px; border-radius: 12px; color: #fff; background: rgba(21, 44, 54, .92); font-size: 11px; opacity: 0; pointer-events: none; transition: .25s; white-space: nowrap; }.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.fade { animation: fade .22s ease-out; } @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } } @keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
@media (max-width: 430px) { .demo-shell { padding: 0; }.phone { width: 100%; min-height: 100vh; max-height: none; border: 0; border-radius: 0; }.phone::before { display: none; }.app { height: calc(100vh - 34px); min-height: calc(100vh - 34px); max-height: none; } }
 .subject-compare { margin-top: 12px; display: grid; gap: 7px; }.subject-compare-row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; background: #f7faf9; border-radius: 10px; }.subject-compare-row .name { width: 36px; font-size: 10px; font-weight: 800; }.subject-compare-row .bar-wrap { flex: 1; height: 6px; background: #e7efed; border-radius: 6px; overflow: hidden; }.subject-compare-row .bar-wrap i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #7acdbb, #13a38e); }.subject-compare-row .value { width: 60px; color: var(--muted); text-align: right; font-size: 9px; }

; }.auth-label { display: block; margin-top: 18px; color: var(--muted); font-size: 11px; }.auth-input { width: 100%; padding: 12px; margin-top: 7px; border: 1px solid var(--line); border-radius: 12px; outline: 0; color: var(--ink); background: #fff; }.auth-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(19,163,142,.1); }.auth-code-row { display: flex; gap: 8px; }.auth-code-row .auth-input { flex: 1; }.auth-code-row button { flex: 0 0 auto; padding: 0 10px; border-radius: 10px; background: var(--brand-soft); color: var(--brand-dark); font-size: 10px; font-weight: 800; }.auth-divider { display: flex; align-items: center; gap: 9px; margin: 15px 0; color: #a1b0b7; font-size: 10px; }.auth-divider::before, .auth-divider::after { content: ''; height: 1px; flex: 1; background: var(--line); }.auth-link { width: 100%; padding: 0; margin-top: 13px; background: transparent; color: var(--brand-dark); font-size: 11px; font-weight: 800; }.auth-hint { margin-top: 13px; padding: 9px 10px; border-radius: 10px; background: #f7faf9; color: var(--muted); font-size: 10px; line-height: 1.55; }.auth-list { display: grid; gap: 8px; margin-top: 16px; }.auth-student { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 13px; background: #fff; text-align: left; }.auth-student.active { border-color: var(--brand); background: var(--brand-soft); }.auth-student input { accent-color: var(--brand); }.auth-student-main { flex: 1; }.auth-student-main strong { display: block; font-size: 12px; }.auth-student-main span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }.auth-actions { margin-top: 16px; }.auth-actions .secondary-btn { margin-top: 8px; }.auth-role-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 16px; }.auth-role { padding: 11px 6px; border: 1px solid var(--line); border-radius: 11px; background: #fff; color: var(--muted); font-size: 11px; font-weight: 700; function metric(label, value, unit, diff, tone = 'up', action = '') {
  return `<div class="metric${action ? ' clickable' : ''}"${action ? ` onclick="${action}" role="button" tabindex="0"` : ''}><div class="metric-label">${label}</div><div class="metric-value">${value}<span class="metric-unit">${unit || ''}</span></div>${diff ? `<div class="metric-diff ${tone}">${diff}</div>` : ''}</div>`;
}

function topbar(title, sub, action = '') {
  return `<div class="topbar"><div class="brand-lockup"><div class="brand-mark">to</div><div><h1>${title}</h1><div class="topbar-sub">${sub}</div></div></div>${action || '<button class="icon-btn" onclick="showToast(\'本周数据已同步\')" aria-label="数据同步状态">⌁</button>'}</div>`;
}

function rangeLabel(range) { return range === 'week' ? '9/1 — 9/7' : range === 'month' ? '9月1日 — 9月30日' : '2026 春季学期'; }
function changeHomeRange(range) { state.homeRange = range; render(); }
function setSubjectFilter(subject) { state.subjectFilter = subject; render(); }
function subjectButtons() {
  return [['all', '全科'], ['chinese', '语文'], ['math', '数学'], ['english', '英语'], ['physics', '物理']].map(([key, label]) => `<button class="${state.subjectFilter === key ? 'active' : ''}" onclick="setSubjectFilter('${key}')">${label}</button>`).join('');
}
function methodCards(detail = false) {
  return `<div class="method-grid">${DATA.methods.map(m => `<div class="method-card ${detail ? 'detail' : ''}" onclick="openDrawer('method', '${m.id}')"><div class="method-icon">${m.icon}</div><h3>${m.title}</h3><p>${m.desc}</p><strong>${m.value}</strong><span class="method-extra">${m.extra}</span>${m.subjects.length ? `<div class="method-subjects">${m.subjects.slice(0, detail ? m.subjects.length : 2).map(s => `<span>${s}</span>`).join('')}</div>` : ''}</div>`).join('')}</div>`;
}
function selfSubjectComparison() {
  const subjects = ['chinese', 'math', 'english', 'physics'];
  return `<div class="card self-card"><h3>自学分学科统计</h3><div class="subject-compare">${subjects.map(key => { const s = DATA.subjectStats[key]; const accuracy = s.accuracyTrend[s.accuracyTrend.length - 1]; return `<div class="subject-compare-row"><span class="name">${s.label}</span><span class="bar-wrap"><i style="width:${Math.max(18, s.self / 50 * 100)}%"></i></span><span class="value">${s.self} 题 · ${accuracy}%</span></div>`; }).join('')}</div></div>`;

function accuracyPoints(values) {
  const min = 60, max = 100;
  return values.map((value, index) => `${40 + index * 80},${102 - ((value - min) / (max - min)) * 72}`).join(' ');
}

function closeDrawer() { state.drawer = null; state.privacyOpen = false; render(); }
function toggleReminder() { state.reminderOn = !state.reminderOn; render(); showToast(state.reminderOn ? '已开启周报提醒（演示）' : '已关闭周报提醒'); }
function showToast(message) { clearTimeout(state.toastTimer); const el = document.getElementById('toast'); if (!el) return; el.textContent = message; el.classList.add('show'); state.toastTimer = setTimeout(() => el.classList.remove('show'), 2200); }
render();
</script>
</body>
</html>
