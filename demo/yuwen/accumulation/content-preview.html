    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink);background:#dfe5ee}button,select{font:inherit}button{border:0;cursor:pointer}.page{min-height:100vh;padding:20px}.tablet{width:100%;min-width:1120px;min-height:calc(100vh - 40px);margin:auto;background:#f7f9fc;border-radius:24px;overflow:hidden;box-shadow:0 25px 80px rgba(22,39,70,.2);display:grid;grid-template-columns:78px 1fr}.sidebar{background:#243453;color:#cbd6ec;display:flex;flex-direction:column;align-items:center;padding:23px 0;gap:18px}.brand{width:38px;height:38px;border-radius:13px;background:#fff;color:#355ac2;display:grid;place-items:center;font-weight:800;font-size:20px;margin-bottom:15px}.side-title{font-size:10px;line-height:1.5;text-align:center;color:#9fb0ce}.workspace{padding:30px 36px 42px;overflow:auto}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.08em;color:#8897ae;font-weight:750}.topbar h1{font-size:27px;line-height:1.2;margin:7px 0 8px;color:#2e405f}.topbar p{margin:0;color:#8190a7;font-size:13px}.top-actions{display:flex;gap:9px;align-items:center}.back-link,.outline-btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 13px;border-radius:10px;background:#fff;border:1px solid #dbe4f2;color:#617391;font-size:12px;text-decoration:none}.outline-btn:hover,.back-link:hover{border-color:#a9bdf1;color:var(--blue)}.preview-grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.catalog-card{padding:18px;position:sticky;top:0}.catalog-card h2,.detail-card h2{font-size:16px;margin:6px 0 16px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:11px;color:#8796ad;font-weight:700}.select{width:100%;padding:10px 11px;border:1px solid #dfe6f1;border-radius:10px;background:#fbfcff;color:#50617f;outline:none}.select:focus{border-color:#9db7f7;box-shadow:0 0 0 3px #edf3ff}.catalog-count{display:flex;justify-content:space-between;align-items:center;color:#91a0b4;font-size:11px;margin:18px 0 9px}.catalog-count b{color:#566b8d}.poem-list{display:grid;gap:8px;max-height:calc(100vh - 370px);overflow:auto;padding-right:2px}.poem-item{display:grid;grid-template-columns:35px 1fr auto;align-items:center;gap:9px;text-align:left;padding:11px 10px;background:#fbfcff;border:1px solid #e6ecf4;border-radius:12px;color:#4d6182}.poem-item:hover{border-color:#adc2f6;background:#f4f7ff}.poem-item.active{background:var(--blue-soft);border-color:#a8bdf4}.poem-index{width:28px;height:28px;border-radius:9px;background:#edf2f9;color:#8797ad;display:grid;place-items:center;font-size:11px;font-weight:800}.poem-item.active .poem-index{background:#dce7ff;color:var(--blue)}.poem-copy{min-width:0}.poem-copy b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.poem-copy small{display:block;color:#97a3b6;font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.poem-item.active .poem-copy b{color:#315fc8}.sort{font-size:10px;color:#a0adbf;white-space:nowrap}.detail-card{padding:23px;min-height:620px}.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding-bottom:18px;border-bottom:1px solid #eef1f6}.detail-title{display:flex;gap:13px;align-items:flex-start}.poem-symbol{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#eaf9f4,#dff0ff);color:#2885a1;display:grid;place-items:center;font-size:20px;font-weight:800}.detail-head h2{margin:0;font-family:"Songti SC","STSong",serif;font-size:25px;color:#2d405e}.author-line{margin-top:7px;color:#8290a5;font-size:12px}.locator{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:520px}.locator span{padding:6px 9px;border-radius:8px;background:#f6f8fb;border:1px solid #e8edf4;color:#71819a;font-size:10px;white-space:nowrap}.locator .id{color:#486cca;background:#f0f4ff;border-color:#d9e4ff;font-weight:750}.locator .trial{color:#b27b22;background:#fff8e7;border-color:#f4e3b2}.section-label{font-size:11px;color:#8291a7;font-weight:750;margin:19px 0 9px}.understand-panel{padding:17px 17px 14px;background:#fbfcff;border:1px solid #e6ecf5;border-radius:14px}.original{font-family:"Songti SC","STSong",serif;color:#34415b;font-size:18px;line-height:2.1;letter-spacing:.5px}.original-section+.original-section{border-top:1px dashed #e4eaf3;margin-top:13px;padding-top:13px}.paragraph-label{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#9aa8bb;font-size:10px;font-weight:750;margin-bottom:4px}.original-line{padding:3px 0}.original b{color:#2e69da;background:#edf3ff;border-radius:4px;padding:0 2px;font-weight:700}.sub-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.sub-tab{padding:8px 12px;border-radius:9px;background:#f4f6fa;color:#8290a5;font-size:11px}.sub-tab.active{background:#eaf9f4;color:var(--green);font-weight:750}.support-panel{padding:16px 17px;background:#fbfefd;border:1px solid #e2efec;border-radius:14px;color:#60718d;font-size:13px;line-height:1.9;white-space:normal;min-height:125px}.support-panel p{margin:0 0 9px}.support-panel p:last-child{margin-bottom:0}.detail-note{margin-top:15px;padding:10px 12px;background:#fff8e8;color:#9a7628;border:1px solid #f2e3b8;border-radius:10px;font-size:11px;line-height:1.7}.empty{padding:35px 15px;text-align:center;color:#9aa7b9;font-size:12px;border:1px dashed #ced9e9;border-radius:13px}.copy-btn{padding:6px 9px;border-radius:8px;background:#eef3ff;color:#4d71d1;font-size:10px}.copy-btn:hover{background:#dfe9ff}.mode-note{display:flex;align-items:center;gap:7px;margin-top:16px;color:#95a1b2;font-size:11px}.mode-note i{width:7px;height:7px;border-radius:50%;background:#38b49b;display:inline-block}.mini-link{color:#7e8da4;font-size:11px;text-decoration:none}.mini-link:hover{color:var(--blue)}#rotateHint{display:none;position:fixed;inset:0;background:#243453;z-index:20;color:white;align-items:center;justify-content:center;text-align:center}.hint-card{padding:30px}.hint-card h2{margin:12px 0 4px;font-size:20px}.hint-card p{color:#afbdd4;font-size:12px}@media(max-width:1050px),(max-height:680px){#rotateHint{display:flex}.page{padding:0}.tablet{display:none}}
    /* 预览页不绑定固定设备宽度，窄窗口下自动改为上下布局。 */

    .question-link{display:inline-flex;align-items:center;justify-content:center;padding:6px 8px;border-radius:8px;background:#fff5e7;color:#b47722;font-size:10px;white-space:nowrap}.question-link:hover{background:#ffedcc}.question-modal{position:fixed;inset:0;z-index:30;background:rgba(30,44,70,.48);display:flex;align-items:center;justify-content:center;padding:22px}.question-dialog{width:min(820px,100%);max-height:min(86vh,820px);background:#fff;border-radius:18px;box-shadow:0 24px 80px rgba(22,39,70,.3);display:flex;flex-direction:column;overflow:hidden}.question-dialog-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 22px;border-bottom:1px solid #edf1f6}.question-dialog-head h3{margin:0;color:#2e405f;font-size:19px}.question-dialog-head p{margin:6px 0 0;color:#8a98ad;font-size:11px}.question-close{width:30px;height:30px;border-radius:8px;background:#f3f6fa;color:#71819a;font-size:20px;line-height:30px}.question-list{overflow:auto;padding:14px 22px 20px}.question-row{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #eef2f6;color:#50627e;font-size:13px;line-height:1.9}.question-row:last-child{border-bottom:0}.question-no{width:24px;height:24px;border-radius:7px;background:#fff0d9;color:#b47722;font-size:11px;line-height:24px;text-align:center;font-weight:750}.question-stem mark{background:#fff0b8;color:#8a5b00;border-radius:4px;padding:2px 4px;font-weight:750}
    .poem-item{grid-template-columns:35px minmax(0,1fr) auto auto}

          <div><div class="eyebrow">语文自学 · 内容预览</div><h1>古诗文「理解与背诵」预览</h1><p>用于确认教材挂载关系、篇目内容和学生端详情展示效果。</p></div>

  <script>
    const poems = [{"id":900002,"title":"短歌行","author":"曹操","genre":"古诗","dynasty":"东汉末","content":"对酒当歌，人生几何！譬如朝露，去日苦多。\\n慨当以慷，忧思难忘。何以解忧？唯有<b>杜康</b>。\\n青青子衿，悠悠我心。但为君故，沉吟至今。\\n呦呦鹿鸣，食野之<b>苹</b>。我有嘉宾，鼓瑟吹笙。\\n明明如月，何时可<b>掇</b>？忧从中来，不可断绝。\\n越陌度阡，枉用相存。契阔谈<b>䜩</b>，心念旧恩。\\n月明星稀，乌鹊南飞。绕树三<b>匝</b>，何枝可依？\\n山不厌高，海不厌深。周公吐<b>哺</b>，天下归心。","translation":"面对美酒应当高歌，人生短促，好像早晨的露水，苦于过去的日子已经太多。\\n慷慨高歌，忧思难以忘怀。用什么来排解忧愁？只有杜康造的美酒。\\n有学识的贤才啊，我一直思念你们，只是因为你们的缘故，我低声吟诵到今天。\\n鹿群呦呦地叫，在野外吃着艾蒿。我有尊贵的宾客，奏瑟吹笙来欢迎。\\n明亮的月亮，什么时候可以摘取呢？忧愁从心中涌出，不能断绝。\\n贤才穿过田间小路屈驾来访，久别重逢，畅谈宴饮，重温往日的恩情。\\n月光明亮，星星稀少，乌鹊向南飞去。绕树飞了三圈，却找不到可以栖息的枝条。\\n高山不嫌土石多，大海不嫌水流深。我愿像周公一样礼贤下士，使天下的贤才都归附于我。","pinyin":null,"annotation":"杜康：代指酒。\\n子衿：代指有学识的人。\\n苹：艾蒿。\\n掇：拾取、摘取。\\n契阔：久别重逢。\\n谈䜩：欢饮畅谈。\\n匝：周、圈。\\n吐哺：吐出嘴里的食物，典出周公礼贤下士。","authorIntro":"曹操（155—220），字孟德，东汉末年政治家、军事家、文学家。","appreciation":"诗歌以“忧”起笔，以“求贤”和“天下归心”收束，把人生苦短的感叹转化为招揽贤才、建功立业的政治抱负。","extraJson":{"content_key":"c4bf51e0d17f","dynasty":"东汉末","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["杜康","苹","掇","䜩","匝","哺"],"paragraph_count":1,"required_catalogs":[910003]}},{"id":900003,"title":"宿建德江","author":"孟浩然","genre":"古诗","dynasty":"唐","content":"移舟<b>泊</b><b>烟渚</b>，日暮<b>客愁</b>新。\\n野<b>旷</b>天低树，江清月<b>近</b>人。","translation":"把船停泊在烟雾朦胧的小洲边，日暮时分，漂泊在外的愁绪又涌上心头。\\n旷野无边无际，远处的天空比近处的树木还要低；江水清澈，水中的月影仿佛与人更加亲近。","pinyin":null,"annotation":"宿：住宿、停泊。\\n建德江：指新安江流经建德的一段。\\n烟渚：烟雾笼罩的江中小洲。\\n客愁：旅居在外的愁绪。\\n野旷：原野空旷。","authorIntro":"孟浩然（689—740），唐代山水田园诗人，世称“孟襄阳”。","appreciation":"前两句写停舟日暮，由眼前景物引出羁旅愁绪；后两句以“天低树”和“月近人”构成独特意境，情景交融。","extraJson":{"content_key":"e65a4b522a0d","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["泊","烟渚","客愁","旷","近"],"paragraph_count":1,"required_catalogs":[]}},{"id":900005,"title":"六月二十七日望湖楼醉书","author":"苏轼","genre":"古诗","dynasty":"北宋","content":"黑云<b>翻墨</b>未遮山，白雨<b>跳珠</b>乱入船。\\n<b>卷地</b>风来忽吹散，望湖楼下水如天。","translation":"黑云像打翻的墨水一样翻滚，却没有把山遮住；白亮的雨点像跳动的珍珠，纷乱地落进船里。\\n忽然一阵卷地而来的大风把乌云和雨吹散，望湖楼下的湖水像天空一样开阔明净。","pinyin":null,"annotation":"望湖楼：在杭州西湖边。\\n翻墨：像打翻的墨汁。\\n白雨：白亮的雨点。\\n跳珠：跳动的珍珠。","authorIntro":"苏轼（1037—1101），字子瞻，号东坡居士，北宋文学家、书画家。","appreciation":"诗人抓住夏日西湖骤雨的变化，用比喻和动静结合写出云、雨、风、湖的瞬息万变，画面明快而富有动感。","extraJson":{"content_key":"910209ac107f","dynasty":"北宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["翻墨","跳珠","卷地"],"paragraph_count":1,"required_catalogs":[]}},{"id":900006,"title":"西江月·夜行黄沙道中","author":"辛弃疾","genre":"古诗","dynasty":"南宋","content":"明月<b>别枝</b>惊鹊，清风半夜鸣蝉。\\n稻花香里说丰年，听取蛙声一片。\\n七八个星天外，两三点雨山前。\\n旧时茅店<b>社林</b>边，路转溪桥忽<b>见</b>。","translation":"明月升上树梢，惊飞了枝头的喜鹊；清风吹拂，半夜里传来蝉鸣。\\n稻花飘香，蛙声阵阵，似乎在谈论丰收年景。\\n天边只有七八颗星星，山前却落下两三点雨。\\n往日熟悉的茅店就在土地庙的树林旁，山路一转，溪桥忽然出现在眼前。","pinyin":null,"annotation":"黄沙：黄沙岭。\\n别枝：横斜突出的树枝。\\n社林：土地庙附近的树林。\\n见：同“现”，出现。","authorIntro":"辛弃疾（1140—1207），字幼安，号稼轩，南宋豪放派词人。","appreciation":"上片写夏夜山村的声色气息，下片写骤雨将至和道路转折；词中动静相间，表现乡村生活的宁静和丰收的喜悦。","extraJson":{"content_key":"03e772044386","dynasty":"南宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["别枝","社林","见"],"paragraph_count":1,"required_catalogs":[]}},{"id":900007,"title":"七律·长征","author":"毛泽东","genre":"古诗","dynasty":"现代","content":"红军不怕远征难，万水千山只等闲。\\n五岭<b>逶迤</b>腾细浪，乌蒙<b>磅礴</b>走泥丸。\\n金沙水拍云崖暖，大渡桥横铁索寒。\\n更喜<b>岷山</b>千里雪，三军过后尽开颜。","translation":"红军不怕长征路上的艰难险阻，把万水千山都看作平平常常。\\n五岭连绵起伏，在红军眼中像翻腾的细小波浪；乌蒙山气势雄伟，在红军脚下也像滚动的小泥丸。\\n金沙江水拍打着高耸入云的山崖，使人感到温暖；大渡河上的铁索桥横跨江面，使人感到寒意。\\n更令人喜悦的是翻过千里积雪的岷山，三军将士经过之后个个笑逐颜开。","pinyin":null,"annotation":"逶迤：弯曲绵延。\\n磅礴：气势盛大。\\n云崖：高耸入云的山崖。\\n三军：红军队伍。","authorIntro":"毛泽东（1893—1976），伟大的无产阶级革命家、诗人。","appreciation":"诗歌以高度概括的笔墨描写长征途中的山水险阻，以夸张和比喻表现红军藐视困难、英勇乐观的革命精神。","extraJson":{"content_key":"d9d42a53a13a","dynasty":"现代","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["逶迤","磅礴","岷山"],"paragraph_count":1,"required_catalogs":[]}},{"id":900008,"title":"浪淘沙（其一）","author":"刘禹锡","genre":"古诗","dynasty":"唐","content":"九曲黄河万里沙，浪淘风<b>簸</b>自天涯。\\n如今直上<b>银河</b>去，同到<b>牵牛织女</b>家。","translation":"万里黄河弯弯曲曲，挟带着泥沙；波涛翻滚，风浪颠簸，仿佛来自天边。\\n如今我要迎着风浪直上银河，和黄河一起到牛郎织女的家中去。","pinyin":null,"annotation":"九曲：形容黄河弯曲多。\\n簸：颠簸。\\n牵牛织女：牛郎织女。","authorIntro":"刘禹锡，唐代文学家、哲学家。","appreciation":"诗人借黄河浪涛和牛郎织女的传说展开想象，表现不畏艰险、追求理想的浪漫情怀。","extraJson":{"content_key":"4fe7d5813eff","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["簸","银河","牵牛织女"],"paragraph_count":1,"required_catalogs":[]}},{"id":900009,"title":"江南春","author":"杜牧","genre":"古诗","dynasty":"唐","content":"千里<b>莺啼</b>绿映红，水村<b>山郭</b><b>酒旗</b>风。\\n南朝四百八十寺，多少楼台<b>烟雨</b>中。","translation":"辽阔的江南到处莺歌燕舞，绿树映衬着红花；临水的村庄、依山的城郭，酒旗迎风招展。\\n南朝修建的四百八十座寺院，如今有多少楼台都笼罩在烟雨之中。","pinyin":null,"annotation":"山郭：山城。\\n酒旗：酒店门前悬挂的旗子。\\n南朝：宋、齐、梁、陈。\\n楼台：寺院的楼阁。","authorIntro":"杜牧（803—852），字牧之，晚唐诗人。","appreciation":"前两句写明丽繁盛的江南春景，后两句转入烟雨寺院，在鲜明色彩和朦胧意境的对照中寄寓历史兴亡之感。","extraJson":{"content_key":"eb3a21447139","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["莺啼","山郭","酒旗","烟雨"],"paragraph_count":1,"required_catalogs":[]}},{"id":900010,"title":"书湖阴先生壁","author":"王安石","genre":"古诗","dynasty":"北宋","content":"茅檐长扫净无苔，花木<b>成畦</b>手自栽。\\n一水<b>护田</b>将绿绕，两山<b>排闼</b>送青来。","translation":"茅屋檐下常常打扫，干净得没有一丝青苔；花草树木排列成畦，都是主人亲手栽种。\\n一条溪水环绕着田野，把绿色送来；两座青山推开门，送来满眼青翠。","pinyin":null,"annotation":"湖阴先生：杨德逢。\\n排闼：推开门。闼，小门。\\n护田：护卫田地。","authorIntro":"王安石（1021—1086），字介甫，号半山，北宋政治家、文学家。","appreciation":"诗人从庭院写到山水，以拟人手法写水环田、山送青，赞美湖阴先生高洁的生活情趣和周围环境的清幽。","extraJson":{"content_key":"b984b1290252","dynasty":"北宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["成畦","排闼","护田"],"paragraph_count":1,"required_catalogs":[]}},{"id":900011,"title":"过故人庄","author":"孟浩然","genre":"古诗","dynasty":"唐","content":"故人具鸡<b>黍</b>，邀我至田家。\\n绿树村边合，青山郭外斜。\\n开轩面场<b>圃</b>，把酒话<b>桑麻</b>。\\n待到重阳日，还来<b>就</b>菊花。","translation":"老朋友准备了丰盛的饭菜，邀请我到他的田舍做客。\\n翠绿的树林环绕着村庄，青山在城郭外斜斜地横卧。\\n打开窗户面对谷场和菜园，举起酒杯谈论农事。\\n等到重阳节那天，我还要再来这里观赏菊花。","pinyin":null,"annotation":"具：准备。\\n鸡黍：丰盛的饭菜。\\n郭：城郭。\\n轩：窗户。\\n就：靠近，此指欣赏。","authorIntro":"孟浩然，唐代山水田园诗人。","appreciation":"诗歌写田园风光、宾主情谊和自然淳朴的生活，语言平淡自然，末句以重阳再会收束，余味悠长。","extraJson":{"content_key":"38ca9f7c7f14","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["黍","圃","桑麻","就"],"paragraph_count":1,"required_catalogs":[]}},{"id":900012,"title":"送元二使安西","author":"王维","genre":"古诗","dynasty":"唐","content":"渭城朝雨<b>浥</b>轻尘，<b>客舍</b>青青柳色新。\\n劝君更尽一杯酒，西出<b>阳关</b>无故人。","translation":"渭城早晨一场春雨沾湿了路上的轻尘，旅店周围的柳树被雨水洗得格外青翠。\\n请你再喝完这一杯酒吧，向西出了阳关就再也没有老朋友了。","pinyin":null,"annotation":"浥：沾湿。\\n客舍：旅店。\\n更尽：再饮完。\\n阳关：古关名。","authorIntro":"王维（701—761），字摩诘，唐代诗人、画家。","appreciation":"前两句写雨后清新的送别环境，后两句直抒惜别之情，以酒寄情，语言平实而情感深厚。","extraJson":{"content_key":"7c755b22a92d","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["浥","客舍","阳关"],"paragraph_count":1,"required_catalogs":[]}},{"id":900013,"title":"江畔独步寻花（其五）","author":"杜甫","genre":"古诗","dynasty":"唐","content":"黄师塔前江水东，春光<b>懒困</b>倚微风。\\n桃花<b>一簇</b>开无主，可爱<b>深红</b>爱<b>浅红</b>？","translation":"黄师塔前的江水向东流去，春光使人懒洋洋地困倦，正好倚靠着微风。\\n一丛桃花盛开着却没有主人，你究竟是喜爱深红的桃花，还是浅红的桃花呢？","pinyin":null,"annotation":"江畔：江边。\\n懒困：懒散困倦。\\n一簇：一丛。\\n无主：任意开放。","authorIntro":"杜甫，唐代现实主义诗人。","appreciation":"诗人独步江畔寻花，写桃花的浓淡可爱；“可爱深红爱浅红”用问语表现赏花时的欣喜和悠然。","extraJson":{"content_key":"89349462a8aa","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["懒困","一簇","深红","浅红"],"paragraph_count":1,"required_catalogs":[]}},{"id":900014,"title":"春日","author":"朱熹","genre":"古诗","dynasty":"南宋","content":"胜日<b>寻芳</b><b>泗水</b>滨，无边光景一时新。\\n<b>等闲</b>识得东风面，<b>万紫千红</b>总是春。","translation":"风和日丽的日子在泗水边游春，眼前无边无际的风光焕然一新。\\n谁都可以看出春风的面貌，百花争奇斗艳都是春天的景象。","pinyin":null,"annotation":"胜日：天气晴朗的好日子。\\n寻芳：游春。\\n等闲：平常、轻易。\\n东风：春风。","authorIntro":"朱熹（1130—1200），字元晦，号晦庵，南宋理学家、思想家。","appreciation":"诗歌写春日游赏所见的万紫千红，借春风和百花表现对新生事物、蓬勃春天的赞美。","extraJson":{"content_key":"9b1634add2f9","dynasty":"南宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["泗水","寻芳","等闲","万紫千红"],"paragraph_count":1,"required_catalogs":[]}},{"id":900015,"title":"咏雪","author":"刘义庆","genre":"文言文","dynasty":"南朝宋","content":"谢太傅寒雪日内集，与儿女讲论文义。\\n俄而雪<b>骤</b>，公欣然曰：“白雪纷纷何所似？”\\n兄子胡儿曰：“撒盐空中差可<b>拟</b>。”\\n兄女曰：“未若<b>柳絮</b>因风起。”公大笑乐。\\n即公大兄无奕女，左将军王凝之妻也。","translation":"谢太傅在一个寒冷的雪天把家人聚集在一起，和子侄辈谈论文章的义理。\\n不一会儿雪下得急了，谢太傅高兴地说：“纷纷扬扬的白雪像什么呢？”\\n他哥哥的儿子胡儿说：“把盐撒在空中大体可以相比。”\\n他哥哥的女儿说：“不如比作柳絮乘风飞舞。”谢太傅大笑起来，非常高兴。\\n她就是谢太傅哥哥的长女谢道韫，左将军王凝之的妻子。","pinyin":null,"annotation":"内集：把家人聚集在一起。\\n儿女：子侄辈。\\n俄而：不久，一会儿。\\n骤：急。\\n差可拟：大体可以相比。\\n未若：不如。\\n因风：乘风。","authorIntro":"刘义庆（403—444），南朝宋文学家，编撰《世说新语》。","appreciation":"文章通过咏雪比喻的问答，表现谢道韫的才思敏捷；“柳絮因风起”更形象地写出雪花轻盈飞舞的姿态。","extraJson":{"content_key":"476a0739c443","dynasty":"南朝宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["骤","拟","柳絮"],"paragraph_count":1,"required_catalogs":[910009,910045]}},{"id":900016,"title":"陈太丘与友期行","author":"刘义庆","genre":"文言文","dynasty":"南朝宋","content":"陈太丘与友<b>期</b>行，<b>期</b>日中。\\n过中不至，太丘<b>舍去</b>，去后乃至。##元方时年七岁，门外戏。\\n客问元方：“尊君在不？”\\n答曰：“待君久不至，已去。”\\n友人便怒曰：“非人哉！\\n与人<b>期</b>行，相委而去。”\\n元方曰：“君与家君<b>期</b>日中。\\n日中不至，则是<b>无信</b>；\\n对子骂父，则是<b>无礼</b>。”\\n友人惭，下车<b>引</b>之。\\n元方入门不<b>顾</b>。","translation":"陈太丘和朋友约定一同出行，约定的时间是正午。\\n正午过了朋友还没有到，陈太丘便离开了；\\n他离开以后朋友才到。##陈元方当时七岁，正在门外玩耍。\\n朋友问元方：“令尊在不在？”\\n元方回答：“等您很久您都没有到，已经离开了。”\\n朋友便生气地说：“真不是人啊！\\n和别人约好一同出行，却丢下别人离开。”\\n元方说：“您和我父亲约在正午。\\n正午您没有到，就是不讲信用；\\n对着孩子骂父亲，就是没有礼貌。”\\n朋友感到惭愧，下车拉元方。\\n元方走进家门，没有回头看他。","pinyin":null,"annotation":"期行：相约同行。\\n日中：正午时分。\\n舍去：舍弃，离开。\\n尊君：对别人父亲的尊称。\\n家君：对人称自己的父亲。\\n引：拉，牵拉。\\n顾：回头看。","authorIntro":"刘义庆，南朝宋文学家。","appreciation":"文章通过陈元方与友人的对话，围绕“信”和“礼”展开批评与自省，人物语言简洁有力，刻画了元方的聪慧明理。","extraJson":{"content_key":"a77fe3d06d3e","dynasty":"南朝宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["期","舍去","无信","无礼","引","顾"],"paragraph_count":2,"required_catalogs":[910010,910046]}},{"id":900017,"title":"诫子书","author":"诸葛亮","genre":"文言文","dynasty":"三国蜀汉","content":"夫君子之行，静以修身，俭以养德。\\n非<b>淡泊</b>无以明志，非宁静无以<b>致远</b>。\\n夫学须静也，才须学也，非学无以广才，非志无以成学。\\n<b>淫慢</b>则不能<b>励精</b>，<b>险躁</b>则不能治性。\\n年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！","translation":"君子的行为操守，用宁静来修养身心，用节俭来培养品德。\\n不恬淡寡欲就无法明确志向，不排除外来干扰就无法达到远大目标。\\n学习必须静心专一，才干必须从学习中获得；\\n不学习就无法增长才干，没有志向就无法成就学业。\\n放纵懈怠就不能振奋精神，轻薄浮躁就不能修养性情。\\n年华随时光飞驰，意志随岁月消逝，最终像枯枝败叶一样衰残，大多不能接触社会、贡献才力，只能悲哀地守着穷困的居舍，到那时再后悔又怎么来得及呢？","pinyin":null,"annotation":"行：操守、品德。\\n淡泊：内心恬淡，不慕名利。\\n致远：达到远大目标。\\n淫慢：放纵懈怠。\\n励精：振奋精神。\\n险躁：轻薄浮躁。\\n治性：修养性情。","authorIntro":"诸葛亮（181—234），字孔明，三国时期蜀汉政治家、军事家。","appreciation":"文章以“静”“俭”为核心，论述修身、学习与成才的关系，采用对偶和正反对比，语言警策有力。","extraJson":{"content_key":"9d7108d669af","dynasty":"三国蜀汉","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["淡泊","致远","淫慢","励精","险躁"],"paragraph_count":1,"required_catalogs":[910016,910052]}},{"id":900018,"title":"狼","author":"蒲松龄","genre":"文言文","dynasty":"清","content":"一屠晚归，担中肉尽，止有剩骨。\\n途中两狼，<b>缀</b>行甚远。\\n屠惧，投以骨。\\n一狼得骨止，一狼仍从。\\n复投之，后狼止而前狼又至。\\n骨已尽矣，而两狼之<b>并驱</b>如故。\\n屠大<b>窘</b>，恐前后受其敌。\\n顾野有麦场，场主积薪其中，<b>苫蔽</b>成丘。\\n屠自后断其<b>股</b>，亦毙之。\\n乃悟前狼<b>假寐</b>，盖以诱敌。\\n狼亦<b>黠</b>矣，而顷刻两毙，禽兽之变诈几何哉？\\n止增笑耳。","translation":"一个屠户傍晚回家，担子里的肉已经卖完了，只剩下骨头。\\n路上遇到两只狼，紧跟着他走了很远。\\n屠户害怕，把骨头投给狼。\\n一只狼得到骨头停下了，另一只狼仍然跟随。\\n屠户又把骨头投给它，后得到骨头的狼停下了，可是先得到骨头的狼又跟上来。\\n骨头已经扔完了，但两只狼像原来一样一起追赶。\\n屠户非常困窘，担心前后受到狼的攻击。\\n他回头看见野地里有一个麦场，场主人把柴草堆积在麦场里，覆盖成小山似的。\\n屠户于是靠在柴草堆下面，弯腰从后面砍断了狼的大腿，也杀死了另一只狼。\\n这才明白前面的狼假装睡觉，原来是用来诱惑敌人。\\n狼也很狡猾，可是一会儿两只狼都被杀死了，禽兽的诡诈能有多少呢？\\n只不过增加笑料罢了。","pinyin":null,"annotation":"缀行：紧跟着走。\\n并驱：一起追赶。\\n窘：困窘。\\n顾：回头看。\\n苫蔽：覆盖、遮蔽。\\n股：大腿。\\n假寐：假装睡觉。\\n黠：狡猾。","authorIntro":"蒲松龄（1640—1715），字留仙，号柳泉居士，清代文学家。","appreciation":"故事通过屠户与两狼的斗争，揭露狼的贪婪、凶狠和狡猾，结尾议论点明像狼一样的恶势力终将以失败告终。","extraJson":{"content_key":"a5ad7b00432c","dynasty":"清","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["缀","并驱","窘","苫蔽","股","假寐","黠"],"paragraph_count":1,"required_catalogs":[910017,910053]}},{"id":900019,"title":"穿井得一人","author":"吕不韦","genre":"文言文","dynasty":"战国末","content":"宋之丁氏，家无井而出<b>溉汲</b>，常一人居外。\\n及其家穿井，告人曰：“吾穿井得一人。”\\n有闻而传之者：“丁氏穿井得一人。”\\n国人<b>道</b>之，闻之于宋君。\\n宋君令人问之于丁氏。\\n丁氏对曰：“得一人之使，非得一人于井中也。”\\n求能之若此，不若无闻也。","translation":"宋国有个姓丁的人，家里没有水井，需要到外面打水浇田，经常要派一个人住在外面。\\n等到他家打了一口井，便告诉别人说：“我家打井得到了一个人。”\\n有人听说后传播：“丁家打井得到了一个人。”\\n都城的人都谈论这件事，宋国国君也听到了。\\n宋君派人向丁氏询问。\\n丁氏回答：“是得到一个人的劳力，并不是从井里挖出一个人。”\\n寻求像这样得到知识，还不如没有听到。","pinyin":null,"annotation":"溉汲：打水浇田。\\n及：等到。\\n国人：国都中的人。\\n道：讲述。\\n闻于宋君：使宋君听到。\\n得一人之使：得到一个人的劳力。","authorIntro":"《吕氏春秋》是战国末期吕不韦组织门客编写的杂家著作。","appreciation":"故事说明对传闻要调查核实，不能把“得一人之使”误传成“井中得人”，也不能轻信未经证实的信息。","extraJson":{"content_key":"0c533651d36e","dynasty":"战国末","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["溉汲","道","闻于宋君"],"paragraph_count":1,"required_catalogs":[]}},{"id":900020,"title":"杞人忧天","author":"列子","genre":"文言文","dynasty":"战国","content":"杞国有人忧天地<b>崩坠</b>，身亡所寄，废寝食者。\\n又有忧彼之所忧者，因往<b>晓</b>之，曰：“天，<b>积气</b>耳，亡处亡气。\\n若屈伸呼吸，终日在天中行止，奈何忧<b>崩坠</b>乎？”##其人曰：“天果<b>积气</b>，日月星宿，不当坠邪？”\\n<b>晓</b>之者曰：“日月星宿，亦<b>积气</b>中之有光耀者，只使坠，亦不能有所中伤。”##其人曰：“奈地坏何？”\\n<b>晓</b>之者曰：“地，积块耳，充塞四虚，亡处亡块。\\n若躇步跐蹈，终日在地上行止，奈何忧其坏？”\\n其人<b>舍然</b>大喜，<b>晓</b>之者亦<b>舍然</b>大喜。","translation":"杞国有个人担忧天会塌地会陷，自己无处可依，因此睡不着、吃不下。\\n又有一个人为这个人的忧愁而忧愁，就去开导他，说：“天不过是聚积的气体罢了，没有一个地方没有气。\\n你一举一动、一呼一吸，整天都在天中活动，为什么还担心天会塌下来呢？”##那个人说：“天果真是聚积的气体，日月星辰不会坠落吗？”\\n开导他的人说：“日月星辰也是气体中能发光的东西，即使坠落，也不会伤害什么。”##那个人又说：“地塌了怎么办呢？”\\n开导他的人说：“地不过是聚积的土块罢了，填满了四方，没有一个地方没有土块。\\n你行走跳跃，整天在地上活动，为什么还担心地会塌呢？”\\n那个人释然了，非常高兴，开导他的人也释然了，非常高兴。","pinyin":null,"annotation":"崩坠：崩塌坠落。\\n身亡所寄：身体无处寄托。\\n晓：开导。\\n积气：聚积的气体。\\n日月星宿：日月星辰。\\n舍然：消除疑虑的样子。\\n躇步跐蹈：踩、踏。","authorIntro":"列子，战国时期思想家，道家代表人物。","appreciation":"寓言用夸张的担忧和耐心的解释构成幽默效果，说明对事物应作合理分析，不能为没有根据的忧虑困扰。","extraJson":{"content_key":"337252ab414b","dynasty":"战国","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["崩坠","晓","积气","舍然"],"paragraph_count":3,"required_catalogs":[]}},{"id":900021,"title":"论语十二章","author":"孔子及其弟子","genre":"文言文","dynasty":"春秋","content":"子曰：“人而不<b>仁</b>，如礼何？\\n人而不<b>仁</b>，如乐何？”\\n子曰：“朝闻道，夕死可矣。”\\n子曰：“君子喻于义，小人喻于利。”\\n子曰：“见贤思齐焉，见不贤而内自省也。”\\n子曰：“质胜文则野，文胜质则史。\\n文质彬彬，然后君子。”\\n曾子曰：“士不可以不<b>弘毅</b>，任重而道远。\\n<b>仁</b>以为己任，不亦重乎？\\n死而后已，不亦远乎？”\\n子曰：“譬如为山，未成一<b>篑</b>，止，吾止也；\\n譬如平地，虽覆一<b>篑</b>，进，吾往也。”\\n子曰：“知者不惑，<b>仁</b>者不忧，勇者不惧。”\\n颜渊问<b>仁</b>。\\n子曰：“<b>克己复礼</b>为<b>仁</b>。\\n一日<b>克己复礼</b>，天下归<b>仁</b>焉。”\\n子贡问曰：“有一言而可以终身行之者乎？”\\n子曰：“其<b>恕</b>乎！\\n己所不欲，勿施于人。”\\n子曰：“小子何莫学夫《诗》？\\n《诗》可以兴，可以观，可以群，可以怨。\\n<b>迩</b>之事父，远之事君；\\n多识于鸟兽草木之名。”\\n子曰：“君子食无求饱，居无求安，敏于事而慎于言，就有道而正焉，可谓好学也已。”","translation":"孔子说：“一个人如果没有仁爱之心，如何对待礼仪呢？\\n如果没有仁爱之心，如何对待音乐呢？”\\n孔子说：“早晨得知真理，即使当晚死去也可以。”\\n孔子说：“君子懂得的是道义，小人懂得的是利益。”\\n孔子说：“看见贤人就想着向他看齐，看见不贤的人就要在内心反省自己。”\\n孔子说：“质朴超过文采就显得粗野，文采超过质朴就显得虚浮。\\n文采和质朴配合适当，这才是君子。”\\n曾子说：“士人不可以不弘大刚强而有毅力，因为责任重大，道路遥远。\\n把实现仁作为自己的责任，不是很重大吗？\\n直到死才停止，不是很遥远吗？”\\n孔子说：“譬如堆土成山，只差一筐土没有完成，如果停下来，是我自己停下来的；\\n譬如填平洼地，即使只倒下一筐土，只要继续前进，也是我自己前进。”\\n孔子说：“智慧的人不迷惑，仁德的人不忧愁，勇敢的人不畏惧。”\\n颜渊问怎样做到仁。\\n孔子说：“约束自己，使一切言语行动归复于礼，就是仁。\\n一天做到约束自己归复于礼，天下人就会归依仁德。”\\n子贡问：“有没有一句话可以终身奉行？”\\n孔子说：“大概是‘恕’吧！\\n自己不想要的，不要施加给别人。”\\n孔子说：“学生们为什么没有人学习《诗》呢？\\n《诗》可以激发情感，可以观察社会，可以交往，可以讽谏；\\n近可以侍奉父亲，远可以侍奉君主，还可以多知道鸟兽草木的名称。”\\n孔子说：“君子饮食不求饱足，居住不求舒适，做事勤勉，说话谨慎，到有道德有学问的人那里去匡正自己，这可以说是好学了。”","pinyin":null,"annotation":"喻：明白，懂得。\\n弘毅：胸怀宽广，意志坚强。\\n篑：盛土的竹筐。\\n知：同“智”。\\n克己复礼：约束自己，使言语行动归复于礼。\\n恕：推己及人。\\n迩：近。\\n就有道：接近有道德有学问的人。","authorIntro":"孔子（前551—前479），名丘，字仲尼，春秋时期思想家、教育家，儒家学派创始人。","appreciation":"十二章语录从仁德、修身、求学、交友等方面阐释君子之道，语言简约而富有哲理，是理解儒家思想的重要材料。","extraJson":{"content_key":"eaadd6356195","dynasty":"春秋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["仁","弘毅","篑","克己复礼","恕","迩"],"paragraph_count":1,"required_catalogs":[910011,910047]}},{"id":900022,"title":"孙权劝学","author":"司马光","genre":"文言文","dynasty":"北宋","content":"初，权谓吕蒙曰：“卿今<b>当涂</b>掌事，不可不学！”\\n蒙辞以军中多务。\\n权曰：“孤岂欲卿治经为博士邪！\\n但当<b>涉猎</b>，<b>见往事</b>耳。\\n卿言多务，孰若孤？\\n孤常读书，自以为大有所益。”\\n蒙乃始就学。##及鲁肃过寻阳，与蒙论议，大惊曰：“卿今者才略，非复吴下阿蒙！”\\n蒙曰：“士别三日，即更<b>刮目相待</b>，大兄何见事之晚乎！”\\n肃遂拜蒙母，结友而别。","translation":"当初，孙权对吕蒙说：“你现在当权掌管事务，不可以不学习！”\\n吕蒙用军中事务多来推托。\\n孙权说：“我难道想要你研究儒家经典成为学官吗？\\n只是应当粗略地阅读，了解历史罢了。\\n你说事务多，谁比得上我事务多呢？\\n我经常读书，自己认为获益很多。”\\n吕蒙于是开始学习。##等到鲁肃经过寻阳，和吕蒙谈论事情，十分惊讶地说：“你现在的才干和谋略，已经不是原来那个吴下阿蒙了！”\\n吕蒙说：“士人分别几天，就要重新另眼看待，长兄知道事情怎么这么晚呢！”\\n鲁肃于是拜见吕蒙的母亲，和吕蒙结为朋友，然后分别。","pinyin":null,"annotation":"卿：古代君对臣的爱称。\\n当涂：当权。\\n治经：研究儒家经典。\\n博士：专掌经学传授的学官。\\n涉猎：粗略地阅读。\\n见往事：了解历史。\\n更：重新。\\n刮目相待：另眼相看。","authorIntro":"司马光（1019—1086），字君实，北宋政治家、史学家，主持编纂《资治通鉴》。","appreciation":"文章通过孙权劝学、吕蒙就学和鲁肃赞学三个片段，说明学习能使人发生巨大变化，突出劝学的说服力。","extraJson":{"content_key":"d9233e65ae93","dynasty":"北宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["当涂","涉猎","见往事","刮目相待"],"paragraph_count":2,"required_catalogs":[910024,910060]}},{"id":900023,"title":"木兰诗","author":"郭茂倩编","genre":"文言文","dynasty":"北朝民歌","content":"唧唧复唧唧，木兰当户织。\\n不闻<b>机杼</b>声，惟闻女叹息。##问女何所思，问女何所忆。\\n女亦无所思，女亦无所忆。\\n昨夜见军帖，可汗大点兵，军书十二卷，卷卷有爷名。\\n阿爷无大儿，木兰无长兄，愿为市鞍马，从此替爷征。##东市买骏马，西市买<b>鞍鞯</b>，南市买<b>辔头</b>，北市买长鞭。\\n旦辞爷娘去，暮宿黄河边；\\n不闻爷娘唤女声，但闻黄河流水鸣溅溅。\\n旦辞黄河去，暮至黑山头；\\n不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。##万里赴<b>戎机</b>，关山度若飞。\\n<b>朔气</b>传金柝，寒光照铁衣。\\n将军百战死，壮士十年归。##归来见天子，天子坐明堂。\\n<b>策勋</b>十二转，赏赐百千强。\\n可汗问所欲，木兰不用尚书郎；\\n愿驰千里足，送儿还故乡。##爷娘闻女来，出郭相扶将；\\n阿姊闻妹来，当户理红妆；\\n小弟闻姊来，磨刀霍霍向猪羊。##开我东阁门，坐我西阁床。\\n脱我战时袍，<b>著</b>我旧时裳。\\n当窗理云鬓，对镜帖花黄。\\n出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。##雄兔脚<b>扑朔</b>，雌兔眼迷离；\\n双兔傍地走，安能辨我是雄雌？","translation":"织机声唧唧又唧唧，木兰对着门织布。\\n听不见织机的声音，只听见女儿的叹息。##问木兰在想什么、在回忆什么，木兰说自己没有想什么，也没有回忆什么。\\n昨夜看见军中的文书，天子大规模征兵，征兵的名册很多卷，每一卷都有父亲的名字。\\n父亲没有大儿子，木兰没有长兄，木兰愿意去买鞍马，从此替父亲出征。##到东市买骏马，到西市买鞍具，到南市买辔头，到北市买长鞭。\\n早晨辞别父母上路，傍晚住在黄河边；\\n听不见父母呼唤女儿的声音，只听见黄河水奔流的声音。\\n早晨辞别黄河，傍晚到达黑山头；\\n听不见父母呼唤女儿的声音，只听见燕山胡骑嘶鸣。##不远万里奔赴战场，飞越一道道关山。\\n北方的寒气传来打更的声音，清冷的月光照在铠甲上。\\n将士们身经百战，有的战死沙场，有的多年后归来。##胜利归来朝见天子，天子坐在明堂。\\n给木兰记了很多功，赏赐很多财物。\\n天子问木兰想要什么，木兰不要尚书郎，只希望骑着千里马送我回故乡。##父母听说女儿回来，出城互相搀扶；\\n姐姐听说妹妹回来，对着门户梳妆；\\n弟弟听说姐姐回来，磨刀霍霍准备杀猪宰羊。##打开东阁门，坐在西阁的床上；\\n脱下战时穿的战袍，穿上过去的衣裳；\\n对着窗户梳理鬓发，对着镜子贴花黄。\\n出门看同伍的伙伴，伙伴们都惊忙：一同行军多年，竟不知道木兰是女子。##雄兔的脚喜欢动弹，雌兔的眼睛常常眯着；\\n两只兔子并排跑，怎么能辨别哪只是雄兔、哪只是雌兔呢？","pinyin":null,"annotation":"机杼：织布机。\\n军帖：军中的文书。\\n可汗：古代西北地区民族对最高统治者的称呼。\\n鞍鞯：马鞍下的垫子。\\n辔头：驾驭牲口用的嚼子和缰绳。\\n戎机：战事。\\n朔气：北方的寒气。\\n策勋：记功。\\n著：穿。\\n帖：同“贴”。\\n扑朔：动弹。","authorIntro":"《木兰诗》是北朝民歌，郭茂倩编《乐府诗集》收录。","appreciation":"全诗以木兰代父从军为线索，兼写战场、功赏和归家，塑造了勇敢、孝顺而不慕荣利的巾帼形象；详略相间、比喻收束，富有民歌特色。","extraJson":{"content_key":"ca3c096e5e66","dynasty":"北朝民歌","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["机杼","鞍鞯","辔头","戎机","朔气","策勋","著","扑朔"],"paragraph_count":8,"required_catalogs":[910025,910061]}},{"id":900024,"title":"陋室铭","author":"刘禹锡","genre":"文言文","dynasty":"唐","content":"山不在高，有仙则名。\\n水不在深，有龙则灵。\\n斯是陋室，惟吾德<b>馨</b>。##苔痕上阶绿，草色入帘青。\\n谈笑有<b>鸿儒</b>，往来无白丁。\\n可以调素琴，阅金经。\\n无丝竹之乱耳，无<b>案牍</b>之<b>劳形</b>。##南阳诸葛庐，西蜀子云亭。\\n孔子云：何陋之有？","translation":"山不在于高，有了神仙就出名；\\n水不在于深，有了龙就显得灵异。\\n这是简陋的屋舍，只是我的品德高尚。##苔痕碧绿，长到台阶上；\\n草色青葱，映入帘里。\\n谈笑的是博学的人，来往的没有平民。\\n可以弹奏不加装饰的琴，阅读佛经。\\n没有世俗的乐曲扰乱耳鼓，也没有官府公文使身体劳累。##南阳有诸葛亮的草庐，西蜀有扬子云的亭子。\\n孔子说：“有什么简陋的呢？”","pinyin":null,"annotation":"馨：能散布很远的香气，这里指品德高尚。\\n鸿儒：博学的人。\\n白丁：平民，指没有功名的普通人。\\n素琴：不加装饰的琴。\\n案牍：官府的公文。\\n劳形：使身体劳累。","authorIntro":"刘禹锡（772—842），字梦得，唐代文学家、哲学家。","appreciation":"文章以山水起兴，以“德馨”为核心，通过景物、交往和日常生活写陋室不陋，结尾引孔子之言强化高洁傲岸的节操。","extraJson":{"content_key":"63a701e5d620","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["馨","鸿儒","案牍","劳形"],"paragraph_count":3,"required_catalogs":[910030,910066]}},{"id":900025,"title":"爱莲说","author":"周敦颐","genre":"文言文","dynasty":"北宋","content":"水陆草木之花，可爱者甚蕃。\\n晋陶渊明独爱菊。\\n李唐来世人甚爱牡丹。\\n予独爱莲之出<b>淤泥</b>而不染，<b>濯</b>清涟而不妖，中通外直，<b>不蔓不枝</b>，香远益清，亭亭净植，可远观而不可<b>亵玩</b>焉。##予谓菊，花之隐逸者也；\\n牡丹，花之富贵者也；\\n莲，花之君子者也。\\n噫！\\n菊之爱，陶后<b>鲜</b>有闻。\\n莲之爱，同予者何人？\\n牡丹之爱，宜乎众矣。","translation":"水上、地上各种草木的花，值得喜爱的很多。\\n晋代陶渊明唯独喜爱菊花。\\n唐朝以来世人大多喜爱牡丹。\\n我唯独喜爱莲花从淤泥里长出却不被污染，经过清水洗涤却不显得妖媚；\\n内空外直，不牵牵连连，不枝枝节节；\\n香气传得越远越觉得清幽，洁净地挺立在那里，只可远观却不可轻慢地玩弄。##我认为菊是花中的隐士，牡丹是花中的富贵者，莲是花中的君子。\\n唉！\\n对于菊花的喜爱，陶渊明以后很少听到了；\\n对于莲花的喜爱，像我一样的还有什么人呢？\\n对于牡丹的喜爱，当然人很多了。","pinyin":null,"annotation":"蕃：多。\\n濯：洗。\\n妖：美丽而不端庄。\\n益：更加。\\n植：立。\\n亵玩：玩弄。\\n鲜：少。","authorIntro":"周敦颐（1017—1073），字茂叔，北宋哲学家。","appreciation":"作者以莲喻君子，从生长环境、外形、香气、姿态等方面写莲的品格，并以菊、牡丹作对比，表达洁身自好、不慕荣利的君子情怀。","extraJson":{"content_key":"995b54a1402c","dynasty":"北宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["淤泥","濯","不蔓不枝","亵玩","鲜"],"paragraph_count":2,"required_catalogs":[910031,910067]}},{"id":900026,"title":"登幽州台歌","author":"陈子昂","genre":"古诗","dynasty":"唐","content":"前不见古人，后不见来者。\\n念天地之<b>悠悠</b>，独<b>怆然</b>而涕下。","translation":"向前看不见古代礼贤下士的圣君，向后看不见后世求贤若渴的明君。\\n一想到天地茫茫悠悠无限，独自悲伤地流下眼泪。","pinyin":null,"annotation":"幽州台：战国时燕昭王为招纳贤才所筑的黄金台。\\n怆然：悲伤的样子。","authorIntro":"陈子昂（659—700），字伯玉，唐代文学家。","appreciation":"诗人登台远眺，因时空无涯、知音难遇而悲怆，前后对举和天地对照扩大了孤独感。","extraJson":{"content_key":"30fdda716826","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["幽州台","悠悠","怆然"],"paragraph_count":1,"required_catalogs":[910032,910068]}},{"id":900027,"title":"望岳","author":"杜甫","genre":"古诗","dynasty":"唐","content":"<b>岱宗</b>夫如何？齐鲁青未了。\\n造化<b>钟</b>神秀，阴阳割昏晓。\\n荡胸生曾云，<b>决眦</b>入归鸟。\\n会当<b>凌绝顶</b>，一览众山小。","translation":"泰山究竟怎么样？它横跨齐鲁，青色的山影连绵不断。\\n大自然把神奇秀美集中在泰山，山南山北一面明亮一面昏暗。\\n层云升腾，使我的心胸震荡；睁大眼睛远望，归鸟都映入眼帘。\\n一定要登上泰山的最高峰，俯瞰群山都显得渺小。","pinyin":null,"annotation":"岱宗：指泰山。\\n齐鲁：古代齐、鲁两国。\\n钟：聚集。\\n决眦：睁大眼睛。\\n会当：终当，一定要。","authorIntro":"杜甫，唐代现实主义诗人。","appreciation":"全诗从远望、近望、细望写泰山雄伟景象，末句由望岳转入登岳的想象，表现凌云壮志和积极进取精神。","extraJson":{"content_key":"73e321102565","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["岱宗","钟","决眦","凌绝顶"],"paragraph_count":1,"required_catalogs":[910033,910069]}},{"id":900028,"title":"登飞来峰","author":"王安石","genre":"古诗","dynasty":"北宋","content":"飞来山上<b>千寻</b>塔，闻说鸡鸣见日升。\\n不畏<b>浮云</b>遮望眼，<b>自缘</b>身在最高层。","translation":"飞来峰顶有一座高耸入云的塔，听说在鸡鸣时分可以看到太阳升起。\\n不怕浮云遮住远望的视线，只因为自己身在最高层。","pinyin":null,"annotation":"千寻：极言塔高。\\n闻说：听说。\\n缘：因为。\\n最高层：最高处，也有政治立场高远之意。","authorIntro":"王安石，北宋政治家、文学家。","appreciation":"诗人以登高所见寄寓人生哲理，借“浮云”象征遮蔽视线的事物，表现高瞻远瞩、不畏艰难的胸襟。","extraJson":{"content_key":"7e57af792a2b","dynasty":"北宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["千寻","浮云","自缘"],"paragraph_count":1,"required_catalogs":[910034,910070]}},{"id":900029,"title":"游山西村","author":"陆游","genre":"古诗","dynasty":"南宋","content":"莫笑农家<b>腊酒</b>浑，丰年留客足<b>鸡豚</b>。\\n<b>山重水复</b>疑无路，<b>柳暗花明</b>又一村。\\n箫鼓追随春社近，衣冠简朴古风存。\\n从今若许闲乘月，拄杖无时夜<b>叩门</b>。","translation":"不要笑农家腊月酿的酒浑浊，丰收年景农家待客有充足的鸡和猪。\\n山峦重重、水道曲折，正怀疑没有路，忽然看见柳色深绿、花色明艳的村庄。\\n箫鼓声跟随着春社的日子将近，村民衣冠简朴，仍然保留古代的风俗。\\n从今以后如果允许我趁着月明闲游，我会拄着拐杖随时来敲你家的门。","pinyin":null,"annotation":"腊酒：腊月酿的酒。\\n浑：浑浊。\\n鸡豚：鸡和猪。\\n山重水复：山峦重重、水道曲折。\\n箫鼓：箫和鼓。\\n叩门：敲门。","authorIntro":"陆游，南宋爱国诗人。","appreciation":"诗歌描写农家淳朴热情和村庄清新风光，“山重水复疑无路，柳暗花明又一村”既写景又富有哲理，表现诗人对乡村生活的喜爱。","extraJson":{"content_key":"f71d7a8c7839","dynasty":"南宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["腊酒","鸡豚","山重水复","柳暗花明","叩门"],"paragraph_count":1,"required_catalogs":[910035,910071]}},{"id":900030,"title":"己亥杂诗（其五）","author":"龚自珍","genre":"古诗","dynasty":"清","content":"<b>浩荡</b>离愁白日斜，<b>吟鞭</b>东指即天涯。\\n<b>落红</b>不是无情物，化作春泥更护花。","translation":"浩浩荡荡的离别愁绪向远处延伸，夕阳已经西斜；扬鞭向东离开故乡，从此就是天涯。\\n落花并不是无情之物，即使化作春泥，也愿意培育春花成长。","pinyin":null,"annotation":"吟鞭：诗人的马鞭。\\n落红：落花。","authorIntro":"龚自珍（1792—1841），字璱人，号定庵，清代思想家、文学家。","appreciation":"诗人以落花自比，虽离开朝廷仍关心国家和社会，以形象的比喻表现无私奉献的情怀。","extraJson":{"content_key":"d3e87f771fdf","dynasty":"清","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["浩荡","吟鞭","落红"],"paragraph_count":1,"required_catalogs":[910036,910072]}},{"id":900031,"title":"卖油翁","author":"欧阳修","genre":"文言文","dynasty":"北宋","content":"陈康肃公尧咨善射，当世无双，公亦以此<b>自矜</b>。\\n尝射于家圃，有卖油翁释担而立，<b>睨</b>之久而不去。\\n见其发矢十中八九，但微<b>颔</b>之。##康肃问曰：“汝亦知射乎？\\n吾射不亦精乎？”\\n翁曰：“无他，但手熟尔。”\\n康肃忿然曰：“尔安敢轻吾射！”\\n翁曰：“以我<b>酌</b>油知之。”\\n乃取一葫芦置于地，以钱覆其口，徐以杓<b>酌</b>油沥之，自钱孔入，而钱不湿。\\n因曰：“我亦无他，惟手熟尔。”\\n康肃笑而<b>遣</b>之。","translation":"陈尧咨擅长射箭，当时没有人能比得上，他也凭借这一点自我夸耀。\\n曾经在家里的场地射箭，有个卖油的老翁放下担子站在那里，斜着眼看了很久也没有离开。\\n看见他射箭十支中八九支，只是微微点头。##陈尧咨问：“你也懂射箭吗？\\n我的射箭技艺难道不精湛吗？”\\n老翁说：“没有别的，只是手法熟练罢了。”\\n陈尧咨气愤地说：“你怎么敢轻视我的射箭本领！”\\n老翁说：“凭我倒油的经验知道这个道理。”\\n于是取来一个葫芦放在地上，用一枚铜钱盖住葫芦口，慢慢地用勺子把油滴入，从钱孔注入，钱却没有沾湿。\\n于是说：“我也没有别的，只是手法熟练罢了。”\\n陈尧咨笑着把他打发走了。","pinyin":null,"annotation":"自矜：自夸。\\n睨：斜着眼看。\\n颔：点头。\\n忿然：气愤的样子。\\n安：怎么。\\n酌：舀取。\\n杓：同“勺”。\\n遣：打发。","authorIntro":"欧阳修（1007—1072），字永叔，号醉翁，晚号六一居士，北宋文学家。","appreciation":"故事通过射箭和倒油的对比，说明熟能生巧的道理，同时告诫人们即使有专长也不应自满。","extraJson":{"content_key":"453c2bff17f3","dynasty":"北宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["自矜","睨","颔","酌","遣"],"paragraph_count":2,"required_catalogs":[910037,910073]}},{"id":900032,"title":"泊秦淮","author":"杜牧","genre":"古诗","dynasty":"唐","content":"<b>烟笼</b>寒水月笼沙，夜泊秦淮近酒家。\\n<b>商女</b>不知<b>亡国恨</b>，隔江犹唱<b>后庭花</b>。","translation":"烟雾笼罩着寒冷的江水，月光映照着沙滩；夜晚停泊在秦淮河边，靠近酒家。\\n歌女不知道亡国的悲恨，隔着江水还在唱《玉树后庭花》。","pinyin":null,"annotation":"泊：停泊。\\n商女：歌女。\\n后庭花：歌曲《玉树后庭花》的简称，被视为亡国之音。","authorIntro":"杜牧，晚唐诗人。","appreciation":"诗歌借秦淮夜景和歌女歌声，把对现实的忧虑融入写景叙事，批评统治者沉溺声色、漠视国事。","extraJson":{"content_key":"45ea1c12bcaf","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["烟笼","商女","亡国恨","后庭花"],"paragraph_count":1,"required_catalogs":[]}},{"id":900033,"title":"贾生","author":"李商隐","genre":"古诗","dynasty":"唐","content":"宣室求贤访<b>逐臣</b>，贾生<b>才调</b>更无伦。\\n可怜夜半虚前席，不问<b>苍生</b>问<b>鬼神</b>。","translation":"汉文帝在宣室召见被贬逐的臣子，贾谊的才华和格调更是无人能比。\\n可惜文帝半夜徒然向前移动坐席靠近他，却不询问百姓的疾苦，只询问鬼神之事。","pinyin":null,"annotation":"宣室：汉代未央宫前殿。\\n逐臣：被贬谪的臣子。\\n才调：才华气格。\\n苍生：百姓。","authorIntro":"李商隐，晚唐诗人。","appreciation":"诗歌先扬后抑，通过汉文帝召见贾谊却不问苍生的历史细节，讽刺晚唐统治者不能真正重视人才和民生。","extraJson":{"content_key":"d4c13a0b6c48","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["逐臣","才调","苍生","鬼神"],"paragraph_count":1,"required_catalogs":[]}},{"id":900034,"title":"过松源晨炊漆公店（其五）","author":"杨万里","genre":"古诗","dynasty":"南宋","content":"莫言下岭便无难，<b>赚得</b>行人<b>错喜欢</b>。\\n正入万山<b>圈子</b>里，一山放过一山拦。","translation":"不要说下山就没有困难，这样会让行人白白高兴。\\n当你正进入群山围成的圈子时，一座山放过你，另一座山又把你拦住。","pinyin":null,"annotation":"赚得：骗得。\\n错喜欢：空欢喜。\\n放过：让过去。","authorIntro":"杨万里（1127—1206），字廷秀，号诚斋，南宋诗人。","appreciation":"诗歌借登山写人生道路，说明不要被一时顺利迷惑，前进中仍会有新的困难，语言浅近而富有哲理。","extraJson":{"content_key":"6716bae1a12e","dynasty":"南宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["赚得","错喜欢","圈子"],"paragraph_count":1,"required_catalogs":[]}},{"id":900035,"title":"约客","author":"赵师秀","genre":"古诗","dynasty":"南宋","content":"<b>黄梅时节</b>家家雨，青草<b>池塘</b>处处蛙。\\n有约不来过夜半，<b>闲敲</b>棋子落灯花。","translation":"梅子黄时，家家户户都笼罩在雨中，长满青草的池塘边处处传来蛙声。\\n已经约好的客人却没有来，时间已经过了午夜，我悠闲地敲着棋子，震落了灯花。","pinyin":null,"annotation":"黄梅时节：梅子黄熟的时节，江南雨季。\\n灯花：灯芯燃烧时结成的花状物。","authorIntro":"赵师秀，南宋诗人，“永嘉四灵”之一。","appreciation":"诗歌前两句写雨夜蛙声，后两句写候客的动作，以“闲敲棋子”表现等待中的寂寞和闲适。","extraJson":{"content_key":"aaffec231778","dynasty":"南宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["黄梅时节","池塘","闲敲"],"paragraph_count":1,"required_catalogs":[]}},{"id":900036,"title":"寒食","author":"韩翃","genre":"古诗","dynasty":"唐","content":"春城无处不<b>飞花</b>，寒食东风<b>御柳</b>斜。\\n日暮汉宫<b>传蜡烛</b>，轻烟散入<b>五侯</b>家。","translation":"暮春时节，长安城处处飞舞着落花，寒食节东风吹斜了皇城中的柳枝。\\n日暮时分，汉宫里传送蜡烛，轻烟飘散到王侯贵族的家中。","pinyin":null,"annotation":"春城：指春天的长安城。\\n寒食：节日名，禁火三日。\\n御柳：皇城中的柳树。\\n五侯：泛指权贵。","authorIntro":"韩翃，唐代诗人。","appreciation":"诗歌以飞花、东风、蜡烛和轻烟描绘寒食春景，结尾写宫中传烛进入权贵之家，含蓄点出宫廷生活。","extraJson":{"content_key":"3046fcc14b23","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["飞花","御柳","传蜡烛","五侯"],"paragraph_count":1,"required_catalogs":[]}},{"id":900037,"title":"迢迢牵牛星","author":"《古诗十九首》","genre":"古诗","dynasty":"东汉","content":"迢迢牵牛星，皎皎河汉女。\\n纤纤<b>擢</b>素手，札札弄<b>机杼</b>。\\n终日不成章，<b>泣涕</b>零如雨。\\n河汉清且浅，相去复几许？\\n<b>盈盈</b>一水间，<b>脉脉</b>不得语。","translation":"遥远而明亮的牵牛星，皎洁而遥远的织女星。\\n织女伸出纤纤素手，发出札札声摆弄织机。\\n一整天也织不成纹样，眼泪流下来像下雨一样。\\n银河清澈又浅，彼此相隔又有多远呢？\\n只隔着一条清清的河水，却只能含情凝视，不能开口说话。","pinyin":null,"annotation":"河汉：银河。\\n擢：伸出。\\n章：织物上的经纬纹理。\\n零：落下。\\n盈盈：水清澈的样子。\\n脉脉：含情凝视的样子。","authorIntro":"《古诗十九首》是东汉末年一组五言诗的总称，作者多已不可考。","appreciation":"诗歌借牛郎织女的传说写相思和阻隔，以叠词和动作描写塑造织女形象，情感含蓄深长。","extraJson":{"content_key":"f7a24ab70a6f","dynasty":"东汉","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["擢","机杼","泣涕","盈盈","脉脉"],"paragraph_count":1,"required_catalogs":[]}},{"id":900038,"title":"十五夜望月","author":"王建","genre":"古诗","dynasty":"唐","content":"<b>中庭</b>地白树栖鸦，<b>冷露</b>无声湿桂花。\\n今夜月明人尽望，不知<b>秋思</b>落谁家。","translation":"月光照在庭院中，地面像铺了一层白霜，树上栖息着乌鸦；秋露无声地打湿了桂花。\\n今夜明月当空，人们都在仰望，不知道这秋夜的思念会落到谁家。","pinyin":null,"annotation":"中庭：庭院中。\\n地白：月光照在地上像铺了一层白霜。\\n秋思：秋天的情思，这里指思乡之情。","authorIntro":"王建，唐代诗人。","appreciation":"诗歌从庭院月色写起，以乌鸦、冷露、桂花等意象渲染清冷秋夜，末句由己及人，含蓄表现望月思乡。","extraJson":{"content_key":"7c34ac3aff21","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["中庭","冷露","秋思"],"paragraph_count":1,"required_catalogs":[]}},{"id":900039,"title":"马诗","author":"李贺","genre":"古诗","dynasty":"唐","content":"<b>大漠</b>沙如雪，<b>燕山</b>月似钩。\\n何当<b>金络脑</b>，快走踏清秋。","translation":"大漠中的沙子像雪一样洁白，燕山顶上的月亮像弯钩。\\n什么时候才能给我的马套上用黄金装饰的笼头，在清爽的秋天驰骋呢？","pinyin":null,"annotation":"燕山：山名。\\n金络脑：用黄金装饰的马笼头。\\n何当：什么时候能够。","authorIntro":"李贺（约790—约816），字长吉，中唐诗人。","appreciation":"前两句写边疆景色，后两句以骏马自况，借“金络脑”表达渴望建功立业、施展抱负的愿望。","extraJson":{"content_key":"3287c5e6924e","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["大漠","燕山","金络脑"],"paragraph_count":1,"required_catalogs":[]}},{"id":900040,"title":"石灰吟","author":"于谦","genre":"古诗","dynasty":"明","content":"<b>千锤万凿</b>出深山，烈火<b>焚烧</b>若等闲。\\n<b>粉骨碎身</b>浑不怕，要留<b>清白</b>在人间。","translation":"石灰石经过千锤万凿才从深山中开采出来，把烈火焚烧看作平平常常。\\n即使粉身碎骨也完全不害怕，只愿把清白留在人世间。","pinyin":null,"annotation":"吟：古代诗体的一种。\\n若等闲：好像平常事。\\n浑：全、完全。","authorIntro":"于谦（1398—1457），字廷益，号节庵，明代政治家、诗人。","appreciation":"诗人以石灰的烧炼过程象征人生磨炼，以物喻人，表现不畏艰险、坚守清白的高尚节操。","extraJson":{"content_key":"d45101da65e1","dynasty":"明","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["千锤万凿","焚烧","粉骨碎身","清白"],"paragraph_count":1,"required_catalogs":[]}},{"id":900041,"title":"竹石","author":"郑燮","genre":"古诗","dynasty":"清","content":"<b>咬定</b>青山不放松，立根原在<b>破岩</b>中。\\n千磨万击还<b>坚劲</b>，<b>任尔</b>东西南北风。","translation":"竹子紧紧咬住青山不放松，根扎在破裂的岩石之中。\\n经历千万次磨炼和打击仍然坚韧挺拔，任凭你从东西南北刮来的风。","pinyin":null,"annotation":"咬定：紧紧扎根。\\n立根：扎根。\\n坚劲：坚韧刚劲。\\n任尔：任凭你。","authorIntro":"郑燮（1693—1765），字克柔，号板桥，清代书画家、文学家。","appreciation":"诗人借竹写人，以“咬定”“不放松”“任尔”等词表现坚定顽强、不向恶劣环境屈服的品格。","extraJson":{"content_key":"a821774b2366","dynasty":"清","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["咬定","破岩","坚劲","任尔"],"paragraph_count":1,"required_catalogs":[]}},{"id":900042,"title":"伯牙鼓琴","author":"《吕氏春秋》","genre":"文言文","dynasty":"战国末","content":"伯牙鼓琴，锺子期听之。\\n方鼓琴而<b>志在太山</b>，锺子期曰：“善哉乎鼓琴，<b>巍巍</b>乎若太山。”\\n少选之间而志在流水，锺子期曰：“善哉乎鼓琴，<b>汤汤</b>乎若流水。”\\n锺子期死，伯牙破琴<b>绝弦</b>，终身不复鼓琴，以为世无足复为鼓琴者。","translation":"伯牙弹琴，锺子期听他弹奏。\\n伯牙刚刚弹琴，意念在高山，锺子期说：“琴弹得好啊，像高大的泰山。”\\n过了一会儿，伯牙意念在流水，锺子期说：“琴弹得好啊，像奔腾的流水。”\\n锺子期死后，伯牙摔破琴，弄断琴弦，终身不再弹琴，认为世上再没有值得为之弹琴的人了。","pinyin":null,"annotation":"鼓：弹奏。\\n志：意念、心志。\\n太山：大山。\\n少选：一会儿。\\n汤汤：水流大而急的样子。","authorIntro":"《吕氏春秋》是战国末期吕不韦组织门客编写的杂家著作。","appreciation":"文章通过伯牙和锺子期的故事表现知音难遇、知己难得的主题，伯牙绝弦的行为强化了情感的深度。","extraJson":{"content_key":"1c618a459725","dynasty":"战国末","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["志在太山","巍巍","汤汤","绝弦"],"paragraph_count":1,"required_catalogs":[]}},{"id":900043,"title":"书戴嵩画牛","author":"苏轼","genre":"文言文","dynasty":"北宋","content":"蜀中有杜处士，好书画，所宝以百数。\\n有戴嵩《牛》一轴，尤所爱，锦囊玉轴，常以自随。##一日<b>曝</b>书画，有一牧童见之，<b>拊掌</b>大笑，曰：“此画斗牛也。\\n牛斗，力在角，尾<b>搐</b>入两股间。\\n今乃<b>掉尾</b>而斗，谬矣。”\\n处士笑而然之。\\n古语有云：“耕当问奴，织当问婢。”\\n不可改也。","translation":"四川有个杜处士，喜爱书画，所珍藏的书画有几百件。\\n其中有一幅戴嵩画的《斗牛图》，他尤其喜爱，用锦缎作画囊、玉作画轴，常常随身带着。##一天，他晒书画，一个牧童看见这幅画，拍手大笑说：“这画的是斗牛。\\n牛相斗时，力量在角上，尾巴紧紧夹在两条大腿中间。\\n现在这幅画上的牛却摇着尾巴在斗，错了。”\\n杜处士笑笑，认为牧童说得对。\\n古话说：“耕种应当去问农民，织布应当去问女仆。”\\n这句话是不可改变的。","pinyin":null,"annotation":"处士：有德才而不愿做官的人。\\n所宝：所珍藏的书画。\\n曝：晒。\\n拊掌：拍手。\\n搐：抽缩。\\n掉尾：摇尾巴。","authorIntro":"苏轼，北宋文学家、书画家。","appreciation":"文章通过牧童指出名画错误的故事，说明实践出真知，遇到问题应向有实际经验的人请教。","extraJson":{"content_key":"0e81dcdc14d6","dynasty":"北宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["曝","拊掌","搐","掉尾"],"paragraph_count":2,"required_catalogs":[]}},{"id":900044,"title":"江上渔者","author":"范仲淹","genre":"古诗","dynasty":"北宋","content":"江上往来人，但爱<b>鲈鱼</b>美。\\n君看<b>一叶舟</b>，出没<b>风波</b>里。","translation":"江上来来往往的人只知道喜爱鲈鱼味道鲜美。\\n请你看那一叶小小的渔船，正出没在风浪之中。","pinyin":null,"annotation":"渔者：捕鱼的人。\\n但：只是。\\n鲈鱼：鱼名，味美。\\n出没：忽隐忽现。","authorIntro":"范仲淹（989—1052），字希文，北宋政治家、文学家。","appreciation":"诗歌以旁观者的享受和渔人的艰险对比，表现对劳动人民的关切和对只知享乐者的提醒。","extraJson":{"content_key":"8ce89671598c","dynasty":"北宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["鲈鱼","一叶舟","风波"],"paragraph_count":1,"required_catalogs":[]}},{"id":900045,"title":"泊船瓜洲","author":"王安石","genre":"古诗","dynasty":"北宋","content":"京口<b>瓜洲</b>一水间，钟山只隔<b>数重山</b>。\\n春风又<b>绿</b>江南岸，明月何时<b>照我还</b>？","translation":"京口和瓜洲只隔着一条江水，钟山也只隔着几重青山。\\n春风又吹绿了江南两岸，明月什么时候才能照着我回到故乡？","pinyin":null,"annotation":"瓜洲：在今江苏扬州南长江边。\\n京口：今江苏镇江。\\n绿：吹绿。\\n还：归来。","authorIntro":"王安石，北宋政治家、文学家。","appreciation":"诗歌写春风又绿江南的明丽景色，借“绿”字炼字传神，结尾以明月引出思乡和归意。","extraJson":{"content_key":"8a99fb07c541","dynasty":"北宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["瓜洲","数重山","绿","照我还"],"paragraph_count":1,"required_catalogs":[]}},{"id":900046,"title":"游园不值","author":"叶绍翁","genre":"古诗","dynasty":"南宋","content":"应怜<b>屐齿</b>印苍苔，<b>小扣</b><b>柴扉</b>久不开。\\n春色满园关不住，一枝红杏出墙来。","translation":"大概是园主人爱惜青苔，怕我的木屐在上面留下脚印；我轻轻敲打柴门，很久也没有人来开。\\n可是满园的春色是关不住的，一枝红杏伸出墙外来。","pinyin":null,"annotation":"不值：没有遇到园主人。\\n屐齿：木屐底下的齿。\\n小扣：轻轻敲门。\\n柴扉：柴门。","authorIntro":"叶绍翁，南宋诗人。","appreciation":"诗歌先写访园未遇的遗憾，再以出墙红杏表现春色不可阻挡，虚实相生，富有哲理意味。","extraJson":{"content_key":"928ee0d64808","dynasty":"南宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["不值","屐齿","小扣","柴扉"],"paragraph_count":1,"required_catalogs":[]}},{"id":900047,"title":"卜算子·送鲍浩然之浙东","author":"王观","genre":"古诗","dynasty":"北宋","content":"水是<b>眼波横</b>，山是<b>眉峰聚</b>。\\n欲问行人去那边？眉眼<b>盈盈</b>处。\\n才始送春归，又送君归去。\\n若到江南赶上春，千万<b>和春住</b>。","translation":"水像美人的眼波横流，山像美人的眉峰聚拢。\\n想问远行的人要到哪里去？到那山水明秀、眉眼盈盈的地方。\\n刚刚送走春天，又要送你归去。\\n如果你到江南还能赶上春天，千万要把春天留住。","pinyin":null,"annotation":"鲍浩然：词人的朋友。\\n水是眼波横：水像美人的眼波横流。\\n眉峰聚：山如美人蹙起的眉。\\n盈盈：仪态美好的样子。","authorIntro":"王观，北宋词人。","appreciation":"词上片用比喻写浙东山水之美，下片把送春与送友相连，既有惜春，也有对友人的深情祝愿。","extraJson":{"content_key":"a301e696954c","dynasty":"北宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["眼波横","眉峰聚","盈盈","和春住"],"paragraph_count":1,"required_catalogs":[]}},{"id":900048,"title":"浣溪沙","author":"苏轼","genre":"古诗","dynasty":"北宋","content":"游蕲水清泉寺，寺临兰溪，溪水西流。\\n山下<b>兰芽</b>短，松间沙路净无泥。萧萧暮雨<b>子规</b>啼。\\n谁道人生无<b>再少</b>？门前流水尚能西！休将白发唱<b>黄鸡</b>。","translation":"游览蕲水的清泉寺，寺庙靠近兰溪，溪水向西流。\\n山下兰草的嫩芽刚刚出土，松林间的沙路洁净没有泥；傍晚细雨萧萧，杜鹃声声啼叫。\\n谁说人生不能重新拥有少年时光？门前的流水还能够向西流呢！不要因年老而感叹时光易逝。","pinyin":null,"annotation":"蕲水：今湖北浠水一带。\\n萧萧：形容雨声。\\n子规：杜鹃鸟。\\n黄鸡：黄鸡报晓，借指时光流逝。","authorIntro":"苏轼，北宋文学家。","appreciation":"上片写清泉寺暮春景色，下片以溪水西流反用“人生不能再少”的常理，表现积极旷达的人生态度。","extraJson":{"content_key":"f32f182e7de6","dynasty":"北宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["兰芽","子规","再少","黄鸡"],"paragraph_count":1,"required_catalogs":[]}},{"id":900049,"title":"清平乐","author":"黄庭坚","genre":"古诗","dynasty":"北宋","content":"春归何处？<b>寂寞</b>无行路。\\n若有人知春去处，<b>唤取</b>归来同住。\\n春无踪迹谁知？除非问取黄鹂。\\n<b>百啭</b>无人能解，因风飞过<b>蔷薇</b>。","translation":"春天回到哪里去了？四处寂寞，找不到它的踪迹。\\n如果有人知道春天离去的地方，就把它叫回来和我们同住。\\n春天没有踪迹，谁知道它去了哪里？除非去问一问黄鹂。\\n黄鹂百转千啭却没有人能听懂它的歌声，它趁着风飞过蔷薇花。","pinyin":null,"annotation":"行路：踪迹。\\n唤取：叫来。\\n啭：鸟婉转地鸣叫。\\n因风：顺着风势。","authorIntro":"黄庭坚（1045—1105），字鲁直，号山谷道人，北宋文学家、书法家。","appreciation":"词人通过追寻春天的奇特想象表现惜春之情，以黄鹂和蔷薇收束，轻灵而含蓄。","extraJson":{"content_key":"25eb6af784f3","dynasty":"北宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["寂寞","唤取","百啭","蔷薇"],"paragraph_count":1,"required_catalogs":[]}},{"id":900050,"title":"学弈","author":"孟子及其弟子","genre":"文言文","dynasty":"战国","content":"弈秋，通国之善弈者也。\\n使弈秋<b>诲</b>二人弈，其一人<b>专心致志</b>，惟弈秋之为听；\\n一人虽听之，一心以为有<b>鸿鹄</b>将至，思援弓<b>缴</b>而射之。\\n虽与之俱学，<b>弗若</b>之矣。\\n为是其智<b>弗若</b>与？\\n曰：非然也。","translation":"弈秋是全国最擅长下棋的人。\\n让弈秋教两个人下棋，其中一个人专心致志，只听弈秋的教导；\\n另一个人虽然也在听，却一心想着有天鹅将要飞来，想拿弓箭把它射下来；\\n虽然和前一个人一起学习，成绩却不如前一个人。\\n是因为他的智力不如前一个人吗？\\n回答说：不是这样的。","pinyin":null,"annotation":"弈：下棋。\\n诲：教导。\\n惟弈秋之为听：只听弈秋的教导。\\n鸿鹄：天鹅。\\n援：引，拉。\\n缴：系在箭上的丝绳。\\n弗若：不如。","authorIntro":"《孟子》记录孟子及其弟子言行，儒家经典之一。","appreciation":"故事通过两个人学习下棋的不同结果，说明学习必须专心致志，不能三心二意。","extraJson":{"content_key":"edc1ff05f40a","dynasty":"战国","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["诲","专心致志","鸿鹄","缴","弗若"],"paragraph_count":1,"required_catalogs":[]}},{"id":900051,"title":"两小儿辩日","author":"列子","genre":"文言文","dynasty":"战国","content":"孔子东游，见两小儿<b>辩斗</b>，问其故。##一儿曰：“我以日始出时<b>去</b>人近，而日中时远也。”\\n一儿以日初出远，而日中时近也。##一儿曰：“日初出大如车盖，及日中则如<b>盘盂</b>，此不为远者小而近者大乎？”\\n一儿曰：“日初出沧沧凉凉，及其日中如<b>探汤</b>，此不为近者热而远者凉乎？”##孔子不能决也。\\n两小儿笑曰：“<b>孰</b>为汝多<b>知</b>乎？”","translation":"孔子向东游历，看见两个小孩在争辩，便问他们争辩的原因。##一个小孩说：“我认为太阳刚出来时离人近，而正午时离人远。”\\n另一个小孩认为太阳刚出来时离人远，而正午时离人近。##一个小孩说：“太阳刚出来时大得像车盖，等到正午时就像盘盂，这不是远的时候小、近的时候大吗？”\\n另一个小孩说：“太阳刚出来时清凉寒冷，等到正午时就像把手伸进热水，这不是近的时候热、远的时候凉吗？”##孔子不能判断。\\n两个小孩笑着说：“谁说你知识渊博呢？”","pinyin":null,"annotation":"辩斗：辩论，争论。\\n故：原因。\\n去：距离。\\n车盖：古代车上的圆形篷盖。\\n盘盂：盛物的器皿。\\n沧沧凉凉：寒凉的感觉。\\n探汤：把手伸到热水里。\\n孰：谁。\\n知：同“智”。","authorIntro":"列子，战国时期思想家，道家代表人物。","appreciation":"寓言通过两个小孩从视觉和感觉提出相反观点，表现他们善于观察、敢于质疑，也说明认识事物要实事求是，孔子也有不知为不知的一面。","extraJson":{"content_key":"d883525bfafd","dynasty":"战国","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["辩斗","去","盘盂","探汤","孰","知"],"paragraph_count":4,"required_catalogs":[]}},{"id":900052,"title":"沁园春·长沙","author":"毛泽东","genre":"古诗","dynasty":"现代","content":"独立寒秋，湘江北去，橘子洲头。\\n看万山红遍，层林尽染；漫江碧透，百舸争流。\\n鹰击长空，鱼翔浅底，万类霜天竞自由。\\n怅<b>寥廓</b>，问苍茫大地，谁主沉浮？\\n携来百侣曾游。忆往昔<b>峥嵘</b>岁月稠。\\n恰同学少年，风华正茂；书生意气，挥斥方<b>遒</b>。\\n指点江山，激扬文字，<b>粪土</b>当年万户侯。\\n曾记否，到中流击水，浪<b>遏</b>飞舟？","translation":"独自站立在深秋的寒风中，湘江水向北流去，橘子洲在眼前。\\n看万千山峰全都染上红色，层层树林仿佛浸染；满江秋水碧绿澄澈，大小船只竞相行驶。\\n雄鹰搏击长空，鱼儿在清澈的水底游动，万物都在秋光中争着享受自由。\\n面对辽阔的宇宙，问苍茫大地，谁才是主宰沉浮的力量？\\n我曾和许多同学携手来此游览，回忆往昔，那些峥嵘岁月多么密集。\\n同学们正值青春年少，风采才华旺盛；大家意气风发，挥洒豪情。\\n评论国家大事，写出激扬的文章，把当时的权贵视若粪土。\\n还记得吗？我们曾在江水深处游泳，激起的浪花几乎挡住飞来的船只。","pinyin":null,"annotation":"橘子洲：湘江中的洲名。\\n百舸：许多船。\\n怅寥廓：面对广阔天空而深思。\\n峥嵘：不平凡。\\n挥斥方遒：意气奔放，奋发有为。\\n粪土：视……如粪土。\\n遏：阻止。","authorIntro":"毛泽东（1893—1976），字润之，伟大的无产阶级革命家、战略家、理论家和诗人。","appreciation":"上片写长沙秋景并提出“谁主沉浮”的时代之问，下片追忆同学少年和革命豪情，以景抒情、以问结篇，表现青年人的崇高理想和革命气概。","extraJson":{"content_key":"03b2d7d1cf1c","dynasty":"现代","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["寥廓","峥嵘","遒","粪土","遏"],"paragraph_count":1,"required_catalogs":[910104]}},{"id":900053,"title":"芣苢","author":"《诗经》","genre":"古诗","dynasty":"先秦","content":"采采<b>芣苢</b>，薄言采之。采采<b>芣苢</b>，薄言有之。\\n采采<b>芣苢</b>，薄言<b>掇</b>之。采采<b>芣苢</b>，薄言<b>捋</b>之。\\n采采<b>芣苢</b>，薄言<b>袺</b>之。采采<b>芣苢</b>，薄言<b>襭</b>之。","translation":"繁茂的芣苢啊，快来采呀；繁茂的芣苢啊，快来采些吧。\\n繁茂的芣苢啊，快来拾取；繁茂的芣苢啊，快来成把地捋取。\\n繁茂的芣苢啊，快提起衣襟兜起来；繁茂的芣苢啊，快把衣襟别起来兜满。","pinyin":null,"annotation":"芣苢：车前草，嫩叶可食。\\n薄言：语气助词，无实义。\\n掇：拾取。\\n捋：成把地取。\\n袺：提起衣襟兜东西。\\n襭：把衣襟别在腰带上兜东西。","authorIntro":"《诗经》是我国最早的一部诗歌总集，收录西周初年至春秋中叶的诗歌。","appreciation":"诗歌通过“采、有、掇、捋、袺、襭”的动作变化和重章复沓，表现集体劳动的热烈场面和劳动者的喜悦。","extraJson":{"content_key":"91b1a112ca71","dynasty":"先秦","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["芣苢","掇","捋","袺","襭"],"paragraph_count":1,"required_catalogs":[]}},{"id":900054,"title":"插秧歌","author":"杨万里","genre":"古诗","dynasty":"南宋","content":"田夫<b>抛秧</b>田妇接，小儿拔秧大儿插。\\n笠是<b>兜鍪</b>蓑是甲，雨从头上湿到<b>胛</b>。\\n唤渠朝餐歇半霎，低头折腰只不答。\\n秧根未牢<b>莳</b>未<b>匝</b>，照管鹅儿与雏鸭。","translation":"农夫抛秧，农妇接秧；小儿拔秧，大儿插秧。\\n斗笠是头盔，蓑衣是铠甲；雨水从头上落下，一直湿到肩胛。\\n喊他们吃早饭、歇息一会儿，他们只是低头弯腰忙碌，顾不上回答。\\n秧苗根还没有扎牢，插秧还没有完成，要小心照看鹅和小鸭。","pinyin":null,"annotation":"兜鍪：古代战士的头盔。\\n胛：肩胛。\\n渠：他，这里指农人。\\n莳：移栽。\\n匝：周、遍。","authorIntro":"杨万里（1127—1206），字廷秀，号诚斋，南宋诗人。","appreciation":"诗歌用白描和口语写全家冒雨插秧的劳动场面，以“笠”“蓑”作比，表现劳动的紧张、热烈和农人的勤劳。","extraJson":{"content_key":"848a2f306389","dynasty":"南宋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["抛秧","兜鍪","胛","莳","匝"],"paragraph_count":1,"required_catalogs":[]}},{"id":900055,"title":"归园田居（其一）","author":"陶渊明","genre":"古诗","dynasty":"东晋","content":"少无适俗韵，性本爱丘山。误落尘网中，一去三十年。\\n<b>羁鸟</b>恋旧林，池鱼思故渊。\\n开荒南野际，<b>守拙</b>归园田。\\n方宅十余亩，草屋八九间。\\n榆柳荫后檐，桃李罗堂前。\\n<b>暧暧</b>远人村，依依墟里烟。\\n狗吠深巷中，鸡鸣桑树颠。\\n户庭无尘杂，虚室有余闲。\\n久在<b>樊笼</b>里，复得返自然。","translation":"年少时就没有适应世俗的性格，天性喜爱山林。误入世俗的罗网，一去就是三十年。\\n笼中鸟留恋旧日的森林，池中鱼思念原来的深潭。\\n在南边的田野开荒，守着愚拙的本性回到田园。\\n住宅四周有十多亩地，草屋有八九间。\\n榆树柳树遮蔽后檐，桃树李树排列在堂前。\\n远处的村庄依稀可见，村落上空飘着袅袅炊烟。\\n深巷传来狗叫，桑树顶上传来鸡鸣。\\n门庭没有世俗杂事，空屋里有闲暇。\\n长久地困在樊笼里，如今终于又回归自然。","pinyin":null,"annotation":"适俗韵：适应世俗的性格。\\n尘网：世俗的罗网。\\n羁鸟：笼中鸟。\\n守拙：守住愚拙的本性。\\n暧暧：昏暗、模糊。\\n樊笼：关鸟兽的笼子，比喻官场。","authorIntro":"陶渊明（约365—427），字元亮，号五柳先生，东晋诗人。","appreciation":"诗人以“羁鸟”“池鱼”“樊笼”比喻身处官场的自己，以田园景物和生活写归隐后的自由，表现对官场的厌弃和对自然的热爱。","extraJson":{"content_key":"30105fb686b2","dynasty":"东晋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["羁鸟","守拙","暧暧","樊笼"],"paragraph_count":1,"required_catalogs":[910107]}},{"id":900056,"title":"梦游天姥吟留别","author":"李白","genre":"古诗","dynasty":"唐","content":"海客谈<b>瀛洲</b>，烟涛微茫信难求；越人语天姥，云霞明灭或可睹。\\n天姥连天向天横，势拔五岳掩赤城。天台四万八千丈，对此欲倒东南倾。\\n我欲因之梦吴越，一夜飞度镜湖月。湖月照我影，送我至剡溪。\\n谢公宿处今尚在，<b>渌水</b>荡漾清猿啼。脚著谢公屐，身登青云梯。\\n半壁见海日，空中闻天鸡。千岩万转路不定，迷花倚石忽已<b>暝</b>。\\n熊咆龙吟殷岩泉，栗深林兮惊层巅。云青青兮欲雨，水澹澹兮生烟。\\n<b>列缺</b>霹雳，丘峦崩摧。洞天石扉，<b>訇然</b>中开。\\n青冥浩荡不见底，日月照耀金银台。霓为衣兮风为马，云之君兮纷纷而来下。\\n虎鼓瑟兮鸾回车，仙之人兮列如麻。\\n忽魂悸以魄动，恍惊起而长嗟。惟觉时之枕席，失向来之烟霞。\\n世间行乐亦如此，古来万事东流水。别君去兮何时还？且放白鹿青崖间，须行即骑访名山。\\n安能<b>摧眉折腰</b>事权贵，使我不得开心颜！","translation":"海外来客谈论瀛洲，烟雾波涛渺茫，确实难以寻求；越地的人谈论天姥山，云霞忽明忽暗，或许可以看见。\\n天姥山高耸入云，横向天际，气势超过五岳，遮蔽赤城山；天台山高达四万八千丈，对着天姥山也要向东南倾倒。\\n我因此梦游吴越，一夜飞过镜湖上空；湖月照着我的身影，送我到剡溪。\\n谢灵运住过的地方至今还在，清水荡漾，猿猴清啼；我脚穿谢公木屐，登上青云般的山路。\\n山腰看见海上日出，空中听到天鸡的叫声；山岩千回百转，路途曲折，迷恋花朵倚着岩石时忽然天黑。\\n熊在怒吼，龙在长鸣，岩中的泉水震响，使深林战栗、层巅惊动；云色青青将要下雨，水波荡漾升起烟雾。\\n电光闪闪，雷声轰鸣，山丘崩塌；仙洞的石门轰然打开。\\n青色的天空浩瀚无边看不到底，日月照耀着金银台；彩虹做衣裳，风做马，云中的神仙纷纷下来。\\n老虎弹琴，鸾鸟驾车，仙人密密麻麻排列。\\n忽然魂惊魄动，恍惚中惊醒，长声叹息；醒来时只有枕席，梦中美好的烟霞全都消失。\\n人世间的欢乐也是此，自古以来万事都像东流的水；和你告别后什么时候回来？暂且把白鹿放在青崖间，需要时就骑它去访问名山。\\n怎么能低头弯腰侍奉权贵，使我不能舒心展颜！","pinyin":null,"annotation":"瀛洲：传说中的海上仙山。\\n渌：清。\\n著：穿。\\n暝：天黑。\\n殷：震响，使……震响。\\n列缺：闪电。\\n訇然：声音很大的样子。\\n摧眉折腰：低头弯腰，指卑躬屈膝。","authorIntro":"李白，唐代浪漫主义诗人。","appreciation":"诗歌以梦境为主体，描绘瑰丽奇幻的天姥山仙境，梦醒后转入现实，以“安能摧眉折腰事权贵”直抒不事权贵的傲岸性格。","extraJson":{"content_key":"f8111ab55ef4","dynasty":"唐","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["瀛洲","渌水","暝","列缺","訇然","摧眉折腰"],"paragraph_count":1,"required_catalogs":[910108]}},{"id":900057,"title":"登高","author":"杜甫","genre":"古诗","dynasty":"唐","content":"风急天高猿啸哀，<b>渚</b>清沙白鸟飞回。\\n无边<b>落木</b>萧萧下，不尽长江滚滚来。\\n万里悲秋常作客，百年多病独登台。\\n艰难苦恨<b>繁霜鬓</b>，<b>潦倒</b>新停浊酒杯。","translation":"风急天高，猿猴哀鸣；水清沙白，鸟儿在江洲上盘旋。\\n无边无际的树木萧萧地飘下落叶，不尽的长江滚滚奔流而来。\\n漂泊万里常年作客，又值悲秋；年老多病，独自登上高台。\\n一生艰难，深恨白发增多；潦倒失意，近来又停下了浊酒杯。","pinyin":null,"annotation":"渚：水中的小块陆地。\\n回：回旋。\\n落木：落叶。\\n繁霜鬓：鬓发像霜一样白且多。\\n潦倒：衰颓，失意。","authorIntro":"杜甫，唐代现实主义诗人。","appreciation":"前两联写登高所见的秋江景色，后两联由景入情，层层写出羁旅、悲秋、多病、孤独和忧国伤时，沉郁顿挫。","extraJson":{"content_key":"972da03a7afb","dynasty":"唐","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["渚","落木","繁霜鬓","潦倒"],"paragraph_count":1,"required_catalogs":[910109]}},{"id":900058,"title":"念奴娇·赤壁怀古","author":"苏轼","genre":"古诗","dynasty":"北宋","content":"大江东去，浪淘尽，千古风流人物。\\n<b>故垒</b>西边，人道是，三国周郎赤壁。\\n乱石穿空，惊涛拍岸，卷起千堆雪。\\n江山如画，一时多少豪杰。\\n遥想<b>公瑾</b>当年，小乔初嫁了，雄姿英发。\\n羽扇<b>纶巾</b>，谈笑间，<b>樯橹</b>灰飞烟灭。\\n故国神游，多情应笑我，早生华发。\\n人生如梦，一尊还<b>酹</b>江月。","translation":"大江向东流去，巨大的浪涛淘尽了千古以来的英雄人物。\\n旧营垒的西边，人们说那就是三国时周瑜大破曹军的赤壁。\\n乱石穿空而起，惊人的巨浪拍打江岸，卷起层层雪白的浪花。\\n江山如此美丽，一时之间涌现出多少英雄豪杰。\\n遥想周瑜当年，小乔刚刚嫁给他，他姿态雄伟、意气风发。\\n手摇羽扇，头戴纶巾，说笑之间曹军的战船就化为灰烬。\\n神游故国战场，应该笑我多愁善感，过早生出白发。\\n人生如梦，还是把一杯酒洒向江面祭奠明月吧。","pinyin":null,"annotation":"故垒：古时营垒。\\n周郎：周瑜。\\n纶巾：古代配有青丝带的头巾。\\n樯橹：代指曹操水军。\\n酹：把酒洒在地上祭奠。","authorIntro":"苏轼，北宋文学家、书画家。","appreciation":"词作上片写赤壁壮阔景色并追怀周瑜，下片写自身失意和人生如梦，在历史英雄与现实自我的对照中寄寓豪放而苍凉的感慨。","extraJson":{"content_key":"813af3a69870","dynasty":"北宋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["故垒","公瑾","纶巾","樯橹","酹"],"paragraph_count":1,"required_catalogs":[910111]}},{"id":900059,"title":"永遇乐·京口北固亭怀古","author":"辛弃疾","genre":"古诗","dynasty":"南宋","content":"千古江山，英雄无觅，孙仲谋处。\\n<b>舞榭歌台</b>，风流总被，雨打风吹去。\\n斜阳草树，寻常巷陌，人道寄奴曾住。\\n想当年，<b>金戈铁马</b>，气吞万里如虎。\\n元嘉草草，<b>封狼居胥</b>，赢得仓皇北顾。\\n四十三年，望中犹记，烽火扬州路。\\n可堪回首，<b>佛狸</b>祠下，一片神鸦社鼓。\\n凭谁问：<b>廉颇</b>老矣，尚能饭否？","translation":"千百年来的江山依然如故，却再也找不到孙权那样的英雄了。\\n歌舞楼台和英雄业绩，都被风雨吹打而消磨。\\n斜阳照着草木，普通的街巷里，人们说刘裕曾经住过。\\n想当年他指挥精锐军队，气势如猛虎吞掉万里山河。\\n宋文帝草率出兵，想建立像霍去病那样的功业，结果只落得仓皇逃回、回头北望。\\n南渡至今四十三年，遥望之中还记得扬州一带战火连天。\\n怎能忍心回头看，拓跋焘行宫遗址下乌鸦啄食祭品、百姓举行社日活动。\\n还有谁来问，廉颇老了，饭量还好吗？","pinyin":null,"annotation":"孙仲谋：孙权。\\n舞榭歌台：演出歌舞的楼台。\\n寄奴：刘裕的小名。\\n金戈铁马：战争。\\n元嘉：宋文帝年号。\\n封狼居胥：登狼居胥山筑坛祭天，指建立战功。\\n佛狸：拓跋焘小名。\\n社鼓：社日祭神的鼓声。","authorIntro":"辛弃疾，南宋豪放派词人、抗金将领。","appreciation":"词人登临北固亭，借孙权、刘裕、宋文帝、佛狸和廉颇等历史人物，批评草率用兵和忘却战事，表达抗金复国的忧愤。","extraJson":{"content_key":"fc927ab986c7","dynasty":"南宋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["舞榭歌台","金戈铁马","封狼居胥","佛狸","廉颇"],"paragraph_count":1,"required_catalogs":[910112]}},{"id":900060,"title":"声声慢（寻寻觅觅）","author":"李清照","genre":"古诗","dynasty":"宋","content":"寻寻觅觅，冷冷清清，凄凄惨惨<b>戚戚</b>。\\n<b>乍暖还寒</b>时候，最难<b>将息</b>。\\n三杯两盏淡酒，怎敌他、晚来风急！\\n雁过也，正伤心，却是旧时相识。\\n满地黄花堆积，<b>憔悴</b>损，如今有谁堪摘？\\n守着窗儿，独自怎生得黑？\\n梧桐更兼细雨，到黄昏、点点滴滴。\\n这<b>次第</b>，怎一个愁字了得！","translation":"苦苦寻觅，却只见冷冷清清，感到凄凄惨惨、悲痛忧愁。\\n天气忽暖忽冷的时候，最难调养休息。\\n几杯淡酒，怎么抵挡傍晚的急风！\\n大雁飞过，正令人伤心，却原来是曾经见过的旧相识。\\n满地都是凋零的菊花，憔悴不堪，如今还有谁值得我采摘？\\n守着窗户独自一人，怎么才能熬到天黑？\\n梧桐树又遇上细雨，到黄昏时分，点点滴滴不停落下。\\n这种情形，一个“愁”字怎么能说尽呢？","pinyin":null,"annotation":"乍暖还寒：忽暖忽冷。\\n将息：调养休息。\\n怎生：怎么。\\n次第：情形、光景。","authorIntro":"李清照（1084—约1155），号易安居士，宋代女词人。","appreciation":"词作以叠词开篇，借酒、雁、黄花、梧桐细雨等意象层层渲染愁情，结尾以“愁字了得”化抽象为具体，表现深重的身世之感。","extraJson":{"content_key":"18a0a0213289","dynasty":"宋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["戚戚","乍暖还寒","将息","憔悴","次第"],"paragraph_count":1,"required_catalogs":[910113]}},{"id":900061,"title":"静女","author":"《诗经·邶风》","genre":"古诗","dynasty":"先秦","content":"静女其<b>姝</b>，俟我于城隅。爱而不见，搔首<b>踟蹰</b>。\\n静女其娈，贻我彤管。彤管有炜，<b>说怿</b>女美。\\n自牧<b>归荑</b>，<b>洵</b>美且异。匪来贸丝，来即我谋。","translation":"娴静的姑娘多么美丽，在城角等待我。她故意藏起来不让我看见，我挠着头来回走。\\n娴静的姑娘多么美好，送给我红色的笛管。红笛鲜明有光泽，喜爱它的颜色美丽。\\n她从郊野送给我白茅芽，确实美丽又奇异。并不是来交换蚕丝，而是来和我商量婚事。","pinyin":null,"annotation":"姝：美丽。\\n俟：等待。\\n爱：同“薆”，隐藏。\\n踟蹰：徘徊。\\n贻：赠送。\\n说怿：喜爱。\\n归：同“馈”，赠送。\\n荑：初生的茅草芽。","authorIntro":"《诗经·邶风》篇目，属于《诗经》十五国风。","appreciation":"诗歌写青年男女约会赠物，以细节和口语表现纯真活泼的爱情，物虽平常，却因情意而美好。","extraJson":{"content_key":"1b1ad3aef486","dynasty":"先秦","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["姝","踟蹰","说怿","归荑","洵"],"paragraph_count":1,"required_catalogs":[910118]}},{"id":900062,"title":"涉江采芙蓉","author":"《古诗十九首》","genre":"古诗","dynasty":"东汉","content":"<b>涉江</b>采芙蓉，兰泽多芳草。\\n采之欲<b>遗</b>谁？所思在远道。\\n还顾望旧乡，长路<b>漫浩浩</b>。\\n<b>同心</b>而离居，忧伤以终老。","translation":"渡过江水去采摘荷花，兰草生长的水泽里芳草繁茂。\\n采摘荷花想送给谁呢？所思念的人正在远方。\\n回头望向故乡，路途遥远而又漫长。\\n彼此心意相同却分居两地，只能忧伤地终老。","pinyin":null,"annotation":"芙蓉：荷花。\\n遗：赠送。\\n远道：远方。\\n还顾：回头看。\\n同心：指彼此感情深厚。","authorIntro":"《古诗十九首》，东汉末年五言诗总集。","appreciation":"诗歌以采莲赠人起兴，由眼前芳草转入远方所思，空间转换和结尾直抒相结合，表现游子与思妇的离愁。","extraJson":{"content_key":"4d0eadace0ff","dynasty":"东汉","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["涉江","遗","漫浩浩","同心"],"paragraph_count":1,"required_catalogs":[910119]}},{"id":900063,"title":"虞美人","author":"李煜","genre":"古诗","dynasty":"南唐","content":"春花秋月何时了？往事知多少。\\n小楼昨夜又东风，<b>故国</b>不堪回首月明中。\\n<b>雕栏玉砌</b>应犹在，只是<b>朱颜</b>改。\\n问君能有几多愁？恰似<b>一江春水</b>向东流。","translation":"春花秋月的美好时光什么时候结束？过去的事情还记得多少呢？\\n小楼昨夜又吹来了春风，在明月下回首故国实在不忍。\\n精雕的栏杆和玉石的台阶应该还在，只是人的容颜已经改变。\\n要问我心中有多少愁，就像一江春水向东流不尽。","pinyin":null,"annotation":"了：了结。\\n故国：指南唐故都，也指故国。\\n雕栏玉砌：雕花的栏杆和玉石的台阶。\\n朱颜：红润的脸色，代指青春年华。","authorIntro":"李煜（937—978），南唐后主，词人。","appreciation":"词作由春花秋月、东风明月触发故国之思，以不变的物与改变的人形成对照，结尾以江水喻愁，形象写出愁绪的绵长。","extraJson":{"content_key":"86b912027b08","dynasty":"南唐","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["故国","雕栏玉砌","朱颜","一江春水"],"paragraph_count":1,"required_catalogs":[910120]}},{"id":900064,"title":"鹊桥仙（纤云弄巧）","author":"秦观","genre":"古诗","dynasty":"北宋","content":"<b>纤云</b>弄巧，飞星传恨，<b>银汉</b>迢迢暗度。\\n<b>金风玉露</b>一相逢，便胜却人间无数。\\n柔情似水，佳期如梦，忍顾鹊桥归路。\\n两情若是久长时，又岂在<b>朝朝暮暮</b>。","translation":"纤薄的云彩变幻出巧妙的图案，流星传递着牛郎织女的离愁，遥远的银河在无声中渡过。\\n金风玉露的相逢，即使只有一次，也胜过人间无数次平庸的相聚。\\n柔情像流水，短暂的相会如梦，怎忍心回头看鹊桥归去的路。\\n只要两情长久，即使不日日夜夜相守，又何必在意朝夕相处呢？","pinyin":null,"annotation":"纤云：纤薄的云彩。\\n飞星：流星。\\n银汉：银河。\\n金风玉露：秋风白露。\\n忍顾：怎忍回头看。","authorIntro":"秦观（1049—1100），字少游，号淮海居士，北宋词人。","appreciation":"词作上片写相会之难与相会之美，下片写离别之苦并提升到爱情长久的境界，最后两句成为歌咏忠贞爱情的名句。","extraJson":{"content_key":"87541f3a9a64","dynasty":"北宋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["纤云","银汉","金风玉露","朝朝暮暮"],"paragraph_count":1,"required_catalogs":[910121]}},{"id":900065,"title":"登岳阳楼","author":"杜甫","genre":"古诗","dynasty":"唐","content":"昔闻洞庭水，今上岳阳楼。\\n吴楚东南<b>坼</b>，<b>乾坤</b>日夜浮。\\n亲朋无一字，老病有孤舟。\\n<b>戎马</b>关山北，凭轩<b>涕泗</b>流。","translation":"以前就听说洞庭湖的盛名，今天终于登上岳阳楼。\\n洞庭湖把吴地和楚地从东南方向分开，天地仿佛日日夜夜都漂浮在湖面上。\\n亲朋没有一点音信，年老多病只乘着一叶孤舟。\\n关山以北战事不断，倚着栏杆远望，不禁泪流满面。","pinyin":null,"annotation":"坼：分裂。\\n乾坤：天地。\\n戎马：战争。\\n凭轩：倚着楼窗。\\n涕泗：眼泪和鼻涕，泛指眼泪。","authorIntro":"杜甫，唐代现实主义诗人。","appreciation":"诗歌先写洞庭湖的雄阔，再写个人身世孤苦，最后由个人漂泊转入对国家战乱的忧虑，境界宏阔而情感深沉。","extraJson":{"content_key":"35aa68b8dd4f","dynasty":"唐","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["坼","乾坤","戎马","涕泗"],"paragraph_count":1,"required_catalogs":[910130]}},{"id":900066,"title":"桂枝香·金陵怀古","author":"王安石","genre":"古诗","dynasty":"北宋","content":"登临<b>送目</b>，正故国晚秋，天气初肃。\\n千里<b>澄江</b>似练，翠峰如簇。归帆去棹残阳里，背西风、酒旗斜矗。\\n彩舟云淡，<b>星河</b>鹭起，画图难足。\\n念往昔、繁华竞逐，叹门外楼头，悲恨相续。\\n千古凭高对此，<b>谩嗟</b>荣辱。六朝旧事随流水，但寒烟衰草凝绿。\\n至今商女，时时犹唱，<b>后庭遗曲</b>。","translation":"登上高处远望，正值故国金陵晚秋，天气开始变得肃杀。\\n千里长江澄澈如白绢，青翠的山峰聚集在一起。归来的船桨在夕阳中驶去，背对西风，酒旗斜斜地竖立。\\n彩色的船只浮在淡云中，银河旁白鹭飞起，美丽的图画也难以完全描绘。\\n回想过去，六朝统治者竞相追逐繁华，叹息城门外、楼头上，悲恨接连不断。\\n千百年来登高面对这番景象，徒然感叹历史上的荣辱；六朝旧事随流水消逝，只剩寒烟衰草凝成一片苍绿。\\n直到今天歌女还时常唱着《后庭花》的曲调。","pinyin":null,"annotation":"故国：旧时的都城，指金陵。\\n送目：远眺。\\n练：白绢。\\n棹：船桨。\\n谩：徒然。\\n后庭遗曲：《玉树后庭花》，被视为亡国之音。","authorIntro":"王安石，北宋政治家、文学家。","appreciation":"词作上片写金陵秋景，下片由眼前景物追怀六朝兴亡，以“后庭遗曲”收束，寄寓对沉溺享乐、重蹈覆辙的警戒。","extraJson":{"content_key":"695ab5edf470","dynasty":"北宋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["送目","澄江","星河","谩嗟","后庭遗曲"],"paragraph_count":1,"required_catalogs":[910131]}},{"id":900067,"title":"念奴娇·过洞庭","author":"张孝祥","genre":"古诗","dynasty":"南宋","content":"洞庭青草，近中秋，更无一点风色。\\n<b>玉鉴琼田</b>三万顷，着我扁舟一叶。\\n素月分辉，明河共影，表里俱<b>澄澈</b>。\\n悠然心会，妙处难与君说。\\n应念岭海经年，<b>孤光</b>自照，肝胆皆冰雪。\\n短发萧骚襟袖冷，稳泛沧浪空阔。\\n尽<b>挹</b>西江，细斟<b>北斗</b>，万象为宾客。\\n扣舷独啸，不知今夕何夕。","translation":"洞庭湖与青草湖相连，临近中秋，湖面没有一点风的痕迹。\\n明净如玉的湖面宽阔无边，我乘着一叶小舟漂浮其中。\\n皎洁的月光分外明亮，银河倒映在湖中，水面上下都清澈透明。\\n我悠然领会其中的妙处，却难以对你说清。\\n应该想到我在岭南多年，只有月光照着自己，内心像冰雪一样纯洁。\\n头发已经稀疏，衣襟袖子被秋风吹冷；我稳稳地泛舟在苍茫的水面上。\\n我要舀尽西江水，把北斗星当酒杯慢慢斟酒，让天地万物都作宾客。\\n敲着船舷独自长啸，竟不知道今夜是什么夜晚。","pinyin":null,"annotation":"玉鉴琼田：形容湖水明净。\\n扁舟：小船。\\n素月：皎洁的月亮。\\n岭海：岭南地区。\\n挹：舀取。\\n北斗：北斗七星，想象为酒器。","authorIntro":"张孝祥（1132—1169），字安国，号于湖居士，南宋词人。","appreciation":"词作以洞庭秋月为背景，写词人澄澈的胸襟和豪迈的气度；景、情、理交融，结尾以奇特想象表现超然物外的精神境界。","extraJson":{"content_key":"e28916ca1956","dynasty":"南宋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["玉鉴琼田","澄澈","孤光","挹","北斗"],"paragraph_count":1,"required_catalogs":[910132]}},{"id":900068,"title":"游园（皂罗袍）","author":"汤显祖","genre":"古诗","dynasty":"明","content":"原来<b>姹紫嫣红</b>开遍，似这般都付与断井<b>颓垣</b>。\\n<b>良辰美景</b>奈何天，赏心乐事谁家院！\\n朝飞暮卷，云霞翠轩；雨丝风片，烟波画船——\\n锦屏人忒看的这<b>韶光</b>贱！","translation":"原来百花开得这样艳丽，却都付给了荒废的井台和倾颓的墙垣。\\n这样美好的春日和景色，却不知哪家的院子才有赏心乐事。\\n早晨飞起、傍晚卷起的云霞映照着翠绿的楼阁，细雨微风和烟波中的画船构成美景——\\n深闺中的人太不珍惜这美好的春光了！","pinyin":null,"annotation":"姹紫嫣红：形容花色繁多艳丽。\\n断井颓垣：荒废的井台和倾颓的墙垣。\\n良辰美景：美好的时光和景物。\\n锦屏人：闺中女子。\\n忒：太。\\n韶光：美好的春光。","authorIntro":"汤显祖（1550—1616），字义仍，号海若，明代戏曲家、文学家，《牡丹亭》作者。","appreciation":"曲文以绚丽春景与断井颓垣的对照，写杜丽娘被压抑的青春情感，语言华美，情景交融。","extraJson":{"content_key":"9ea8962508f0","dynasty":"明","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["姹紫嫣红","颓垣","良辰美景","韶光"],"paragraph_count":1,"required_catalogs":[]}},{"id":900069,"title":"劝学","author":"荀子","genre":"文言文","dynasty":"战国末","content":"君子曰：学不可以已。##青，取之于蓝，而青于蓝；\\n冰，水为之，而寒于水。\\n木直中绳，<b>輮</b>以为轮，其曲中规。\\n虽有槁暴，不复挺者，<b>輮</b>使之然也。\\n故木受绳则直，金就<b>砺</b>则利，君子博学而日参省乎己，则知明而行无过矣。##吾尝终日而思矣，不如须臾之所学也；\\n吾尝跂而望矣，不如登高之博见也。\\n登高而招，臂非加长也，而见者远；\\n顺风而呼，声非加疾也，而闻者彰。\\n假舆马者，非利足也，而致千里；\\n假舟楫者，非能水也，而绝江河。\\n君子生非异也，善假于物也。##积土成山，风雨兴焉；\\n积水成渊，蛟龙生焉；\\n积善成德，而神明自得，圣心备焉。\\n故不积<b>跬步</b>，无以至千里；\\n不积小流，无以成江海。\\n<b>骐骥</b>一跃，不能十步；\\n<b>驽马</b>十驾，功在不舍。\\n<b>锲</b>而舍之，朽木不折；\\n<b>锲</b>而不舍，金石可<b>镂</b>。\\n蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。\\n蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。","translation":"君子说：学习不可以停止。##靛青从蓼蓝中取得，却比蓼蓝颜色更深；\\n冰由水凝结而成，却比水寒冷。\\n木材直得合乎墨线，用火烤使它弯曲制成车轮，弯曲程度合乎圆规。\\n即使又晒干，也不会再挺直，这是火烤使它变成这样的。\\n所以木材用墨线量过就直，刀剑等金属靠近磨刀石就锋利，君子广泛学习并且每天检查反省自己，就能智慧明达、行为没有过错。##我曾经整天空想，不如片刻学习所得；\\n我曾踮起脚跟远望，不如登高看得广。\\n登高招手，手臂没有加长，但远处的人能看见；\\n顺风呼喊，声音没有加大，但听到的人觉得清楚。\\n借助车马的人，脚并不快，却能到达千里；\\n借助船和桨的人，并不善于游泳，却能横渡江河。\\n君子的本性同一般人没有差别，只是善于借助外物。##堆积土石成为高山，风雨从那里兴起；\\n聚集水流成为深潭，蛟龙在那里生长；\\n积累善行形成高尚品德，精神就自然明达，圣人的思想境界就具备了。\\n所以不积累每一步，无法到达千里；\\n不汇聚细小水流，无法形成江海。\\n骏马跳跃一次，不能超过十步；\\n劣马拉车走十天，功效在于不停。\\n雕刻如果半途而废，腐朽的木头也刻不断；\\n如果不停雕刻，金石也能刻成。\\n蚯蚓没有锋利的爪牙、强健的筋骨，却能向上吃泥土，向下饮地下水，是因为用心专一；\\n螃蟹有六条腿和两只钳子，若没有蛇鳝的洞穴就无处藏身，是因为用心浮躁。","pinyin":null,"annotation":"已：停止。\\n輮：使弯曲。\\n中绳：合乎墨线。\\n砺：磨刀石。\\n参省：检验省察。\\n跂：踮起脚跟。\\n假：借助。\\n跬步：半步。\\n骐骥：骏马。\\n驽马：劣马。\\n锲：刻。\\n镂：雕刻。","authorIntro":"荀子（约前313—前238），名况，战国末期思想家、教育家，儒家代表人物。","appreciation":"文章以大量比喻论述学习的意义、作用和方法，层层推进，强调学习必须坚持、专心，并善于借助外物。","extraJson":{"content_key":"7885449f5bb5","dynasty":"战国末","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["輮","砺","跬步","骐骥","驽马","锲","镂"],"paragraph_count":4,"required_catalogs":[910114]}},{"id":900070,"title":"师说","author":"韩愈","genre":"文言文","dynasty":"唐","content":"古之学者必有师。\\n师者，所以传道<b>受业</b>解惑也。\\n人非生而知之者，孰能无惑？\\n惑而不从师，其为惑也，终不解矣。\\n生乎吾前，其闻道也固先乎吾，吾从而师之；\\n生乎吾后，其闻道也亦先乎吾，吾从而师之。\\n吾<b>师道</b>也，夫庸知其年之先后生于吾乎？\\n是故无贵无贱，无长无少，道之所存，师之所存也。##嗟乎！\\n<b>师道</b>之不传也久矣！\\n欲人之无惑也难矣！\\n古之圣人，其出人也远矣，犹且从师而问焉；\\n今之众人，其下圣人也亦远矣，而耻学于师。\\n是故圣益圣，愚益愚。\\n圣人之所以为圣，愚人之所以为愚，其皆出于此乎？##爱其子，择师而教之；\\n于其身也，则耻师焉，惑矣。\\n彼童子之师，授之书而习其<b>句读</b>者，非吾所谓传其道解其惑者也。\\n<b>句读</b>之不知，惑之不解，或师焉，或不焉，<b>小学</b>而大遗，吾未见其明也。##巫医乐师百工之人，不耻相师。\\n士大夫之族，曰师曰弟子云者，则群聚而笑之。\\n问之，则曰：“彼与彼年相若也，道相似也。\\n位卑则足羞，官盛则近<b>谀</b>。”\\n呜呼！\\n<b>师道</b>之不复可知矣。\\n巫医乐师百工之人，<b>不齿</b>，今其智乃反不能及，其可怪也欤！##孔子曰：三人行，则必有我师。\\n是故弟子不必不如师，师不必贤于弟子，闻道有先后，术业有专攻，如是而已。##李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。\\n余嘉其能行古道，作《师说》以贻之。","translation":"古代求学的人一定有老师。\\n老师，是用来传授道理、教授学业、解答疑难问题的人。\\n人不是生来就懂得道理的，谁能没有疑惑？\\n有疑惑却不跟从老师学习，那些疑惑最终也不能解决。\\n出生在我前面的人，他懂得道理本来就比我早，我跟从他把他当作老师；\\n出生在我后面的人，他懂得道理也可能比我早，我也跟从他把他当作老师。\\n我学习的是道理，哪里要了解他的年龄比我大还是小呢？\\n因此无论地位高低、年龄大小，道理存在的地方就是老师存在的地方。##唉！\\n从师学习的风尚失传已经很久了，想让人没有疑惑就难了。\\n古代的圣人远远超过一般人，尚且跟从老师请教；\\n现在的一般人远远低于圣人，却以向老师学习为可耻。\\n因此圣人更加圣明，愚人更加愚昧。\\n圣人之所以圣明、愚人之所以愚昧，大概都出于这个原因吧？##爱自己的孩子，选择老师教他；\\n对于自己，却以从师学习为可耻，真是糊涂。\\n那些儿童的老师，只是教孩子读书、学习断句的，并不是我所说的传授道理、解答疑惑的老师。\\n不理解句读，不能解决疑惑，有的从师学习，有的不从师学习，小的方面学习，大的方面却丢弃了，我看不出他的明智。##巫医、乐师和各种工匠，不以互相学习为可耻；\\n士大夫这一类人，一听到老师、弟子的称呼，就成群结队地讥笑他们。\\n问他们原因，就说：“他和他年龄差不多，道术相似，地位低就觉得可羞，官职高就近于谄媚。”\\n唉，从师学习的风尚不能恢复就可想而知了。\\n巫医乐师百工之人，士大夫们看不起，现在他们的智慧反而赶不上这些人，真是奇怪啊！##孔子说：三个人同行，其中一定有可以做我老师的人。\\n因此学生不一定不如老师，老师也不一定比学生贤能，听闻道理有先有后，学术技艺各有专门研究，如此而已。##李家的孩子蟠，十七岁，喜欢古文，六经的经文和传文都普遍学习了，不受时俗拘束，向我学习。\\n我赞许他能够奉行古人从师的风尚，写这篇《师说》送给他。","pinyin":null,"annotation":"师：以……为师。\\n受：同“授”，传授。\\n道：道理。\\n句读：古人指文辞的休止和停顿。\\n小学：小的方面学习。\\n不齿：不屑与之同列。\\n谀：谄媚。","authorIntro":"韩愈（768—824），字退之，唐代文学家、思想家，古文运动倡导者。","appreciation":"文章针对当时士大夫以从师为耻的风气，正面论述从师学习的必要性，反面批判社会偏见，论证严密，语言气势充沛。","extraJson":{"content_key":"3b8cd4a879a0","dynasty":"唐","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["受业","师道","句读","小学","不齿","谀"],"paragraph_count":6,"required_catalogs":[910115]}},{"id":900071,"title":"赤壁赋","author":"苏轼","genre":"文言文","dynasty":"北宋","content":"壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。\\n清风徐来，水波不兴。\\n举酒<b>属</b>客，诵明月之诗，歌窈窕之章。\\n少焉，月出于东山之上，徘徊于斗牛之间。\\n白露横江，水光接天。\\n纵一苇之所如，凌万顷之茫然。\\n浩浩乎如<b>冯虚御风</b>，而不知其所止；\\n飘飘乎如遗世独立，羽化而登仙。##于是饮酒乐甚，扣舷而歌之。\\n歌曰：“桂棹兮兰桨，击空明兮溯流光。\\n渺渺兮予怀，望美人兮天一方。”\\n客有吹洞箫者，倚歌而和之。\\n其声呜呜然，如怨如慕，如泣如诉；\\n余音袅袅，不绝如缕。\\n舞幽壑之潜蛟，泣孤舟之嫠妇。##苏子愀然，正襟危坐而问客曰：“何为其然也？”\\n客曰：“月明星稀，乌鹊南飞。\\n此非曹孟德之诗乎？\\n西望夏口，东望武昌，山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？\\n方其破荆州，下江陵，顺流而东也，<b>舳舻</b>千里，旌旗蔽空，<b>酾酒</b>临江，<b>横槊</b>赋诗，固一世之雄也，而今安在哉？\\n况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿；\\n驾一叶之扁舟，举匏尊以相<b>属</b>。\\n寄<b>蜉蝣</b>于天地，渺沧海之一粟。\\n哀吾生之须臾，羡长江之无穷。\\n挟飞仙以遨游，抱明月而长终。\\n知不可乎骤得，托遗响于悲风。”##苏子曰：“客亦知夫水与月乎？\\n逝者如斯，而未尝往也；\\n盈虚者如彼，而卒莫消长也。\\n盖将自其变者而观之，则天地曾不能以一瞬；\\n自其不变者而观之，则物与我皆无尽也，而又何羡乎！\\n且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。\\n惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭，是造物者之无尽藏也，而吾与子之所共适。”##客喜而笑，洗盏更酌。\\n肴核既尽，杯盘<b>狼籍</b>。\\n相与枕藉乎舟中，不知东方之既白。","translation":"壬戌年秋，七月十六日，苏轼和友人在赤壁下泛舟游览。\\n清风徐徐吹来，水面没有波浪。\\n举起酒杯劝客人饮酒，吟诵明月诗篇，歌唱窈窕诗句。\\n一会儿月亮从东山升起，在斗宿牛宿之间徘徊。\\n白茫茫的水汽横贯江面，水光和天相接。\\n任凭小船漂到哪里，越过茫茫万顷的江面，浩浩荡荡仿佛凌空乘风而行，不知停在哪里；\\n飘飘然像脱离尘世、独立存在，飞升成仙。##于是喝酒喝得高兴，敲着船舷唱歌。\\n歌中说：“桂木做的棹、兰木做的桨，划开月光下的水面，逆流追随流动的月光；\\n我的情思悠远，思念的人在天边。”\\n客人中有吹洞箫的，依着歌声伴奏，箫声呜呜，像哀怨、像思慕、像哭泣、像诉说，余音悠长不断，像细丝一样；\\n使深谷中的蛟龙起舞，使孤舟上的寡妇哭泣。##苏轼面色忧愁，整理衣襟端正坐姿，问客人：“为什么会这样呢？”\\n客人说：“月明星稀，乌鹊南飞，这不是曹操的诗吗？\\n向西望是夏口，向东望是武昌，山水相互缭绕，草木郁郁苍苍，这不是曹操被周瑜围困的地方吗？\\n当他攻破荆州、占领江陵、顺流向东时，战船连绵千里，旌旗遮蔽天空；\\n他面对长江斟酒，横握长矛吟诗，本来是一代英雄，如今在哪里呢？\\n何况我和你在江边捕鱼砍柴，与鱼虾作伴、与麋鹿为友；\\n驾着一叶小船，举起葫芦酒器互相劝饮，把像蜉蝣一样短暂的生命寄托在天地间，渺小得像沧海之一粟。\\n哀叹生命短促，羡慕长江无穷无尽；\\n希望携仙人遨游，与明月长存。\\n明知不能骤然得到，只能把箫声寄托给悲凉的秋风。”##苏轼说：“你也知道水和月吗？\\n流逝的水像这样，却未曾真正流走；\\n月有圆缺像那样，但终究没有增减。\\n若从变化的方面看，天地万物连一瞬间都不能保持不变；\\n若从不变的方面看，万物和我们都无穷无尽，又羡慕什么呢？\\n况且天地之间万物各有主人，如果不是我所有，即使一丝一毫也不能取用。\\n只有江上的清风和山间的明月，耳朵听到就成为声音，眼睛看到就成为景色，取用它们没有禁令，享用它们不会竭尽，这是大自然无穷无尽的宝藏，是我和你共同享用的东西。”##客人高兴地笑了，洗净酒杯重新斟酒。\\n菜肴果核都吃完了，杯子盘子杂乱地放着。\\n大家互相枕着靠着睡在船中，不知不觉东方已经发白。","pinyin":null,"annotation":"既望：农历十六日。\\n属：同“嘱”，劝酒。\\n冯：同“凭”，乘。\\n愀然：忧愁的样子。\\n舳舻：船头和船尾，代指首尾相接的船。\\n酾酒：斟酒。\\n横槊：横执长矛。\\n蜉蝣：朝生暮死的小虫。\\n逝者如斯：流逝的水像这样。\\n狼籍：凌乱。","authorIntro":"苏轼，北宋文学家、书画家。","appreciation":"文章以主客问答为结构，先写秋江夜游的乐景，再写客人由曹操、周瑜引发的兴亡之悲，最后以水月之变揭示“变与不变”的哲理，表现旷达超然的人生态度。","extraJson":{"content_key":"98e76e362e43","dynasty":"北宋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["属","冯虚御风","舳舻","酾酒","横槊","蜉蝣","狼籍"],"paragraph_count":5,"required_catalogs":[910116]}},{"id":900072,"title":"登泰山记","author":"姚鼐","genre":"文言文","dynasty":"清","content":"泰山之阳，<b>汶水</b>西流；\\n其阴，济水东流。\\n阳谷皆入汶，阴谷皆入济。\\n当其南北分者，古长城也。\\n最高日观峰，在长城南十五里。##余以乾隆三十九年十二月，自京师乘风雪，历齐河、长清，穿泰山西北谷，越长城之限，至于泰安。\\n是月丁未，与知府朱孝纯子颍由南麓登。\\n四十五里，道皆砌石为<b>磴</b>，其级七千有余。##泰山正南面有三条水道，中谷绕泰安城下，郦道元所谓环水也。\\n余始循以入，道少半，越中岭，复循西谷，遂至其巅。\\n古时登山，循东谷入，道有天门。\\n东谷者，古谓之天门溪水，余所不至也。##今所经中岭及山巅，崖限当道者，世皆谓之天门云。\\n道中迷雾冰滑，<b>磴</b>几不可登。\\n及既上，苍山负雪，明<b>烛天南</b>；\\n望晚日照城郭，<b>汶水</b>、徂徕如画，而半山居雾若带然。##戊申晦，五鼓，与子颍坐日观亭，待日出。\\n大风扬积雪击面。\\n亭东自足下皆云漫。\\n稍见云中白若<b>樗蒲</b>数十立者，山也。\\n极天云一线异色，须臾成五采。\\n日上，正赤如丹，下有红光动摇承之。\\n或曰，此东海也。\\n回视日观以西峰，或得日或否，<b>绛皓驳色</b>，而皆若<b>偻</b>。##亭西有岱祠，又有碧霞元君祠。\\n皇帝行宫在碧霞元君祠东。\\n是日观道中石刻，自唐显庆以来；\\n其远古刻尽漫失。##至日观数里内无树，而雪与人膝齐。\\n桐城姚鼐记。","translation":"泰山的南面，汶水向西流；\\n泰山的北面，济水向东流。\\n南面的山谷水流都汇入汶水，北面的山谷水流都汇入济水。\\n在南北山谷分界的地方，是古长城。\\n最高的日观峰，在古长城以南十五里。##我在乾隆三十九年十二月，从京城乘着风雪，经过齐河、长清，穿过泰山西北的山谷，越过长城的界限，到了泰安。\\n这月丁未日，和泰安知府朱孝纯从南麓登山。\\n路程四十五里，道路都是石头砌成的台阶，台阶有七千多级。##泰山正南面有三条水道，中谷的水环绕泰安城下，这就是郦道元所说的环水。\\n我开始沿着中谷进入，路走不到一半，越过中岭，又沿着西谷走，于是到达山顶。\\n古时候登泰山，沿东谷进入，道路有天门。\\n东谷，古人称它为天门溪水，我没有到达那里。##现在经过的中岭和山顶，山崖像门槛一样挡在路上的地方，世人都称它为天门。\\n一路上大雾弥漫、冰面光滑，石阶几乎无法攀登。\\n登上山顶后，只见青山背负着白雪，明亮的雪光照耀着南面的天空；\\n远望夕阳照着城郭，汶水、徂徕山美如图画，半山停留着的雾气像一条白带。##戊申日月底，五更时分，我和子颍坐在日观亭，等待日出。\\n大风扬起积雪扑打脸面。\\n日观亭东面从脚下起全是云雾。\\n渐渐看见云中有几十个白色的像骰子一样站立的东西，那是山峰。\\n天边的云中有一线奇异的色彩，一会儿变成五彩。\\n太阳升起，正红得像朱砂，下面有红光摇动着承托它。\\n有人说，那就是东海。\\n回头看日观峰以西的山峰，有的被日光照到，有的没有，红白相间的颜色，都像弯曲着腰。##日观亭西边有岱祠，还有碧霞元君祠。\\n皇帝的行宫在碧霞元君祠东边。\\n这一天观看沿途的石刻，从唐代显庆年间以来的都有；\\n更古老的石刻全都模糊或缺失。##到日观峰几里以内没有树木，积雪和人的膝盖一样高。\\n桐城姚鼐记。","pinyin":null,"annotation":"阳：山的南面。\\n阴：山的北面。\\n磴：石阶。\\n既：已经。\\n烛：照。\\n樗蒲：古代一种博戏，这里指骰子。\\n绛皓驳色：红白相间。\\n偻：脊背弯曲的样子。","authorIntro":"姚鼐（1731—1815），字姬传，号惜抱，清代桐城派文学家。","appreciation":"文章以游踪为线索，写登山路线、山顶日出和沿途景物，观察细致、层次清晰，表现泰山日出的壮丽和作者的审美感受。","extraJson":{"content_key":"5ce835797b33","dynasty":"清","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["汶水","磴","烛天南","樗蒲","绛皓驳色","偻"],"paragraph_count":7,"required_catalogs":[910117]}},{"id":900073,"title":"子路、曾皙、冉有、公西华侍坐","author":"《论语》","genre":"文言文","dynasty":"春秋","content":"子路、曾皙、冉有、公西华侍坐。\\n子曰：“以吾一日长乎尔，毋吾以也。\\n居则曰：‘不吾知也！’\\n如或知尔，则何以哉？”##子路率尔而对曰：“千乘之国，摄乎大国之间，加之以<b>师旅</b>，因之以<b>饥馑</b>；\\n由也为之，<b>比及</b>三年，可使有勇，且知方也。”\\n夫子哂之。##“求，尔何如？”\\n对曰：“方六七十，如五六十，求也为之，<b>比及</b>三年，可使足民。\\n如其礼乐，以俟君子。”##“赤，尔何如？”\\n对曰：“非曰能之，愿学焉。\\n宗庙之事，如会同，<b>端章甫</b>，愿为小相焉。”##“点，尔何如？”\\n鼓瑟希，<b>铿尔</b>，舍瑟而作，对曰：“异乎三子者之撰。”\\n子曰：“何伤乎？\\n亦各言其志也。”\\n曰：“莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎<b>舞雩</b>，咏而归。”\\n夫子喟然叹曰：“吾与点也。”","translation":"子路、曾皙、冉有、公西华陪孔子坐着。\\n孔子说：“不要因为我年长一些就不说了。\\n你们平时总说：‘没有人了解我！’\\n如果有人了解你们，那么你们打算做什么呢？”##子路轻率地回答：“一个有一千辆兵车的国家，夹在大国之间，又有军队侵犯它，接着发生饥荒；\\n如果让我治理，等到三年，可以使百姓勇敢，并且懂得道义。”\\n孔子微微一笑。##孔子问：“冉求，你怎么样？”\\n回答：“纵横六七十里或五六十里的小国，如果让我治理，三年可以使百姓富足。\\n至于礼乐教化，等待贤能的君子来做。”##孔子问：“公西赤，你怎么样？”\\n回答：“不敢说我能做到，只愿学习。\\n宗庙祭祀，诸侯会盟，我穿戴礼服礼帽，愿意做一个小小的司仪。”##孔子问：“曾点，你怎么样？”\\n曾点弹瑟的声音渐渐稀疏，铿的一声，放下瑟站起来，说：“和他们三人的志向不一样。”\\n孔子说：“这有什么关系呢？\\n也就是各人谈谈自己的志向。”\\n曾点说：“暮春三月，春衣已经穿上，成年人五六人，儿童六七人，在沂水边洗浴，在舞雩台上吹风，唱着歌回来。”\\n孔子长叹说：“我赞同曾点的志向。”","pinyin":null,"annotation":"侍坐：陪侍长者闲坐。\\n摄：夹。\\n师旅：军队。\\n饥馑：饥荒。\\n比及：等到。\\n方：纵横。\\n端章甫：穿礼服、戴礼帽。\\n希：同“稀”，稀疏。\\n作：起身。\\n风：吹风。","authorIntro":"《论语》记录孔子及其弟子言行，儒家经典。","appreciation":"文章以师生问志为线索，通过不同回答展现政治理想和人格追求；曾皙描绘暮春游乐图，孔子“与点”，寄托对礼乐教化、和谐社会的向往。","extraJson":{"content_key":"c8544560e0e2","dynasty":"春秋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["师旅","饥馑","比及","端章甫","铿尔","舞雩"],"paragraph_count":5,"required_catalogs":[910122]}},{"id":900074,"title":"烛之武退秦师","author":"《左传》","genre":"文言文","dynasty":"春秋","content":"晋侯、秦伯围郑，以其无礼于晋，且<b>贰于楚</b>也。\\n晋军函陵，秦军氾南。##佚之狐言于郑伯曰：“国危矣，若使烛之武见秦君，师必退。”\\n公从之。\\n辞曰：“臣之壮也，犹不如人；\\n今老矣，无能为也已。”\\n公曰：“吾不能早用子，今急而求子，是寡人之过也。\\n然郑亡，子亦有不利焉！”\\n许之。##夜缒而出，见秦伯，曰：“秦、晋围郑，郑既<b>知</b>亡矣。\\n若亡郑而有益于君，敢以烦执事。\\n越国以<b>鄙远</b>，君<b>知</b>其难也，焉用亡郑以陪邻？\\n邻之厚，君之薄也。\\n若舍郑以为<b>东道主</b>，<b>行李</b>之往来，共其乏困，君亦无所害。\\n且君尝为晋君赐矣，许君焦、瑕，朝济而夕设版焉，君之所<b>知</b>也。\\n夫晋，何厌之有？\\n既东封郑，又欲肆其西封，若不<b>阙秦</b>，将焉取之？\\n<b>阙秦</b>以利晋，唯君图之。”##秦伯说，与郑人盟。\\n使杞子、逢孙、杨孙戍之，乃还。\\n子犯请击之，公曰：“不可。\\n微夫人之力不及此。\\n因人之力而敝之，不仁；\\n失其所与，不<b>知</b>；\\n以乱易整，不武。\\n吾其还也。”\\n亦去之。","translation":"晋文公和秦穆公包围郑国，因为郑国曾对晋国无礼，并且在晋、楚之间摇摆。\\n晋军驻扎在函陵，秦军驻扎在氾水南面。##佚之狐对郑伯说：“国家危险了，如果派烛之武去见秦君，秦军一定会撤退。”\\n郑伯听从了。\\n烛之武推辞说：“我年轻时尚且不如别人；\\n现在老了，不能做什么了。”\\n郑伯说：“我没有早点任用您，现在危急才求您，这是我的过错。\\n但郑国灭亡，对您也不利啊！”\\n烛之武答应了。##夜里用绳子把烛之武从城墙上吊下去，他见到秦穆公说：“秦晋围攻郑国，郑国已经知道要灭亡了。\\n如果灭亡郑国对您有好处，怎敢拿这件事来麻烦您？\\n越过晋国把远方的郑国作为边邑，您知道很困难，为什么要灭亡郑国来增加邻国的土地呢？\\n邻国势力雄厚，您的势力就相对削弱了。\\n如果放过郑国，让它作为东方道路上的主人，秦国使者往来，郑国供给他们缺少的东西，您也没有损失。\\n况且您曾经给过晋君恩惠，他答应把焦、瑕给您，早晨渡河归晋，晚上就筑城防御，这是您知道的。\\n晋国哪里有满足的时候？\\n既然向东把郑国作为疆界，又想扩张西部疆界，如果不损害秦国，将从哪里取得土地？\\n损害秦国来使晋国获利，希望您考虑这件事。”##秦穆公很高兴，和郑国结盟。\\n派杞子、逢孙、杨孙戍守郑国，秦军就回去了。\\n子犯请求袭击秦军，晋文公说：“不行。\\n没有那个人的力量，我到不了今天。\\n借助别人的力量又反过来损害他，这是不仁；\\n失去同盟者，这是不明智；\\n用混乱代替整齐，这是不武。\\n我们还是回去吧。”\\n晋军也离开了郑国。","pinyin":null,"annotation":"以：因为。\\n贰于楚：从属二主。\\n鄙：边邑。\\n东道主：东方道路上的主人。\\n行李：外交使者。\\n共：同“供”，供给。\\n厌：满足。\\n阙：侵损。\\n知：同“智”。","authorIntro":"《左传》是编年体史书，相传为左丘明所作。","appreciation":"烛之武以国家利益、秦晋矛盾和历史旧怨层层说服秦穆公，体现高超的外交辞令；文章情节紧凑，人物形象鲜明。","extraJson":{"content_key":"658b75e52d56","dynasty":"春秋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["贰于楚","鄙远","东道主","行李","阙秦","知"],"paragraph_count":4,"required_catalogs":[]}},{"id":900075,"title":"庖丁解牛","author":"庄子","genre":"文言文","dynasty":"战国","content":"庖丁为文惠君解牛。\\n手之所触，肩之所倚，足之所履，膝之所踦，<b>砉然</b>向然，奏刀騞然，莫不中音。\\n合于《桑林》之舞，乃中《经首》之会。##文惠君曰：“嘻，善哉！\\n技盖至此乎？”\\n庖丁释刀对曰：“臣之所好者道也，进乎技矣。\\n始臣之解牛之时，所见无非牛者；\\n三年之后，未尝见全牛也。\\n方今之时，臣以神遇而不以目视，官知止而神欲行。\\n依乎天理，批大<b>郤</b>，导大<b>窾</b>，因其固然，技经<b>肯綮</b>之未尝，而况大<b>軱</b>乎！\\n良庖岁更刀，割也；\\n族庖月更刀，折也。\\n今臣之刀十九年矣，所解数千牛矣，而刀刃若新发于<b>硎</b>。\\n彼节者有间，而刀刃者无厚；\\n以无厚入有间，恢恢乎其于游刃必有余地矣。\\n是以十九年而刀刃若新发于<b>硎</b>。\\n虽然，每至于族，吾见其难为，<b>怵然</b>为戒，视为止，行为迟。\\n动刀甚微，謋然已解，如土委地。\\n提刀而立，为之四顾，为之踌躇满志，善刀而藏之。”\\n文惠君曰：“善哉！\\n吾闻庖丁之言，得养生焉。”","translation":"厨师丁给文惠君宰牛。\\n手接触的地方、肩倚靠的地方、脚踩踏的地方、膝盖顶住的地方，发出砉砉的声响，进刀时发出騞騞的声音，没有不合乎音律。\\n合乎《桑林》舞蹈的节拍，也合乎《经首》乐曲的节奏。##文惠君说：“嘻，好啊！\\n技术怎么能高超到这种程度呢？”\\n庖丁放下刀回答：“我所喜爱的，是自然的规律，已经超过一般的技术了。\\n开始我宰牛时，看到的没有不是整头牛的；\\n三年以后，不曾看到整头牛了。\\n现在，我用精神去接触而不用眼睛看，视觉停止了而精神在运行。\\n依照牛体天然的结构，击入大的缝隙，引导刀进入大的空隙，顺着牛体本来的结构，连筋骨经络都没有碰到，更何况大骨呢！\\n好的厨师一年换一把刀，因为割断；\\n一般厨师一个月换一把刀，因为砍断。\\n我的刀用了十九年，宰了几千头牛，刀刃好像刚从磨刀石上磨出来。\\n牛的骨节有间隙，而刀刃没有厚度；\\n用没有厚度的刀刃插入有间隙的骨节，刀刃游动起来宽绰有余。\\n因此用了十九年，刀刃仍像刚磨出来。\\n即便如此，每当遇到筋骨交错聚结的地方，我看见它难以处理，就警惕起来，目光集中，动作放慢。\\n刀刃轻轻一动，牛体就分解开了，像泥土散落在地上。\\n提着刀站起来，为此环顾四周，为此悠然自得，擦拭好刀收藏起来。”\\n文惠君说：“好啊！\\n我听了庖丁的话，懂得养生的道理了。","pinyin":null,"annotation":"庖丁：名为丁的厨师。\\n向：同“响”。\\n盖：同“盍”，何、怎么。\\n郤：同“隙”，空隙。\\n窾：空。\\n技经肯綮：经络筋骨交错的地方。\\n軱：大骨。\\n硎：磨刀石。\\n怵然：警惕的样子。\\n善：通“缮”，揩拭。","authorIntro":"庄子（约前369—前286），名周，战国时期思想家，道家代表人物。","appreciation":"文章借庖丁解牛说明顺应事物规律、避开矛盾、谨慎行事的道理，故事性强，寓理于技，形象地表现由“技”入“道”的过程。","extraJson":{"content_key":"f26fd9536814","dynasty":"战国","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["砉然","郤","窾","肯綮","軱","硎","怵然"],"paragraph_count":2,"required_catalogs":[]}},{"id":900076,"title":"谏逐客书","author":"李斯","genre":"文言文","dynasty":"秦","content":"臣闻吏议逐客，<b>窃</b>以为过矣。\\n昔穆公求士，西取由余于戎，东得百里奚于宛，迎蹇叔于宋，来丕豹、公孙支于晋。\\n此五子者，不产于秦，而穆公用之，并国二十，遂霸西戎。\\n孝公用商鞅之法，移风易俗，民以殷盛，国以富强，百姓乐用，诸侯亲服，获楚、魏之师，<b>举</b>地千里，至今治强。\\n惠王用张仪之计，拔三川之地，西并巴、蜀，北收上郡，南取汉中，包九夷，制鄢郢，东据成皋之险，割膏腴之壤，遂散六国之从，使之西面事秦，功<b>施</b>到今。\\n昭王得范雎，废穰侯，逐华阳，强公室，杜私门，蚕食诸侯，使秦成帝业。\\n此四君者，皆以客之功。\\n由此观之，客何负于秦哉！##今陛下致昆山之玉，有随、和之宝，垂明月之珠，服太阿之剑，乘纤离之马，建翠凤之旗，树灵鼍之鼓。\\n此数宝者，秦不生一焉，而陛下说之，何也？\\n必秦国之所生然后可，则是夜光之璧不饰朝廷，犀象之器不为玩好，郑、卫之女不充后宫，而骏良駃騠不实外厩，江南金锡不为用，西蜀丹青不为采。\\n所以饰后宫、充<b>下陈</b>、娱心意、说耳目者，必出于秦然后可，则是宛珠之簪、傅玑之珥、阿缟之衣、锦绣之饰不进于前，而佳冶窈窕赵女不立于侧也。\\n夫击瓮叩缶、弹筝搏髀，而歌呼呜呜快耳者，真秦之声也；\\n郑、卫、桑间、韶、虞、武、象者，异国之乐也。\\n今弃击瓮叩缶而就郑卫，退弹筝而取《韶》《虞》，若是者何也？\\n快意当前，适观而已矣。\\n今取人则不然，不问可否，不论曲直，非秦者去，为客者逐。\\n然则是所重者在乎色乐珠玉，而所轻者在乎人民也。\\n此非所以跨海内、制诸侯之术也。##臣闻地广者粟多，国大者人众，兵强则士勇。\\n是以泰山不让土壤，故能成其大；\\n河海不择细流，故能就其深；\\n王者不却众庶，故能明其德。\\n是以地无四方，民无异国，四时充美，鬼神降福，此五帝三王之所以无敌也。\\n今乃弃<b>黔首</b>以资敌国，却宾客以业诸侯，使天下之士退而不敢西向，裹足不入秦，此所谓“藉寇兵而<b>赍盗粮</b>”者也。##夫物不产于秦，可宝者多；\\n士不产于秦，而愿忠者众。\\n今逐客以资敌国，损民以益仇，内自虚而外树怨于诸侯，求国无危，不可得也。","translation":"我听说官吏们在商议驱逐客卿，私下认为这是错误的。\\n过去秦穆公寻求贤士，西面从戎地得到由余，东面从宛地得到百里奚，从宋国迎来蹇叔，从晋国招来丕豹、公孙支。\\n这五个人不出生在秦国，秦穆公任用他们，兼并二十个国家，于是称霸西戎。\\n秦孝公采用商鞅变法，改变风俗，百姓富足，国家强盛，诸侯亲近归服，打败楚魏军队，夺取千里土地，至今政治安定强大。\\n秦惠王采用张仪的计策，攻取三川，向西兼并巴蜀，向北收取上郡，向南夺取汉中，包围九夷，控制鄢郢，向东占据成皋险要，割取肥沃土地，瓦解六国合纵，使六国向西侍奉秦国，功业延续至今。\\n秦昭王得到范雎，废黜穰侯，驱逐华阳君，强化王室，杜绝私门，蚕食诸侯，使秦国成就帝业。\\n这四位君主，都靠客卿的功劳。\\n由此看来，客卿有什么对不起秦国的呢？##如今陛下得到昆仑山的美玉、随侯珠和和氏璧，悬挂明月珠，佩带太阿剑，乘坐纤离马，树立翠凤旗，设置灵鼍鼓。\\n这些宝物没有一样产于秦国，但陛下却喜爱它们，为什么呢？\\n如果一定要秦国出产的才可以，那么夜光璧不能装饰朝廷，犀角象牙器不能成为玩物，郑卫美女不能充实后宫，良马不能放入马厩，江南金锡不能使用，西蜀丹青不能采纳。\\n用来装饰后宫、充实下陈、娱悦心意、满足耳目的东西，如果一定要秦国产的才可以，那么宛珠簪、傅玑耳饰、阿缟衣服、锦绣装饰不能进献，赵国美丽女子也不能侍立身旁。\\n敲击瓦缶、弹筝拍腿、歌唱呜呜使耳朵快乐的，是秦国的音乐；\\n郑卫、桑间、韶、虞、武、象是外国音乐。\\n如今放弃秦声而取用郑卫音乐，放下弹筝而取用韶虞，这是什么原因？\\n只是眼前使人快乐、适合观赏罢了。\\n如今任用人才却不是这样，不问可不可用，不论是非曲直，不是秦人就离开，是客卿就驱逐。\\n这样看来，所看重的是美色音乐珍珠玉石，所轻视的是百姓，这不是驾驭天下、制服诸侯的办法。##我听说土地广阔粮食就多，国家强大人口就多，兵力强盛士气就勇。\\n泰山不拒绝土壤，所以能成就高大；\\n河海不挑剔细流，所以能成就深广；\\n君王不拒绝众多百姓，所以能彰明德行。\\n因此土地没有四方之分，百姓不分异国，四时充满美好，鬼神降下福祉，这正是五帝三王无敌的原因。\\n现在却抛弃百姓来资助敌国，拒绝宾客来使诸侯成就，使天下士人退却不敢向西进入秦国，这就是所谓“借武器给敌寇，送粮食给盗贼”。##物产不在秦国但可珍爱的很多，士人不生在秦国但愿意效忠的很多。\\n如今驱逐客卿来资助敌国，损害百姓来使仇敌获益，内部使自己空虚，外部又和诸侯结怨，想求国家没有危险，是不可能的。","pinyin":null,"annotation":"窃：私下。\\n举：攻取。\\n施：延续。\\n说：同“悦”，喜欢。\\n下陈：堂下，指宫女、珍宝。\\n快意：使心意畅快。\\n黔首：百姓。\\n藉寇兵而赍盗粮：把武器粮食送给敌人。","authorIntro":"李斯（？—前208），秦代政治家、文学家，秦统一六国的重要谋臣。","appreciation":"文章列举秦国历代任用客卿的功业，再以日常享用外来器物反衬逐客政策的不合理，最后以泰山河海作比，论证广纳人才的重要性。","extraJson":{"content_key":"a0dc9052a49e","dynasty":"秦","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["窃","举","施","下陈","黔首","赍盗粮"],"paragraph_count":4,"required_catalogs":[910125]}},{"id":900077,"title":"谏太宗十思疏","author":"魏征","genre":"文言文","dynasty":"唐","content":"臣闻求木之长者，必固其根本；\\n欲流之远者，必<b>浚</b>其泉源；\\n思国之安者，必积其德义。\\n源不深而望流之远，根不固而求木之长，德不厚而思治之理，臣虽下愚，知其不可，而况于明哲乎！\\n人君当<b>神器</b>之重，居域中之大，将崇极天之峻，永保无疆之休。\\n不念居安思危，戒奢以俭，德不处其厚，情不胜其欲，斯亦伐根以求木茂，塞源而欲流长者也。##凡百元首，承天景命，莫不<b>殷忧</b>而道著，功成而德衰。\\n有善始者实繁，能克终者盖寡。\\n岂其取之易守之难乎？\\n盖在<b>殷忧</b>必竭诚以待下，既得志则纵情以<b>傲物</b>。\\n竭诚则吴越为一体，<b>傲物</b>则骨肉为行路。\\n虽董之以严刑，振之以威怒，终苟免而不怀仁，貌恭而不心服。##怨不在大，可畏惟人；\\n载舟覆舟，所宜深慎。\\n诚能见可欲则思知足以自戒，将有作则思知止以安人，念高危则思谦冲而自牧，惧满溢则思江海下百川，乐盘游则思三驱以为度，忧懈怠则思慎始而敬终，虑<b>壅蔽</b>则思虚心以纳下，想谗邪则思正身以<b>黜</b>恶，恩所加则思无因喜以谬赏，罚所及则思无因怒而滥刑。\\n总此十思，弘兹九德，简能而任之，择善而从之，则智者尽其谋，勇者竭其力，仁者播其惠，信者效其忠；\\n文武争驰，君臣无事，可以尽豫游之乐，可以养松乔之寿，鸣琴垂拱，不言而化。\\n何必劳神苦思，代下司职，役聪明之耳目，亏无为之大道哉！","translation":"我听说想要树木长得高大，一定要使它的根牢固；\\n想要水流得远，一定要疏浚它的源头；\\n想要国家安定，一定要积累道德仁义。\\n源头不深却希望水流得远，根基不牢却要求树木长高，道德不深厚却想理好国家，我虽然极其愚昧，也知道这是不可能的，何况明智的人呢！\\n国君掌握帝王的重权，处在天地中心的至尊地位，将使皇位崇高如天、永远保持无边的美好。\\n如果不居安思危、戒奢侈行节俭，道德不能保持厚重、性情不能克制欲望，这也像砍断根却求树木茂盛、堵塞源头却想水流长远。##历代所有君主，承受上天重大使命，没有一个不是在深深忧虑中竭尽诚意而治道显著，功业完成后道德却衰退。\\n开头做得好的实在很多，能够坚持到底的却很少。\\n难道取得天下容易、守住天下困难吗？\\n大概在忧虑时必定竭尽诚意对待臣民，得志以后就放纵情感傲视他人。\\n竭尽诚意，吴越也能同心；\\n傲视他人，亲骨肉也会变成陌生人。\\n即使严刑督责、威风震怒，最终也只求苟且免罪而不感念仁德，表面恭敬而内心不服。##怨恨不在大小，可怕的是民众；\\n水能载舟也能覆舟，这是应当深切谨慎的。\\n果真见到想得到的东西就想到知足来自我警戒，将要兴建什么就想到适可而止使百姓安定，想到帝位高危就想到谦虚自我修养，害怕骄傲自满就想到江海处在百川之下，喜爱打猎游乐就想到三驱为度，担心懈怠就想到慎始慎终，忧虑受蒙蔽就想到虚心采纳下属意见，想到有谗邪就想到端正自己来贬黜奸恶，施加恩惠就想到不要因一时高兴而错误奖赏，施加刑罚就想到不要因一时愤怒而滥用刑法。\\n总括这十条思虑，发扬九德，选拔有才能的人任用，选择好的意见听从，那么有智慧的人会竭尽谋略，勇敢的人会竭尽力量，仁爱的人会传播恩惠，诚信的人会效忠；\\n文臣武将争相奔走，君臣相安无事，可以尽情享受游乐，可以获得长寿，弹琴垂衣拱手，不用多说就能教化天下。\\n何必劳神苦思，代替臣下处理职务，耗费自己的耳目，损害无为而治的最高原则呢？","pinyin":null,"annotation":"固：使……牢固。\\n浚：疏通水道。\\n神器：帝位。\\n景命：大命。\\n董：督察。\\n黜：排斥、罢免。\\n三驱：田猎时网开一面。\\n壅蔽：受蒙蔽。","authorIntro":"魏征（580—643），字玄成，唐代政治家、思想家，以直言敢谏著称。","appreciation":"文章先以比喻论述居安思危，再分析守成之难，最后提出“十思”具体建议，逻辑严密，体现以民为本的政治思想。","extraJson":{"content_key":"08ab4e2f6039","dynasty":"唐","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["浚","神器","殷忧","傲物","黜","壅蔽"],"paragraph_count":3,"required_catalogs":[910126]}},{"id":900078,"title":"答司马谏议书","author":"王安石","genre":"文言文","dynasty":"北宋","content":"某启：昨日蒙教，窃以为与君实游处相好之日久，而议事每不合，所操之术多异故也。\\n虽欲<b>强聒</b>，终必不蒙<b>见察</b>，故略上报，不复一一自辨。\\n重念蒙君实视遇厚，于反复不宜卤莽，故今具道所以，冀君实或见恕也。##盖儒者所争，尤在于名实，名实已明，而天下之理得矣。\\n今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。\\n某则以为受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官；\\n举先王之政，以兴利除弊，不为生事；\\n为天下理财，不为征利；\\n<b>辟邪说</b>，难<b>壬人</b>，不为拒谏。\\n至于怨诽之多，则固前知其如此也。##人习于苟且非一日，士大夫多以不恤国事、同俗自媚于众为善。\\n上乃欲变此，而某不量敌之众寡，欲出力助上以抗之，则众何为而不<b>汹汹然</b>？\\n盘庚之迁，胥怨者民也，非特朝廷士大夫而已。\\n盘庚之迁，胥怨者民也，盘庚不为怨者故改其度；\\n<b>度义</b>而后动，是而不见可悔故也。\\n如君实责我以在位久，未能助上大有为，以膏泽斯民，则某知罪矣；\\n如曰今日当一切不事事，守前所为而已，则非某之所敢知。##无由会晤，不任区区向往之至。","translation":"昨天承蒙您赐教，我私下认为和您相交友好已经很久，但议论政事常常不合，是因为我们所持的政治主张大多不同。\\n即使想勉强多说，最终也一定不能得到您的理解，所以只作简略答复，不再一一为自己辩解。\\n又考虑到您对我看待优厚，书信往来不应草率，因此现在详细说明事情的原委，希望您或许能够宽恕我。##读书人所争辩的，尤其在于名义和事实，名义和事实明确了，天下的道理也就清楚了。\\n如今您用来指教我的，是认为我侵夺官职、制造事端、聚敛钱财、拒绝劝谏，以致天下人怨恨诽谤。\\n我却认为，接受皇帝命令，在朝廷上议订法令制度并加以修正，交给有关部门执行，不是侵夺官职；\\n推行先王的政令，以兴利除弊，不是制造端；\\n为天下理财，不是聚敛钱财；\\n批驳错误言论，排斥奸佞小人，不是拒绝劝谏。\\n至于怨恨诽谤很多，本来就预料到会这样。##人们习惯于得过且过不是一天了，士大夫多把不关心国家大事、迎合世俗来向众人献媚当作好事。\\n皇上想改变这种状况，而我不估量反对者多少，想尽力帮助皇上来抵抗他们，那么众人怎么会不气势汹汹呢？\\n盘庚迁都，怨恨的是百姓，并不只是朝廷士大夫。\\n盘庚迁都，怨恨他的人很多，但盘庚不因怨恨就改变计划；\\n考虑合理然后行动，认为正确且看不到可以后悔的地方。\\n假如您责备我在位很久，仍不能帮助皇上大有作为，使恩泽施加给百姓，那么我知道自己有罪；\\n假如说现在应当什么都不做，只守着过去的做法，那不是我敢领教的。##没有机会见面，内心不胜仰慕至极。","pinyin":null,"annotation":"启：书信开头的称谓。\\n强聒：强作解说。\\n卤莽：粗疏草率。\\n侵官：侵夺官吏职权。\\n征利：与民争利。\\n壬人：善于巧言献媚的奸人。\\n汹汹然：气势汹汹。\\n度义：考虑是否合理。","authorIntro":"王安石（1021—1086），字介甫，北宋政治家、文学家，熙宁变法主持者。","appreciation":"书信围绕名实、变法和怨谤展开，逐层回应司马光的指责，语言简洁有力，表现坚持改革、勇于担当的政治态度。","extraJson":{"content_key":"3019cdb5831e","dynasty":"北宋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["强聒","见察","辟邪说","壬人","汹汹然","度义"],"paragraph_count":4,"required_catalogs":[]}},{"id":900079,"title":"阿房宫赋","author":"杜牧","genre":"文言文","dynasty":"唐","content":"六王毕，四海一；\\n蜀山兀，阿房出。\\n覆压三百余里，隔离天日。\\n骊山北构而西折，直走咸阳。\\n二川溶溶，流入宫墙。\\n五步一楼，十步一阁；\\n廊腰<b>缦回</b>，檐牙高啄；\\n各抱地势，<b>钩心斗角</b>。##盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。\\n长桥卧波，未云何龙？\\n复道行空，不<b>霁</b>何虹？\\n高低冥迷，不知西东。\\n歌台暖
