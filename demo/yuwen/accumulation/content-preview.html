响，春光融融；\\n舞殿冷袖，风雨凄凄。\\n一日之内，一宫之间，而气候不齐。##妃嫔<b>媵嫱</b>，王子皇孙，辞楼下殿，辇来于秦；\\n朝歌夜弦，为秦宫人。\\n明星荧荧，开妆镜也；\\n绿云扰扰，梳晓鬟也；\\n渭流涨腻，弃脂水也；\\n烟斜雾横，焚椒兰也；\\n雷霆乍惊，宫车过也；\\n辘辘远听，杳不知其所之也。\\n一肌一容，尽态极妍，缦立远视，而望幸焉；\\n有不得见者，三十六年。##燕赵之收藏，韩魏之经营，齐楚之精英，几世几年，<b>剽掠</b>其人，倚叠如山。\\n一旦不能有，输来其间。\\n鼎铛玉石，金块珠砾，弃掷逦迤，秦人视之，亦不甚惜。##嗟乎！\\n一人之心，千万人之心也。\\n秦爱纷奢，人亦念其家。\\n奈何取之尽<b>锱铢</b>，用之如泥沙？\\n栋梁之材，多于南亩之农夫；\\n架梁之椽，多于机上之工女；\\n钉头磷磷，多于在庾之粟粒；\\n瓦缝参差，多于周身之帛缕；\\n直栏横槛，多于九土之城郭；\\n管弦呕哑，多于市人之言语。\\n使六国各爱其人，则足以拒秦；\\n使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？##秦人不暇自哀，而后人哀之；\\n后人哀之而不鉴之，亦使后人而复哀后人也。","translation":"六国灭亡，天下统一；\\n蜀地的山被砍光了，阿房宫建成。\\n覆盖三百多里，隔断了天空和阳光。\\n从骊山向北建筑，向西曲折，直通咸阳。\\n渭水、樊川浩浩荡荡，流入宫墙。\\n五步一座楼，十步一座阁；\\n走廊曲折，檐角高啄；\\n楼阁各随地势，宫室彼此环抱、屋角相对。##盘旋曲折，像蜂房、水涡，耸立着不知有几千万座。\\n长桥横卧在水面，没有云怎么会有龙？\\n复道架在空中，不是雨过天晴怎么会有彩虹？\\n高高低低迷迷蒙蒙，分不清东西。\\n歌台上歌声温暖，充满春意；\\n舞殿上舞袖飘动，仿佛风雨凄冷。\\n同一天、同一座宫殿，气候却不相同。##妃嫔、宫女、王子皇孙，辞别楼阁殿堂，乘辇来到秦国；\\n早晚歌唱奏乐，成为秦宫的宫人。\\n星光闪烁，是宫女打开梳妆镜；\\n绿云般的头发纷乱，是清晨梳理发髻；\\n渭水涨起油腻，是宫女们泼掉的脂粉水；\\n烟雾斜升，是焚烧椒兰香料；\\n雷霆突然惊响，是宫车经过；\\n车声辘辘远去，杳然不知到哪里。\\n每一处肌肤、每一种容貌，都极尽娇媚，久久站立远望，等待皇帝宠幸；\\n有的宫女三十六年也没有被召见。##燕赵收藏的珠宝、韩魏经营的珍宝、齐楚保存的精华，经过几代几年，从百姓那里掠夺而来，堆积如山。\\n一旦不能占有，就运送到这里。\\n把鼎看作铁锅、玉看作石头、金看作土块、珠子看作石子，随意丢弃，秦人看见也不很珍惜。##唉！\\n一个人的心，就是千万人的心。\\n秦人喜爱奢侈，百姓也顾念自己的家。\\n为什么搜刮百姓一丝一毫，用起来却像泥沙？\\n柱梁上的木料比田地里的农夫还多；\\n架梁的椽子比织机旁的织女还多；\\n钉头光亮比粮仓里的粮食还多；\\n瓦缝参差比全国的丝缕还多；\\n直栏横槛比九州的城郭还多；\\n管弦嘈杂比市民的言语还多。\\n假使六国各自爱护百姓，就足以抵抗秦国；\\n假使秦国也爱护六国百姓，那么可以传三世乃至万世为君，谁能灭掉它呢？##秦人来不及为自己哀叹，后人为他们哀叹；\\n后人如果哀叹却不吸取教训，也会使更后的人再为后人哀叹了。","pinyin":null,"annotation":"兀：山秃。\\n缦回：曲折。\\n囷囷：盘旋的样子。\\n霁：雨雪停止，天放晴。\\n媵嫱：宫妃。\\n幸：皇帝到某处。\\n剽掠：抢劫掠夺。\\n锱铢：极微小的数量。\\n族：灭族。","authorIntro":"杜牧，晚唐诗人。","appreciation":"文章铺陈阿房宫的宏丽、宫女的悲惨和珍宝的浪费，层层揭露秦统治者的奢靡和暴政，以秦亡告诫后人。","extraJson":{"content_key":"af60c1e776c8","dynasty":"唐","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["缦回","钩心斗角","霁","媵嫱","剽掠","锱铢"],"paragraph_count":6,"required_catalogs":[910128]}},{"id":900080,"title":"六国论","author":"苏洵","genre":"文言文","dynasty":"北宋","content":"六国破灭，非兵不利，战不善，弊在<b>赂秦</b>。\\n<b>赂秦</b>而力亏，破灭之道也。\\n或曰：六国互丧，率<b>赂秦</b>耶？\\n曰：不赂者以赂者丧，盖失强援，不能独完。\\n故曰：弊在<b>赂秦</b>也。##秦以攻取之外，小则获邑，大则得城。\\n较秦之所得，与战胜而得者，其实百倍；\\n诸侯之所亡，与战败而亡者，其实亦百倍。\\n则秦之所大欲，诸侯之所大患，固不在战矣。\\n思<b>厥先祖父</b>，暴霜露，斩荆棘，以有尺寸之地。\\n子孙视之不甚惜，举以予人，如弃草芥。\\n今日割五城，明日割十城，然后得一夕安寝；\\n起视四境，而秦兵又至矣。\\n然则诸侯之地有限，<b>暴秦之欲</b>无厌，奉之弥繁，侵之愈急。\\n故不战而强弱胜负已判矣。\\n至于颠覆，理固宜然。\\n古人云：“以地事秦，犹抱薪救火，薪不尽，火不灭。”\\n此言得之。##齐人未尝<b>赂秦</b>，终继五国迁灭，何哉？\\n<b>与嬴</b>而不助五国也。\\n五国既丧，齐亦不免矣。\\n燕赵之君，始有远略，能守其土，义不<b>赂秦</b>。\\n是故燕虽小国而后亡，斯用兵之效也。\\n至丹以荆卿为计，始<b>速祸</b>焉。\\n赵尝五战于秦，二败而三胜。\\n后秦击赵者再，李牧连却之。\\n<b>洎牧</b>以谗诛，邯郸为郡，惜其用武而不终也。\\n且燕赵处秦革灭殆尽之际，可谓智力孤危，战败而亡，诚不得已。##<b>向使</b>三国各爱其地，齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当与秦相较，或未易量。##呜呼！\\n以<b>赂秦</b>之地封天下之谋臣，以事秦之心礼天下之奇才，并力西向，则吾恐秦人食之不得下咽也。\\n悲夫！\\n有如此之势，而为秦人积威之所劫，日削月割，以趋于亡。\\n为国者无使为积威之所劫哉！##夫六国与秦皆诸侯，其势弱于秦，而犹有可以不赂而胜之之势。\\n苟以天下之大，下而从六国破亡之故事，是又在六国下矣。","translation":"六国灭亡，不是兵器不锋利、仗打不好，弊病在于贿赂秦国。\\n贿赂秦国使自己的力量亏损，这是灭亡的道路。\\n有人说：六国接连灭亡，都是因为贿赂秦国吗？\\n回答：不贿赂秦国的国家因为贿赂秦国的国家而灭亡，是因为失去了强大的援助，不能独自保全。\\n所以说，弊病在于贿赂秦国。##秦国用攻战取得土地以外，小的得到邑镇，大的得到城池。\\n比较秦国贿赂所得和战胜所得，实际多百倍；\\n诸侯失去的土地，与战败失去的土地，实际也多百倍。\\n秦国最大的欲望、诸侯最大的祸患，本来不在战争。\\n想到他们祖辈父辈，冒着霜露，披荆斩棘，才有一点土地；\\n子孙却不很珍惜，拿来送给别人，像丢弃草芥。\\n今天割让五座城，明天割让十座城，然后得到一夜安睡；\\n第二天起来看四境，秦军又来了。\\n诸侯土地有限，暴秦欲望没有满足，送给秦国越多，秦国侵犯越急。\\n所以不用战争，强弱胜负就已经判定了；\\n最终覆亡，按道理本来就应当如此。\\n古人说：“用土地侍奉秦国，就像抱着柴薪救火，柴薪不烧完，火就不会熄灭。”\\n这话说对了。##齐国不曾贿赂秦国，最终也随着五国迁灭，为什么？\\n因为它亲附秦国而不帮助五国。\\n五国已经灭亡，齐国也不能幸免。\\n燕赵的君主开始有远见，能守住土地，坚持正义不贿赂秦国，因此燕虽是小国却最后灭亡，这是用兵的效果；\\n等到燕太子丹用荆轲刺秦，才招致祸患。\\n赵国曾五次与秦作战，两次失败、三次胜利；\\n后来秦两次攻打赵国，李牧连续击退秦军。\\n等到李牧因受谗言被杀，邯郸成了郡，可惜它使用武力却没有坚持到底。\\n而且燕赵处在秦国把其他国家几乎消灭的时期，可以说智力孤危，战败灭亡实在是不得已。##假使韩魏楚三国各自爱护土地，齐国不亲附秦国，荆轲不去刺秦，良将李牧还在，那么胜负存亡的形势如果同秦国较量，或许还不能轻易判断。##唉！\\n如果把贿赂秦国的土地封给天下谋臣，把侍奉秦国的心意礼遇天下奇才，合力向西进攻，我恐怕秦人连饭都咽不下去。\\n可悲啊！\\n有这样的形势，却被秦国积久的威势所胁迫，土地一天天削减、月月割让，以至于走向灭亡。\\n治理国家的人不要让自己被积久的威势所胁迫啊！##六国和秦国都是诸侯，势力比秦弱，却还有可以不贿赂秦国而战胜它的形势。\\n假如凭借这样大的天下，却降低身份重蹈六国灭亡的旧事，那就又在六国之下了。","pinyin":null,"annotation":"赂：贿赂。\\n厥：其、他们的。\\n弥：更加。\\n厌：满足。\\n与：亲附。\\n速：招致。\\n洎：及、等到。\\n向使：假使。\\n劫：胁迫。","authorIntro":"苏洵（1009—1066），字明允，号老泉，北宋文学家，“唐宋八大家”之一。","appreciation":"文章以“赂秦”为中心，分别分析韩魏楚、齐、燕赵的灭亡原因，再提出历史借鉴，论证严密，语言富有气势。","extraJson":{"content_key":"df442d83ba3f","dynasty":"北宋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["赂秦","厥先祖父","暴秦之欲","与嬴","速祸","洎牧","向使"],"paragraph_count":6,"required_catalogs":[910129]}},{"id":900004,"title":"陈情表","author":"李密","genre":"文言文","dynasty":"西晋","content":"臣密言：臣以险衅，夙遭<b>闵凶</b>；\\n生孩六月，慈父见背；\\n行年四岁，舅夺母志。\\n祖母刘愍臣孤弱，躬亲抚养。\\n臣少多疾病，九岁不行；\\n零丁孤苦，至于成立。\\n既无伯叔，终鲜兄弟；\\n门衰<b>祚薄</b>，晚有儿息。\\n外无<b>期功</b>强近之亲；\\n内无应门五尺之僮；\\n茕茕孑立，形影相吊。##逮奉圣朝，沐浴清化。\\n前太守臣逵察臣孝廉；\\n后刺史臣荣举臣秀才。\\n诏书特下，拜臣郎中；\\n寻蒙国恩，除臣<b>洗马</b>。\\n猥以微贱，当侍东宫，非臣陨首所能上报。##且臣少仕伪朝，历职郎署，本图宦达，不矜名节。\\n今臣亡国贱俘，至微至陋，过蒙<b>拔擢</b>，宠命优渥，岂敢<b>盘桓</b>，有所希冀！\\n但以刘<b>日薄西山</b>，气息奄奄，人命危浅，朝不虑夕。\\n今臣欲奉诏奔驰，则刘病日<b>笃</b>；\\n欲苟顺私情，则告诉不许：是以区区不能废远。##今臣以弱冠，非臣陨首所能上报。\\n祖母刘夙婴疾病，常在床蓐；\\n臣侍汤药，未曾废离。\\n愿陛下矜悯愚诚，听臣微志，庶刘侥幸，保卒余年。\\n臣生当陨首，死当结草。\\n臣不胜犬马怖惧之情，谨拜表以闻。","translation":"臣李密上言：我因为命运不好，早年遭遇不幸；\\n出生六个月，父亲就去世了；\\n四岁时，舅舅强行改变了母亲守节的志向。\\n祖母刘氏怜悯我孤弱，亲自抚养我。\\n我年少时多病，九岁还不会走；\\n孤苦伶仃，直到成人自立。\\n既没有伯叔，也没有兄弟；\\n门庭衰微、福分浅薄，很晚才有儿子。\\n外面没有关系近的亲戚，家里没有照应门户的童仆，孤单无依，只有身体和影子相互安慰。##等到奉行晋朝的圣旨，受到清明教化。\\n先前太守臣逵考察并推荐我为孝廉，后来刺史臣荣举荐我为秀才。\\n诏书特地下达，任命我为郎中；\\n不久又蒙受国恩，任命我为太子洗马。\\n凭我这样卑微的身份担任侍奉太子的职务，不是杀身捐躯所能报答的。##况且我年轻时曾在蜀汉做官，历任郎官，本来希望取得显达的官位，并不看重名誉和节操。\\n如今我是亡国的俘虏，身份极其卑微，却过分受到提拔，恩宠优厚，哪里敢徘徊观望，有什么别的企求呢？\\n只是祖母刘氏已经像夕阳迫近西山，气息微弱，生命垂危，早晚难以预料。\\n我现在想奉诏急速前往，祖母的病却一天比一天严重；\\n想要姑且顺从自己的私情，但申诉又不被允许，因此内心实在不能废弃祖母而远行。##如今我已成年，祖母刘氏早被疾病缠绕，常年卧病在床；\\n我侍奉汤药，从未离开过她。\\n希望陛下怜悯我愚拙诚心，听任我微小的愿望，使祖母能够侥幸保全余年。\\n我活着应当杀身报恩，死后也要结草报恩。\\n我怀着犬马一样惶恐不安的心情，恭敬地呈上此表让您知道。","pinyin":null,"annotation":"闵凶：忧患凶丧。\\n见背：弃我而死去。\\n成立：成人自立。\\n期功强近之亲：关系较近的亲属。\\n茕茕孑立：孤单无依。\\n洗马：太子的属官。\\n猥：谦辞，辱。\\n拔擢：提拔。\\n盘桓：徘徊不进。\\n日薄西山：接近死亡。\\n笃：病重。","authorIntro":"李密（224—287），字令伯，西晋文学家，以孝闻名。","appreciation":"文章先叙身世孤苦和祖母养育之恩，再写朝廷知遇和征召，陈述忠孝两难，最后请求终养祖母，情理交融、感人至深。","extraJson":{"content_key":"4cb99da72f0e","dynasty":"西晋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["闵凶","祚薄","期功","洗马","拔擢","盘桓","日薄西山","笃"],"paragraph_count":4,"required_catalogs":[]}},{"id":900081,"title":"琵琶行并序","author":"白居易","genre":"古诗","dynasty":"唐","content":"<b>浔阳</b>江头夜送客，枫叶<b>荻花</b>秋瑟瑟。\\n主人下马客在船，举酒欲饮无管弦。\\n醉不成欢惨将别，别时茫茫江浸月。\\n忽闻水上琵琶声，主人忘归客不发。\\n寻声暗问弹者谁？琵琶声停欲语迟。\\n移船相近邀相见，添酒回灯重开宴。\\n千呼万唤始出来，犹抱琵琶半遮面。\\n转轴拨弦三两声，未成曲调先有情。\\n弦弦掩抑声声思，似诉平生不得志。\\n低眉信手续续弹，说尽心中无限事。\\n大弦嘈嘈如急雨，小弦切切如私语。\\n嘈嘈切切错杂弹，大珠小珠落玉盘。\\n<b>间关</b>莺语花底滑，<b>幽咽</b>泉流冰下难。\\n冰泉冷涩弦凝绝，凝绝不通声暂歇。\\n别有幽愁暗恨生，此时无声胜有声。\\n银瓶乍破水浆迸，铁骑突出刀枪鸣。\\n曲终收拨当心画，四弦一声如裂帛。\\n东船西舫悄无言，唯见江心秋月白。\\n沉吟放拨插弦中，整顿衣裳起敛容。\\n自言本是京城女，家在虾蟆陵下住。\\n十三学得琵琶成，名属<b>教坊</b>第一部。\\n门前冷落车马稀，老大嫁作商人妇。\\n我闻琵琶已叹息，又闻此语重唧唧。\\n同是天涯沦落人，相逢何必曾相识！\\n我从去年辞帝京，谪居卧病<b>浔阳</b>城。\\n其间旦暮闻何物？杜鹃啼血猿哀鸣。\\n春江花朝秋月夜，往往取酒还独倾。\\n岂无山歌与村笛？呕哑<b>嘲哳</b>难以听。\\n今夜闻君琵琶语，如听仙乐耳暂明。\\n莫辞更坐弹一曲，为君翻作《琵琶行》。\\n感我此言良久立，却坐促弦弦转急。\\n凄凄不似向前声，满座重闻皆掩泣。\\n座中泣下谁最多？江州司马<b>青衫</b>湿。","translation":"秋夜我在浔阳江头送别友人，枫叶和荻花在秋风中瑟瑟作响。\\n主人下马，客人登船，举杯想饮，却没有音乐伴奏。\\n醉了也不能尽兴，悲伤地将要分别；分别时茫茫江面上浸着一轮月亮。\\n忽然听到江面传来的琵琶声，主人忘了回去，客人也不再出发。\\n循着声音暗中询问是谁弹奏，琵琶声停了，想说话却迟疑不语。\\n我们移船靠近邀请相见，添酒、拨亮灯火，重新摆开酒宴。\\n千呼万唤她才走出来，还抱着琵琶半遮着脸。\\n转动弦轴拨弄几下琴弦，还没有弹成曲调就先流露出感情。\\n每一根弦都压抑低沉，每一声都含有愁思，像在诉说一生的不如意。\\n她低着眉随手连续弹奏，仿佛说尽心中无数事情。\\n大弦嘈嘈像急骤的雨，小弦切切像私语。\\n嘈嘈切切交错弹奏，大珠小珠落在玉盘上。\\n像黄莺在花下婉转鸣叫，像幽咽的泉水在冰下艰难流淌。\\n冰下泉水冷涩，琴弦凝结，声音暂时停歇。\\n另有幽愁暗恨产生，这时无声胜过有声。\\n像银瓶突然破裂水浆迸射，像铁骑突出刀枪齐鸣。\\n曲终收拨在琴弦中心一划，四根弦一起发声像撕裂丝帛。\\n东船西舫都静悄悄，只看见江心映着一轮秋月。\\n她沉思着放下拨子插入琴弦，整理衣裳站起来，收敛容态。\\n她自称本是京城女子，家住在虾蟆陵附近。\\n十三岁学会弹琵琶，名字列在教坊第一部。\\n门前车马渐渐稀少，年老后嫁给商人为妻。\\n我听了琵琶声已经叹息，又听了这番话更加感慨。\\n我们同是漂泊天涯的人，今天相逢又何必一定曾经相识！\\n我从去年离开京都，贬居在浔阳，卧病在身。\\n这里早晚听到什么声音呢？杜鹃啼血，猿猴哀鸣。\\n春江花朝、秋江月夜，往往取酒独自饮。\\n难道没有山歌和村笛吗？只是嘈杂刺耳，实在难以听下去。\\n今夜听到您的琵琶话语，像听到仙乐，耳朵暂时清明。\\n请不要推辞再坐下来弹一曲，我为您创作一首《琵琶行》。\\n她被我的话感动，站立了很久，回去坐下使琴弦弹得更急。\\n凄凄切切不像先前的声音，满座的人再次听到都掩面哭泣。\\n在座的人中流泪最多的是谁？江州司马的青衫已经湿透。","pinyin":null,"annotation":"行：古诗的一种体裁。\\n瑟瑟：秋风吹动草木的声音。\\n教坊：唐代官办管领音乐杂技的机构。\\n间关：鸟鸣婉转。\\n幽咽：形容声音低沉圆转。\\n呕哑嘲哳：声音嘈杂。\\n青衫：唐代八、九品文官服色，指白居易。","authorIntro":"白居易（772—846），字乐天，号香山居士，唐代现实主义诗人。","appreciation":"诗歌以琵琶女的演奏和身世为核心，通过音乐描写的通感、比喻和节奏变化，表现琵琶女的悲惨身世，也寄托诗人被贬后的失意与同病相怜。","extraJson":{"content_key":"c13f35d1e41f","dynasty":"唐","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["浔阳","荻花","教坊","间关","幽咽","嘲哳","青衫"],"paragraph_count":1,"required_catalogs":[910110]}},{"id":900082,"title":"竹里馆","author":"王维","genre":"古诗","dynasty":"唐","content":"独坐<b>幽篁</b>里，弹琴复<b>长啸</b>。\\n深林人不知，明月来相照。","translation":"独自坐在幽深的竹林里，弹琴又长声呼啸。\\n深深的树林中没有人知道我，只有明月来陪伴照耀。","pinyin":null,"annotation":"幽篁：幽深的竹林。\\n长啸：撮口发出长而清越的声音。","authorIntro":"王维，唐代诗人、画家。","appreciation":"诗人独坐竹林、弹琴长啸，以明月为伴，营造幽静高雅的意境，表现隐逸生活的情趣。","extraJson":{"content_key":"9ac783258ba4","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["幽篁","长啸"],"paragraph_count":1,"required_catalogs":[]}},{"id":900083,"title":"春夜洛城闻笛","author":"李白","genre":"古诗","dynasty":"唐","content":"谁家玉笛<b>暗飞声</b>，散入春风满洛城。\\n此夜曲中闻<b>折柳</b>，何人不起<b>故园情</b>。","translation":"不知谁家的玉笛吹出悠扬的声音，随着春风飘满整个洛阳城。\\n在今夜的曲调中听到《折杨柳》，有谁能不生出思念故乡的感情呢？","pinyin":null,"annotation":"玉笛：玉制或精美的笛子。\\n折柳：曲名，也含折柳送别之意。\\n故园：故乡。","authorIntro":"李白，唐代浪漫主义诗人。","appreciation":"诗歌由笛声写起，先写声音随春风传遍全城，再由《折杨柳》触发普遍的思乡之情，情景交融。","extraJson":{"content_key":"427f29ab17dc","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["暗飞声","折柳","故园情"],"paragraph_count":1,"required_catalogs":[]}},{"id":900084,"title":"逢入京使","author":"岑参","genre":"古诗","dynasty":"唐","content":"故园东望路漫漫，双袖<b>龙钟</b>泪不干。\\n马上相逢无纸笔，<b>凭君</b><b>传语</b>报平安。","translation":"向东遥望故乡，路途遥远；两袖沾满泪水，眼泪仍然没有擦干。\\n在骑马途中与你相逢，没有纸笔可以写信，只能托你捎个口信，给家人报平安。","pinyin":null,"annotation":"龙钟：泪流纵横的样子。\\n凭：托，烦请。\\n传语：捎口信。","authorIntro":"岑参，唐代边塞诗人。","appreciation":"诗歌写赴边途中偶遇使者，想写家书却无纸笔，只托口信报平安，表现思乡之情和边塞行旅的急切。","extraJson":{"content_key":"7fcc2a828213","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["龙钟","凭君","传语"],"paragraph_count":1,"required_catalogs":[]}},{"id":900085,"title":"晚春","author":"韩愈","genre":"古诗","dynasty":"唐","content":"草树知春不久归，百般红紫<b>斗芳菲</b>。\\n<b>杨花</b><b>榆荚</b>无才思，惟解漫天<b>作雪飞</b>。","translation":"花草树木知道春天即将归去，争奇斗艳，尽情展现自己的芳香。\\n杨花和榆荚没有艳丽的姿色，只知道像雪花一样漫天飞舞。","pinyin":null,"annotation":"不久归：将要归去。\\n斗芳菲：争奇斗艳。\\n杨花：柳絮。\\n榆荚：榆树的果实。","authorIntro":"韩愈，唐代文学家、思想家。","appreciation":"诗人用拟人手法写晚春百花争艳，连无色无香的杨花榆荚也不甘示弱，表现珍惜春光、积极进取的情怀。","extraJson":{"content_key":"976189912f31","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["斗芳菲","杨花","榆荚","作雪飞"],"paragraph_count":1,"required_catalogs":[]}},{"id":900001,"title":"观沧海","author":"曹操","genre":"古诗","dynasty":"东汉","content":"东临<b>碣石</b>，以观沧海。\\n水何<b>澹澹</b>，山岛<b>竦峙</b>。\\n树木丛生，百草丰茂。\\n秋风<b>萧瑟</b>，<b>洪波</b>涌起。\\n日月之行，若出其中；\\n星汉灿烂，若出其里。\\n幸甚至哉，歌以咏志。","translation":"向东登上碣石山，来观赏大海。\\n海水多么宽阔浩荡，山岛高高地耸立着。\\n树木郁郁葱葱，百草丰美茂盛。\\n秋风吹过树木发出悲凉的声音，巨大的波浪涌起。\\n日月的运行，好像都出自大海之中。\\n银河星光灿烂，好像都从大海里升起。\\n庆幸得很，好极了！就用这首歌来表达自己的志向。","pinyin":null,"annotation":"碣石：山名。\\n澹澹：水波荡漾的样子。\\n竦峙：耸立。\\n萧瑟：树木被秋风吹拂的声音。\\n洪波：巨大的波浪。\\n星汉：银河。\\n幸甚至哉：庆幸得很，好极了。","authorIntro":"曹操（155—220），字孟德，东汉末年政治家、军事家、文学家，三国时期曹魏政权的奠基者。","appreciation":"全诗借大海的壮阔景象抒发建功立业的抱负。“日月之行，若出其中；星汉灿烂，若出其里”运用想象和夸张，表现诗人开阔的胸襟和宏大的政治抱负。","extraJson":{"content_key":"8e1b121365e7","dynasty":"东汉","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["碣石","澹澹","竦峙","萧瑟","洪波"],"paragraph_count":1,"required_catalogs":[910001,910002]}},{"id":900086,"title":"闻王昌龄左迁龙标遥有此寄","author":"李白","genre":"古诗","dynasty":"唐","content":"杨花落尽<b>子规</b>啼，闻道<b>龙标</b>过五溪。\\n我寄愁心与明月，随君直到<b>夜郎</b>西。","translation":"杨花落尽，杜鹃鸟声声哀啼，我听说你被贬为龙标尉，要经过五溪。\\n我把忧愁的心思寄托给明月，希望它伴随你一直到夜郎以西。","pinyin":null,"annotation":"龙标：指王昌龄，古代官职或任所称谓。\\n子规：杜鹃鸟。\\n五溪：地名。\\n夜郎：古代地名。","authorIntro":"李白（701—762），字太白，号青莲居士，唐代浪漫主义诗人。","appreciation":"诗人借明月寄托对友人的关切，把无形的愁心化为可传递的情感，想象奇特，情真意切。","extraJson":{"content_key":"7b032d978367","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["子规","龙标","夜郎"],"paragraph_count":1,"required_catalogs":[]}},{"id":900087,"title":"次北固山下","author":"王湾","genre":"古诗","dynasty":"唐","content":"客路青山外，行舟绿水前。\\n潮平两岸阔，风正一帆<b>悬</b>。\\n<b>海日</b>生残夜，江春入旧年。\\n<b>乡书</b>何处达？归雁洛阳边。","translation":"旅途行驶在青山之外，船行在碧绿的江水之上。\\n潮水上涨，两岸之间更加开阔；风势正顺，一面白帆高高悬挂。\\n海上的太阳在残夜将尽时升起，江南的春意在旧年未尽时已经到来。\\n寄出去的家书不知道什么时候到达？希望北归的大雁捎到洛阳。","pinyin":null,"annotation":"次：停宿。\\n客路：旅途。\\n潮平：潮水涨满。\\n海日：海上的太阳。\\n乡书：家信。","authorIntro":"王湾，唐代诗人。","appreciation":"诗中以行舟为线索，写江南春早和旅途所见；“海日生残夜，江春入旧年”以新旧交替寄寓积极向上的情思，末句转入思乡。","extraJson":{"content_key":"77f98ea204c6","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["悬","海日","乡书"],"paragraph_count":1,"required_catalogs":[]}},{"id":900088,"title":"天净沙·秋思","author":"马致远","genre":"古诗","dynasty":"元","content":"<b>枯藤</b>老树<b>昏鸦</b>，小桥流水人家，古道西风瘦马。\\n夕阳西下，<b>断肠</b>人在天涯。","translation":"枯藤缠绕着老树，树上栖息着黄昏时的乌鸦；小桥下流水潺潺，旁边有几户人家；古道上秋风萧瑟，一匹瘦马驮着游子前行。\\n夕阳已经向西落下，悲痛欲绝的旅人还漂泊在天涯。","pinyin":null,"annotation":"昏鸦：黄昏时的乌鸦。\\n断肠：形容悲痛到极点。\\n天涯：指远离家乡的地方。","authorIntro":"马致远（约1251—1321以后），号东篱，元代戏曲作家、散曲家。","appreciation":"作品用白描手法连缀九种景物，营造萧瑟苍凉的秋景，最后以“断肠人”点明游子思乡之情，意境深远。","extraJson":{"content_key":"6b360a6a2518","dynasty":"元","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["枯藤","昏鸦","断肠"],"paragraph_count":1,"required_catalogs":[]}},{"id":900089,"title":"峨眉山月歌","author":"李白","genre":"古诗","dynasty":"唐","content":"<b>峨眉</b>山月半轮秋，影入<b>平羌</b>江水流。\\n夜发清溪向三峡，思君不见下<b>渝州</b>。","translation":"半轮明月高悬在峨眉山上，月影倒映在平羌江水中随波流动。\\n夜间乘船从清溪出发驶向三峡，想念你却难以相见，只能顺流而下到渝州。","pinyin":null,"annotation":"峨眉山：在今四川峨眉山市。\\n平羌：青衣江的古称。\\n发：出发。\\n渝州：今重庆一带。","authorIntro":"李白，唐代浪漫主义诗人。","appreciation":"全诗五个地名随行舟展开，月亮既是眼前景，也是思念的寄托，构成清朗而悠远的意境。","extraJson":{"content_key":"f3855abb008a","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["峨眉","平羌","渝州"],"paragraph_count":1,"required_catalogs":[]}},{"id":900090,"title":"江南逢李龟年","author":"杜甫","genre":"古诗","dynasty":"唐","content":"<b>岐王</b>宅里寻常见，<b>崔九</b>堂前几度闻。\\n正是江南好风景，<b>落花时节</b>又逢君。","translation":"过去常在岐王宅里见到你，也多次在崔九堂前听到你的歌声。\\n现在正是江南风景最好的时候，却在落花时节又遇见了你。","pinyin":null,"annotation":"岐王：唐玄宗李隆范。\\n崔九：崔涤，排行第九。\\n落花时节：暮春，亦含身世飘零之意。","authorIntro":"杜甫（712—770），字子美，唐代现实主义诗人。","appreciation":"前两句追忆昔日相逢，后两句写今日重逢，以江南暮春的落花寄托对国事凋零、个人身世飘零的感慨。","extraJson":{"content_key":"a2b177ec8e83","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["岐王","崔九","落花时节"],"paragraph_count":1,"required_catalogs":[]}},{"id":900091,"title":"行军九日思长安故园","author":"岑参","genre":"古诗","dynasty":"唐","content":"<b>强</b>欲登高去，无人送酒来。\\n<b>遥怜</b>故园菊，应<b>傍</b>战场开。","translation":"勉强想要登高远望，却没有人送酒来。\\n远方怜惜故乡的菊花，它们大概正靠近战场开放。","pinyin":null,"annotation":"强：勉强。\\n登高：重阳节习俗。\\n故园：故乡。\\n傍：靠近。","authorIntro":"岑参（约715—770），唐代边塞诗人。","appreciation":"诗人重阳登高而无人送酒，转而遥想故园菊花在战乱中开放，以想象写思乡忧国之情。","extraJson":{"content_key":"b45ff0bb6f66","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["强","遥怜","傍"],"paragraph_count":1,"required_catalogs":[]}},{"id":900092,"title":"夜上受降城闻笛","author":"李益","genre":"古诗","dynasty":"唐","content":"回乐<b>烽</b>前沙似雪，受降城外月如霜。\\n不知何处吹<b>芦管</b>，一夜<b>征人</b>尽望乡。","translation":"回乐烽前的沙地洁白得像雪，受降城外的月光有如秋霜。\\n不知道哪里吹响了芦笛，一夜之间出征的将士都在思念故乡。","pinyin":null,"annotation":"回乐烽：烽火台名。\\n受降城：古城名。\\n芦管：笛子。\\n征人：出征的将士。","authorIntro":"李益（约748—829），唐代边塞诗人。","appreciation":"前两句营造空旷寒冷的边塞月夜，后两句写笛声触发征人思乡，以声传情，含蓄深沉。","extraJson":{"content_key":"63d2ffd58886","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["烽","芦管","征人"],"paragraph_count":1,"required_catalogs":[]}},{"id":900093,"title":"秋词（其一）","author":"刘禹锡","genre":"古诗","dynasty":"唐","content":"自古逢秋悲<b>寂寥</b>，我言秋日胜春朝。\\n晴空一鹤<b>排云</b>上，便引诗情到<b>碧霄</b>。","translation":"自古以来人们每逢秋天都悲叹萧条寂寥，我却认为秋天胜过明丽的春天。\\n一只白鹤推开云层直冲云霄，也引发我的诗兴飞到万里晴空。","pinyin":null,"annotation":"寂寥：空旷冷落。\\n春朝：春天的早晨，泛指春日。\\n排云：推开云层。\\n碧霄：蓝天。","authorIntro":"刘禹锡（772—842），字梦得，唐代文学家、哲学家。","appreciation":"诗人一反悲秋传统，以鹤冲云天的形象表达奋发进取、乐观旷达的精神。","extraJson":{"content_key":"c9b77ad0f2cc","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["寂寥","排云","碧霄"],"paragraph_count":1,"required_catalogs":[]}},{"id":900094,"title":"夜雨寄北","author":"李商隐","genre":"古诗","dynasty":"唐","content":"君问<b>归期</b>未有期，<b>巴山</b>夜雨涨秋池。\\n何当共剪西窗烛，却话<b>巴山</b>夜雨时。","translation":"你问我回家的日期，我还没有确定；此时巴山夜里下着大雨，秋池都涨满了。\\n什么时候我们才能共同在西窗下剪烛夜谈，再回忆起巴山夜雨的情景呢？","pinyin":null,"annotation":"寄北：写诗寄给北方的妻子或友人。\\n何当：什么时候能够。\\n共剪西窗烛：指亲友相聚夜谈。","authorIntro":"李商隐（约813—约858），字义山，晚唐诗人。","appreciation":"以“巴山夜雨”统摄今昔，眼前的羁旅愁苦与未来团聚的想象相互映照，构思新巧，情深意长。","extraJson":{"content_key":"7a2c808b84ca","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["归期","巴山","剪烛"],"paragraph_count":1,"required_catalogs":[]}},{"id":900095,"title":"十一月四日风雨大作（其二）","author":"陆游","genre":"古诗","dynasty":"南宋","content":"<b>僵卧</b>孤村不自哀，尚思为国<b>戍</b>轮台。\\n<b>夜阑</b>卧听风吹雨，<b>铁马</b>冰河入梦来。","translation":"我直挺挺地躺在孤寂的乡村里，并不为自己的处境悲哀，还在想着替国家守卫边疆。\\n夜将尽时我躺在床上听着风雨声，梦见自己骑着披甲的战马跨过冰封的河流。","pinyin":null,"annotation":"僵卧：直挺挺地躺着。\\n戍：守卫。\\n轮台：古代边疆地名。\\n夜阑：夜深。\\n铁马：披着铁甲的战马。","authorIntro":"陆游（1125—1210），字务观，号放翁，南宋爱国诗人。","appreciation":"诗人虽年老闲居，仍心系国事；“铁马冰河入梦来”把现实风雨与杀敌报国的梦境融为一体，表现强烈的爱国情怀。","extraJson":{"content_key":"a6c11c261457","dynasty":"南宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["僵卧","戍","夜阑","铁马"],"paragraph_count":1,"required_catalogs":[]}},{"id":900096,"title":"潼关","author":"谭嗣同","genre":"古诗","dynasty":"清","content":"终古高云<b>簇</b>此城，秋风吹散马蹄声。\\n河流大野犹嫌<b>束</b>，山入<b>潼关</b>不解平。","translation":"自古以来高云聚集在这座雄关之上，秋风把马蹄声吹散。\\n黄河奔向辽阔的原野还嫌受到约束，群山进入潼关也不知什么叫平坦。","pinyin":null,"annotation":"潼关：关名，在今陕西潼关。\\n终古：久远。\\n簇：聚集。\\n束：约束。","authorIntro":"谭嗣同（1865—1898），字复生，号壮飞，近代维新派政治家、思想家。","appreciation":"诗人用高云、秋风、河流和群山写潼关的雄奇险峻，借“犹嫌束”“不解平”表现冲决罗网、追求解放的少年气概。","extraJson":{"content_key":"671c555f496c","dynasty":"清","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["簇","潼关","束"],"paragraph_count":1,"required_catalogs":[]}}];

    const state={versionId:"5e21a87b47a648eb9da56a51381e1611",volumeId:"cd7333ee86389c1aeb234dca6d110508",unitId:"全部篇目",poemId:900001,aux:"translation"};
    const auxLabels={translation:"译文",annotation:"注释",authorIntro:"作者简介",appreciation:"赏析"};
    const $=s=>document.querySelector(s);
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    function rich(s){return esc(s).replace(/&lt;b&gt;(.*?)&lt;\/b&gt;/g,"<b>$1</b>")}
    function textBlocks(value){return String(value||"").split(/\\n/).map(x=>x.trim()).filter(Boolean).map(x=>`<p>${rich(x)}</p>`).join("")||'<p class="empty">暂无内容</p>'}
    function renderTranslation(value,genre){
      if(genre==="古诗") return String(value||"").split(/\\n/).map(x=>x.trim()).filter(Boolean).map((x,i)=>`<p class="translation-line"><span class="translation-index">${i+1}</span>${rich(x)}</p>`).join("")||'<p class="empty">暂无内容</p>';
      if(genre==="文言文") return String(value||"").split("##").map((x,i)=>`<div class="translation-paragraph"><span class="translation-paragraph-index">第${i+1}段</span>${textBlocks(x)}</div>`).join("")||'<p class="empty">暂无内容</p>';
      return textBlocks(value);
    }
    function renderOriginal(content){const sections=String(content||"").split("##");return sections.map((section,i)=>{const lines=section.split(/\\n/).map(x=>x.trim()).filter(Boolean);const label=sections.length>1?`<div class="paragraph-label">第${i+1}段</div>`:"";return `<section class="original-section">${label}${lines.map(x=>`<div class="original-line">${rich(x)}</div>`).join("")}</section>`}).join("")}
    function versionOptions(){return [...new Map(catalogs.map(x=>[x.versionId,x])).values()].map(x=>`<option value="${x.versionId}" ${x.versionId===state.versionId?"selected":""}>${esc(x.versionName)}</option>`).join("")}
    function volumeOptions(){const rows=catalogs.filter(x=>x.versionId===state.versionId);return [...new Map(rows.map(x=>[x.volumeId,x])).values()].map(x=>`<option value="${x.volumeId}" ${x.volumeId===state.volumeId?"selected":""}>${esc(x.volumeName)}</option>`).join("")}
    function unitOptions(){const rows=catalogs.filter(x=>x.versionId===state.versionId&&x.volumeId===state.volumeId);const options=[`<option value="全部篇目" ${state.unitId==="全部篇目"?"selected":""}>全部篇目</option>`];return options.concat([...new Map(rows.map(x=>[x.unitId,x])).values()].map(x=>`<option value="${x.unitId}" ${x.unitId===state.unitId?"selected":""}>${esc(x.unitName)}</option>`)).join("")}
    function visibleCatalogs(){return catalogs.filter(x=>x.versionId===state.versionId&&x.volumeId===state.volumeId&&(state.unitId==="全部篇目"||x.unitId===state.unitId)).sort((a,b)=>a.sort-b.sort)}
    function currentCatalog(){return catalogs.find(x=>x.poemId===state.poemId&&x.versionId===state.versionId&&x.volumeId===state.volumeId&&(state.unitId==="全部篇目"||x.unitId===state.unitId))||visibleCatalogs()[0]}
    function renderList(){const rows=visibleCatalogs();if(!rows.length)return '<div class="empty">当前教材范围暂无挂载篇目</div>';return rows.map((row,i)=>{const p=poems.find(x=>x.id===row.poemId);return `<button class="poem-item ${p&&p.id===state.poemId?"active":""}" data-poem-id="${row.poemId}" data-catalog-id="${row.id}"><span class="poem-index">${i+1}</span><span class="poem-copy"><b>${esc(p?.title||"未知篇目")}</b><small>${esc(p?.author||"未知作者")} · 挂载ID ${row.id}</small></span><span class="question-link" data-question-poem-id="${row.poemId}">查看题目</span><span class="sort">查看</span></button>`}).join("")}
    function renderQuestionStem(stem){return rich(stem).replace(/##(.*?)##/g,"<mark>$1</mark>")}
    function openQuestions(poemId){const p=poems.find(x=>x.id===poemId);const rows=questions.filter(x=>x.poemId===poemId);if(!p)return;document.querySelector(".question-modal")?.remove();document.body.insertAdjacentHTML("beforeend",`<div class="question-modal" data-question-modal><section class="question-dialog" role="dialog" aria-modal="true"><header class="question-dialog-head"><div><h3>${esc(p.title)} · 理解性默写</h3><p>${esc(p.author)} · 共 ${rows.length} 题（当前展示完整答案）</p></div><button class="question-close" data-question-close aria-label="关闭">×</button></header><div class="question-list">${rows.map((row,i)=>`<div class="question-row"><span class="question-no">${i+1}</span><div class="question-stem">${renderQuestionStem(row.stem)}</div></div>`).join("")}</div></section></div>`);document.querySelector("[data-question-close]").onclick=closeQuestions;document.querySelector("[data-question-modal]").onclick=e=>{if(e.target.matches("[data-question-modal]"))closeQuestions()}}
    function closeQuestions(){document.querySelector(".question-modal")?.remove()}
    function renderSupport(p){const tabs=Object.entries(auxLabels).map(([key,label])=>`<button class="sub-tab ${state.aux===key?"active":""}" data-aux="${key}">${label}</button>`).join("");const body=state.aux==="translation"?renderTranslation(p[state.aux],p.genre):textBlocks(p[state.aux]);return `<div class="section-label">辅助理解</div><div class="sub-tabs">${tabs}</div><div class="support-panel">${body}</div>`}
    function copyPayload(p,row){return {poemId:p.id,catalogId:row?.id||null,title:p.title,author:p.author,genre:p.genre,dynasty:p.dynasty||null,versionId:row?.versionId||state.versionId,versionName:row?.versionName||null,volumeId:row?.volumeId||state.volumeId,volumeName:row?.volumeName||null,unitId:row?.unitId||state.unitId,unitName:row?.unitName||null,content:p.content,translation:p.translation||null,pinyin:p.pinyin||null,annotation:p.annotation||null,authorIntro:p.authorIntro||null,appreciation:p.appreciation||null,extraJson:p.extraJson||null}}
    function renderDetail(){const row=currentCatalog();const p=poems.find(x=>x.id===(row?.poemId||state.poemId));if(!p)return '<section class="card detail-card"><div class="empty">请选择篇目</div></section>';const trial=row?.unitName.includes("试用")?'<span class="trial">试用挂载</span>':"";return `<section class="card detail-card"><div class="detail-head"><div class="detail-title"><div class="poem-symbol">诗</div><div><h2>${esc(p.title)}</h2><div class="author-line">${esc(p.author)} · ${esc(p.dynasty)} · ${esc(p.genre)}</div></div></div><div class="locator"><span class="id">篇目 ID：${p.id}</span><span class="id">挂载记录 ID：${row?.id||"--"}</span>${trial}<button class="copy-btn" data-copy="${esc(JSON.stringify(copyPayload(p,row)))}">复制全部内容</button></div></div><div class="section-label">理解与背诵</div><div class="understand-panel"><div class="original">${renderOriginal(p.content)}</div></div>${renderSupport(p)}<div class="mode-note"><i></i>本页面仅用于内容和教材挂载预览，不展示背诵遮盖、首字提示或默写流程。</div></section>`}
    function render(){const rows=visibleCatalogs();if(!rows.some(x=>x.poemId===state.poemId)){state.poemId=rows[0]?.poemId||null;state.aux="translation"}const list=document.querySelector(".poem-list");const listScrollTop=list?.scrollTop||0;const listScrollHeight=list?.scrollHeight||0;const listClientHeight=list?.clientHeight||0;const listAtBottom=listScrollHeight>listClientHeight&&listScrollTop+listClientHeight>=listScrollHeight-2;$("#app").innerHTML=`<div class="preview-grid"><section class="card catalog-card"><div class="eyebrow">教材目录</div><h2>版本 / 分册 / 单元</h2><div class="field"><label>教材版本</label><select class="select" id="version">${versionOptions()}</select></div><div class="field"><label>分册 / 书目</label><select class="select" id="volume">${volumeOptions()}</select></div><div class="field"><label>单元</label><select class="select" id="unit">${unitOptions()}</select></div><div class="catalog-count"><span>当前篇目</span><b>${rows.length} 篇</b></div><div class="poem-list">${renderList()}</div></section>${renderDetail()}</div>`;bind();const nextList=document.querySelector(".poem-list");if(nextList){nextList.scrollTop=listAtBottom?nextList.scrollHeight:Math.min(listScrollTop,Math.max(0,nextList.scrollHeight-nextList.clientHeight))}}
    function bind(){
      $("#version").onchange=e=>{state.versionId=e.target.value;const first=catalogs.find(x=>x.versionId===state.versionId);state.volumeId=first?.volumeId||"";state.unitId="全部篇目";render()};
      $("#volume").onchange=e=>{state.volumeId=e.target.value;state.unitId="全部篇目";render()};
      $("#unit").onchange=e=>{state.unitId=e.target.value;render()};
      document.querySelectorAll("[data-poem-id]").forEach(el=>el.onclick=()=>{state.poemId=Number(el.dataset.poemId);render()});
      document.querySelectorAll("[data-question-poem-id]").forEach(el=>el.onclick=e=>{e.stopPropagation();openQuestions(Number(el.dataset.questionPoemId))});
      document.querySelectorAll("[data-aux]").forEach(el=>el.onclick=()=>{state.aux=el.dataset.aux;render()});
      document.querySelectorAll("[data-copy]").forEach(el=>el.onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(JSON.parse(el.dataset.copy),null,2));el.textContent="已复制全部内容";setTimeout(()=>el.textContent="复制全部内容",1200)}catch{el.textContent="请手动记录"}});
    }
    render();
  </script>
</body>
</html>
