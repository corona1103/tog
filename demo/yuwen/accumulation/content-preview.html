还多；\\n瓦缝参差比全国的丝缕还多；\\n直栏横槛比九州的城郭还多；\\n管弦嘈杂比市民的言语还多。\\n假使六国各自爱护百姓，就足以抵抗秦国；\\n假使秦国也爱护六国百姓，那么可以传三世乃至万世为君，谁能灭掉它呢？\\n秦人来不及为自己哀叹，后人为他们哀叹；\\n后人如果哀叹却不吸取教训，也会使更后的人再为后人哀叹了。","pinyin":null,"annotation":"兀：山秃。\\n缦回：曲折。\\n囷囷：盘旋的样子。\\n霁：雨雪停止，天放晴。\\n媵嫱：宫妃。\\n幸：皇帝到某处。\\n剽掠：抢劫掠夺。\\n锱铢：极微小的数量。\\n族：灭族。","authorIntro":"杜牧，晚唐诗人。","appreciation":"文章铺陈阿房宫的宏丽、宫女的悲惨和珍宝的浪费，层层揭露秦统治者的奢靡和暴政，以秦亡告诫后人。","extraJson":{"content_key":"af60c1e776c8","dynasty":"唐","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["霁","媵嫱","剽掠","锱铢","囷囷焉","矗","辇","荧荧","鬟","腻","焚椒","辘辘","杳","缦","逦迤"],"paragraph_count":4,"required_catalogs":[910128]}},{"id":900080,"title":"六国论","author":"苏洵","genre":"文言文","dynasty":"北宋","content":"六国破灭，非兵不利，战不善，<b>弊</b>在赂秦。\\n赂秦而力亏，破灭之道也。\\n或曰：六国互丧，率赂秦耶？\\n曰：不赂者以赂者丧。\\n盖失强援，不能独完。\\n故曰：<b>弊</b>在赂秦也。##秦以攻取之外，小则获邑，大则得城。\\n较秦之所得，与战胜而得者，其实百倍；诸侯之所亡，与战败而亡者，其实亦百倍。\\n则秦之所大欲，诸侯之所大患，固不在战矣。\\n思厥先祖父，暴霜露，斩<b>荆棘</b>，以有尺寸之地。\\n子孙视之不甚惜，举以予人，如弃草<b>芥</b>。\\n今日割五城，明日割十城，然后得一夕安寝。\\n起视四境，而秦兵又至矣。\\n然则诸侯之地有限，暴秦之欲无厌，奉之弥繁，侵之愈急。\\n故不战而强弱胜负已判矣。\\n至于颠覆，理固宜然。\\n古人云：“以地事秦，犹抱<b>薪</b>救火，<b>薪</b>不尽，火不灭。”此言得之。##齐人未尝赂秦，终继五国迁灭，何哉？与嬴而不助五国也。\\n五国既丧，齐亦不免矣。\\n燕赵之君，始有远略，能守其土，义不赂秦。\\n是故燕虽小国而后亡，斯用兵之效也。\\n至丹以荆卿为计，始速祸焉。\\n赵尝五战于秦，二败而三胜。\\n后秦击赵者再，李牧连却之。\\n洎牧以谗诛，<b>邯郸</b>为郡，惜其用武而不终也。\\n且燕赵处秦革灭<b>殆</b>尽之际，可谓智力孤危，战败而亡，诚不得已。\\n向使三国各爱其地，齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当与秦相较，或未易量。##呜呼！以赂秦之地封天下之谋臣，以事秦之心礼天下之奇才，并力西向，则吾恐秦人食之不得下咽也。\\n悲夫！有如此之势，而为秦人积威之所劫，日削月割，以趋于亡。\\n为国者无使为积威之所劫哉！##夫六国与秦皆诸侯，其势弱于秦，而犹有可以不赂而胜之之势。\\n苟以天下之大，下而从六国破亡之故事，是又在六国下矣。","translation":"六国灭亡，不是兵器不锋利、仗打不好，弊病在于贿赂秦国。\\n贿赂秦国使自己的力量亏损，这是灭亡的道路。\\n有人说：六国接连灭亡，都是因为贿赂秦国吗？\\n回答：不贿赂秦国的国家因为贿赂秦国的国家而灭亡，是因为失去了强大的援助，不能独自保全。\\n所以说，弊病在于贿赂秦国。##秦国用攻战取得土地以外，小的得到邑镇，大的得到城池。\\n比较秦国贿赂所得和战胜所得，实际多百倍；\\n诸侯失去的土地，与战败失去的土地，实际也多百倍。\\n秦国最大的欲望、诸侯最大的祸患，本来不在战争。\\n想到他们祖辈父辈，冒着霜露，披荆斩棘，才有一点土地；\\n子孙却不很珍惜，拿来送给别人，像丢弃草芥。\\n今天割让五座城，明天割让十座城，然后得到一夜安睡；\\n第二天起来看四境，秦军又来了。\\n诸侯土地有限，暴秦欲望没有满足，送给秦国越多，秦国侵犯越急。\\n所以不用战争，强弱胜负就已经判定了；\\n最终覆亡，按道理本来就应当如此。\\n古人说：“用土地侍奉秦国，就像抱着柴薪救火，柴薪不烧完，火就不会熄灭。”\\n这话说对了。##齐国不曾贿赂秦国，最终也随着五国迁灭，为什么？\\n因为它亲附秦国而不帮助五国。\\n五国已经灭亡，齐国也不能幸免。\\n燕赵的君主开始有远见，能守住土地，坚持正义不贿赂秦国，因此燕虽是小国却最后灭亡，这是用兵的效果；\\n等到燕太子丹用荆轲刺秦，才招致祸患。\\n赵国曾五次与秦作战，两次失败、三次胜利；\\n后来秦两次攻打赵国，李牧连续击退秦军。\\n等到李牧因受谗言被杀，邯郸成了郡，可惜它使用武力却没有坚持到底。\\n而且燕赵处在秦国把其他国家几乎消灭的时期，可以说智力孤危，战败灭亡实在是不得已。##假使韩魏楚三国各自爱护土地，齐国不亲附秦国，荆轲不去刺秦，良将李牧还在，那么胜负存亡的形势如果同秦国较量，或许还不能轻易判断。##唉！\\n如果把贿赂秦国的土地封给天下谋臣，把侍奉秦国的心意礼遇天下奇才，合力向西进攻，我恐怕秦人连饭都咽不下去。\\n可悲啊！\\n有这样的形势，却被秦国积久的威势所胁迫，土地一天天削减、月月割让，以至于走向灭亡。\\n治理国家的人不要让自己被积久的威势所胁迫啊！\\n六国和秦国都是诸侯，势力比秦弱，却还有可以不贿赂秦国而战胜它的形势。\\n假如凭借这样大的天下，却降低身份重蹈六国灭亡的旧事，那就又在六国之下了。","pinyin":null,"annotation":"赂：贿赂。\\n厥：其、他们的。\\n弥：更加。\\n厌：满足。\\n与：亲附。\\n速：招致。\\n洎：及、等到。\\n向使：假使。\\n劫：胁迫。","authorIntro":"苏洵（1009—1066），字明允，号老泉，北宋文学家，“唐宋八大家”之一。","appreciation":"文章以“赂秦”为中心，分别分析韩魏楚、齐、燕赵的灭亡原因，再提出历史借鉴，论证严密，语言富有气势。","extraJson":{"content_key":"df442d83ba3f","dynasty":"北宋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["弊","荆棘","芥","薪","邯郸","殆"],"paragraph_count":5,"required_catalogs":[910129]}},{"id":900004,"title":"陈情表","author":"李密","genre":"文言文","dynasty":"西晋","content":"臣密言：臣以险衅，夙遭<b>闵凶</b>；\\n生孩六月，慈父见背；\\n行年四岁，舅夺母志。\\n祖母刘愍臣孤弱，躬亲抚养。\\n臣少多疾病，九岁不行；\\n零丁孤苦，至于成立。\\n既无伯叔，终鲜兄弟；\\n门衰<b>祚薄</b>，晚有儿息。\\n外无<b>期功</b>强近之亲；\\n内无应门五尺之僮；\\n茕茕孑立，形影相吊。##逮奉圣朝，沐浴清化。\\n前太守臣逵察臣孝廉；\\n后刺史臣荣举臣秀才。\\n诏书特下，拜臣郎中；\\n寻蒙国恩，除臣<b>洗马</b>。\\n猥以微贱，当侍东宫，非臣陨首所能上报。##且臣少仕伪朝，历职郎署，本图宦达，不矜名节。\\n今臣亡国贱俘，至微至陋，过蒙<b>拔擢</b>，宠命优渥，岂敢<b>盘桓</b>，有所希冀！\\n但以刘<b>日薄西山</b>，气息奄奄，人命危浅，朝不虑夕。\\n今臣欲奉诏奔驰，则刘病日<b>笃</b>；\\n欲苟顺私情，则告诉不许：是以区区不能废远。##今臣以弱冠，非臣陨首所能上报。\\n祖母刘夙婴疾病，常在床蓐；\\n臣侍汤药，未曾废离。\\n愿陛下矜悯愚诚，听臣微志，庶刘侥幸，保卒余年。\\n臣生当陨首，死当结草。\\n臣不胜犬马怖惧之情，谨拜表以闻。","translation":"臣李密上言：我因为命运不好，早年遭遇不幸；\\n出生六个月，父亲就去世了；\\n四岁时，舅舅强行改变了母亲守节的志向。\\n祖母刘氏怜悯我孤弱，亲自抚养我。\\n我年少时多病，九岁还不会走；\\n孤苦伶仃，直到成人自立。\\n既没有伯叔，也没有兄弟；\\n门庭衰微、福分浅薄，很晚才有儿子。\\n外面没有关系近的亲戚，家里没有照应门户的童仆，孤单无依，只有身体和影子相互安慰。##等到奉行晋朝的圣旨，受到清明教化。\\n先前太守臣逵考察并推荐我为孝廉，后来刺史臣荣举荐我为秀才。\\n诏书特地下达，任命我为郎中；\\n不久又蒙受国恩，任命我为太子洗马。\\n凭我这样卑微的身份担任侍奉太子的职务，不是杀身捐躯所能报答的。##况且我年轻时曾在蜀汉做官，历任郎官，本来希望取得显达的官位，并不看重名誉和节操。\\n如今我是亡国的俘虏，身份极其卑微，却过分受到提拔，恩宠优厚，哪里敢徘徊观望，有什么别的企求呢？\\n只是祖母刘氏已经像夕阳迫近西山，气息微弱，生命垂危，早晚难以预料。\\n我现在想奉诏急速前往，祖母的病却一天比一天严重；\\n想要姑且顺从自己的私情，但申诉又不被允许，因此内心实在不能废弃祖母而远行。##如今我已成年，祖母刘氏早被疾病缠绕，常年卧病在床；\\n我侍奉汤药，从未离开过她。\\n希望陛下怜悯我愚拙诚心，听任我微小的愿望，使祖母能够侥幸保全余年。\\n我活着应当杀身报恩，死后也要结草报恩。\\n我怀着犬马一样惶恐不安的心情，恭敬地呈上此表让您知道。","pinyin":null,"annotation":"闵凶：忧患凶丧。\\n见背：弃我而死去。\\n成立：成人自立。\\n期功强近之亲：关系较近的亲属。\\n茕茕孑立：孤单无依。\\n洗马：太子的属官。\\n猥：谦辞，辱。\\n拔擢：提拔。\\n盘桓：徘徊不进。\\n日薄西山：接近死亡。\\n笃：病重。","authorIntro":"李密（224—287），字令伯，西晋文学家，以孝闻名。","appreciation":"文章先叙身世孤苦和祖母养育之恩，再写朝廷知遇和征召，陈述忠孝两难，最后请求终养祖母，情理交融、感人至深。","extraJson":{"content_key":"4cb99da72f0e","dynasty":"西晋","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["闵凶","祚薄","期功","洗马","拔擢","盘桓","日薄西山","笃"],"paragraph_count":4,"required_catalogs":[]}},{"id":900081,"title":"琵琶行并序","author":"白居易","genre":"古诗","dynasty":"唐","content":"浔阳江头夜送客，枫叶荻花秋<b>瑟瑟</b>。\\n主人下马客在船，举酒欲饮无管弦。\\n醉不成欢惨将别，别时茫茫江浸月。##忽闻水上<b>琵琶</b>声，主人忘归客不发。\\n寻声暗问弹者谁？<b>琵琶</b>声停欲语迟。\\n移船相近邀相见，添酒回灯重开宴。\\n千呼万唤始出来，犹抱<b>琵琶</b>半遮面。\\n转轴拨弦三两声，未成曲调先有情。\\n弦弦掩抑声声思，似诉平生不得志。\\n低眉信手续续弹，说尽心中无限事。\\n轻拢慢捻抹复挑，初为《霓裳》后《六幺》。\\n大弦嘈嘈如急雨，小弦切切如私语。\\n嘈嘈切切错杂弹，大珠小珠落玉盘。\\n<b>间关</b>莺语花底滑，<b>幽咽</b>泉流冰下难。\\n冰泉冷涩弦凝绝，凝绝不通声暂歇。\\n别有幽愁暗恨生，此时无声胜有声。\\n银瓶乍破水浆迸，铁骑突出刀枪鸣。\\n曲终收拨当心画，四弦一声如裂帛。\\n东船西舫悄无言，唯见江心秋月白。##沉吟放拨插弦中，整顿衣裳起<b>敛</b>容。\\n自言本是京城女，家在虾蟆陵下住。\\n十三学得<b>琵琶</b>成，名属教坊第一部。\\n曲罢曾教善才服，妆成每被秋娘妒。\\n五陵年少争缠头，一曲红绡不知数。\\n钿头银篦击节碎，血色罗裙翻酒污。\\n今年欢笑复明年，秋月春风等闲度。\\n弟走从军阿姨死，暮去朝来颜色故。\\n门前冷落车马稀，老大嫁作商人妇。\\n商人重利轻别离，前月浮梁买茶去。\\n去来江口守空船，绕船月明江水寒。\\n夜深忽梦少年事，梦啼妆泪红阑干。##我闻<b>琵琶</b>已叹息，又闻此语重唧唧。\\n同是天涯沦落人，相逢何必曾相识！\\n我从去年辞帝京，<b>谪</b>居卧病浔阳城。\\n浔阳地僻无音乐，终岁不闻丝竹声。\\n住近湓江地低湿，黄芦苦竹绕宅生。\\n其间旦暮闻何物？杜鹃啼血猿哀鸣。\\n春江花朝秋月夜，往往取酒还独倾。\\n岂无山歌与村笛，呕哑<b>嘲哳</b>难为听。\\n今夜闻君<b>琵琶</b>语，如听仙乐耳暂明。\\n莫辞更坐弹一曲，为君翻作《<b>琵琶</b>行》。##感我此言良久立，却坐促弦弦转急。\\n凄凄不似向前声，满座重闻皆掩泣。\\n座中泣下谁最多？江州司马青衫湿。","translation":"秋夜我在浔阳江头送别友人，枫叶和荻花在秋风中瑟瑟作响。\\n主人下马，客人登船，举杯想饮，却没有音乐伴奏。\\n醉了也不能尽兴，悲伤地将要分别；分别时茫茫江面上浸着一轮月亮。##忽然听到江面传来的琵琶声，主人忘了回去，客人也不再出发。\\n循着声音暗中询问是谁弹奏，琵琶声停了，想说话却迟疑不语。\\n我们移船靠近邀请相见，添酒、拨亮灯火，重新摆开酒宴。\\n千呼万唤她才走出来，还抱着琵琶半遮着脸。\\n转动弦轴拨弄几下琴弦，还没有弹成曲调就先流露出感情。\\n每一根弦都压抑低沉，每一声都含有愁思，像在诉说一生的不如意。\\n她低着眉随手连续弹奏，仿佛说尽心中无数事情。\\n轻轻抚拢慢慢捻揉下抹又上挑，初弹《霓裳羽衣曲》接着再弹《六幺》。\\n大弦嘈嘈像急骤的雨，小弦切切像私语。\\n嘈嘈切切交错弹奏，大珠小珠落在玉盘上。\\n像黄莺在花下婉转鸣叫，像幽咽的泉水在冰下艰难流淌。\\n冰下泉水冷涩，琴弦凝结，声音暂时停歇。\\n像另有一种愁思幽恨暗暗滋生，此时闷闷无声却比有声更动人。\\n像银瓶突然破裂水浆迸射，像铁骑突出刀枪齐鸣。\\n曲终收拨在琴弦中心一划，四根弦一起发声像撕裂丝帛。\\n东船西舫都静悄悄，只看见江心映着一轮秋月。##她沉思着放下拨子插入琴弦，整理衣裳站起来，收敛容态。\\n她自称本是京城女子，家住在虾蟆陵附近。\\n弹奏琵琶技艺十三岁就已学成，教坊乐团第一队中列有我姓名。\\n每曲弹罢都令艺术大师们叹服，每次妆成都被同行歌妓们嫉妒。\\n京都豪富子弟争先恐后来献彩，弹完一曲收来的红绡不知其数。\\n钿头银篦打节拍常常断裂粉碎，红色罗裙被酒渍染污也不后悔。\\n年复一年都在欢笑打闹中度过，秋去春来美好的时光白白消磨。\\n兄弟从军，鸨母死，家道已经破败，暮去朝来我也渐渐地年老色衰。\\n门前车马渐渐稀少，年老后嫁给商人为妻。\\n商人重利不重情常常轻易别离，上个月他去浮梁做茶叶的生意。\\n他去了留下我在江口孤守空船，秋月与我作伴绕舱的秋水凄寒。\\n更深夜阑常梦少年时作乐狂欢，从梦中哭醒，搽了胭脂粉的脸上流满了一道道红色的泪痕。##我听了琵琶声已经叹息，又听了这番话更加感慨。\\n我们同是漂泊天涯的人，今天相逢又何必一定曾经相识！\\n我从去年离开京都，贬居在浔阳，卧病在身。\\n浔阳这地方荒凉偏僻没有音乐，一年到头听不到管弦的乐器声。\\n住在湓江这个低洼潮湿的地方，第宅周围黄芦和苦竹缭绕丛生。\\n在这里能听到的是什么呢？尽是杜鹃猿猴那些悲凄的哀鸣。\\n春江花朝、秋江月夜，往往取酒独自饮。\\n难道没有山歌和村笛吗？只是嘈杂刺耳，实在难以听下去。\\n今夜听到您的琵琶话语，像听到仙乐，耳朵暂时清明。\\n请不要推辞再坐下来弹一曲，我为您创作一首《琵琶行》。##她被我的话感动，站立了很久，回去坐下使琴弦弹得更急。\\n凄凄切切不像先前的声音，满座的人再次听到都掩面哭泣。\\n在座的人中流泪最多的是谁？江州司马的青衫已经湿透。","pinyin":null,"annotation":"行：古诗的一种体裁。\\n瑟瑟：秋风吹动草木的声音。\\n教坊：唐代官办管领音乐杂技的机构。\\n间关：鸟鸣婉转。\\n幽咽：形容声音低沉圆转。\\n呕哑嘲哳：声音嘈杂。\\n青衫：唐代八、九品文官服色，指白居易。","authorIntro":"白居易（772—846），字乐天，号香山居士，唐代现实主义诗人。","appreciation":"诗歌以琵琶女的演奏和身世为核心，通过音乐描写的通感、比喻和节奏变化，表现琵琶女的悲惨身世，也寄托诗人被贬后的失意与同病相怜。","extraJson":{"content_key":"c13f35d1e41f","dynasty":"唐","school_stage":"高中","preview_title":"理解与背诵","emphasis_words":["间关","幽咽","嘲哳","瑟瑟","琵琶","敛","谪"],"paragraph_count":5,"required_catalogs":[910110]}},{"id":900082,"title":"竹里馆","author":"王维","genre":"古诗","dynasty":"唐","content":"独坐<b>幽篁</b>里，弹琴复长啸。\\n深林人不知，明月来相照。","translation":"独自坐在幽深的竹林里，弹琴又长声呼啸。\\n深深的树林中没有人知道我，只有明月来陪伴照耀。","pinyin":null,"annotation":"幽篁：幽深的竹林。\\n长啸：撮口发出长而清越的声音。","authorIntro":"王维，唐代诗人、画家。","appreciation":"诗人独坐竹林、弹琴长啸，以明月为伴，营造幽静高雅的意境，表现隐逸生活的情趣。","extraJson":{"content_key":"9ac783258ba4","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["幽篁"],"paragraph_count":1,"required_catalogs":[]}},{"id":900083,"title":"春夜洛城闻笛","author":"李白","genre":"古诗","dynasty":"唐","content":"谁家玉笛暗飞声，散入春风满洛城。\\n此夜曲中闻折柳，何人不起故园情。","translation":"不知谁家的玉笛吹出悠扬的声音，随着春风飘满整个洛阳城。\\n在今夜的曲调中听到《折杨柳》，有谁能不生出思念故乡的感情呢？","pinyin":null,"annotation":"玉笛：玉制或精美的笛子。\\n折柳：曲名，也含折柳送别之意。\\n故园：故乡。","authorIntro":"李白，唐代浪漫主义诗人。","appreciation":"诗歌由笛声写起，先写声音随春风传遍全城，再由《折杨柳》触发普遍的思乡之情，情景交融。","extraJson":{"content_key":"427f29ab17dc","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":[],"paragraph_count":1,"required_catalogs":[]}},{"id":900084,"title":"逢入京使","author":"岑参","genre":"古诗","dynasty":"唐","content":"故园东望路漫漫，双<b>袖</b><b>龙钟</b>泪不干。\\n马上相逢无纸笔，凭君传语报平安。","translation":"向东遥望故乡，路途遥远；两袖沾满泪水，眼泪仍然没有擦干。\\n在骑马途中与你相逢，没有纸笔可以写信，只能托你捎个口信，给家人报平安。","pinyin":null,"annotation":"龙钟：泪流纵横的样子。\\n凭：托，烦请。\\n传语：捎口信。","authorIntro":"岑参，唐代边塞诗人。","appreciation":"诗歌写赴边途中偶遇使者，想写家书却无纸笔，只托口信报平安，表现思乡之情和边塞行旅的急切。","extraJson":{"content_key":"7fcc2a828213","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["龙钟","袖"],"paragraph_count":1,"required_catalogs":[]}},{"id":900085,"title":"晚春","author":"韩愈","genre":"古诗","dynasty":"唐","content":"草树知春不久归，百般红紫斗芳菲。\\n杨花<b>榆荚</b>无才思，惟解漫天作雪飞。","translation":"花草树木知道春天即将归去，争奇斗艳，尽情展现自己的芳香。\\n杨花和榆荚没有艳丽的姿色，只知道像雪花一样漫天飞舞。","pinyin":null,"annotation":"不久归：将要归去。\\n斗芳菲：争奇斗艳。\\n杨花：柳絮。\\n榆荚：榆树的果实。","authorIntro":"韩愈，唐代文学家、思想家。","appreciation":"诗人用拟人手法写晚春百花争艳，连无色无香的杨花榆荚也不甘示弱，表现珍惜春光、积极进取的情怀。","extraJson":{"content_key":"976189912f31","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["榆荚"],"paragraph_count":1,"required_catalogs":[]}},{"id":900001,"title":"观沧海","author":"曹操","genre":"古诗","dynasty":"东汉","content":"东临<b>碣石</b>，以观沧海。\\n水何<b>澹澹</b>，山岛<b>竦峙</b>。\\n树木丛生，百草丰茂。\\n秋风<b>萧瑟</b>，<b>洪波</b>涌起。\\n日月之行，若出其中；\\n星汉灿烂，若出其里。\\n幸甚至哉，歌以咏志。","translation":"向东登上碣石山，来观赏大海。\\n海水多么宽阔浩荡，山岛高高地耸立着。\\n树木郁郁葱葱，百草丰美茂盛。\\n秋风吹过树木发出悲凉的声音，巨大的波浪涌起。\\n日月的运行，好像都出自大海之中。\\n银河星光灿烂，好像都从大海里升起。\\n庆幸得很，好极了！就用这首歌来表达自己的志向。","pinyin":null,"annotation":"碣石：山名。\\n澹澹：水波荡漾的样子。\\n竦峙：耸立。\\n萧瑟：树木被秋风吹拂的声音。\\n洪波：巨大的波浪。\\n星汉：银河。\\n幸甚至哉：庆幸得很，好极了。","authorIntro":"曹操（155—220），字孟德，东汉末年政治家、军事家、文学家，三国时期曹魏政权的奠基者。","appreciation":"全诗借大海的壮阔景象抒发建功立业的抱负。“日月之行，若出其中；星汉灿烂，若出其里”运用想象和夸张，表现诗人开阔的胸襟和宏大的政治抱负。","extraJson":{"content_key":"8e1b121365e7","dynasty":"东汉","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["碣石","澹澹","竦峙","萧瑟","洪波"],"paragraph_count":1,"required_catalogs":[910001,910002]}},{"id":900086,"title":"闻王昌龄左迁龙标遥有此寄","author":"李白","genre":"古诗","dynasty":"唐","content":"杨花落尽<b>子规</b>啼，闻道龙标过五<b>溪</b>。\\n我寄愁心<b>与</b>明月，随君直到夜郎西。","translation":"杨花落尽，杜鹃鸟声声哀啼，我听说你被贬为龙标尉，要经过五溪。\\n我把忧愁的心思寄托给明月，希望它伴随你一直到夜郎以西。","pinyin":null,"annotation":"龙标：指王昌龄，古代官职或任所称谓。\\n子规：杜鹃鸟。\\n五溪：地名。\\n夜郎：古代地名。","authorIntro":"李白（701—762），字太白，号青莲居士，唐代浪漫主义诗人。","appreciation":"诗人借明月寄托对友人的关切，把无形的愁心化为可传递的情感，想象奇特，情真意切。","extraJson":{"content_key":"7b032d978367","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["子规","溪","与"],"paragraph_count":1,"required_catalogs":[]}},{"id":900087,"title":"次北固山下","author":"王湾","genre":"古诗","dynasty":"唐","content":"客路青山外，行舟绿水前。\\n潮平两岸阔，风正一帆<b>悬</b>。\\n海日<b>生</b>残夜，江春入旧年。\\n乡书何处达？归雁洛阳边。","translation":"旅途行驶在青山之外，船行在碧绿的江水之上。\\n潮水上涨，两岸与江水齐平，整个江面十分开阔。风势正顺，一面白帆高高悬挂。\\n海上的太阳在残夜将尽时升起，江南的春意在旧年未尽时已经到来。\\n寄出去的家书不知道什么时候到达？希望北归的大雁捎到洛阳。","pinyin":null,"annotation":"次：停宿。\\n客路：旅途。\\n潮平：潮水涨满。\\n海日：海上的太阳。\\n乡书：家信。","authorIntro":"王湾，唐代诗人。","appreciation":"诗中以行舟为线索，写江南春早和旅途所见；“海日生残夜，江春入旧年”以新旧交替寄寓积极向上的情思，末句转入思乡。","extraJson":{"content_key":"77f98ea204c6","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["悬","生"],"paragraph_count":1,"required_catalogs":[]}},{"id":900088,"title":"天净沙·秋思","author":"马致远","genre":"古诗","dynasty":"元","content":"<b>枯藤</b>老树<b>昏鸦</b>，小桥流水人家，古道西风<b>瘦</b>马。\\n夕阳西下，断肠人在天涯。","translation":"天色黄昏，一群乌鸦落在枯藤缠绕的老树上， 小桥下流水潺潺，小桥边庄户人家炊烟袅袅， 古道上一匹瘦马，顶着西风艰难地前行。\\n夕阳已经向西落下，只有孤独的旅人漂泊在遥远的地方。","pinyin":null,"annotation":"昏鸦：黄昏时的乌鸦。\\n断肠：形容悲痛到极点。\\n天涯：指远离家乡的地方。","authorIntro":"马致远（约1251—1321以后），号东篱，元代戏曲作家、散曲家。","appreciation":"作品用白描手法连缀九种景物，营造萧瑟苍凉的秋景，最后以“断肠人”点明游子思乡之情，意境深远。","extraJson":{"content_key":"6b360a6a2518","dynasty":"元","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["枯藤","昏鸦","瘦"],"paragraph_count":1,"required_catalogs":[]}},{"id":900089,"title":"峨眉山月歌","author":"李白","genre":"古诗","dynasty":"唐","content":"<b>峨眉</b>山月半轮秋，影入<b>平羌</b>江水流。\\n夜发清溪向三峡，思君不见下<b>渝州</b>。","translation":"半轮明月高悬在峨眉山上，月影倒映在平羌江水中随波流动。\\n夜间乘船从清溪出发驶向三峡，想念你却难以相见，只能顺流而下到渝州。","pinyin":null,"annotation":"峨眉山：在今四川峨眉山市。\\n平羌：青衣江的古称。\\n发：出发。\\n渝州：今重庆一带。","authorIntro":"李白，唐代浪漫主义诗人。","appreciation":"全诗五个地名随行舟展开，月亮既是眼前景，也是思念的寄托，构成清朗而悠远的意境。","extraJson":{"content_key":"f3855abb008a","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["峨眉","平羌","渝州"],"paragraph_count":1,"required_catalogs":[]}},{"id":900090,"title":"江南逢李龟年","author":"杜甫","genre":"古诗","dynasty":"唐","content":"岐王宅里寻常见，崔九堂前几度闻。\\n正是江南好风景，落花时节又<b>逢</b>君。","translation":"过去常在岐王宅里见到你，也多次在崔九堂前听到你的歌声。\\n现在正是江南风景最好的时候，却在落花时节又遇见了你。","pinyin":null,"annotation":"岐王：唐玄宗李隆范。\\n崔九：崔涤，排行第九。\\n落花时节：暮春，亦含身世飘零之意。","authorIntro":"杜甫（712—770），字子美，唐代现实主义诗人。","appreciation":"前两句追忆昔日相逢，后两句写今日重逢，以江南暮春的落花寄托对国事凋零、个人身世飘零的感慨。","extraJson":{"content_key":"a2b177ec8e83","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["逢"],"paragraph_count":1,"required_catalogs":[]}},{"id":900091,"title":"行军九日思长安故园","author":"岑参","genre":"古诗","dynasty":"唐","content":"强欲登高去，无人送酒来。\\n<b>遥怜</b>故园菊，应<b>傍</b>战场开。","translation":"重阳佳节我勉强想要按照习俗登高远眺，可在这战乱的行军途中，再也没有像当年给陶渊明送酒的友人那样，来为我送酒助兴。\\n我在远方深深怜惜着长安故园的菊花，它们此刻应该正寂寞地在战场的断壁残垣旁静静开放。","pinyin":null,"annotation":"强：勉强。\\n登高：重阳节习俗。\\n故园：故乡。\\n傍：靠近。","authorIntro":"岑参（约715—770），唐代边塞诗人。","appreciation":"诗人重阳登高而无人送酒，转而遥想故园菊花在战乱中开放，以想象写思乡忧国之情。","extraJson":{"content_key":"b45ff0bb6f66","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["遥怜","傍"],"paragraph_count":1,"required_catalogs":[]}},{"id":900092,"title":"夜上受降城闻笛","author":"李益","genre":"古诗","dynasty":"唐","content":"回乐<b>烽</b>前沙似雪，受降城外月如霜。\\n不知何处吹<b>芦管</b>，一夜征人尽望乡。","translation":"回乐烽前的沙地洁白得像雪，受降城外的月光有如秋霜。\\n不知道哪里吹响了芦笛，一夜之间出征的将士都在思念故乡。","pinyin":null,"annotation":"回乐烽：烽火台名。\\n受降城：古城名。\\n芦管：笛子。\\n征人：出征的将士。","authorIntro":"李益（约748—829），唐代边塞诗人。","appreciation":"前两句营造空旷寒冷的边塞月夜，后两句写笛声触发征人思乡，以声传情，含蓄深沉。","extraJson":{"content_key":"63d2ffd58886","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["烽","芦管"],"paragraph_count":1,"required_catalogs":[]}},{"id":900093,"title":"秋词（其一）","author":"刘禹锡","genre":"古诗","dynasty":"唐","content":"自古逢秋悲<b>寂寥</b>，我言秋日胜春朝。\\n晴空一鹤排云上，便引诗情到碧霄。","translation":"自古以来人们每逢秋天都悲叹萧条寂寥，我却认为秋天胜过明丽的春天。\\n万里晴空，一只鹤凌云而飞起，也引发我的诗兴飞到万里晴空。","pinyin":null,"annotation":"寂寥：空旷冷落。\\n春朝：春天的早晨，泛指春日。\\n排云：推开云层。\\n碧霄：蓝天。","authorIntro":"刘禹锡（772—842），字梦得，唐代文学家、哲学家。","appreciation":"诗人一反悲秋传统，以鹤冲云天的形象表达奋发进取、乐观旷达的精神。","extraJson":{"content_key":"c9b77ad0f2cc","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["寂寥"],"paragraph_count":1,"required_catalogs":[]}},{"id":900094,"title":"夜雨寄北","author":"李商隐","genre":"古诗","dynasty":"唐","content":"君问归期未有期，巴山夜雨<b>涨</b>秋池。\\n何当共剪西窗<b>烛</b>，却话巴山夜雨时。","translation":"你问我回家的日期，我还没有确定；此时巴山夜里下着大雨，秋池都涨满了。\\n什么时候我们才能共同在西窗下剪烛夜谈，回头追忆我今夜在巴山听雨时的这份思念。","pinyin":null,"annotation":"寄北：写诗寄给北方的妻子或友人。\\n何当：什么时候能够。\\n共剪西窗烛：指亲友相聚夜谈。","authorIntro":"李商隐（约813—约858），字义山，晚唐诗人。","appreciation":"以“巴山夜雨”统摄今昔，眼前的羁旅愁苦与未来团聚的想象相互映照，构思新巧，情深意长。","extraJson":{"content_key":"7a2c808b84ca","dynasty":"唐","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["剪烛","涨","烛"],"paragraph_count":1,"required_catalogs":[]}},{"id":900095,"title":"十一月四日风雨大作（其二）","author":"陆游","genre":"古诗","dynasty":"南宋","content":"<b>僵卧</b>孤村不自哀，尚思为国<b>戍</b>轮台。\\n夜阑卧听风吹雨，铁马冰河入梦来。","translation":"我直挺挺地躺在孤寂的乡村里，并不为自己的处境悲哀，还在想着替国家守卫边疆。\\n夜将尽时我躺在床上听着风雨声，梦见自己骑着披甲的战马跨过冰封的河流。","pinyin":null,"annotation":"僵卧：直挺挺地躺着。\\n戍：守卫。\\n轮台：古代边疆地名。\\n夜阑：夜深。\\n铁马：披着铁甲的战马。","authorIntro":"陆游（1125—1210），字务观，号放翁，南宋爱国诗人。","appreciation":"诗人虽年老闲居，仍心系国事；“铁马冰河入梦来”把现实风雨与杀敌报国的梦境融为一体，表现强烈的爱国情怀。","extraJson":{"content_key":"a6c11c261457","dynasty":"南宋","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["僵卧","戍"],"paragraph_count":1,"required_catalogs":[]}},{"id":900096,"title":"潼关","author":"谭嗣同","genre":"古诗","dynasty":"清","content":"终古高云<b>簇</b>此城，秋风吹散马蹄声。\\n河流大野犹嫌<b>束</b>，山入潼关不解平。","translation":"自古以来高高的云层聚集在这座雄关之上，秋风把马蹄声吹散。\\n黄河奔向辽阔的原野还嫌受到约束，群山进入潼关也不知什么叫平坦。","pinyin":null,"annotation":"潼关：关名，在今陕西潼关。\\n终古：久远。\\n簇：聚集。\\n束：约束。","authorIntro":"谭嗣同（1865—1898），字复生，号壮飞，近代维新派政治家、思想家。","appreciation":"诗人用高云、秋风、河流和群山写潼关的雄奇险峻，借“犹嫌束”“不解平”表现冲决罗网、追求解放的少年气概。","extraJson":{"content_key":"671c555f496c","dynasty":"清","school_stage":"初中","preview_title":"理解与背诵","emphasis_words":["簇","束"],"paragraph_count":1,"required_catalogs":[]}},{"id":900097,"title":"活板","author":"沈括","genre":"文言文","dynasty":"北宋","content":"板印书籍，唐人尚未盛为之。自冯瀛王始印五经，已后典籍皆为板本。##庆历中，有布衣毕昇，又为活板。\\n其法：用胶泥刻字，薄如钱唇，每字为一印，火烧令坚。\\n先设一铁板，其上以松脂、蜡和纸灰之类冒之。\\n欲印，则以一铁范置铁板上，乃密布字印，满铁范为一板，持就火<b>炀</b>之；药稍镕，则以一平板按其面，则字平如<b>砥</b>。\\n若止印三二本，未为简易；若印数十百千本，则极为神速。\\n常作二铁板，一板印刷，一板已自布字，此印者才毕，则第二板已具，更互用之，瞬息可就。\\n每一字皆有数印，如“之”“也”等字，每字有二十余印，以备一板内有重复者。\\n不用，则以纸<b>帖</b>之，每韵为一<b>帖</b>，木格贮之。\\n有奇字素无备者，<b>旋</b>刻之，以手拂之，其印自落，殊不沾污。\\n不用木料刻字的原因，是木纹有疏有密，沾水后就高低不平，并且和混合物粘在一起，不容易取出来；不像火烧过的胶泥字，印完后再用火烤使混合物熔化，拿手一抹，这些字模就会自己落下来，绝不会被弄脏。##昇死，其印为予群从所得，至今保藏。","translation":"用雕版印刷书籍，唐朝人还没有大规模地这么做。\\n从冯瀛王（冯道）开始用雕版印刷五经，以后的经典文献就都是雕版印刷的本子了。##庆历年间，有一个平民叫毕昇，又发明了活字印刷。\\n他的方法是：用胶泥刻字，字模薄得像铜钱的边缘，每个字刻一个印，用火烧使它坚硬。\\n先设置一块铁板，在铁板上用松脂、蜡和纸灰之类覆盖。\\n要印刷时，就把一个铁框放在铁板上，然后密密地排布字印，\\n排满一铁框就是一版，拿到火上烘烤；\\n药物稍稍熔化，就用一块平板按在字印表面，于是字印平整得像磨刀石。\\n如果只印两三本，还不能算简便；\\n如果印几十乃至成百上千本，就非常迅速了。\\n通常制作两块铁板，一块印刷，另一块已经另外排好字；\\n这一块印完，第二块已经准备好了，交替使用，很短时间就能完成。\\n每一个字都有好几个印模，像“之”“也”等字，每个字有二十多个印模，用来准备同一版内有重复的字。\\n遇到平时没有准备的生僻字，随即刻制，用草烧火烘烤，很快就能制成功。\\n不用木料刻字的原因，是木纹有疏有密，沾水后就高低不平，并且和混合物粘在一起，不容易取出来；\\n不像火烧过的胶泥字，印完后再用火烤使混合物熔化，拿手一抹，这些字模就会自己落下来，绝不会被弄脏。##毕昇死后，他的字模被我的堂兄弟和侄辈取得，到今天还珍藏着。","pinyin":null,"annotation":"布衣：平民。\\n冒：覆盖。\\n炀：烘烤。\\n砥：磨刀石。\\n帖：标签。\\n旋：立即。","authorIntro":"沈括，北宋科学家、政治家。","appreciation":"文章介绍毕昇活字印刷术的制作、印刷、贮存和传承方法，说明了活字印刷的高效与便捷。","extraJson":{"content_key":"5c98435767ec","dynasty":"北宋", 无信 ##；## 对子骂父## ，## 则是无礼 ##。"},{"poemId":900016,"sort":2,"stem":"《陈太丘与友期行》中，交代故事起因的句子是：“##陈太丘与友期行##，##期日中##。## 过中不至 ##，##太丘舍去##。”"},{"poemId":900016,"sort":3,"stem":"《陈太丘与友期行》中，机智的元方斥责“友人”无信的句子是：##日中不至##，## 则是无信 ##。"},{"poemId":900016,"sort":4,"stem":"《陈太丘与友期行》中，元方指出友人 “无礼” 的句子是：##对子骂父##，## 则是无礼 ##。"},{"poemId":900016,"sort":5,"stem":"《陈太丘与友期行》一文中，陈太丘丢下友人离开的原因是：##过中不至##。"},{"poemId":900016,"sort":6,"stem":"《陈太丘与友期行》中元方最后的表现是：## 元方入门不顾 ##。"},{"poemId":900016,"sort":7,"stem":"《陈太丘与友期行》中元方应对得体，据理力争的句子是：## 日中不至## ，## 则是无信 ##；## 对子骂父## ，## 则是无礼 ##。"},{"poemId":900016,"sort":8,"stem":"《陈太丘与友期行》中，表明元方不愿原谅父亲友人的句子是：## 元方入门不顾 ##。"},{"poemId":900016,"sort":9,"stem":"《陈太丘与友期行》中，友人发怒责问的句子是：## 非人哉 ##！## 与人期行## ，## 相委而去## 。"},{"poemId":900016,"sort":10,"stem":"在《陈太丘与友期行》一文中，含有谦辞的句子是：## 君与家君期日中## 。"},{"poemId":900017,"sort":1,"stem":"最近班级的学习状态有些浮躁，为了规劝同学们静心学习，宣传委员想从《诫子书》中选取一句话写在墙报上。你建议他选取的一句是：## 非淡泊无以明志 ##。"},{"poemId":900017,"sort":2,"stem":"诸葛亮在《诫子书》中用“## 非学无以广才 ##，## 非志无以成学 ##”这两句话来强调“志”与学习、成才的关系。"},{"poemId":900017,"sort":3,"stem":"《诫子书》中阐述放纵懈怠和浮躁对人修身养性产生不利影响的句子是：## 淫慢则不能励精 ##，##  险躁则不能治性 ##。"},{"poemId":900017,"sort":4,"stem":"方向迷失时，读诸葛亮的《诫子书》，从 “## 非淡泊无以明志 ##，## 非宁静无以致远 ##” 中领悟恬淡自守、宁静专一才能达到高远境界的智慧。"},{"poemId":900017,"sort":5,"stem":"《诫子书》告诉我们要珍惜时间的句子是：##年与时驰##，##意与日去##。"},{"poemId":900017,"sort":6,"stem":"书法创作意在墨香间涵养从容心境，实现志存高远的精神追求，《诫子书》中与此有异曲同工之妙的句子是：## 非淡泊无以明志 ##，## 非宁静无以致远 ##。"},{"poemId":900017,"sort":7,"stem":"《诫子书》中阐述过度享乐和急躁会对人修身养性产生不利影响的句子是：## 淫慢则不能励精 ##，##  险躁则不能治性 ##。"},{"poemId":900017,"sort":8,"stem":"《诫子书》中有两句话常被人们当作 “志存高远” 的座右铭，这两句话是 “## 非淡泊无以明志 ##，## 非宁静无以致远 ##”。"},{"poemId":900017,"sort":9,"stem":"对那些心气浮躁、生活铺张浪费的人，我们可以用《诫子书》中的“ ##静以修身##，##俭以养德##”两句来劝勉他们。"},{"poemId":900017,"sort":10,"stem":"谆谆教诲，诸葛亮劝勉儿子：“## 非淡泊无以明志 ##，## 非宁静无以致远 ##”（《诫子书》），双重否定句强调修身养性要从淡泊宁静处下功夫。"},{"poemId":900017,"sort":11,"stem":"《诫子书》中，作者开篇即以“君子之行”这种高标准的道德规范来要求儿子的句子是：##静以修身##，##俭以养德##。"},{"poemId":900017,"sort":12,"stem":"在《诫子书》中，诸葛亮用 “## 非学无以广才 ##，## 非志无以成学 ##” 论述了学习、成才、立志三者的关系。"},{"poemId":900017,"sort":13,"stem":"诸葛亮在《诫子书》中开篇就明确君子立身行事的核心准则，强调依靠宁静心绪修养身心、凭借节俭作风培养品德的句子是 “## 静以修身 ##，## 俭以养德 ##”；并指出治学与心境、才能关系密切，说明学习必须依赖宁静心境，而才能的获得离不开学习的句子是 “## 夫学须静也 ##，## 才须学也 ##”；最后以 “困守陋室、悔恨已晚” 的情景警示人珍惜时光、积极进取的句子是 “## 悲守穷庐 ##，## 将复何及 ##”。"},{"poemId":900017,"sort":14,"stem":"《诫子书》中体现作者核心观点的句子是：##静以修身##，##俭以养德##。"},{"poemId":900017,"sort":15,"stem":"《诫子书》中表现“躁”的危害的语句是：##  险躁则不能治性 ##。"},{"poemId":900017,"sort":16,"stem":"诸葛亮在《诫子书》中劝勉儿子成为君子应做到“##静以修身##，##俭以养德##”。"},{"poemId":900017,"sort":17,"stem":"《诫子书》中阐释享乐放纵对人修身养性产生不利影响的句子是：## 淫慢则不能励精 ##，##  险躁则不能治性 ##。"},{"poemId":900017,"sort":18,"stem":"《诫子书》中阐明“志”与“学”关系的句子是：## 非志无以成学 ##。"},{"poemId":900017,"sort":19,"stem":"《诫子书》中具体阐述“静以修身”之“静”的重要性的两句话分别是“## 非宁静无以致远 ##”“## 夫学须静也 ##”。"},{"poemId":900017,"sort":20,"stem":"“读书”主题班会中，班主任借用《诫子书》中“## 淫慢则不能励精 ##，##  险躁则不能治性 ##”这两句话，告诫同学们读书治学最忌放纵怠慢和心态浮躁。"},{"poemId":900018,"sort":1,"stem":"《狼》中，写屠户晚归时，途中被两狼跟踪的句子是：“## 途中两狼## ，## 缀行甚远 ##。”"},{"poemId":900018,"sort":2,"stem":"《狼》中，写屠户害怕、把骨头扔给狼的句子是：“##屠惧##，## 投以骨 ##。”"},{"poemId":900018,"sort":3,"stem":"《狼》中，写骨头扔完而两狼仍紧追不舍的句子是：“## 骨已尽矣 ##，##而两狼之并驱如故##。”"},{"poemId":900018,"sort":4,"stem":"《狼》中，写屠户奔靠柴草堆、放下担子拿起屠刀的句子是：“##屠乃奔倚其下##，## 弛担持刀 ##。”"},{"poemId":900018,"sort":5,"stem":"《狼》中，写两狼不敢上前、瞪眼朝着屠户的句子是：“##狼不敢前##，## 眈眈相向 ##。”"},{"poemId":900018,"sort":6,"stem":"《狼》中，写一狼径直走开、另一狼像狗一样蹲坐在前面的句子是：“##少时##，##一狼径去##，##其一犬坐于前 ##。”"},{"poemId":900018,"sort":7,"stem":"《狼》中，写屠户突然跃起、挥刀劈向狼头的句子是：“##屠暴起##，## 以刀劈狼首 ##，##又数刀毙之##。”"},{"poemId":900018,"sort":8,"stem":"《狼》中，写屠户转到柴草堆后、砍断狼腿的句子是：“##屠自后断其股##，## 亦毙之 ##。”"},{"poemId":900018,"sort":9,"stem":"《狼》中，写屠户醒悟到前面那狼是假装睡觉来诱敌的句子是：“##乃悟前狼假寐 ##，##盖以诱敌##。”"},{"poemId":900018,"sort":10,"stem":"《狼》中，揭示主旨、讥讽狼虽狡诈终被杀的句子是：“##狼亦黠矣##，##而顷刻两毙##，## 禽兽之变诈几何哉 ##？##止增笑耳##。”"},{"poemId":900018,"sort":11,"stem":"《狼》中，描写狼“犬坐于前”的神态的句子是“##目似瞑##，##意暇甚##”。"},{"poemId":900018,"sort":12,"stem":"《狼》中，最能表现屠户勇敢的句子是“##屠暴起##，##以刀劈狼首##，## 又数刀毙之 ##”。"},{"poemId":900018,"sort":13,"stem":"《狼》中，“一狼径去”的目的是“## 意将隧入以攻其后也 ##”。"},{"poemId":900018,"sort":14,"stem":"《狼》中，蒲松龄在《狼》中，对狼的狡猾进行嘲讽的句子是“## 禽兽之变诈几何哉 ##？##止增笑耳##”。"},{"poemId":900018,"sort":15,"stem":"《狼》一文中表现狼狡猾的句子是：##一狼洞其中##，##意将隧入以攻其后也##。"},{"poemId":900019,"sort":1,"stem":"《穿井得一人》中，交代丁家打井原因的句子是：“##宋之丁氏##，##家无井而出溉汲 ##，##常一人居外##。”"},{"poemId":900019,"sort":2,"stem":"《穿井得一人》中，写丁家因无井而需专人外出打水的句子是：“ ##常一人居外 ##。”"},{"poemId":900019,"sort":3,"stem":"《穿井得一人》中，丁氏打井后告诉别人的话是：“## 吾穿井得一人 ##。”"},{"poemId":900019,"sort":4,"stem":"《穿井得一人》中，写消息被讹传的句子是：## 有闻而传之者曰## ：“## 丁氏穿井得一人 ##。”"},{"poemId":900019,"sort":5,"stem":"《穿井得一人》中，写国人议论纷纷、消息传到宋君那里的句子是：“## 国人道之 ##，##闻之于宋君##。”"},{"poemId":900019,"sort":6,"stem":"《穿井得一人》中，说明传言最终传到国君耳中的句子是：“## 闻之于宋君 ##。”"},{"poemId":900019,"sort":7,"stem":"《穿井得一人》中，写宋君派人向丁氏询问的句子是：“ ##宋君令人问之于丁氏 ##。”"},{"poemId":900019,"sort":8,"stem":"《穿井得一人》中，丁氏澄清事实的话是：“## 得一人之使 ##， ##非得一人于井中也 ##。”"},{"poemId":900019,"sort":9,"stem":"《穿井得一人》中，说明丁氏打井得到的只是一个人的劳力的句子是：“## 得一人之使 ##， ##非得一人于井中也 ##。”"},{"poemId":900019,"sort":10,"stem":"《穿井得一人》中，揭示主旨、告诫人们不可轻信传闻的句子是：“## 求闻之若此 ##， ##不若无闻也 ##。”"},{"poemId":900019,"sort":11,"stem":"《穿井得一人》中，丁家打完井后，随口说出引发后续全城误会的那句话是：##吾穿井得一人##。"},{"poemId":900019,"sort":12,"stem":"《穿井得一人》一文中作者以议论作结，点明故事的寓意的句子是“## 求闻之若此 ##， ##不若无闻也 ##”。"},{"poemId":900019,"sort":13,"stem":"因为丁氏原本“##家无井而出灌汲##，##常一人居外##”，所以穿井后可以“##得一人之使##”。而他所说的“##吾穿井得一人##”的本意就是“得一人之使”，而非国人所误会的“##得一人于井中也##”。"},{"poemId":900019,"sort":14,"stem":"《穿井得一人》中，直接点明对待传闻要审慎甄别，揭示全文核心寓意的主旨句是：##求闻之若此##，##不若无闻也##。"},{"poemId":900019,"sort":15,"stem":"《穿井得一人》中，丁氏向宋君派来的使者澄清事件真相的句子是：##得一人之使##，##非得一人于井中也##。"},{"poemId":900020,"sort":1,"stem":"《杞人忧天》中，写杞国人担忧天地崩塌、无处寄身而寝食不安的句子是：“##杞国有人忧天地崩坠 ##，##身亡所寄##，##废寝食者##。”"},{"poemId":900020,"sort":2,"stem":"《杞人忧天》中，写有人为杞人的忧愁而忧愁、前去开导他的句子是：“##又有忧彼之所忧者##，## 因往晓之 ##。”"},{"poemId":900020,"sort":3,"stem":"《杞人忧天》中，开导者解释天只是积聚的气体的句子是：“##天##，## 积气耳 ##，##亡处亡气##。”"},{"poemId":900020,"sort":4,"stem":"《杞人忧天》中，说明天无处没有气的句子是：“ ##亡处亡气 ##。”"},{"poemId":900020,"sort":5,"stem":"《杞人忧天》中，开导者说明人整天在天中活动呼吸的句子是：“## 若屈伸呼吸 ##， ##终日在天中行止 ##， ##奈何忧崩坠乎 ##？”"},{"poemId":900020,"sort":6,"stem":"《杞人忧天》中，开导者解释日月星宿也不过是积气中发光之物的句子是：“ ##日月星宿 ##，## 亦积气中之有光耀者 ##， ##只使坠 ##， ##亦不能有所中伤 ##。”"},{"poemId":900020,"sort":7,"stem":"《杞人忧天》中，开导者解释地只是堆积的土块的句子是：“ ##地 ##，## 积块耳 ##， ##充塞四虚 ##， ##亡处亡块 ##。”"},{"poemId":900020,"sort":8,"stem":"《杞人忧天》中，开导者说明人整天在地上行走踩踏的句子是：“##若躇步跐蹈 ##， ##终日在地上行止 ##， ##奈何忧其坏 ##？”"},{"poemId":900020,"sort":9,"stem":"《杞人忧天》中，写杞人听罢开导后放下心来、非常高兴的句子是：“##其人舍然大喜 ##，##晓之者亦舍然大喜##。”"},{"poemId":900020,"sort":10,"stem":"《杞人忧天》中，写杞人担心大地陷落的疑问句是：“## 奈何忧其坏 ##？”"},{"poemId":900021,"sort":1,"stem":"《<论语> 十二章》中论述学习和思考的辩证关系的语句是：## 学而不思则罔 ##，## 思而不学则殆 ##。"},{"poemId":900021,"sort":2,"stem":"《<论语> 十二章》中感叹时光易逝，勉励弟子珍惜时光的语句是 “## 逝者如斯夫 ##，## 不舍昼夜 ##”。"},{"poemId":900021,"sort":3,"stem":"阅读《论语》能领悟许多学习之道。读到 “## 学而不思则罔 ##，## 思而不学则殆 ##”，我们懂得要把 “学” 与 “思” 结合起来；再读到 “##知之者不如好之者##，## 好之者不如乐之者 ##”，我们懂得以学为乐是求知的最高境界。"},{"poemId":900021,"sort":4,"stem":"为了表达 “只要谦虚求教，到处都有老师” 的观点，同学们可以引用《论语》十二章中孔子的话: “## 三人行 ##, ## 必有我师焉 ##。”"},{"poemId":900021,"sort":5,"stem":"《〈论语〉十二章》中体现真正有修养的君子应具有的风格的句子是：## 人不知而不愠 ##，## 不亦君子乎 ##。"},{"poemId":900021,"sort":6,"stem":"《论语》体现了孔子的教育智慧。“## 博学而笃志 ##，## 切问而近思 ##”，教育我们要广泛学习且志向坚定；“## 学而不思则罔 ## ## 思而不学则殆 ##”，教育我们要将学与思结合起来。"},{"poemId":900021,"sort":7,"stem":"六年小学时光匆匆而逝，有同学不禁发问：时间都去哪了？此时，你不由得想起孔子在河边的感叹：“## 逝者如斯夫 ##，## 不舍昼夜 ##。”"},{"poemId":900021,"sort":8,"stem":"《<论语> 十二章》中，孔子在学习和做人方面的教诲对我们当代人都有很大启发。如 “## 知之者不如好之者 ##，## 好之者不如乐之者 ##” 一章就强调了兴趣对学习的重要性。"},{"poemId":900021,"sort":9,"stem":"《（论语〉十二章》中 “## 吾十有五而志于学 ##” 启示人们立志向学，“##三军可夺帅也##，## 匹夫不可夺志也 ##” 激励人们坚定志向，“## 博学而笃志 ##，##切问而近思##” 鼓励人们务实求索。"},{"poemId":900021,"sort":10,"stem":"《＜论语＞十二章》中指出反复温习的作用的句子是：## 温故而知新 ##，## 可以为师矣 ##。"},{"poemId":900021,"sort":11,"stem":"《〈论语〉十二章》中，从学习的角度谈论 “仁” 的句子是 ## 博学而笃志 ##，## 切问而近思 ##，## 仁在其中矣 ##。"},{"poemId":900021,"sort":12,"stem":"想要成为别人的老师，需要具备通过复习旧知识获得新感悟的能力，《〈论语〉十二章》中对应的句子是：## 温故而知新 ##，## 可以为师矣 ##。"},{"poemId":900021,"sort":13,"stem":"学无常师，人应该随时随地注意向他人学习，因为“## 三人行 ##，## 必有我师焉 ##。”"},{"poemId":900021,"sort":14,"stem":"《〈论语〉十二章》中论述达到儒家所追求的“仁”的途径是：## 博学而笃志 ##，## 切问而近思 ##。"},{"poemId":900021,"sort":15,"stem":"《〈论语〉十二章》告诉我们：面对别人的不了解甚至误会，我们应该”## 人不知而不愠 ##，## 不亦君子乎 ##“。"},{"poemId":900021,"sort":16,"stem":"《〈论语〉十二章》中告诉人们，学习的时候要把新旧知识相结合的句子是：“ ## 温故而知新 ##，## 可以为师矣 ##。”"},{"poemId":900021,"sort":17,"stem":"《〈论语〉十二章》中告诫我们既要善于从正面学习，也要善于从反面借鉴的句子是：## 择其善者而从之 ##，## 其不善者而改之 ##。"},{"poemId":900021,"sort":18,"stem":"《〈论语〉十二章》中论述君子对富贵的正确态度的句子是： ## 不义而富且贵 ##，## 于我如浮云 ##。"},{"poemId":900021,"sort":19,"stem":"“ ## 三军可夺帅也  ##，## 匹夫不可夺志也 ## ”。越是困难面前、重压之下，我们越要用《〈论语〉十二章》中的句子来勉励自己要坚定信心，咬定目标，奋力拼搏，攻破难关。"},{"poemId":900021,"sort":20,"stem":"《〈论语〉十二章》中，孔子用递进式的人生阶段总结，点明人到四十能摆脱外界事物迷惑的相关语句是：##吾十有五而志于学##，##三十而立##，##四十而不惑##。"},{"poemId":900022,"sort":1,"stem":"《孙权劝学》中，孙权劝吕蒙学习的句子是：“##卿今当涂掌事##，## 不可不学 ##！”"},{"poemId":900022,"sort":2,"stem":"《孙权劝学》中，吕蒙以军中事务繁多来推托的句子是：“##蒙辞以军中多务 ##。”"},{"poemId":900022,"sort":3,"stem":"《孙权劝学》中，点明孙权劝学原因的句子是：“## 卿今当涂掌事 ##，##不可不学##！”"},{"poemId":900022,"sort":4,"stem":"《孙权劝学》中，孙权表明自己并非要吕蒙研究儒家经典、只要求粗略阅读的句子是：“##孤岂欲卿治经为博士邪##！## 但当涉猎 ##，##见往事耳##。”"},{"poemId":900022,"sort":5,"stem":"《孙权劝学》中，孙权现身说法、以自己常读书受益来劝导吕蒙的句子是：“##卿言多务##，##孰若孤##？## 孤常读书 ##，##自以为大有所益##。”"},{"poemId":900022,"sort":6,"stem":"《孙权劝学》中，写吕蒙开始学习的句子是：“## 蒙乃始就学 ##。”"},{"poemId":900022,"sort":7,"stem":"《孙权劝学》中，鲁肃与吕蒙议论后大惊、赞叹其才干进步的句子是：“##卿今者才略##，## 非复吴下阿蒙 ##！”"},{"poemId":900022,"sort":8,"stem":"《孙权劝学》中，吕蒙回答鲁肃、表明自己已有长进的句子是：“## 士别三日 ##，##即更刮目相待##。”"},{"poemId":900022,"sort":9,"stem":"《孙权劝学》中，吕蒙强调要用发展的眼光看人的句子是：“##士别三日##，## 即更刮目相待 ##。”"},{"poemId":900022,"sort":10,"stem":"《孙权劝学》中，写鲁肃与吕蒙结为好友的句子是：“##肃遂拜蒙母##，## 结友而别 ##。”"},{"poemId":900022,"sort":11,"stem":"《孙权劝学》中，孙权开门见山点明吕蒙身居要职，必须坚持学习的劝学核心句是：##卿今当涂掌事##，##不可不学##。"},{"poemId":900022,"sort":12,"stem":"《孙权劝学》中没有直接描写吕蒙的进步，而是通过鲁肃的“大惊”和他所说的话表现出来，这两句是：##卿今者才略##，## 非复吴下阿蒙 ##!"},{"poemId":900022,"sort":13,"stem":"《孙权劝学》中从“##士别三日##，## 即更刮目相待 ##”可看出吕蒙对自己的进步相当自信。"},{"poemId":900022,"sort":14,"stem":"《孙权劝学》中，鲁肃路过寻阳与吕蒙交谈后，惊叹吕蒙才干谋略已今非昔比的句子是：##卿今者才略##，##非复吴下阿蒙##。"},{"poemId":900022,"sort":15,"stem":"《孙权劝学》中，吕蒙调侃鲁肃知晓事物变化反应太慢的收尾句是：##大兄何见事之晚乎##。"},{"poemId":900023,"sort":1,"stem":"《木兰诗》中，“## 愿驰千里足 ##，## 送儿还故乡 ##” 一句，写出木兰凯旋后归心似箭，令人动容。"},{"poemId":900023,"sort":2,"stem":"《木兰诗》中运用 “互文” 手法写出了战斗的紧张激烈，战士伤亡惨重的诗句是 “## 将军百战死 ##，## 壮士十年归 ##”。"},{"poemId":900023,"sort":3,"stem":"《木兰诗》中展现木兰战场生活艰难苦寒的对偶句是：## 朔气传金柝 ##，## 寒光照铁衣 ##。"},{"poemId":900023,"sort":4,"stem":"《木兰诗》中说明战争旷日持久，战斗激烈，且概括了多年征战经历的句子是：## 将军百战死 ##，## 壮士十年归 ##。"},{"poemId":900023,"sort":5,"stem":"《木兰诗》中运用夸张手法描写木兰万里迢迢奔往战场时矫健英姿的句子是：## 万里赴戎机 ##，## 关山度若飞 ##。"},{"poemId":900023,"sort":6,"stem":"“声音” 可以使诗词的意境更加丰富。“## 不闻机杼声 ##，##唯闻女叹息##”（《木兰诗》）中的叹息声，仿佛让我们看到了停机长叹、忧愁苦闷的木兰。"},{"poemId":900023,"sort":7,"stem":"木兰在无长兄应征的困境下，以 “## 愿为市鞍马 ##，##从此替爷征##” 展现出孝亲爱国的强大决心。"},{"poemId":900023,"sort":8,"stem":"《木兰诗》中，“## 愿驰千里足 ##，## 送儿还故乡 ##” 一句，写出木兰凯旋后归心似箭，令人动容。"},{"poemId":900023,"sort":9,"stem":"有诗云：醉卧沙场君莫笑，古来征战几人回。《木兰诗》中与之相似的两句诗是：## 将军百战死 ##，## 壮士十年归 ##。"},{"poemId":900023,"sort":10,"stem":"《木兰诗》中体现木兰功勋卓著的诗句是：## 策勋十二转 ##，## 赏赐百千强 ##。"},{"poemId":900023,"sort":11,"stem":"《木兰诗》中体现木兰聪明的句子是“## 雄兔脚扑朔 ##，##雌兔眼迷离##”。"},{"poemId":900023,"sort":12,"stem":"《木兰诗》夸张地表现木兰身跨战马飞越层峦奔赴战场的诗句是：## 万里赴戎机 ##，## 关山度若飞 ##。"},{"poemId":900023,"sort":13,"stem":"《木兰诗》中描写木兰十年百战凯旋而归后最大心愿的句子是：## 愿驰千里足 ##，## 送儿还故乡 ##。"},{"poemId":900023,"sort":14,"stem":"成语“扑朔迷离”出自《木兰诗》，其原话是：## 雄兔脚扑朔 ##，##雌兔眼迷离##。"},{"poemId":900023,"sort":15,"stem":"《木兰诗》中写木兰出征前紧张、周密准备的句子是：##东市买骏马##，##西市买鞍鞯##，##南市买辔头##，##北市买长鞭##。"},{"poemId":900023,"sort":16,"stem":"阅读诗文能“养气”。读《木兰诗》“##愿为市鞍马##，##从此替爷征##”，能涵养深明大义的担当之气。"},{"poemId":900023,"sort":17,"stem":"《木兰诗》中从侧面反映木兰战功显赫的诗句是：## 策勋十二转 ##，## 赏赐百千强 ##。"},{"poemId":900023,"sort":18,"stem":"《木兰诗》中描写木兰在军营艰苦战斗生活（夜晚军营戒备场景）的句子是 “## 朔气传金柝 ##，## 寒光照铁衣 ##”。"},{"poemId":900023,"sort":19,"stem":"《木兰诗》中描写夜晚军营戒备场景，突出木兰战地生涯艰苦的诗句是 “## 朔气传金柝 ##，## 寒光照铁衣 ##”。"},{"poemId":900023,"sort":20,"stem":"《木兰诗》中既表现军务紧急，行军迅速，又突出木兰矫健英姿的句子是：## 万里赴戎机 ##，## 关山度若飞 ##。"},{"poemId":900024,"sort":1,"stem":"《陋室铭》中，写陋室主人德行美好的句子是：## 斯是陋室 ##，## 惟吾德馨 ##。"},{"poemId":900024,"sort":2,"stem":"《陋室铭》中表现作者对那些官僚们寻欢作乐生活的鄙弃，对官场的厌倦的语句是：## 无丝竹之乱耳 ##，##无案牍之劳形##。"},{"poemId" m":"王安石登上飞来峰，用一句 “## 不畏浮云遮望眼 ##，## 自缘身在最高层 ##” 表现了不畏奸邪、锐意进取的勇气和决心。"},{"poemId":900028,"sort":6,"stem":"《登飞来峰》中，借助传闻里鸡鸣时分在塔顶能看见旭日东升的场景，从侧面烘托飞来峰高入云端的诗句是：##闻说鸡鸣见日升##。"},{"poemId":900028,"sort":7,"stem":"古人喜登高抒怀。王安石《登飞来峰》中的 “##不畏浮云遮望眼##，## 自缘身在最高层 ##” 蕴含深刻的人生哲理。"},{"poemId":900028,"sort":8,"stem":"“## 不畏浮云遮望眼 ##”表现了不畏奸邪的勇气和决心。"},{"poemId":900028,"sort":9,"stem":"王安石在《登飞来峰》一诗中直抒胸臆，表现变法革新政治理想的诗句是：“##不畏浮云遮望眼##，## 自缘身在最高层 ##”，同时也表现了作者大无畏的精神。"},{"poemId":900028,"sort":10,"stem":"王安石《登飞来峰》中富有哲理地表达自己锐意改革的远大抱负的诗句是：##不畏浮云遮望眼##，## 自缘身在最高层 ##。"},{"poemId":900029,"sort":1,"stem":"在《游山西村》中，常用来形容在困境中坚持，终将迎来转机（以景寓理）的诗句是 “## 山重水复疑无路 ##，## 柳暗花明又一村 ##”。"},{"poemId":900029,"sort":2,"stem":"翻开历史长卷，不难看出酒与文人墨客的不解之缘。酒中有真情，如《游山西村》中的：##莫笑农家腊酒浑##，##丰年留客足鸡豚##。"},{"poemId":900029,"sort":3,"stem":"在机器人迷宫挑战中，小兴设计的程序多次在复杂弯道处陷入 “死循环”，正当他打算放弃时，队友小鸣提出用传感器重新定位的新思路。经过调试，机器人顺利抵达终点。这让小兴不禁想起陆游《游山西村》中的诗句 “## 山重水复疑无路 ##，## 柳暗花明又一村 ##”。"},{"poemId":900029,"sort":4,"stem":"陆游《游山西村》一诗中描绘乡村社日前夕的热闹场面，表现诗人对民风民俗赞美之情的诗句是：##箫鼓追随春社近##，##衣冠简朴古风存##。"},{"poemId":900029,"sort":5,"stem":"科学家在研究中，有时会陷入重重困境，不断进行新的探索，也许就会和灵感相遇，另辟蹊径，解决问题。就像陆游《游山西村》中说的 “## 山重水复疑无路 ##，## 柳暗花明又一村 ##”。"},{"poemId":900029,"sort":6,"stem":"《游山西村》中“##从今若许闲乘月##，##拄杖无时夜叩门##”一句表达了诗人对山村迷人景色、淳朴民风的恋恋不舍之情和再次造访的愿望。"},{"poemId":900029,"sort":7,"stem":"《游山西村》中的 “## 山重水复疑无路 ##，## 柳暗花明又一村 ##” 表明了诗人虽遇挫折，却心存希望的积极人生态度（蕴含丰富人生哲理的千古名句）。"},{"poemId":900029,"sort":8,"stem":"苏轼《蝶恋花·密州上元》说：“击鼓吹箫，却入农桑社。”陆游在《游山西村》中更以“##箫鼓追随春社近##，##衣冠简朴古风存##”赞美着这个古老的乡土风俗，显示出他对吾土吾民之爱。"},{"poemId":900029,"sort":9,"stem":"人生的道路是曲折的，我们经常会面临生活的艰难，陷入情绪的低谷。此时，你可以用陆游《游山西村》中的名句 “## 山重水复疑无路 ##，## 柳暗花明又一村 ##” 来激励自己。"},{"poemId":900029,"sort":10,"stem":"《游山西村》中体现村民淳朴真诚、丰收后热情待客的两句诗是“##箫鼓追随春社近##，##衣冠简朴古风存##”。"},{"poemId":900030,"sort":1,"stem":"龚自珍《己亥杂诗（其五）》中用落花喻人，表现诗人虽脱离官场，仍关心国家前途和命运、表达对理想和信念执着追求的句子是 “## 落红不是无情物 ##，## 化作春泥更护花 ##”。"},{"poemId":900030,"sort":2,"stem":"《己亥杂诗》中表达诗人辞官离京与朋友分别的依依不舍之情的诗句是：##浩荡离愁白日斜##，##吟鞭东指即天涯##。"},{"poemId":900030,"sort":3,"stem":"“落花” 这一意象，龚自珍在《己亥杂诗》中，借 “落红不是无情物，## 化作春泥更护花 ##”，表现自己虽脱离官场，但仍关心国家命运的奉献精神。"},{"poemId":900030,"sort":4,"stem":"龚自珍在辞官离京归乡之时，用 “## 落红不是无情物 ##，## 化作春泥更护花 ##” 流露出发挥余热、无私奉献的一片深情。"},{"poemId":900030,"sort":5,"stem":"《己亥杂诗（其五）》中，龚自珍极力渲染辞官离京时内心汹涌绵长的离愁，同时点明日暮时分送别场景的诗句是：##浩荡离愁白日斜##，##吟鞭东指即天涯##。"},{"poemId":900030,"sort":6,"stem":"《己亥杂诗》中诗人从大自然生生不息的规律中得到启发，富有哲理的句是“## 落红不是无情物 ##，## 化作春泥更护花 ##”。"},{"poemId":900030,"sort":7,"stem":"《己亥杂诗（其五）》中，完整勾勒出诗人满载离愁、在夕阳下扬鞭远赴天涯的辞官离京全过程的诗句是：##浩荡离愁白日斜##，##吟鞭东指即天涯##。"},{"poemId":900030,"sort":8,"stem":"《己亥杂诗（其五）》中，突破传统文人见花落泪的悲秋格调，赋予落花积极奉献全新内涵的核心哲理句是：##落红不是无情物##，##化作春泥更护花##。"},{"poemId":900030,"sort":9,"stem":"《己亥杂诗（其五）》中，诗人扬起马鞭向东望去，前路漫漫仿佛延伸到天涯尽头，写出辞官离京时洒脱又复杂心境的诗句是：##吟鞭东指即天涯##。"},{"poemId":900030,"sort":10,"stem":"《己亥杂诗》中的 “## 落红不是无情物 ##，## 化作春泥更护花 ##” 两句以落花自喻，表现了诗人无私奉献，关心国家命运的爱国情怀。"},{"poemId":900031,"sort":1,"stem":"《卖油翁》中，写陈康肃公擅长射箭并以此自夸的句子是：“##陈康肃公善射##，##当世无双##，## 公亦以此自矜 ##。”"},{"poemId":900031,"sort":2,"stem":"《卖油翁》中，写卖油翁放下担子、斜着眼看陈尧咨射箭很久不离开的句子是：“##有卖油翁释担而立 ##，##睨之久而不去##。”"},{"poemId":900031,"sort":3,"stem":"《卖油翁》中，写卖油翁看陈尧咨射箭十中八九时表现的句子是：“## 但微颔之 ##。”"},{"poemId":900031,"sort":4,"stem":"《卖油翁》中，陈尧咨质问卖油翁的句子是：“## 尔安敢轻吾射 ##！”"},{"poemId":900031,"sort":5,"stem":"《卖油翁》中，卖油翁回答自己懂得射箭道理的话是：“## 以我酌油知之 ##。”"},{"poemId":900031,"sort":6,"stem":"《卖油翁》中，写卖油翁取葫芦、盖铜钱、用勺舀油注入的句子是：“##乃取一葫芦置于地##，##以钱覆其口##，## 徐以杓酌油沥之 ##，##自钱孔入##，##而钱不湿##。”"},{"poemId":900031,"sort":7,"stem":"《卖油翁》中，卖油翁揭示自己技艺高超原因的句子是：“##我亦无他##，## 惟手熟尔 ##。”"},{"poemId":900031,"sort":8,"stem":"《卖油翁》中，写陈尧咨笑着把卖油翁打发走的句子是：“## 康肃笑而遣之 ##。”"},{"poemId":900031,"sort":9,"stem":"《卖油翁》中，与卖油翁 “但微颔之” 形成对比、表现陈尧咨自矜的句子是：“## 公亦以此自矜 ##。”"},{"poemId":900031,"sort":10,"stem":"《卖油翁》中，表现卖油翁对陈尧咨射箭技艺不以为然的句子是：“## 睨之久而不去 ##。”"},{"poemId":900032,"sort":1,"stem":"《泊秦淮》中点明主旨的诗句是：“##商女不知亡国恨##，##隔江犹唱后庭花##。”"},{"poemId":900032,"sort":2,"stem":"《泊秦淮》中描写朦胧的水色夜景，渲染凄清气氛的诗句是：##烟笼寒水月笼沙##，##夜泊秦淮近酒家##。"},{"poemId":900032,"sort":3,"stem":"杜牧《泊秦淮》中借用典故针砭时弊，抒发心中不满的诗句是：##商女不知亡国恨##，##隔江犹唱后庭花##。"},{"poemId":900032,"sort":4,"stem":"《泊秦淮》中作者讽刺当朝统治者不顾国家危难，只顾自己享乐的句子是：##商女不知亡国恨##，##隔江犹唱后庭花##。"},{"poemId":900032,"sort":5,"stem":"杜牧《泊秦淮》一诗中描写了朦胧的水色夜景并借此点题的诗句是：##烟笼寒水月笼沙##，##夜泊秦淮近酒家##。"},{"poemId":900032,"sort":6,"stem":"自古以来，忧国忧民是很多诗歌的主题，杜牧在《泊秦淮》中，运用议论表明对国家命运担忧的诗句是：##商女不知亡国恨##，##隔江犹唱后庭花##。"},{"poemId":900032,"sort":7,"stem":"《泊秦淮》中表现在国运衰微的时候，官僚豪绅不以国事为念，反而聚集在酒楼中欣赏亡国之音的醉生梦死的生活的诗句是“##商女不知亡国恨##，##隔江犹唱后庭花##”。"},{"poemId":900032,"sort":8,"stem":"杜牧的《泊秦淮》中描写秦淮河特有的夜间景致的句子是：##烟笼寒水月笼沙##，##夜泊秦淮近酒家##。"},{"poemId":900032,"sort":9,"stem":"杜牧在《泊秦淮》中将对历史的咏叹与现实的思考结合，感慨家国兴亡的诗句是：##商女不知亡国恨##，##隔江犹唱后庭花##。"},{"poemId":900032,"sort":10,"stem":"《泊秦淮》中作者运用曲笔讽刺那些终日醉生梦死，不关心国事的人的诗句是：##商女不知亡国恨##，##隔江犹唱后庭花##。"},{"poemId":900033,"sort":1,"stem":"李商隐在咏史诗《贾生》中嘲讽封建统治者虚伪求贤和不顾苍生疾苦的诗句是：##可怜夜半虚前席##，##不问苍生问鬼神##。"},{"poemId":900033,"sort":2,"stem":"李商隐《贾生》一诗中表现汉文帝诚意十足、贾生才华横溢的句子是“##宣室求贤访逐臣##，##贾生才调更无伦##”。"},{"poemId":900033,"sort":3,"stem":"《贾生》中李商隐用“##可怜夜半虚前席##，##不问苍生问鬼神##。”这两句诗揭示唐晚期皇帝求仙访道，不顾国计民生的现实，同时寄寓自己怀才不遇的感慨。"},{"poemId":900033,"sort":4,"stem":"《贾生》中，开篇直接点明汉文帝访求贤才、召回被贬逐的贾谊的诗句是：##宣室求贤访逐臣##。"},{"poemId":900033,"sort":5,"stem":"李商隐的《贾生》一诗中表明文帝不是关心国计民生的大事，而是问些毫无道理的鬼神之事的诗句是：##可怜夜半虚前席##，##不问苍生问鬼神##。"},{"poemId":900033,"sort":6,"stem":"《贾生》中，极力夸赞贾谊的政治才华举世无双、无人能比的诗句是：##贾生才调更无伦##。"},{"poemId":900033,"sort":7,"stem":"李商隐借贾生“##可怜夜半虚前席##，##不问苍生问鬼神##”（《贾生》）怀才不遇的遭遇，抒发自己壮志难酬的感慨。"},{"poemId":900033,"sort":8,"stem":"《贾生》中，先扬后抑，先塑造出汉文帝虚心求贤、君臣相谈至深夜的明君形象的两句诗是：##宣室求贤访逐臣##，##贾生才调更无伦##。"},{"poemId":900033,"sort":9,"stem":"《贾生》中，形成强烈反差，揭露汉文帝求贤的虚伪本质，点明全诗讽刺主旨的核心两句诗是：##可怜夜半虚前席##，##不问苍生问鬼神##。"},{"poemId":900033,"sort":10,"stem":"李商隐在《贾生》中的“##可怜夜半虚前席##，##不问苍生问鬼神##”借对皇帝沉迷于求仙访道的慨叹表达了对百姓民生的关切。"},{"poemId":900034,"sort":1,"stem":"杨万里用“##政入万山围子里##，##一山放出一山拦##”（《过松源晨炊漆公店·其五》）描摹行路连绵险阻的景象，表达人生前路磨难重重，切勿盲目乐观，常怀警醒之心的感悟。"},{"poemId":900034,"sort":2,"stem":"《过松源晨炊漆公店（其五）》中，诗人以一句充满告诫意味的话开篇，直接否定“下山就毫无难度”的普遍错觉的诗句是：##莫言下岭便无难##。"},{"poemId":900034,"sort":3,"stem":"诗中有情。它是杨万里下山时的人生感悟，“##政入万山围子里##，##一山放出一山拦##”。（《过松源晨炊漆公店》 （其五））"},{"poemId":900034,"sort":4,"stem":"宋诗尚理。杨万里的《过松源晨炊漆公店（其五）》在诗中寓“顺境勿惑”之理：“##莫言下岭便无难##，##赚得行人错喜欢##”。"},{"poemId":900034,"sort":5,"stem":"杨万里的《过松源晨炊漆公店（其五）》， “##政入万山围子里##，##一山放出一山拦##”。才恍悟“生活中最好不要被眼前的顺境所迷惑，要放眼长远，认真对待，才能不断克服困难”的道理。"},{"poemId":900034,"sort":6,"stem":"《过松源晨炊漆公店（其五）》中，生动写出行人被“下岭容易”的错觉哄骗、白白空欢喜一场的诗句是：##莫言下岭便无难##，##赚得行人错喜欢##。"},{"poemId":900034,"sort":7,"stem":"《过松源晨炊漆公店（其五）》中，常被用来告诫人们不要被眼前的阶段性顺利迷惑，要对前路的困难做好充分准备的经典诗句是：##政入万山围子里##，##一山放出一山拦##。"},{"poemId":900034,"sort":8,"stem":"《过松源晨炊漆公店（其五）》中，先提出“下岭不难”的错误认知，再点出行人因此空欢喜的两句诗是：##莫言下岭便无难##，##赚得行人错喜欢##。"},{"poemId":900034,"sort":9,"stem":"《过松源晨炊漆公店（其五）》中，将行人从空欢喜到恍然大悟的完整心境变化，藏进山的“放”与“拦”动态里的两句诗是：##政入万山围子里##，##一山放出一山拦##。"},{"poemId":900034,"sort":10,"stem":"《过松源晨炊漆公店（其五）》中，运用拟人手法，把山写得像有灵性的生命体，刚放过行人又立刻阻拦的千古哲理名句是：##一山放出一山拦##。"},{"poemId":900035,"sort":1,"stem":"在赵师秀的《约客》一诗中，表现作者心情寂寞的句子是：##有约不来过夜半##，##闲敲棋子落灯花##。"},{"poemId":900035,"sort":2,"stem":"在诗人眼中，一切景语皆情语。赵师秀在《约客》中的”##黄梅时节家家雨##，##青草池塘处处蛙##“通过江南绵绵不绝的雨写出作者的烦闷。"},{"poemId":900035,"sort":3,"stem":"在赵师秀《约客》中，诗人只写了一个小小的动态，就将自己失望焦躁的情绪刻画得细致入微的一句是：##闲敲棋子落灯花##。"},{"poemId":900035,"sort":4,"stem":"赵师秀在《约客》中描绘了“##黄梅时节家家雨##，##青草池塘处处蛙##”的田园风光。"},{"poemId":900035,"sort":5,"stem":"《约客》表现作者寂寞心情的诗句是：##有约不来过夜半##，##闲敲棋子落灯花##。"},{"poemId":900035,"sort":6,"stem":"赵师秀绘夏，《约客》中“##黄梅时节家家雨##，##青草池塘处处蛙##”写尽了江南夏日的热闹。"},{"poemId":900035,"sort":7,"stem":"《约客》中把约客久候不至的心境刻画得极为生动的诗句是：##有约不来过夜半##，##闲敲棋子落灯花##。"},{"poemId":900035,"sort":8,"stem":"赵师秀《约客》一诗中，有“蝉噪林逾静，鸟鸣山更幽”之效的诗句是：##黄梅时节家家雨##，##青草池塘处处蛙##。"},{"poemId":900035,"sort":9,"stem":"《约客》中，如今常被用来表现等待友人时百无聊赖、心绪难平状态的经典细节描写诗句是：##有约不来过夜半##，##闲敲棋子落灯花##。"},{"poemId":900035,"sort":10,"stem":"《约客》中，前两句”##黄梅时节家家雨##，##青草池塘处处蛙##“，以动衬静，用外界的蛙鸣雨声反衬屋内的空寂。"},{"poemId":900052,"sort":1,"stem":"《沁园春·长沙》中，点明时间、地点，写诗人独自站在橘子洲头的句子是：“##独立寒秋##，##湘江北去##，##橘子洲头##。”"},{"poemId":900052,"sort":2,"stem":"《沁园春·长沙》中，写诗人远望山林、层林尽染的壮丽秋色的句子是：“##看万山红遍##，##层林尽染##。”"},{"poemId":900052,"sort":3,"stem":"《沁园春·长沙》中，描写江上船只竞相行驶、充满生机的句子是：##漫江碧透##，##百舸争流##。"},{"poemId":900052,"sort":4,"stem":"毛泽东《沁园春·长沙》中用对偶的手法描写动态景物的两句诗是：##鹰击长空##，##鱼翔浅底##。"},{"poemId":900052,"sort":5,"stem":"《沁园春·长沙》中，面对寥廓天地，诗人发出谁主宰国家命运之问的句子是： 6,"sort":8,"stem":"《梦游天姥吟留别》中，写半山腰望见海上日出、空中听到天鸡鸣叫的句子是：“##半壁见海日##，##空中闻天鸡##。”"},{"poemId":900056,"sort":9,"stem":"《梦游天姥吟留别》中，李白梦游醒来，因发现“##惟觉时之枕席##，##失向来之烟霞##”而顿觉失望。"},{"poemId":900056,"sort":10,"stem":"《梦游天姥吟留别》中，描写熊咆龙吟、使深林战栗、层巅震惊的句子是：“##熊咆龙吟殷岩泉##，##栗深林兮惊层巅##。”"},{"poemId":900056,"sort":11,"stem":"《梦游天姥吟留别》中，写云层黑沉将要下雨、水波荡漾升起烟雾的句子是：“##云青青兮欲雨##，##水澹澹兮生烟##。”"},{"poemId":900056,"sort":12,"stem":"《梦游天姥吟留别》中，写仙人们以霓为衣、以风为马纷纷而降的句子是：“##霓为衣兮风为马##，##云之君兮纷纷而来下##。”"},{"poemId":900056,"sort":13,"stem":"《梦游天姥吟留别》中，写诗人梦醒后枕席依旧、烟霞消失的句子是：“##惟觉时之枕席##，##失向来之烟霞##。”"},{"poemId":900056,"sort":14,"stem":"《梦游天姥吟留别》中，表现诗人蔑视权贵、追求自由的名句是：“##安能摧眉折腰事权贵##，##使我不得开心颜##！”"},{"poemId":900056,"sort":15,"stem":"李白的《梦游天姥吟留别》中描写天姥山巍峨、挺拔的诗句是：##天姥连天向天横##，##势拔五岳掩赤城##，##天台四万八千丈##，##对此欲倒东南倾##。"},{"poemId":900057,"sort":1,"stem":"杜甫的《登高》一诗被誉为“七律之冠”。其中在壮阔之景中蕴含对无限时空感慨的诗句是：“##无边落木萧萧下##，##不尽长江滚滚来##。”"},{"poemId":900057,"sort":2,"stem":"《登高》中，写落木无边、长江滚滚的句子是：“##无边落木萧萧下##，##不尽长江滚滚来##。”"},{"poemId":900057,"sort":3,"stem":"《登高》中，写诗人漂泊万里、常年作客他乡的句子是：“##万里悲秋常作客##，##百年多病独登台##。”"},{"poemId":900057,"sort":4,"stem":"《登高》中的“##万里悲秋常作客##，##百年多病独登台##”写出了作者羁旅之愁、病痛之苦、孤独之感。"},{"poemId":900057,"sort":5,"stem":"《登高》中，写国难家愁使白发增多、因病戒酒的句子是：“##艰难苦恨繁霜鬓##，##潦倒新停浊酒杯##。”"},{"poemId":900057,"sort":6,"stem":"杜甫《登高》中的“##风急天高猿啸哀##，##渚清沙白鸟飞回##”两句，描写了登高的所见所闻，不仅互相对偶，而且句中自对。"},{"poemId":900057,"sort":7,"stem":"《登高》中，以落叶写秋、暗含时光流逝与生命衰微之感的句子是：“##无边落木萧萧下##。”"},{"poemId":900057,"sort":8,"stem":"《登高》中，由写景转入抒情、总括诗人身世之悲的句子是：“##万里悲秋常作客##，##百年多病独登台##。”"},{"poemId":900057,"sort":9,"stem":"《登高》中“##无边落木萧萧下##，##不尽长江滚滚来##”两句写诗人登高远里所见，用传神之笔描写了凄冷的江色和长江的汹涌之势。"},{"poemId":900057,"sort":10,"stem":"《登高》中以夔州三峡秋季的典型景物入诗的诗句是“##风急天高猿啸哀##，##渚清沙白鸟飞回##。”"},{"poemId":900058,"sort":1,"stem":"《念奴娇·赤壁怀古》中，以“##大江东去##，##浪淘尽##，##千古风流人物##”开篇，营造雄浑豪迈的意境。"},{"poemId":900058,"sort":2,"stem":"《念奴娇·赤壁怀古》中，点明所游之地是传说中三国周瑜大破曹军的赤壁的句子是：“##故垒西边##，##人道是##，##三国周郎赤壁##。”"},{"poemId":900058,"sort":3,"stem":"《念奴娇·赤壁怀古》中，描写赤壁雄奇壮丽景色的句子是：“##乱石穿空##，##惊涛拍岸##，##卷起千堆雪##。”"},{"poemId":900058,"sort":4,"stem":"《念奴娇·赤壁怀古》中，以“##卷起千堆雪##”比喻浪花，写出波涛的磅礴气势。"},{"poemId":900058,"sort":5,"stem":"《念奴娇·赤壁怀古》中，总括江山之美与英雄之多的句子是：“##江山如画##，##一时多少豪杰##。”"},{"poemId":900058,"sort":6,"stem":"《念奴娇·赤壁怀古》中，写周瑜年轻有为、雄姿英发的句子是：“##遥想公瑾当年##，##小乔初嫁了##，##雄姿英发##。”"},{"poemId":900058,"sort":7,"stem":"《念奴娇·赤壁怀古》中，写周瑜从容闲雅、谈笑之间大破曹军的句子是：“##羽扇纶巾##，##谈笑间##，##樯橹灰飞烟灭##。”"},{"poemId":900058,"sort":8,"stem":"《念奴娇·赤壁怀古》中，写敌军战船在周瑜谈笑间化为灰烬的句子是：“##谈笑间##，##樯橹灰飞烟灭##。”"},{"poemId":900058,"sort":9,"stem":"《念奴娇·赤壁怀古》中，写词人神游故国、自笑多情、未老先衰的句子是：“##故国神游##，##多情应笑我##，##早生华发##。”"},{"poemId":900058,"sort":10,"stem":"《念奴娇·赤壁怀古》中，以“##人生如梦##，##一尊还酹江月##”作结，抒发旷达超脱之情。"},{"poemId":900058,"sort":11,"stem":"苏轼《念奴娇·赤壁怀古》中从视觉、听觉角度，兼用比喻描写赤壁雄奇壮阔的景象的句子是“##乱石穿空##，##惊涛拍岸##，##卷起千堆雪##”。"},{"poemId":900058,"sort":12,"stem":"当你登临送目，感叹祖国河山壮美、英雄辈出时，可借用苏轼《念奴娇·赤壁怀古》中的“##江山如画##，##一时多少豪杰##”抒发自己的情感。"},{"poemId":900058,"sort":13,"stem":"《念奴娇·赤壁怀古》中，苏轼神游故国、回到现实后，表达自嘲自伤情绪的句子是：##多情应笑我##，##早生华发##。"},{"poemId":900058,"sort":14,"stem":"《念奴娇·赤壁怀古》中表达词人旷达之情的句子是：##人生如梦##，##一尊还酹江月##。"},{"poemId":900058,"sort":15,"stem":"苏轼《念奴娇·赤壁怀古》中“##羽扇纶巾##”一句，写的是周瑜的儒将装束；“##樯橹灰飞烟灭##”一句，表明了周瑜的赫赫战功。"},{"poemId":900059,"sort":1,"stem":"《永遇乐·京口北固亭怀古》中，以“##千古江山##，##英雄无觅##，##孙仲谋处##”开篇，感慨英雄不再。"},{"poemId":900059,"sort":2,"stem":"《永遇乐·京口北固亭怀古》中，用“##舞榭歌台##，##风流总被##，##雨打风吹去##”写随着时间的流逝，英雄功业都化为了历史陈迹。"},{"poemId":900059,"sort":3,"stem":"《永遇乐·京口北固亭怀古》中，借刘义隆草率北伐失败的史实告诫当政者的句子是：“##元嘉草草##，##封狼居胥##，##赢得仓皇北顾##。”"},{"poemId":900059,"sort":4,"stem":"《永遇乐·京口北固亭怀古》中，写佛狸祠下一片神鸦社鼓、人们安于异族统治的句子是：“##可堪回首##，##佛狸祠下##，##一片神鸦社鼓##。”"},{"poemId":900059,"sort":5,"stem":"辛弃疾在《永遇乐·京口北固亭怀古》中借“##佛狸祠下##，##一片神鸦社鼓##”的景象表达了自己对百姓忘却国耻、安于异族统治的沉痛之情。"},{"poemId":900059,"sort":6,"stem":"《永遇乐·京口北固亭怀古》中，以廉颇自比、表达不被重用之愤的句子是：“##凭谁问##：##廉颇老矣##，##尚能饭否##？”"},{"poemId":900059,"sort":7,"stem":"《永遇乐·京口北固亭怀古》中，以夸张手法写刘裕北伐赫赫声威的句子是：“##金戈铁马##，##气吞万里如虎##。”"},{"poemId":900059,"sort":8,"stem":"辛弃疾的《永遇乐·京口北固亭怀古》引用了大量的历史典故，提到了很多历史英雄人物，其中，提到了孙权的句子是“##英雄无觅##，##孙仲谋处##”，与霍去病相关的句子是“##封狼居胥##”。"},{"poemId":900059,"sort":9,"stem":"在《永遇乐·京口北固亭怀古》中，辛弃疾回顾了元嘉年间的那次北伐，宋文帝刘义隆本希望能够“封狼居胥”，但是由于行事草率，最终却“##赢得仓皇北顾##”。"},{"poemId":900059,"sort":10,"stem":"辛弃疾在《永遇乐·京口北固亭怀古》中写古代英雄叱咤风云、驰骋疆场的名句是“ ##金戈铁马##，##气吞万里如虎##。”"},{"poemId":900060,"sort":1,"stem":"梧桐在古诗词里多是凄凉悲伤的象征，比如李清照《声声慢（寻寻觅觅）》中“##梧桐更兼细雨##，##到黄昏##、##点点滴滴##”表现了作者孤独寂寞的忧郁情绪。"},{"poemId":900060,"sort":2,"stem":"《声声慢》中，写大雁飞过、引发词人故国之思和身世之痛的句子是：“##雁过也##，##正伤心##，##却是旧时相识##。”"},{"poemId":900060,"sort":3,"stem":"李清照的《声声慢》（寻寻觅觅）中的“##满地黄花堆积##。##憔悴损##，##如今有谁堪摘##”几句是由景入情，情景交融。作者感情慢慢融入落花，对花自怜，黯然伤神。"},{"poemId":900060,"sort":4,"stem":"《声声慢》中，写词人独守窗前、觉得时间难熬的句子是：“##守着窗儿##，##独自怎生得黑##！”"},{"poemId":900060,"sort":5,"stem":"《声声慢》中“##寻寻觅觅##，##冷冷清清##，##凄凄惨惨戚戚##”三句，用一连串叠字写主人公的愁苦心情，为全词定下了愁惨的基调。"},{"poemId":900060,"sort":6,"stem":"《声声慢》中，以“##这次第##，##怎一个愁字了得##”直抒愁绪难以言尽。"},{"poemId":900060,"sort":7,"stem":"李清照在《声声慢》（寻寻觅觅）中，用“##乍暖还寒时候##，##最难将息##”两句，写出了天气变化无常，人很难调养身体。"},{"poemId":900060,"sort":8,"stem":"李清照《声声慢》（寻寻觅觅）中运用日常生活中的起居环境、行动细节来展现词人兀自独坐，百无聊赖，无所依傍的内心世界的句子是：“##守着窗儿 ##，##独自怎生得黑##！”"},{"poemId":900060,"sort":9,"stem":"《声声慢·寻寻觅觅》中道出词人面对菊花无心摘花的郁闷心情的一句“##如今有谁堪摘##”。"},{"poemId":900060,"sort":10,"stem":"李清照《声声慢（寻寻觅觅）》中直抒胸臆点明“愁”的句子是“##这次第##，##怎一个愁字了得##”！"},{"poemId":900061,"sort":1,"stem":"《静女》中刻画男子找不到女友时的焦急神态的诗句是：##爱而不见##，##搔首踟蹰##。"},{"poemId":900061,"sort":2,"stem":"“月上柳梢头，人约黄昏后”这句诗描写的情境与《静女》中“##静女其妹##，##俟我于城隅##。”有异曲同工之妙。"},{"poemId":900061,"sort":3,"stem":"《诗经·静女》描写了男子等待约会女子的情景，“##静女其姝##，##俟我于城隅##，##爱而不见##，##搔首踟蹰##”。"},{"poemId":900061,"sort":4,"stem":"《诗经·静女》是一首古老的爱情诗，静女“##爱而不见##”，让男子独自徘徊。"},{"poemId":900061,"sort":5,"stem":"《静女》中说静女赠送的彤管很美丽、讨人喜爱，后面又退一步说“##匪女之为美##，##美人之贻##”。"},{"poemId":900061,"sort":6,"stem":"《静女》中男青年用“##彤管有炜##，##说怿女美##”表达了对静女所赠彤管的赞美。"},{"poemId":900061,"sort":7,"stem":"《诗经·静女》中女子不仅“##贻我彤管##”，还“##自牧归荑##”，这两样赠物使男子兴奋不已。"},{"poemId":900061,"sort":8,"stem":"《静女》中，“##彤管有炜##，##说怿女美##”两句运用双关语来赞美姑娘。"},{"poemId":900061,"sort":9,"stem":"《静女》给我们塑造了一位美貌的女子，对于女子的美貌，诗中有两处地方毫不吝啬地进行了赞美，这两处分别是“##静女其姝##”和“##静女其娈##”。"},{"poemId":900061,"sort":10,"stem":"《静女》中，运用移情于物手法，表达爱屋及乌的情感的两句是：“##匪女之为美##，##美人之贻##。”"},{"poemId":900062,"sort":1,"stem":"《涉江采芙蓉》中描写游子望乡的感人诗句：##还顾望旧乡##，##长路漫浩浩##。"},{"poemId":900062,"sort":2,"stem":"《涉江采芙蓉》中“##采之欲遗谁##？##所思在远道##”两句，自问自答，感情由欢乐转为悲哀，这是深沉的疑问，是无奈的叹息。"},{"poemId":900062,"sort":3,"stem":"《涉江采芙蓉》中，“##还顾望旧乡##，##长路漫浩浩##”这两句话，诗角度变了，转为从游子方面写。在这样一个季节里，自然想起家乡采莲一事，只是举目远望，回乡的路途悠远无尽。"},{"poemId":900062,"sort":4,"stem":"《涉江采芙蓉》中“##涉江采芙蓉##，##兰泽多芳草##”两句，描写了一幅女子们在江中采莲，而湖畔泽畔还有着数不清的芳草的美好、欢乐的画面。"},{"poemId":900062,"sort":5,"stem":"《涉江采芙蓉》中“##还顾望旧乡##，##长路漫浩浩##”两句，转换了视角，写远方的丈夫此刻也正带着无限思念，回望妻子所在的故乡。展现在他眼前的，无非是漫漫无尽的长路和隔山隔水的浩洁烟云。"},{"poemId":900062,"sort":6,"stem":"《涉江采芙蓉》中抒发了主人公担忧此生无缘相聚的忧伤，又表达出自己对爱情的忠贞的诗句：“##同心而离居##，##忧伤以终老##。”"},{"poemId":900062,"sort":7,"stem":"《涉江采芙蓉》中 运用比兴手法写抒情主人公形象的雅洁及营造清幽、高洁的意境的句子：“##涉江采芙蓉##，##兰泽多芳草##。”"},{"poemId":900062,"sort":8,"stem":"《涉江采芙蓉》用平实的语言写出了游子与思妇的深情：“ ##采之欲遗谁##？##所思在远道##。”"},{"poemId":900062,"sort":9,"stem":"《涉江采芙蓉》中写彼此思念却无奈分开的一句是：##同心而离居##。"},{"poemId":900062,"sort":10,"stem":"《涉江采芙蓉》中把游子对故乡的望而难归之思，抒写得极为凄婉的句子是：“##还顾望旧乡##，##长路漫浩浩##。”"},{"poemId":900063,"sort":1,"stem":"李煜在《虞美人（春花秋月何时了）》一词中，一个诗句惊心动魄，把李煜的愁闷劈空倾泻下来。这个句子是：“##春花秋月何时了##，##往事知多少##。”这其中包含宇宙的永恒和人生的短暂无常之意。"},{"poemId":900063,"sort":2,"stem":"李煜在《虞美人（春花秋月何时了）》一词中，词人遥望金陵，并传出物是人非的无限怅恨的慨叹的句子是：“##雕栏玉砌应犹在##，##只是朱颜改##。”"},{"poemId":900063,"sort":3,"stem":"李煜在《虞美人（春花秋月何时了）》一词中，用比喻、夸张、设问手法写出愁思的多与深广的句子是：“##问君能有几多愁##，##恰似一江春水向东流##。”"},{"poemId":900063,"sort":4,"stem":"《虞美人》中李煜将抽象的“愁思”形象、具体化的句子是：##问君能有几多愁##，##恰似一江春水向东流##。"},{"poemId":900063,"sort":5,"stem":"李煜《虞美人》中“##雕栏玉砌应犹在##，##只是朱颜改##”两句借对故国宫殿的追忆，写出了物是人非之感。"},{"poemId":900063,"sort":6,"stem":"李煜的《虞美人》中直接抒发亡国之恨的句子是：“##小楼昨夜又东风##，##故国不堪回首月明中##。”"},{"poemId":900063,"sort":7,"stem":"《虞美人》中通过具体的物象，把抽象的愁绪具象化的句子是：“##问君能有几多愁##，##恰似一江春水向东流##。”"},{"poemId":900063,"sort":8,"stem":"李煜的《虞美人》一词中用对比手法，反衬出人生无常的句子是“##雕栏玉砌应犹在##，##只是朱颜改##。”"},{"poemId":900063,"sort":9,"stem":"李煜《虞美人》，运用比喻、夸张，写出愁思的多与深广的句子是：“##问君能有几多愁##，##恰似一江春水向东流##。”"},{"poemId":900063,"sort":10,"stem":"李煜《虞美人（春花秋月何时了）》中“##小楼昨夜又东风##，##故国不堪回首月明中##”两句勾联现实与过去，抒发了深沉的故国之思、亡国之痛。"},{"poemId":900064,"sort":1,"stem":"秦观《鹊桥仙》中“##纤云弄巧##，##飞星传恨##，##银汉迢迢暗度##”表现出牛郎织女鹊桥相会时急迫而喜悦的心情。"},{"poemId":900064,"sort":2,"stem":"《鹊桥仙（纤云弄巧）》中“##银汉迢迢暗度##，##搔首踟蹰##””写出了经过长途跋涉，两人终得见的情景。"},{"poemId":900064,"sort":3,"stem":"《鹊桥仙（纤云弄巧）》中，描绘云彩显示织女的手艺，描绘星星传递离愁别恨的两句是：“##纤云弄巧##，##飞星传恨##。”"},{"poemId":900064,"sort":4,"stem":"《鹊桥仙（纤云弄巧）》中，赞美久别情侣银河之畔的一次相会，胜过人世间千遍万遍的相会的两句是：“##金风玉露一相逢##，##便胜却人间无数##。”"},{"poemId":900064,"sort":5,"stem":"《鹊桥仙（纤云弄巧）》中，以流水喻缠绵之情的一句是“柔情似水”，写不愿离去的一句是“##忍顾鹊桥归路##”。"},{"poemId":900064,"sort":6,"stem":"秦观在《鹊桥仙·纤云弄巧》里称赞牛郎织女在“七夕”的短暂相会胜过人间凡俗之爱的句子是：##金风玉露一相逢##，##便胜却人间无数##。"},{"poemId":900064,"sort":7,"stem":"《鹊桥仙（纤云弄巧）》中，“##柔情似水##，##佳期如梦##”两句运用比喻的修辞手法，写出牛郎、织女的爱情像流水一般温柔，又像梦幻一般倏然而逝。"},{"poemId":900064,"sort":8,"stem":"面对牛郎织女难分难舍的离别场景，秦观在其《鹊桥仙》（纤云弄巧）中却另辟蹊径，以“##两情若是久长时##，##又岂在朝朝暮暮##”两句道出了与众不同的爱情观。"},{"poemId":900064,"sort":9,"stem":"在秦观《鹊桥仙（纤云弄巧）》一词中，词人并不认为织女和牛郎聚少离多值得哀怨，因为他们“##金风玉露一相逢##，##便胜却人间无数##”。"},{"poemId":900064,"sort":10,"stem":"《送杜少府之任蜀川》中说：“海内存知己，天涯若比邻”，秦观的《鹊桥仙》（纤云弄巧）中与此意境相似的两句诗是：##两情若是久长时##，##又岂在朝朝暮暮##。"},{"poemId":900065,"sort":1,"stem":"《登岳阳楼》诗中描写洞庭湖波澜壮阔的景象的诗句是：##吴楚东南坼##，##乾坤日夜浮##。"},{"poemId":900065,"sort":2,"stem":"“舟”是古诗词中常见的意象，常用于抒发羁旅漂泊之痛，如杜甫《登岳阳楼》中的“##老病有孤舟##”。"},{"poemId":900065,"sort":3,"stem":"杜甫《登岳阳楼》中的“##戎马关山北##，##凭轩涕泗流##”两句则展现了老泪纵横的诗人形象，表达了对国事的忧思。"},{"poemId":900065,"sort":4,"stem":"《登岳阳楼》中，写诗人昔日听闻洞庭湖、今日才登上岳阳楼的句子是：“##昔闻洞庭水##，##今上岳阳楼##。”"},{"poemId":900065,"sort":5,"stem":"《登岳阳楼》中，“##吴楚东南坼##，##乾坤日夜浮##”两句，写洞庭湖浩瀚无际的磅礴气势，意境阔大，景色宏伟奇丽。"},{"poemId":900065,"sort":6,"stem":"杜甫《登高》中的“万里悲秋常作客，百年多病独登台”与其《登岳阳楼》中的“##亲朋无一字##，##老病有孤舟##”均写其漂泊天涯的境遇和老病孤愁的心情。"},{"poemId":900065,"sort":7,"stem":"杜甫的《登岳阳楼》“##吴楚东南坼##，##乾坤日夜浮##”两句紧扣上联的“水”字，虽没出现水字，却是专门写洞庭水。孟浩然咏叹洞庭湖的诗句“气蒸云梦泽，波撼岳阳城”与之有异曲同工之妙。"},{"poemId":900065,"sort":8,"stem":"洞庭湖古称云梦、九江和重湖，古代文人留学、就任、漂泊多经留此地，为洞庭湖积淀了深层的文化内涵，如《登岳阳楼》中的“##乾坤日夜浮##”从时间个维度描写洞庭湖的恢弘气象。"},{"poemId":900065,"sort":9,"stem":"《登岳阳楼》中，点明北方战乱未平、表现诗人忧国忧民的句子是：“##戎马关山北##，##凭轩涕泗流##。”"},{"poemId":900065,"sort":10,"stem":"《登岳阳楼》中，以今昔对照、暗含身世飘零之慨的句子是：“##昔闻洞庭水##，##今上岳阳楼##。”"},{"poemId":900066,"sort":1,"stem":"《桂枝香·金陵怀古》中，描写词人登高望远所见金陵城江山的景物特征的句子是“##千里澄江似练##，##翠峰如簇##”。"},{"poemId":900066,"sort":2,"stem":"在《桂枝香·金陵怀古》中，王安石批判文人骚客登临高处枉自感叹国家朝代兴亡荣辱，而无所作为的句子是“##千古凭高对此##，##谩嗟荣辱##”。"},{"poemId":900066,"sort":3,"stem":"窦巩《南游感兴》一诗：“伤心欲问前朝事，惟见江流去不回。日暮东风春草绿，鹧鸪飞上越王台。”《桂枝香·金陵怀古》中与此诗有相似感慨的诗句是：##六朝旧事随流水##，##但寒烟衰草凝绿##。"},{"poemId":900066,"sort":4,"stem":"学校组织秋季研学活动，你登上黄鹤楼，看到千里奔流的长江和对岸的群峰，不禁吟咏出《桂枝香、金陵怀古》中的“##千里澄江似练##，##翠峰如簇##”诗句。"},{"poemId":900066,"sort":5,"stem":"唐朝诗人杜牧曾在《台城曲》中讽刺说：“门外韩擒虎，楼头张丽华。”王安石《桂枝香·金陵怀古》中的“##叹门外楼头##，##悲恨相续##”就是用这个典故表达亡国之恨的。"},{"poemId":900066,"sort":6,"stem":"舟，在古诗中是常用的意象。《桂枝香·金陵怀古》（王安石）中有“舟”的诗句，是“##彩舟云淡##”。"},{"poemId":900066,"sort":7,"stem":"《桂枝香·金陵怀古》中用陈后主、张丽华的典故写出了词人对六朝先后覆灭的感慨：“##叹门外楼头##，##悲恨相续##。”"},{"poemId":900066,"sort":8,"stem":"王安石《桂枝香·金陵怀古》中，“##千古凭高对此##，##谩嗟荣辱##”两句写出了对历来凭吊金陵之作的看法。"},{"poemId":900066,"sort":9,"stem":"《桂枝香•金陵怀古》中“##千里澄江似练##，##翠峰如簇##”两句生动地描写出词人登高远望，纵目千里所看到的景象。"},{"poemId":900066,"sort":10,"stem":"《桂枝香·金陵怀古》中，描写词人登高远望时节和天气的句子是：“##正故国晚秋##，##天气初肃##。”"},{"poemId":900067,"sort":1,"stem":"张孝祥的《念奴娇·过洞庭》中“素月分辉，明河共影，表里俱澄澈”的“景”与“##孤光自照##，##肝肺皆冰雪##”的“情”交相呼应，交相融合。"},{"poemId":900067,"sort":2,"stem":"《念奴娇·过洞庭》中词人泛舟湖上，“##玉鉴琼田三万顷##，##着我扁舟一叶##”两句颇有自然造化全都供“我”所用的意味，有力地衬托出词人的豪迈气概。"},{"poemId":900067,"sort":3,"stem":"在《念奴娇·过洞庭》中，张孝祥运用工整的对偶与夸张的想象，将自我与浩渺无限的自然融合的句子是“##尽挹西江##，##细斟北斗##”。"},{"poemId":900067,"sort":4,"stem":"杜甫《登岳阳楼》中的“乾坤日夜浮”张孝祥《念奴娇·过洞庭》中的“##玉鉴琼田三万顷##”以洞庭湖为描写对象，从不同角度表现了其阔大壮美的特点。"},{"poemId":900067,"sort":5,"stem":"同样是南宋词人，同样是面对人生失意，张孝祥在《念奴娇·过洞庭》中的自我评价“##肝肺皆冰雪##”，有唐人王昌龄“一片冰心在玉壶”之况味。"},{"poemId":900067,"sort":6,"stem":"《念奴娇 过洞庭》中写词人心物融合的美妙体验，且难以诉诸言语的句子：“##悠然心会##，##妙处难与君说##。”"},{"poemId":900067,"sort":7,"stem":"《赤壁赋》中“纵一苇之所如，凌万顷之茫然。”两句意境开阔，胸襟旷达，这与张孝祥的《念奴娇·过洞庭》中“##玉鉴琼田三万顷##，##着我扁舟一叶##。”二句有异曲同工之妙。"},{"poemId":900067,"sort":8,"stem":"《念奴娇 过洞庭》一词中词人扣舷而歌极度赞叹夜色美好的句子是：“##扣舷独啸##，##不知今夕何夕##”。"},{"poemId":900067,"sort":9,"stem":"《念奴娇·过洞庭》中，写月光、银河与湖水交相辉映的美好景象的句子是：“##素月分辉##，##明河共影##，##表里俱澄澈##。”"},{"poemId":900067,"sort":10,"stem":"《念奴娇 过洞庭》中表现秋高气爽、玉宇澄清的景色，是纵目洞庭总的印象的句子是：“##洞庭青草##，##近中秋##，##更无一点风色##”。"},{"poemId":900068,"sort":1,"stem":"《游园（皂罗袍）》中“##良辰美景奈何天##，##赏心乐事谁家院##”两句，化用谢灵运的“天下良辰、美景、赏心、乐事，四者难并”句意，写出杜丽娘联想到自己的身世、遭遇后，从胸中涌出的无限哀怨。"},{"poemId":900068,"sort":2,"stem":"《游园（皂罗袍）》中，以繁盛春景与破败环境的反差引发深沉感伤的句子是：“##原来姹紫嫣红开遍##，##似这般都付与断井颓垣##。”"},{"poemId":900068,"sort":3,"stem":"《游园（皂罗袍）》中以合唱的形式，展现了一幅绚丽而略带迷惘色彩的画面是：##朝飞暮卷##，##云霞翠轩##；##雨丝风片##，##烟波画船##。"},{"poemId":900068,"sort":4,"stem":"《游园（皂罗袍）》中“##锦屏人忒看的这韶光贱##”一句，是春心的萌动，更是追求美好生活和自由人性的觉醒。这样的呼声在当时具有反封建的进步意义。"},{"poemId":900068,"sort":5,"stem":"《游园（皂罗袍）》中写杜丽娘对美好春光的赞叹，但又流露出自己的一腔春愁无处排遣的无奈情绪的诗句是：##良辰美景奈何天##，##赏心乐事谁家院##。"},{"poemId":900068,"sort":6,"stem":"《游园·皂罗袍》中“##似这般都付与断井颓垣##”一句表层是“破败的井台与墙壁”，深层隐喻“封建礼教对人性的压抑，以及杜丽娘青春价值的荒芜”，与“姹紫嫣红”的美景形成反差。"},{"poemId":900068,"sort":7,"stem":"《游园（皂罗袍）》中，“##良辰美景奈何天##，##赏心乐事谁家院##”这两句直抒胸臆，以反问的口吻表达了杜丽娘对美好春光的赞叹与无奈，她感叹良辰美景虽好，但自己的春愁却无处排遣。"},{"poemId":900068,"sort":8,"stem":"“##原来姹紫嫣红开遍##，##似这般都付与断井颓垣##”，运用对比的手法，凸显出花园荒芜冷落，暗示女主人公的生活环境。"},{"poemId":900068,"sort":9,"stem":"《游园·皂罗袍》中“##锦屏人忒看的这韶光贱##”一句表层是“美好春光被辜负”，深层是“杜丽娘感叹自己的青春被深闺禁锢，无法实现生命价值”，是“伤春悲己”的核心体现。"},{"poemId":900068,"sort":10,"stem":"《游园·皂罗袍》中“##朝飞暮卷##，##云霞翠轩##；##雨丝风片##，##烟波画船##”这几句是杜丽娘想象出来的虚景，在她想象的外部世界，她是身心自由的，是生机勃勃的。"},{"poemId":900069,"sort":1,"stem":"《劝学》开篇提出中心论点的句子是：“##君子曰##：##学不可以已##。”"},{"poemId":900069,"sort":2,"stem":"《劝学》中写空想不如学习的句子是：“##吾尝终日而思矣##，##不如须臾之所学也##。”"},{"poemId":900069,"sort":3,"stem":"《劝学》中“##驽马十驾##，##功在不舍##”两句，用劣马来设喻，说明学习贵在坚持的道理。"},{"poemId":900069,"sort":4,"stem":"《荀子·劝学》中的“##学不可以已##”体现了终身学习的理念。"},{"poemId":900069,"sort":5,"stem":"《劝学》中，批评不专心，用的比喻句是“##蟹六跪而二螯##，##非蛇鳝之穴无可寄托者##”。"},{"poemId":900069,"sort":6,"stem":"荀子在《劝学》中说，君子需要通过广泛学习来提升自己的两个句子是：##君子博学而日参省乎己##，##则知明而行无过矣##。"},{"poemId":900069,"sort":7,"stem":"《劝学》开篇就提出了全文的中心论点，即“ 学不可以已”。在后面又阐明了学习要持之以恒的句子是：##锲而舍之##，##朽木不折##；##锲而不舍##，##金石可镂##。"},{"poemId":900069,"sort":8,"stem":"荀子《劝学》中用“##君子博学而日参省乎己##”一句指出君子智慧明达、言行无过的原因。"},{"poemId":900069,"sort":9,"stem":"荀子在《劝学》中，从反面论证学习应当专一的句子是：“##蟹六跪而二螯##，##非蛇鳝之穴无可寄托者##，##用心躁也##。”"},{"poemId":900069,"sort":10,"stem":"荀子《劝学》中“##吾尝终日而思矣##，##不如须臾之所学也##”两句与孔子“思而不学则殆”的观点相近。"},{"poemId":900069,"sort":11,"stem":"荀子在《劝学》中用登高望远的比喻，说明学习的效果的两句是“##吾尝跂而望矣##，##不如登高之博见也##”。"},{"poemId":900069,"sort":12,"stem":"《劝学》中，通过骏马、劣马的对比，劝勉人们要学习不止的句子：“##骐骥一跃##，##不能十步##；##驽马十驾##，##功在不舍##。”"},{"poemId":900069,"sort":13,"stem":"《荀子·劝学》中“##君子生非异也## ; ##善假于物也##”两句强调君子并非有何差异，只是善于借助外力。"},{"poemId":900069,"sort":14,"stem":"《劝学》中写君子能自我反省的一句是：##君子博学而日参省乎己##。"},{"poemId":900069,"sort":15,"stem":"《劝学》中，以蚯蚓为例说明用心专一才能成功的句子是：“##蚓无爪牙之利##，##筋骨之强##，##上食埃土##，##下饮黄泉##，##用心一也##。”"},{"poemId":900069,"sort":16,"stem":"在《劝学》中，荀子认为，君子在本性上与常人没什么区别，只是“##善假于物也##”。"},{"poemId":900069,"sort":17,"stem":"人们常说“活到老，学到老”，《劝学》中的“##学不可以已##”这句话印证了这个道理。"},{"poemId":900069,"sort":18,"stem":"《劝学》中荀子借君子提出论点的句子是：“##学不可以已##”；阐述君子成功原因的句子是：“##善假于物也##。”"},{"poemId":900069,"sort":19,"stem":"荀子在《劝学》中说，君子需要通过广泛学习来提升自己的句子是：“##君子博学而日参省乎己## ，##则知明而行无过矣##。”"},{"poemId":900069,"sort":20,"stem":"《劝学》中，“##吾尝终日而思矣##，##不如须臾之所学也##”表达了“空想不如学习”的看法。"},{"poemId":900070,"sort":1,"stem":"《师说》中，提出“古之学者必有师”后，为“师”下定义的句子是：“##师者##，##所以传道受业解惑也##。”"},{"poemId":900070,"sort":2,"stem":"《师说》中，说明人不是生来就懂道理、谁能没有疑惑的句子是：“##人非生而知之者##，##孰能无惑##？”"},{"poemId":900070,"sort":3,"stem":"韩愈在《师说》文末所说的“##六艺经传皆通习之##”说明了李蟠的儒学素养，“##余嘉其能行古道##”则直接点明写作《师说》的缘由。"},{"poemId":900070,"sort":4,"stem":"《师说》中指出教师作用的句子是：##师者##，##所以传道受业解惑也##。"},{"poemId":900070,"sort":5,"stem":"《师说》中，韩愈认为“弟子不必不如师，师不必贤于弟子”的原因是“##闻道有先后##，##术业有专攻##。”"},{"poemId":900070,"sort":6,"stem":"《师说》中，体现韩愈平等、民主的师生观的句子是：##弟子不必不如师##，##师不必贤于弟子##。"},{"poemId":900070,"sort":7,"stem":"韩愈在《师说》中明确提出了择师的标准：##道之所存##，##师之所存也##。"},{"poemId":900070,"sort":8,"stem":"《师说》中总结“师之道”的一句是：##是故无贵无贱##，##无长无少##，##道之所存##，##师之所存也##。"},{"poemId":900070,"sort":9,"stem":"韩愈《师说》中从职责上将老师界定为“##（所以）传道受业解惑也##”，而把那些童子之师界定为“##授之书而习其句读者##”。"},{"poemId":900070,"sort":10,"stem":"《师说》中体现士大夫之族以地位、官职为借口拒绝从师学习的不良风气的句子是：“##位卑则足羞##，##官盛则近谀##。”"},{"poemId":900070,"sort":11,"stem":"韩愈的《师说》是写给少年李蟠的。文末“ ##六艺经传皆通习之## ”，说明了李蟠的儒学素养。"},{"poemId":900070,"sort":12,"stem":"《师说》中，韩愈认为应该辩证地看待老师和弟子才能的句子是：“##（是故）弟子不必不如师##，##师不必贤于弟子##”。"},{"poemId":900070,"sort":13,"stem":"韩愈在《师说》中用“##位卑则足羞##，##官盛则近谀##”表现出当时的士大夫以地位为标准，耻于从师的心理。"},{"poemId":900070,"sort":14,"stem":"《师说》中，强调了从师是为了学道，和人的年龄大小无关的两句是：“##吾师道也##，##夫庸知其年之先后生于吾乎##？”"},{"poemId":900070,"sort":15,"stem":"《师说》中，感叹从师学习的风尚不能恢复的句子是：“呜呼！##师道之不复##，##可知矣##。”"},{"poemId":900070,"sort":16,"stem":"《师说》中通过古今纵比，批判了“##今之众人##，##其下圣人也亦远矣##，##而耻学于师##”的错误态度。"},{"poemId":900070,"sort":17,"stem":"《师说》中，以孔子从师为例说明圣人没有固定老师的句子是：“##圣人无常师##。孔子师郯子、苌弘、师襄、老聃。”"},{"poemId":900070,"sort":18,"stem":"《师说》中，韩愈对当时耻于学习的现象发出的两句慨叹是∶##师道之不传也久矣##，##欲人之无惑也难矣##。"},{"poemId":900070,"sort":19,"stem":"《师说》中，说明人们懂得道理有先后、学术技艺各有专长的句子是：“##闻道有先后##，##术业有专攻##。”"},{"poemId":900070,"sort":20,"stem":"《师说》中，对于为子择师自己却耻于学习这种现象，韩愈最后的评价是：“##小学而大遗##，##吾未见其明也##。”"},{"poemId":900071,"sort":1,"stem":"苏轼在《赤壁赋》中举杯劝酒后描写吟诗作对的句子是：##诵明月之诗##，##歌窈窕之章##。"},{"poemId":900071,"sort":2,"stem":"在《赤壁赋》中，苏轼用“##舳舻千里##，##旌旗蔽空##”两句概括了曹操的军队在攻破荆州后顺流而下的军容之盛。"},{"poemId":900071,"sort":3,"stem":"《赤壁赋》中侧面描写箫声的句子是：##舞幽壑之潜蛟##，##泣孤舟之嫠妇##。"},{"poemId":900071,"sort":4,"stem":"《赤壁赋》中作者刻画曹操形象的句子是：##酾酒临江##，##横槊赋诗##。"},{"poemId":900071,"sort":5,"stem":"苏轼《赤壁赋》中用比喻的手法，感叹生命短暂和个体渺小的句子是：“##寄蜉蝣于天地##，##渺沧海之一粟##。”"},{"poemId":900071,"sort":6,"stem":"苏轼在《赤壁赋》中写道：在皎洁的月光下茫茫雾气笼罩江面，天光水色连成一片，诗人忘情地“##纵一苇之所如##，##凌万顷之茫然##。”"},{"poemId":900071,"sort":7,"stem":"《赤壁赋》中写作者与友人于扁舟举杯共饮的句子是：##驾一叶之扁舟##，##举匏尊以相属##。"},{"poemId":900071,"sort":8,"stem":"《赤壁赋》中写希望与神仙相交，与明月同存的句子是：##挟飞仙以遨游##，##抱明月而长终##。"},{"poemId":900071,"sort":9,"stem":"苏轼在《赤壁赋》中，从事物变化的角度看待天地存在的句子是：“##盖将自其变者而观之##，##则天地曾不能以一瞬##。”"},{"poemId":900071,"sort":10,"stem":"在古代散文中，经常有“泛舟夜游”的活动，如《赤壁赋》中用“##桂棹兮兰桨##，##击空明兮溯流光##”两句描绘船桨划破月光照耀下的清澈江水，写出了逆流追月的美妙体验。"},{"poemId":900071,"sort":11,"stem":"走上工作岗位的小刚将苏轼《赤壁赋》中“##苟非吾之所有##，##虽一毫而莫取##”两句作为座右铭，警醒自己在物质诱惑面前保持廉洁之心，拒绝贪腐之念。"},{"poemId":900071,"sort":12,"stem":"《赤壁赋》中，表达思念心中所慕之人却远在天边的句子是：“##渺渺兮予怀##，##望美人兮天一方##。”"},{"poemId":900071,"sort":13,"stem":"《赤壁赋》中，客人以曹操诗句“##月明星稀##，##乌鹊南飞##”引出对英雄已逝的感慨。"},{"poemId":900071,"sort":14,"stem":"《赤壁赋》中，苏子以水为喻、说明逝去的事物其实并未真正消逝的句子是：“##逝者如斯##，##而未尝往也##。”"},{"poemId":900071,"sort":15,"stem":"《赤壁赋》中，苏子从“不变”的角度说明万物与自己都是无穷的句子是：“##自其不变者而观之##，##则物与我皆无尽也##，##而又何羡乎##！”"},{"poemId":900071,"sort":16,"stem":"苏轼在《赤壁赋》中慨叹人生短暂，并向往大江永恒的名句是“##哀吾生之须臾##，##羡长江之无穷##”。"},{"poemId":900071,"sort":17,"stem":"《赤壁赋》叙写月亮盈亏却无所增减的哲理的句子是：##盈虚者如彼##，##而卒莫消长也##。"},{"poemId":900071,"sort":18,"stem":"苏轼《赤壁赋》中描写明月初升的句子是“##月出于东山之上##，##徘徊于斗牛之间##”。"},{"poemId":900071,"sort":19,"stem":"《赤壁赋》中，作者在感叹人生短暂和自然永恒后产生了“##哀吾生之须臾##，##羡长江之无穷##“的憧憬。"},{"poemId":900071,"sort":20,"stem":"《赤壁赋》中，从事物变化的角度看待天地的存在的名句是“##盖将自其变者而观之##，##则天地曾不能以一瞬##”。"},{"poemId":900072,"sort":1,"stem":"《登泰山记》中“##苍山负雪##，##明烛天南##”写出泰山山顶雪后的美景。"},{"poemId":900072,"sort":2,"stem":"《登泰山记》中，“##绛皓驳色##，##而皆若偻##”描写日观峰以西诸峰在晨光的照耀下，红白交错，宛如鞠躬致敬。"},{"poemId":900072,"sort":3,"stem":"小方从泰山旅游回来后，引用姚鼐《登泰山记》中“##极天云一线异色##，##须臾成五采##”两句，赞叹泰山日出时云霞色彩变化的极美景象。"},{"poemId":900072,"sort":4,"stem":"《登泰山记》中，“##极天云一线异色##须臾成五采##”两句写出了在泰山顶上看到太阳出时的瑰丽景色，为下文写日出的壮观景色作了衬托。"},{"poemId":900072,"sort":5,"stem":"姚鼐《登泰山记》中，“##道中迷雾冰滑##，##磴几不可登##”写出大雾弥漫，山路冰滑，表现了登山的困难。"},{"poemId":900072,"sort":6,"stem":"在《登泰山记》中，作者先后用拟人和比喻的修辞手法写出了自己登上泰山山顶时刹那间的感受的句子是“##苍山负雪##，##明烛天南##”。"},{"poemId":900072,"sort":7,"stem":"古人巧于运思，善用比喻，如《登泰山记》中“而##半山居雾若带然##”，用衣带喻环绕山腰的云雾。"},{"poemId":900072,"sort":8,"stem":"《登泰山记》中“##极天云一线异色##，##须臾成五采##”两句写出了在泰山顶上看到太阳将出时的景色，奇幻无比，为下文写日出的壮观景色作了衬托。"},{"poemId":900072,"sort":9,"stem":"姚鼐在《登泰山记》中用“##稍见云中白若樗蒱数十立者##”和“##而皆若偻##”分别写出了日出前后群峰的形态，运用比喻，生动传神。"},{"poemId":900072,"sort":10,"stem":"姚鼐《登泰山记》中，写从山巅向下俯视、众山如骰子的两句是“##稍见云中白若樗蒲数十立者##，##山也##”。"},{"poemId":900072,"sort":11,"stem":"姚鼐《登泰山记》中作者写登顶泰山后远望夕阳映照着泰安城，用“##汶水、徂徕如画##，##而半山居雾若带然##”两个比喻句写出了泰山安详、明媚、肃穆中有温柔飘逸之美的特殊风韵。"},{"poemId":900072,"sort":12,"stem":"在《登泰山记》中，“##正赤如丹##，##下有红光动摇承之##”这两句写出了太阳仿佛从东海中升起的壮观景象，充满了生气和力量，具有无比震撼的美。"},{"poemId":900072,"sort":13,"stem":"桐城派作家重视考据，如姚鼐《登泰山记》中“##道皆砌石为磴##，##其级七千有余##”两句，细写泰山道路台阶的开凿及大致数目。"},{"poemId":900072,"sort":14,"stem":"姚鼐在《登泰山记》中，“##道中迷雾冰滑##，##磴几不可登##”两句概括了作者与友人寒冬登泰山途中的困难与艰辛。"},{"poemId":900072,"sort":15,"stem":"《登泰山记》中，描写姚鼐与子颍在日观亭等待日出时看到的风雪交加、云雾弥漫的景象的句子是”##大风扬积雪击面##，##亭东自足下皆云漫##”。"},{"poemId":900072,"sort":16,"stem":"姚鼐《登泰山记》中描写日观峰附近几里内草木不生，积雪覆盖的句子是“##至日观数里内无树##，##而雪与人膝齐##”。"},{"poemId":900072,"sort":17,"stem":"《登泰山记》中，作者用“##大风物积雪击面##”表现了自己与子颍在山顶坐待日出时的风雪之大、天气之恶劣。"},{"poemId":900072,"sort":18,"stem":"记述海上日出奇景，李白“半壁见海日”句是概写，姚鼐《登泰山记》“##正赤如丹##，##下有红光动摇承之##”句则是精描。"},{"poemId":900072,"sort":19,"stem":"姚鼐《登泰山记》中“##大风扬积雪击面 ; ##亭东自足下皆云漫##”两句生动地展示了日出前风扬积雪、云雾弥漫的环境。"},{"poemId":900072,"sort":20,"stem":"姚鼐《登泰山记》中的“##山居雾若带然##”句写出了登上泰山之巅所看到的山间云雾温柔飘逸的特殊神韵，“##下有红光动摇承之##”句把太阳初升时跃动而雄浑的形象表现得气势磅礴，奔放豪迈。"},{"poemId":900073,"sort":1,"stem":"《子路、曾皙、冉有、公西华侍坐》中，孔子为了打消学生们的顾虑，为他们创造一个轻松活跃的交流环境，说：“##以吾一日长乎尔##，##毋吾以也##。”"},{"poemId":900073,"sort":2,"stem":"与孔子的其他弟子不同，在《子路、曾皙、冉有、公西华侍坐》中，曾皙将自己的社会理想描述成一幅与冠者、童子一起“##浴乎沂##，##风乎舞雩##”，吟咏而归的春游图景。"},{"poemId":900073,"sort":3,"stem":"《子路、曾皙、冉有、公西华侍坐》中，“##夫子哂之##”一句传神的表现出孔子含蓄委婉的表态，既以微笑表示对子路的政治抱负的认可，又含而不露地批评了“##其言不让##”。"},{"poemId":900073,"sort":4,"stem":"《子路、曾皙、冉有、公西华侍坐》中，表现孔子不以年长自居，循循善诱，使弟子毫无顾忌地说出各自志向的句子是“##以吾一日长乎尔##，##毋吾以也##”。"},{"poemId":900073,"sort":5,"stem":"孔子与弟子交谈时循循善诱，《子路、曾皙、冉有、公西华侍坐》中，曾皙因志趣与另外三人不同而有顾虑，孔子用 “##何伤乎##？##亦各言其志也##”引导他积极表达。"},{"poemId":900073,"sort":6,"stem":"《子路、曾皙、冉有、公西华侍坐》中，在孔子询问弟子志向时，子路“率尔而对”,用“##可使有勇##，##且知方也##”勾勒治理千乘之国的蓝图，尽显自信豪迈之气。"},{"poemId":900073,"sort":7,"stem":"《子路、曾皙、冉有、公西华侍坐》中曾皙言志描绘出其乐融融的祥和图景，其中展现春日沐浴、迎风抒怀的句子“##浴乎沂##，##风乎舞雩##”,表达了儒家礼乐治国的理想境界。"},{"poemId":900073,"sort":8,"stem":"《子路、曾皙、冉有、公西华侍坐》中面对孔子的询问，弟子们各言志向，孔子哂笑子路是因为“##为国以礼##，##其言不让##。”"},{"poemId":900073,"sort":9,"stem":"《子路、曾皙、冉有、公西华侍坐》中，孔子引导曾暂不要有所顾虑，可以畅所欲言地说出自己的理想，因为每个人只是说说各种的志向的句子是：“##何伤乎##？##亦各言其志也##。”"},{"poemId":900073,"sort":10,"stem":"《子路、曾皙、冉有、公西华侍坐》中，子路的政治设想中要治理什么样的国家：“ ##千乘之国##，##摄乎大国之间##，##加之以师旅##，##因之以饥馑。”"},{"poemId":900073,"sort":11,"stem":"《子路、曾皙、冉有、公西华侍坐》中，冉有认为自己能治理小国，使百姓富足，但他又用“##如其礼乐##，##以俟君子##。”表明自己还不能以礼乐教化百姓。"},{"poemId":900073,"sort":12,"stem":"《子路、曾皙、冉有、公西华侍坐》中，曾皙的理想社会是在“##莫春者##，##春服既成##”情况下，成年人带几个孩子自由自在的生活在和谐的社会里。"},{"poemId":900073,"sort":13,"stem":"《子路、曾皙、冉有、公西华侍坐》中孔子非常赞同曾皙的观点，因为他描绘了一幅太平盛世的蓝图“##浴乎沂##，##风乎舞雩##”，一路唱着歌回家。"},{"poemId":900073,"sort":14,"stem":"《子路、曾皙、冉有、公西华侍坐》中，孔子“哂由”是因为“##其言不让##”，他最赞同曾皙的回答，从“##吾与点也##”这句话可以看出来。"},{"poemId":900073,"sort":15,"stem":"《子路、曾皙、冉有、公西华侍坐》中，子路称自己用三年时间治理一个内忧外患的国家，就能取得“##可使有勇##，##且知⽅也##”的成效，被孔子批评毫不谦让。"},{"poemId":900073,"sort":16,"stem":"《子路、曾皙、冉有、公西华侍坐》中，“##赤也为之小##，##孰能为之大##”两句表明孔子不认为公西华只能做一个小相，而认为公西华能做大事。"},{"poemId":900073,"sort":17,"stem":"《子路、曾晳、冉有、公西华侍坐》 中，子路治理的国家饱经“##加之以师旅##，##因之以饥馑##”的外患内忧。"},{"poemId":900073,"sort":18,"stem":"《子路、曾皙、冉有、公西华侍坐》中写到孔子的四个弟子侍坐时各言其志，子路的志向是用三年时间治理一个饱经忧患的千乘之国，“##可使有勇##，##且知⽅也##”。"},{"poemId":900073,"sort":19,"stem":"《子路、曾皙、冉有、公西华侍坐》中，曾皙所描绘的晚春时分，五六个成年人带着六七个小孩，“##浴乎沂##，##风乎舞雩##，##咏而归##”的情景，彰显了曾皙“以乐治国”的人生理想。"},{"poemId":900073,"sort":20,"stem":"《子路、曾晳、冉有、公西华侍坐》中，孔子指出治理国家要用礼的句子是：“##为国以礼##，##其言不让##”。"},{"poemId":900074,"sort":1,"stem":"《烛之武退秦师》中秦晋围郑的原因是“##以其无礼于晋##，##且贰于楚也##”。"},{"poemId":900074,"sort":2,"stem":"《烛之武退秦师》中晋文公认为“##因人之力而敝之##”是不仁道的，于是也撤离了郑国。"},{"poemId":900074,"sort":3,"stem":"《烛之武退秦师》中，“##既东封郑##，##又欲肆其西封##”具体描写了晋国的贪得无厌。"},{"poemId":900074,"sort":4,"stem":"《烛之武退秦师》中，晋侯认为轻易失去一个盟友的做法是不明智的句子是“##失其所与##，##不知##”。"},{"poemId":900074,"sort":5,"stem":"在《烛之武退秦师》一文中，烛之武认为如果秦伯放弃攻打郑国，会得到郑国提供的好处的句子是：##行李之往来##，##共其乏困##。"},{"poemId":900074,"sort":6,"stem":"烛之武说退秦军后，晋文公非常气愤。晋国大夫子犯请求攻打秦军，然而晋文公说“##因人之力而敝之##”，这是不仁道的。《烛之武退秦师》"},{"poemId":900074,"sort":7,"stem":"《烛之武退秦师》中烛之武以一个假设句否定了秦出兵的合理性，貌似谦恭，却极有分量，以退为进，也由此掌握了谈话的主动权：##若亡郑而有益于君 ##，##敢以烦执事##。"},{"poemId":900074,"sort":8,"stem":"《烛之武退秦师》一文中，烛之武给秦穆公分析越过晋国占领郑国不会给秦国带来好处的句子是：##越国以鄙远##，##君知其难也##。"},{"poemId":900074,"sort":9,"stem":"《烛之武退秦师》中，烛之武劝说秦伯，貌似谦恭，却极有分量，以一个假设句否定了秦出兵的合理性，也由此掌握了谈话的主动权，以退为进，柔中有刚：##若亡郑而有益于君 ##，##敢以烦执事##。"},{"poemId":900074,"sort":10,"stem":"《烛之武退秦师》中，“##因人之力而敝之##”一句表明一个人如果反过来去伤害曾经帮助过他的人，这是不仁道的；表明晋国国君背信弃义的一句是：“##朝济而夕设版焉##”。"},{"poemId":900074,"sort":11,"stem":"《烛之武退秦师》中，烛之武从地理位置说明“亡郑”于秦无益而有害的结果。当时秦在西，郑在东，晋位于两国之间，秦郑并不接壤，秦欲越晋据郑，绝无可能：##越国以鄙远##，##君知其难也##；##焉用亡郑以陪邻##？邻之厚，君之薄也。"},{"poemId":900074,"sort":12,"stem":"《烛之武退秦师》中，说出秦、晋围郑的原因的两句是：##以其无礼于晋##，##且贰于楚也##。"},{"poemId":900074,"sort":13,"stem":"《烛之武退秦师》中，“##因人之力而敝之##”一句表明一个人如果反过来去伤害曾经帮助过他的人，这是不仁道的；表明晋国国君背信弃义的一句是：“##朝济而夕设版焉##”。"},{"poemId":900074,"sort":14,"stem":"《烛之武退秦师》中，写秦伯听了烛之武的话很高兴、与郑国结盟的句子是：“##秦伯说##，##与郑人盟##”。"},{"poemId":900074,"sort":15,"stem":"《烛之武退秦师》中，烛之武劝说秦伯，貌似谦恭，却极有分量，以一个假设句“##若亡郑而有益于君##”否定了秦出兵的合理性，也由此掌握了谈话的主动权，以退为进，柔中有刚。"},{"poemId":900074,"sort":16,"stem":"烛之武说退秦军后，晋国大夫子犯请求攻打秦军，然而晋文公认为“不可”。他说:“因人之力而敝之”，这是不仁道的；“失其所与”，这是不明智的；“以乱易整”，这是不符合武德的。于是晋文公对子犯说“吾其还也”，晋国军队就离开了郑国。"},{"poemId":900074,"sort":17,"stem":"烛之武对本次战役的结果做了预测，认为“##阙秦以利晋##”，并进而希望秦伯能慎重考虑清楚。"},{"poemId":900074,"sort":18,"stem":"烛之武提及晋国的欲望很难得到满足时感叹：##夫晋##，##何厌之有##？"},{"poemId":900074,"sort":19,"stem":"烛之武说服秦伯时首先承认郑国已处于危亡的地步，“##秦、晋围郑##，##郑既知亡矣##”，但紧接着却以“##若亡郑而有益于君##，##敢以烦执事##”来表明自己为秦着想的立场。"},{"poemId":900074,"sort":20,"stem":"《烛之武退秦师》中，晋文公说失掉自己的同盟者是不明智的、用散乱代替整齐是不符合武德的句子是：“##失其所与##，##不知##；##以乱易整##，##不武##。”"},{"poemId":900076,"sort":1,"stem":"《谏逐客书》中，李斯用河海的例子证明有容乃大的句子是“##河海不择细流##，##故能就其深##”。"},{"poemId":900076,"sort":2,"stem":"《谏逐客书》中，李斯开篇指出驱逐客卿是错误的句子是：“##臣闻吏议逐客##，##窃以为过矣##。”"},{"poemId":900076,"sort":3,"stem":"广纳贤能是治国理政的重要方面。李斯《谏逐客书》以“水”为例说明君王应重视接纳人才的句子是“##河海不择细流##，##故能就其深##”。"},{"poemId":900076,"sort":4,"stem":"《谏逐客书》中，写秦孝公任用商鞅变法、移风易俗、使百姓殷实、国家富强的句子是：“##孝公用商鞅之法##，##移风易俗##，##民以殷盛##，##国以富强##。”"},{"poemId":900076,"sort":5,"stem":"《谏逐客书》中，总结四位君主都是依靠客卿功劳的句子是：“##此四君者##，##皆以客之功##。”"},{"poemId":900076,"sort":6,"stem":"《谏逐客书》中，以反问句指出客卿没有辜负秦国的句子是：“##由此观之##，##客何负于秦哉##！”"},{"poemId":900076,"sort":7,"stem":"《谏逐客书》中，写君王不拒绝民众、才能彰明其德行的句子是：“##王者不却众庶##，##故能明其德##。”"},{"poemId":900076,"sort":8,"stem":"《谏逐客书》中，说明国家强盛道理的句子是：“##地广者粟多##，##国大者人众##，##兵强则士勇##。”"},{"poemId":900076,"sort":9,"stem":"《谏逐客书》中，写士人不生在秦国、却愿意效忠秦国的句子是：“##士不产于秦##，##而愿忠者众##。”"},{"poemId":900076,"sort":10,"stem":"《谏逐客书》中，写如今驱逐客卿去帮助敌国、损害百姓去增益仇人的句子是：“##今逐客以资敌国##，##损民以益仇##。”"},{"poemId":900077,"sort":1,"stem":"“知足不辱”“知止不殆”，魏征深谙这些道理，正因如此，在《谏太宗十思疏》中，他告诫唐太宗“##见可欲则思知足以自戒##，##将有作则思知止以安人##”。"},{"poemId":900077,"sort":2,"stem":"《谏太宗十思疏》中用对比的手法来说明竭诚待人和轻视他人而带来不同结果的句子是：“##竭诚则胡越为一体##，##傲物则骨肉为行路##”。"},{"poemId":900077,"sort":3,"stem":"《谏太宗十思疏》中“##有善始者实繁##，##能克终者盖寡##”两句概括了历代君王能创业不能守成的普遍规律。"},{"poemId":900077,"sort":4,"stem":"在《谏太宗十思疏》中，魏征认为如果唐太宗能全面做到“十思”的要求和弘扬“九德”，并且在用人和从谏方面做到“##简能而任之##，##择善而从之##”，那么管理好这个国家就是一件很轻松的事了。"},{"poemId":900077,"sort":5,"stem":"魏征在《谏太宗十思疏》中劝谏唐太宗在大兴土木前应该做到“##将有作则思知止以安人##”。"},{"poemId":900077,"sort":6,"stem":"《论语》中“君子不以言举人，不以人废言”的选才纳言观点与魏征在《谏太宗十思疏》中的“##简能而任之##，##择善而从之##”相似。"},{"poemId":900077,"sort":7,"stem":"魏征《谏太宗十思疏》中表现“谦受益，满招损”意思的两句是“##惧满溢##，##则思江海下百川##”。"},{"poemId":900077,"sort":8,"stem":"魏征《谏太宗十思疏》开篇运用排喻的手法，引出了 “##思国之安者##，##必积其德义##”的结论。"},{"poemId":900077,"sort":9,"stem":"《谏太宗十思疏》中指出所谓取天下易守天下难的缘由是“##有善始者实繁##，##能克终者盖寡##”。"},{"poemId":900077,"sort":10,"stem":"在《谏太宗十思疏》中，魏征认为如果唐太宗能全面做到“十思”的要求和弘扬“九德”，并且在用人和从谏方面做到“##简能而任之##，##择善而从之##”，那么管理好这个国家就是一件很轻松的事了。"},{"poemId":900077,"sort":11,"stem":"《谏太宗十思疏》中魏征劝谏唐太宗赏罚分明，不因喜怒而有所偏颇的两句是“##恩所加则思无因喜以谬赏##，##罚所及则思无以怒而滥刑##。”"},{"poemId":900077,"sort":12,"stem":"《谏太宗十思疏》中，魏征运用对比来论证对人的态度不同，其结果反差强烈，从而说明能否以诚相待是事业成败关键的两句是“##竭诚则胡越为一体##，##傲物则骨肉为行路##”。"},{"poemId":900077,"sort":13,"stem":"魏征《谏太宗十思疏》善用典故，“##念高危则思谦冲而自牧##”借“谦谦君子”的典故劝谏太宗要加强道德修养；“##乐盘游则思三驱以为度##”引“网开一面”的典故劝谏太宗要田猎有度。"},{"poemId":900077,"sort":14,"stem":"《谏太宗十思疏》中，魏征用一个真切生动的比喻来说明帝王与百姓之间的辩证关系的句子是：##载舟覆舟##，##所宜深慎##。"},{"poemId":900077,"sort":15,"stem":"《谏太宗十思疏》中，以种树、治水为喻引出治国要积累德义的句子是：“##臣闻求木之长者##，##必固其根本##；##欲流之远者##，##必浚其泉源##。”"},{"poemId":900078,"sort":1,"stem":"王安石在《答司马谏议书》中用“##举先王之政##，##以兴利除弊##”来论证新法不算是制造事端。"},{"poemId":900078,"sort":2,"stem":"在《答司马谏议书》中，王安石认为自己与司马光议政时常常意见相左，是因为“##所操之术多异故也##”。"},{"poemId":900078,"sort":3,"stem":"盘庚迁都，面对群起而怨恨的老百姓，盘庚的做法是：“##度义而后动##，##是而不见可悔故也##。”王安石在《答司马谏议书》中认为这是改革家应有的行事准则。"},{"poemId":900078,"sort":4,"stem":"在《答司马谏议书》中，王安石对司马光信中冠之以“生事”罪名加以反驳的三句是：##举先王之政##，##以兴利除弊##，##不为生事##。"},{"poemId":900078,"sort":5,"stem":"在《答司马谏议书》中，王安石与司马光虽无缘见面，但对司马光充满了仰慕之情。在结尾用“##无由会晤##，##不任区区向往之至##”两句聊表敬意。"},{"poemId":900078,"sort":6,"stem":"王安石的《答司马谏议书》以“##举先王之政##，##以兴利除弊##”两句说明变法上合先王之道，下利国家百姓，驳斥“生事”之说。"},{"poemId":900078,"sort":7,"stem":"在《答司马谏议书》中，“##度义而后动##，##是而不见可悔故也##”,可以说是王安石的行事准则，也是历史上一切改革家刚决精神的一种概括。"},{"poemId":900078,"sort":8,"stem":"王安石在《答司马谏议书》中引用盘庚迁都遇阻却毫不退缩的史实“##盘庚不为怨者故改其度##，##度义而后动##，##是而不见可悔故也##”，表明自己不同俗媚众、坚持变法的决心。"},{"poemId":900078,"sort":9,"stem":"《答司马谏议书》中，王安石驳斥保守派主张的论证立足点是：##名实已明##，##而天下之理得矣##。"},{"poemId":900078,"sort":10,"stem":"《答司马谏议书》中，王安石指出意见不合是因为所持政治主张多有不同的句子是：“##而议事每不合##，##所操之术多异故也##。”"},{"poemId":900079,"sort":1,"stem":"《阿房宫赋》中说明阿房宫构建的位置的句子是“##骊山北构而西折##，##直走咸阳##”。"},{"poemId":900079,"sort":2,"stem":"《阿房宫赋》中写楼阁依地势而建，互相环抱呼应的句子是：##各抱地势##，##钩心斗角##。"},{"poemId":900079,"sort":3,"stem":"杜牧在《阿房宫赋》中向当朝统治者敲响警钟的句子：##后人哀之而不鉴之##，##亦使后人而复哀后人也##。"},{"poemId":900079,"sort":4,"stem":"杜牧的《阿房宫赋》中“##奈何取之尽锱铢##，##用之如泥沙##”这个对偶句写出了秦人毫不珍惜掠夺的珍宝，生活极度奢侈。"},{"poemId":900079,"sort":5,"stem":"杜牧在《阿房宫赋》中用“##鼎铛玉石##，##金块珠砾##”两句描写了秦人对从六国剽掠而来的珍宝不知珍惜，生活极度奢侈。"},{"poemId":900079,"sort":6,"stem":"《阿房宫赋》中杜牧总结了秦王朝灭亡的历史教训后，借古讽今，画龙点睛地表明写作动机的句子是：##后人哀之而不鉴之##，##亦使后人而复哀后人也##”。"},{"poemId":900079,"sort":7,"stem":"杜牧在《阿房宫赋》中表现这座庞大的宫殿依山势而设计、结构精巧的特点的句子是：“##各抱地势##，##钩心斗角##。”"},{"poemId":900079,"sort":8,"stem":"《阿房宫赋》开篇杜牧不吝想象，粗笔勾勒全貌，言阿房宫占地之广，状其楼阁之高的句子是“##覆压三百余里##，##隔离天日##”。"},{"poemId":900079,"sort":9,"stem":"杜牧在《阿房宫赋》中向当朝统治者敲响警钟的句子：##后人哀之而不鉴之##，##亦使后人而复哀后人也##。"},{"poemId":900079,"sort":10,"stem":"在《阿房宫赋》中，杜牧仅用八个字就把项羽火烧阿房宫的史实写了出来：“##楚人一炬##，##可怜焦土##。”"},{"poemId":900079,"sort":11,"stem":"杜牧《阿房宫赋》中以“##一肌一容##，##尽态极妍##”描写阿房宫宫人的美丽，她们伫立远眺，盼望着皇帝临幸。"},{"poemId":900079,"sort":12,"stem":"《阿房宫赋》用一天之中气候冷暖不同描绘阿房宫歌舞升平的景象，其中表现“暖”的语句是：##歌台暖响##，##春光融融##。"},{"poemId":900079,"sort":13,"stem":"《阿房宫赋》中以“##缦立远视##，##而望幸焉##”两句描写阿房宫宫人的美丽，她们伫立远眺，盼望着皇帝临幸。"},{"poemId":900079,"sort":14,"stem":"杜牧在《阿房宫赋》的结尾处感叹道，如果六国爱护自己的百姓，就足以抵抗秦国，紧接着说：“##使秦复爱六国之人##，##则递三世可至万世而为君##，##谁得而族灭也##？”"},{"poemId":900079,"sort":15,"stem":"杜牧《阿房宫赋》中“##覆压三百余里##”一句直接点明阿房宫占地广阔，而“##骊山北构而西折##”则指出阿房宫是依着山势走向修建的。"},{"poemId":900079,"sort":16,"stem":"《阿房宫赋》中，杜牧分析了秦国灭亡的原因，指出假如国君懂得关心百姓，秦国就会得以延续的句子是“##使秦复爱六国之人##，##则递三世可至万世而为君##。”"},{"poemId":900079,"sort":17,"stem":"杜牧在《阿房宫赋》中用排比句渲染阿房宫繁华奢靡，与老百姓的劳作吃穿等生活作对比，其中写所奏之乐与人们言语对比的句子是“##管弦呕哑##，##多于市人之言语##”。"},{"poemId":900079,"sort":18,"stem":"杜牧的《阿房宫赋》里写阿房宫由于楼阁众多、高大，导致不同的时间不同的地方给人的感觉完全不一样的句子是：##一日之内##，##一宫之间##，##而气候不齐##。"},{"poemId":900079,"sort":19,"stem":"《阿房宫赋》中从人们的主观感受写宫内歌舞盛况。既是以歌舞之纷繁衬托宫殿之众多，又为下文美女充盈宫室预作铺垫的句子是：“##歌台暖响春光融融##; ##舞殿冷袖风雨凄凄##。”"},{"poemId":900079,"sort":20,"stem":"在《阿房宫赋》中，以闪亮的明星来比喻宫人打开的妆镜的语句是：“##明星荧荧##，##开妆镜也##。”"},{"poemId":900080,"sort":1,"stem":"《六国论》中描写祖辈创业艰难的句子：“##暴霜露##，##斩荆棘##”。"},{"poemId":900080,"sort":2,"stem":"《六国论》中论述齐国灭亡根源的句子是：##不赂者以赂者丧##。论述齐国灭亡直接原因的句子是：##与嬴而不助五国也##。而燕国虽然小却在最后灭亡的原因是“##斯用兵之效也##”。"},{"poemId":900080,"sort":3,"stem":"苏洵在《六国论》中告诫统治者不要被强敌的积威吓倒的句子是：##为国者无使为积威之所劫哉##。"},{"poemId":900080,"sort":4,"stem":"《六国论》中，明确体现文章借古讽今和告诫北宋统治者要吸取历史教训这一主旨的句子是：##苟以天下之大##，##下而从六国破亡之故事##，##是又在六国下矣##。"},{"poemId":900080,"sort":5,"stem":"《六国论》中说明齐国灭亡的原因的句子是：##与嬴而不助五国也##；说明燕国灭亡原因的句子是：##至丹以荆卿为计##，##始速祸焉##。"},{"poemId":900080,"sort":6,"stem":"苏洵《六国论》告诫统治者要吸取的历史教训是“##为国者无使为积威之所劫哉##”。"},{"poemId":900080,"sort":7,"stem":"苏洵在《六国论》中敏锐地指出了对抗秦国的办法“##以赂秦之地封天下之谋臣##，##以事秦之心礼天下之奇才##”， 此举会让对方寝食难安。"},{"poemId":900080,"sort":8,"stem":"《六国论》中作者批评赵国杀害良将，不能武力抗秦坚持到底的句子是：##牧以馋诛##，##邯郸为郡##，##惜其用武而不终也##。"},{"poemId":900080,"sort":9,"stem":"《六国论》中，苏洵用以表达其创作意图的一句话是“##苟以天下之大##，##下而丛六国破亡之故事##，##是又在六国下矣##。”"},{"poemId":900080,"sort":10,"stem":"关于荆轲刺秦王，历来颇多赞语，当然也有持不同意见的，如苏洵在《六国论》中就这样评论刺秦事件：##至丹以荆卿为计##，##始速祸焉##。"},{"poemId":900080,"sort":11,"stem":"在《六国论》中，苏洵提出六国灭亡的原因是“##弊在赂秦##”，并假设六国拿赂秦的土地财物封赏给贤臣奇才，合力抗秦的结果会是“##则吾恐秦人食之不得下咽也##”。"},{"poemId":900080,"sort":12,"stem":"秦与六国的灭亡史常被后人用来针砭时弊，苏洵《六国论》则以泱泱大国“##下而从六国破亡之故事##”表达对重蹈覆辙的忧虑。"},{"poemId":900080,"sort":13,"stem":"苏洵在《六国论》中，用“##暴霜露##，##斩荆棘##”描写六国的祖辈创业的艰难，但他们的子孙对得来的土地却不太珍惜。"},{"poemId":900080,"sort":14,"stem":"借古讽今是古代文人创作时常用的手法之一，如苏洵在《六国论》的开头先用“##弊在赂秦##”归纳了六国灭亡的原因，又在结尾处用“##为国者无使为积威之所劫哉##”警告北宋统治者不要采取妥协苟安的外交政策。"},{"poemId":900080,"sort":15,"stem":"在《六国论》的结尾，苏洵用假设的方式警告宋朝统治者“##苟以天下之大##, ##下而从六国破亡之故事##”，那就连六国都不如了。"},{"poemId":900081,"sort":1,"stem":"班会课上王老师告诫同学们，不要像白居易《琵琶行》中所写的“##今年欢笑复明年##，##秋月春风等闲度##”那样，在一天天的嬉戏中荒废年华。"},{"poemId":900081,"sort":2,"stem":"白居易《琵琶行并序》中的“##住近湓江地低湿##，##黄芦苦竹绕宅生##”两句，交代了他谪居于浔阳之后的居所的地势特点以及周围的环境。"},{"poemId":900081,"sort":3,"stem":"《琵琶行并序》中，点明送别时间、地点和环境的句子是：“##浔阳江头夜送客##，##枫叶荻花秋瑟瑟##。”"},{"poemId":900081,"sort":4,"stem":"《琵琶行并序》中，写主客举酒欲饮却无音乐助兴的句子是：“##主人下马客在船##，##举酒欲饮无管弦##。”"},{"poemId":900081,"sort":5,"stem":"《琵琶行并序》中，以银瓶破裂、铁骑突出比喻乐声激越的句子是：“##银瓶乍破水浆迸##，##铁骑突出刀枪鸣##。”"},{"poemId":900081,"sort":6,"stem":"《琵琶行并序》中，表达诗人与琵琶女同病相怜、身世共鸣的句子是：“##同是天涯沦落人##，##相逢何必曾相识##！”"},{"poemId":900081,"sort":7,"stem":"《琵琶行并序》中，写诗人谪居浔阳、住地低洼潮湿、黄芦苦竹环绕住宅的句子是：“##住近湓江地低湿##，##黄芦苦竹绕宅生##。”"},{"poemId":900081,"sort":8,"stem":"《琵琶行并序》中，诗人用“##别有幽愁暗恨生##，##此时无声胜有声##”的佳句描绘了余音袅袅，余意无穷的艺术境界，令人拍案叫绝。"},{"poemId":900081,"sort":9,"stem":"《琵琶行并序》中，“##银瓶乍破水浆迸##，##铁骑突出刀枪鸣##”两句形容琵琶声在沉寂之后，忽然又爆发出激越雄壮的乐音。"},{"poemId":900081,"sort":10,"stem":"《琵琶行并序》中，“##五陵年少争缠头##，##一曲红绡不知数##”两句写出了昔日琵琶女名噪一时，令众多纨绔子弟争相追捧的情景。"},{"poemId":900081,"sort":11,"stem":"《琵琶行并序》中，“##嘈嘈切切错杂弹##，##大珠小珠落玉盘##”两句写诗人由琵琶声想到珠玉声，这是声音的类比联想。"},{"poemId":900081,"sort":12,"stem":"《琵琶行并序》中描写琵琶女刚出场时羞涩情态的诗句是:  ##千呼万唤始出来##，##犹抱琵琶半遮面##。"},{"poemId":900081,"sort":13,"stem":"白居易《琵琶行并序》中“##大弦嘈嘈如急雨##，##小弦切切如私语##”两句运用比喻的修辞、对比的手法正面描写琵琶声。"},{"poemId":900081,"sort":14,"stem":"《琵琶行并序》中，白居易用环境描写以衬托琵琶乐曲之动人的诗句是“##东船西舫悄无言##，##唯见江心秋月白##” 。"},{"poemId":900081,"sort":15,"stem":"《琵琶行并序》中点明诗人送别友人这一事件并渲染悲凉气氛的诗句是“##浔阳江头夜送客##，##枫叶荻花秋瑟瑟##”。"},{"poemId":900082,"sort":1,"stem":"《竹里馆》中写夜静人寂、明月相伴的诗句是：##深林人不知##，##明月来相照##。"},{"poemId":900082,"sort":2,"stem":"“##独坐幽篁里##，##弹琴复长啸##”（王维《竹里馆》）中的琴声，衬托出月夜竹林的幽静。"},{"poemId":900082,"sort":3,"stem":"从古诗文中，我们可以感受到作者的苦乐悲欢。王维《竹里馆》中的“##深林人不知##，##明月来相照##”，让人感受月照竹林的自然情趣。"},{"poemId":900082,"sort":4,"stem":"“##独坐幽篁里##，##弹琴复长啸##。”该诗句出自唐代诗人王维的《竹里馆》，全诗用语平淡自然，却写出了清幽的氛围与淡泊的心态，达到了“诗中有画”的高超境界。"},{"poemId":900082,"sort":5,"stem":"诗有景，景寓情。王维与自然对话，在明月相伴的时光里，写下了“##深林人不知##，##明月来相照##”（《竹里馆》）充分感悟隐居生活的美好情趣。"},{"poemId":900082,"sort":6,"stem":"《竹里馆》中表现诗人安闲自得的隐居生活的句子是：“##独坐幽篁里##，##弹琴复长啸##”。"},{"poemId":900082,"sort":7,"stem":"《竹里馆》中写明月皎洁，惬意相伴的诗句是：##深林人不知##，##明月来相照##。"},{"poemId":900082,"sort":8,"stem":"《竹里馆》一诗中，写诗人独自坐在竹林里进行一系列活动的诗句是：##独坐幽篁里##，##弹琴复长啸##。"},{"poemId":900082,"sort":9,"stem":"诗人是文学世界里美丽的星。这颗星是“诗佛”王维，《竹里馆》中“##深林人不知##，##明月来相照##”的清幽之境便由他创造。"},{"poemId":900082,"sort":10,"stem":"王维《竹里馆》中“##独坐幽篁里##，##弹琴复长啸##”，写出淡泊自守的心境。"},{"poemId":900083,"sort":1,"stem":"《春夜洛城闻笛》中表达诗人对家乡思念的句子是：##此夜曲中闻折柳##，##何人不起故园情##。"},{"poemId":900083,"sort":2,"stem":"《春夜洛城闻笛》一诗中，形容笛声悠扬、深远、飘忽不定情状的两句是：##谁家玉笛暗飞声##，##散入春风满洛城##。"},{"poemId":900083,"sort":3,"stem":"《春夜洛城闻笛》中在暗中拨动许多游子的心弦，引发思乡之情的诗句是：##此夜曲中闻折柳##，##何人不起故园情##。"},{"poemId":900083,"sort":4,"stem":"李白《春夜洛城闻笛》一诗中，从笛声落笔，写笛声传遍洛阳城的情景的两句是：##谁家玉笛暗飞声##，##散入春风满洛城##。"},{"poemId":900083,"sort":5,"stem":"李白《春夜洛城闻笛》中表达诗人对家乡的依恋和思乡之情的两句是：##此夜曲中闻折柳##，##何人不起故园情##。"},{"poemId":900083,"sort":6,"stem":"思乡是萦绕在漂泊异乡之人心中难以释怀的情愫。李白《春夜洛城闻笛》中的“##此夜曲中闻折柳##，##何人不起故园情##”闻曲思乡，抒写离人的不舍，余味无穷。"},{"poemId":900083,"sort":7,"stem":"春天是四季之一，但在诗人眼中，一切景语皆情语。李白在《春夜洛城闻笛》中的“##谁家玉笛暗飞声##，##散入春风满洛城##”写到的笛声和春风，勾起了诗人无尽的相思。"},{"poemId":900083,"sort":8,"stem":"《春夜洛城闻笛》中因笛声唤起游子浓浓思乡之情的诗句是：##此夜曲中闻折柳##，##何人不起故园情##。"},{"poemId":900083,"sort":9,"stem":"《春夜洛城闻笛》一诗中，诗人听到《折杨柳》而引发自身浓郁的思乡之情的句子是：##此夜曲中闻折柳##，##何人不起故园情##。"},{"poemId":900083,"sort":10,"stem":"李白《春夜洛城闻笛》中触动诗人羁旅情怀，夸张主观感受的语句是：##此夜曲中闻折柳##，##何人不起故园情##。"},{"poemId":900084,"sort":1,"stem":"岑参《逢入京使》一诗中，写诗人由于行色匆匆，只好用捎口信方式表达怀亲之情的两句是：##马上相逢无纸笔##，##凭君传语报平安##。"},{"poemId":900084,"sort":2,"stem":"《逢入京使》中颇带夸张意味，强调思家之情的一句是：##双袖龙钟泪不干##。"},{"poemId":900084,"sort":3,"stem":"岑参在《逢入京使》中偶遇老友，欣喜之余托友报平安的诗句是：##马上相逢无纸笔##，##凭君传语报平安##。"},{"poemId":900084,"sort":4,"stem":"仰望历史的天空，家国情怀熠熠生辉；穿越时间的长河，家国情怀绵绵不断。家，是一缕散不去的乡愁，它是岑参“##故园东望路漫漫##，##双袖龙钟泪不干##”（《逢入京使》）亲人远隔的泪雨滂沱。"},{"poemId":900084,"sort":5,"stem":"《逢入京使》当中，写出诗人思念亲人，又不愿让亲人挂念复杂情感的诗句是：##马上相逢无纸笔##，##凭君传语报平安##。"},{"poemId":900084,"sort":6,"stem":"从岑参《逢入京使》中的“##马上相逢无纸笔##，##凭君传语报平安##”可以看出，诗人远赴边关，不忍家人惦念，即使行色匆匆，也要托人给家里捎去口信，牵挂之情跃然纸上。"},{"poemId":900084,"sort":7,"stem":"从古诗文中，我们可以感受到作者的苦乐悲欢。《逢入京使》中的“##马上相逢无纸笔##，##凭君传语报平安##”，让人感受到思念亲人而又不想让亲人牵挂的复杂情感。"},{"poemId":900084,"sort":8,"stem":"岑参《逢入京使》一诗中，写诗人由于思念家乡亲人泪眼婆娑的句子是：“##故园东望路漫漫##，##双袖龙钟泪不干##。”"},{"poemId":900084,"sort":9,"stem":"《逢入京使》中诗人借走马相逢的生活细节描写，蕴含诗人复杂情感的诗句是：##马上相逢无纸笔##，##凭君传语报平安##。（岑参《逢入京使》）"},{"poemId":900084,"sort":10,"stem":"《逢入京使》中运用夸张手法传达惜别深情的诗句是：##故园东望路漫漫##，##双袖龙钟泪不干##。"},{"poemId":900085,"sort":1,"stem":"《晚春》中的“##杨花榆荚无才思##，##惟解漫天作雪飞##”，从反面衬托出春光的无限珍贵。"},{"poemId":900085,"sort":2,"stem":"韩愈在万紫千红的暮春时节里，写下了“##草木知春不久归##，##百般红紫斗芳菲##”（《晚春》）诉说着对春天无限的情思。"},{"poemId":900085,"sort":3,"stem":"韩愈《晚春》中“##杨花榆荚无才思##，##惟解漫天作雪飞##”运用拟人手法借杨、榆写出对春天的留恋。"},{"poemId":900085,"sort":4,"stem":"《晚春》中，生动地写出晚春时节花草树木竞相开放的美丽景象的诗句是：##草木知春不久归##，##百般红紫斗芳菲##。"},{"poemId":900085,"sort":5,"stem":"“##杨花榆荚无才思##，##惟解漫天作雪飞##”（《晚春》），漫天的杨花榆荚飘荡在晚春，生机勃勃的景象蕴藏着韩愈积极进取、珍惜时光的鼓励。"},{"poemId":900085,"sort":6,"stem":"韩愈《晚春》一诗中，杨花榆荚因惜春而争奇斗艳、尽情舒展生命本色的句子是：“##草木知春不久归##，##百般红紫斗芳菲##。”"},{"poemId":900085,"sort":7,"stem":"花无语，人有情。古人常借花草表情达意。有韩愈“##杨花榆荚无才思##，##惟解漫天作雪飞##。”（《晚春》）写杨花的不甘示弱。"},{"poemId":900085,"sort":8,"stem":"韩愈的《晚春》中花草树木皆有情思，其中它们面对即将离去的春天，尽情舒展生命本色的诗句：##草木知春不久归##，##百般红紫斗芳菲##。"},{"poemId":900085,"sort":9,"stem":"现在正值暮春时节，满城柳絮飞舞，让人联想到韩愈《晚春》中的诗句：##杨花榆荚无才思##，##惟解漫天作雪飞##。"},{"poemId":900085,"sort":10,"stem":"咏“##杨花榆荚无才思##，##惟解漫天作雪飞##”（《晚春》），领悟韩愈哪怕年事己高，依然珍惜春光，乘时而进的豪情。"},{"poemId":900001,"sort":1,"stem":"曹操的《观沧海》中，以丰富的想象和夸张的手法写大海吞吐日月的句子是“##日月之行##，##若出其中##”。"},{"poemId":900001,"sort":2,"stem":"《观沧海》中通过写草木欣欣向荣的景象把大海渲染得生机勃发的句子是：##树木丛生##，##百草丰茂##。"},{"poemId":900001,"sort":3,"stem":"曹操在《观沧海》一诗中，特写海面之景，突出风浪景象的诗句是：##秋风萧瑟##，##洪波涌起##。"},{"poemId":900001,"sort":4,"stem":"《观沧海》一诗中，展现山岛上树木繁密、草木茂盛的句子是：##树木丛生##，##百草丰茂##。"},{"poemId":900001,"sort":5,"stem":"《观沧海》中最能反映诗人博大胸襟的诗句是：##日月之行##，##若出其中##；##星汉灿烂##，##若出其里##。"},{"poemId":900001,"sort":6,"stem":"《观沧海》中，写观海全景，渲染大海苍茫动荡气势的句子是：##水何澹澹##，##山岛竦峙##。"},{"poemId":900001,"sort":7,"stem":"《观沧海》中运用动静结合手法的句子是“##水何澹澹##，##山岛竦峙##”。"},{"poemId"
