n makeSenseGroups(rows){const map=new Map();rows.forEach(row=>{const key=senseKey(row);if(!map.has(key))map.set(key,{key,wordClass:row.wordClass,word:row.word,pinyin:row.pinyin,meaning:row.meaning,rows:[]});map.get(key).rows.push(row)});return [...map.values()]}function makeGroups(rows){const map=new Map();rows.forEach(row=>{const key=[row.wordClass,row.word].join('|');if(!map.has(key))map.set(key,{key,wordClass:row.wordClass,word:row.word,pinyin:row.pinyin,senses:[]})});map.forEach(group=>{group.senses=makeSenseGroups(rows.filter(row=>row.wordClass===group.wordClass&&row.word===group.word))});return [...map.values()]}function optionMarkup(items,highlight){return items.map((item,index)=>{const text=String(item??'');const unavailable=text==='暂无例句';return '<div class="option'+(unavailable?' option-unavailable':'')+'" data-label="'+String.fromCharCode(65+index)+'">'+(highlight?rich(text):esc(text))+'</div>'}).join('')}function exampleMarkup(row){const action=row.questionEnabled?'<button class="example-question-btn" data-open-row="'+row.id+'">查看题目</button>':'<span class="example-study-note">例句积累</span>';return '<div class="example-row"><div class="example-text">'+rich(row.example)+'</div><div class="example-footer"><div class="example-meta"><span>'+esc(row.book)+'</span><span>'+esc(row.exampleTrans)+'</span></div><div class="example-actions">'+action+'</div></div></div>'}function cardMarkupFor(group){const tabs=group.senses.map((sense,index)=>'<button class="sense-tab'+(index===0?' active':'')+'" data-sense-tab="'+index+'"><b>'+esc(sense.meaning)+'</b><small>'+esc(sense.pinyin)+' · '+sense.rows.length+' 个例句</small></button>').join('');const panels=group.senses.map((sense,index)=>'<section class="sense-panel'+(index===0?' active':'')+'" data-sense-panel="'+index+'"><div class="meaning-head"><span class="type-tag">'+(sense.wordClass===1?'实词':'虚词')+'</span><b>'+esc(sense.meaning)+'</b></div>'+sense.rows.map(exampleMarkup).join('')+'</section>').join('');return '<article class="word-card" data-class="'+(group.wordClass===1?'实词':'虚词')+'"><div class="word-card-head"><div><div class="word-title">'+esc(group.word)+'</div><div class="pinyin">'+esc(group.pinyin)+'</div></div></div><div class="sense-tabs">'+tabs+'</div><div class="sense-panels">'+panels+'</div></article>'}function bindCards(){cardGrid.querySelectorAll('[data-sense-tab]').forEach(tab=>tab.onclick=()=>{const card=tab.closest('.word-card');card.querySelectorAll('[data-sense-tab]').forEach(item=>item.classList.toggle('active',item===tab));card.querySelectorAll('[data-sense-panel]').forEach(panel=>panel.classList.toggle('active',panel.dataset.sensePanel===tab.dataset.senseTab))});cardGrid.querySelectorAll('[data-open-row]').forEach(button=>button.onclick=()=>openDrawer(button.dataset.openRow))}function draw(){const cls=classFilter.value;const version=versionFilter.value;const volume=volumeFilter.value;const book=bookFilter.value;const filtered=records.filter(row=>(cls==='全部'||(row.wordClass===1?'实词':'虚词')===cls)&&(version==='全部'||row.versionId===version)&&(volume==='全部'||row.volumeId===volume)&&(book==='全部'||row.book===book));const groups=makeGroups(filtered);visibleCount.textContent=groups.length;cardGrid.innerHTML=groups.length?groups.map(cardMarkupFor).join(''):'<div class="empty">当前筛选范围暂无词义内容</div>';bindCards()}function openDrawer(rowId){const row=records.find(item=>item.id===Number(rowId));if(!row||!row.questionEnabled)return;const q1=[row.meaning].concat(row.distractors);const q2=row.compareOptions;drawerBody.innerHTML='<div class="drawer-head"><div><h2>'+esc(row.word)+'</h2><div class="drawer-subtitle">'+esc(row.pinyin)+' · '+(row.wordClass===1?'实词':'虚词')+' · '+esc(row.meaning)+'</div></div><button class="drawer-close" id="closeDrawer">关闭</button></div><section class="question-group"><div class="question-source">'+esc(row.book)+' · 对应例句</div><div class="drawer-example">'+rich(row.example)+'</div><div class="question-box"><span class="question-label">题型一 · 词义选择</span><div class="question-stem">下列对例句中“'+esc(row.word)+'”的解释，正确的一项是</div><div class="options">'+optionMarkup(q1,false)+'</div></div><div class="question-box"><span class="question-label">题型二 · 辨析选择</span><div class="question-stem">下列句子中“'+esc(row.word)+'”的意义和用法，与例句相同的一项是</div><div class="options">'+optionMarkup(q2,true)+'</div></div></section><div class="hint">本页面仅用于人工预览内容可读性，题目选项不展示答案状态。</div>';drawer.classList.add('open');mask.classList.add('open');document.querySelector('#closeDrawer').onclick=closeDrawer}function closeDrawer(){drawer.classList.remove('open');mask.classList.remove('open')}const versionNames=[...new Map(records.map(row=>[row.versionId,row.versionName]).filter(([id])=>id)).entries()];versionFilter.innerHTML='<option value="全部">全部教材版本</option>'+versionNames.map(([id,name])=>'<option value="'+esc(id)+'">'+esc(name)+'</option>').join('');function refreshVolumes(){const version=versionFilter.value;const volumes=[...new Map(records.filter(row=>version==='全部'||row.versionId===version).map(row=>[row.volumeId,row.volumeName]).filter(([id])=>id)).entries()];volumeFilter.innerHTML='<option value="全部">全部分册</option>'+volumes.map(([id,name])=>'<option value="'+esc(id)+'">'+esc(name)+'</option>').join('');refreshBooks();}function refreshBooks(){const version=versionFilter.value;const volume=volumeFilter.value;const books=[...new Set(records.filter(row=>(version==='全部'||row.versionId===version)&&(volume==='全部'||row.volumeId===volume)).map(row=>row.book).filter(Boolean))];bookFilter.innerHTML='<option value="全部">全部篇目</option>'+books.map(name=>'<option value="'+esc(name)+'">'+esc(name)+'</option>').join('');}versionFilter.onchange=()=>{refreshVolumes();draw()};volumeFilter.onchange=()=>{refreshBooks();draw()};classFilter.onchange=draw;bookFilter.onchange=draw;mask.onclick=closeDrawer;refreshVolumes();draw();</script><script id="word-copy-tools">
function copyPlainText(text){
  const area=document.createElement('textarea');
  area.value=text; area.setAttribute('readonly',''); area.style.position='fixed'; area.style.opacity='0';
  document.body.appendChild(area); area.select();
  const copied=document.execCommand('copy'); area.remove(); return copied;
}
async function copyRow(rowId,button){
  const row=records.find(item=>item.id===Number(rowId)); if(!row)return;
  const ids=row.questionIds||{};
  const content=[
    'edu_chn_word_sense.id: '+row.id,
    'edu_chn_word_question.id（题型一）: '+(ids.type1||'无题目'),
    'edu_chn_word_question.id（题型二）: '+(ids.type2||'无题目'),
    '原词: '+row.word,
    '释义: '+row.meaning,
    '篇目: '+row.book,
    '来源: '+row.source,
    '原文: '+String(row.example||'').replace(/<[^>]+>/g,''),
    '译文: '+(row.exampleTrans||'')
  ].join('\n');
  let copied=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(content);copied=true;}}catch(error){}
  if(!copied)copied=copyPlainText(content);
  const old=button.textContent; button.textContent=copied?'已复制':'复制失败';
  window.setTimeout(()=>{button.textContent=old;},1200);
}
function exampleMarkup(row){
  const action=row.questionEnabled?'<button class="example-question-btn" data-open-row="'+row.id+'">查看题目</button>':'<span class="example-study-note">例句积累</span>';
  const copy='<button class="example-copy-btn" data-copy-row="'+row.id+'">复制</button>';
  return '<div class="example-row"><div class="example-text">'+rich(row.example)+'</div><div class="example-footer"><div class="example-meta"><span>'+esc(row.book)+'</span><span>'+esc(row.exampleTrans)+'</span></div><div class="example-actions">'+action+copy+'</div></div></div>';
}
function bindCards(){
  cardGrid.querySelectorAll('[data-sense-tab]').forEach(tab=>tab.onclick=()=>{const card=tab.closest('.word-card');card.querySelectorAll('[data-sense-tab]').forEach(item=>item.classList.toggle('active',item===tab));card.querySelectorAll('[data-sense-panel]').forEach(panel=>panel.classList.toggle('active',panel.dataset.sensePanel===tab.dataset.senseTab));});
  cardGrid.querySelectorAll('[data-open-row]').forEach(button=>button.onclick=()=>openDrawer(button.dataset.openRow));
  cardGrid.querySelectorAll('[data-copy-row]').forEach(button=>button.onclick=()=>copyRow(button.dataset.copyRow,button));
}
draw();
