 }

   return '<div class="text-panel"><div class="panel-head"><div><div class="eyebrow">背诵模式 · '+(completed+1)+' / '+all.length+' 句</div><h3>逐句回忆，段落仅用于展示</h3></div><button class="pill blue hint-toggle" data-action="toggle-recite-hint">'+(state.reciteHintVisible?"隐藏首字":"展示首字")+'</button></div><div class="progress"><i style="width:'+(completed/all.length*100)+'%"></i></div><div class="recite-box"><div class="recite-label">按顺序逐句背诵，完成句高亮显示</div><div class="recite-segments">'+blocks+'</div><div class="recite-actions"><button class="ghost-btn" data-action="toggle-recite-full">'+(state.reciteFullVisible?"继续背":"看提示")+'</button><button class="primary-btn" data-action="complete-recite-sentence">背完了</button><button class="text-btn" data-action="exit-recite">退出背诵</button></div></div></div>';
 }

 let content="";
 if(supportTab==="译文")content='<div class="translation">'+esc(p.translation)+'</div>';
 else {const copy={"注释":"重点字词、通假字和句式注释将在内容完善后开放。","赏析":"围绕意象、手法、情感和表达效果的赏析内容将在后续开放。","作者简介":"作者生平、创作背景和代表作品将在后续开放。"}[supportTab];content='<div class="placeholder-panel"><div class="placeholder-icon">✦</div><h3>'+supportTab+'内容预留</h3><p>'+copy+'</p><span class="pill gold" style="margin-top:12px">敬请期待</span></div>'}

function renderDirect(p){

 const modeTip=state.directMode==="full"?"整篇默写：每句全部挖空。":"上下句默写：每句随机展示上句或下句，填写另一半。";

function renderDirectResult(p){
 const sentences=poemSentences(p),pattern=ensurePairPattern(p),perfect=directBlankRate(p)===100,count=state.directPerfectCountdown||3;
 const lines=sentences.map((sentence,i)=>{const parts=splitSentence(sentence),typed=String(state.directClozeAnswers[i]||"").trim(),target=directBlankTarget(p,i),correct=normalizeAnswer(typed)===normalizeAnswer(target),shown=state.directMode==="pair"?(pattern[i]?parts.first+parts.separator:""):"",suffix=state.directMode==="pair"?(pattern[i]?"":parts.separator+parts.second):"";return '<div class="review-line"><div class="review-line-main"><span class="review-line-index">'+(i+1)+'.</span><span class="review-prefix">'+esc(shown)+'</span><span class="review-blank-cell '+(correct?"correct":"")+'">'+esc(typed||"未作答")+'</span><span class="review-suffix">'+esc(suffix)+'</span></div>'+(!correct?'<div class="review-correct-line">'+esc(target)+'</div>':"")+'</div>'}).join("");
 const nextAction=perfect?'<button class="ghost-btn" data-action="go-comp">去理解练习 '+count+'s</button>':'<button class="ghost-btn" data-action="go-comp">去理解练习</button>';

function renderComprehension(p){
 const round=ensureCompRound(p),position=state.compQuestion,questionIndex=round[position],q=p.comprehension[questionIndex],result=state.compResults[position],answer=state.compAnswers[position]||"";
 const firstUnsubmitted=round.findIndex((_,i)=>!state.compResults[i]);
 const nextAllowed=firstUnsubmitted<0?round.length-1:firstUnsubmitted;

 if(a==="mark-practice-focus"){const w=practicePool()[Number(el.dataset.wordIndex||0)],key=wordKey(w),next=!state.focusedWords[key];state.focusedWords[key]=next;toast(next?"已收藏到重点词卡":"已取消重点收藏");return render();}
 if(a==="mark-learned"){const w=currentWord(),key=wordKey(w);if(!state.learned[key]){state.learned[key]=true;const now=recordNow();appendLearningRecord({...now,category:"word",type:"wordCard",title:"“"+w.word+"”",wordKey:key,status:"learned"});toast("已记录为学会")}else toast("该词已记录为学会");return render();}
 if(a==="start-word-practice")return openWordPractice("learn",0);
 if(a==="continue-word-practice"){state.wordPracticeCard=false;state.wordPracticeCardQuestion=null;return advanceWordPractice();}
 if(a==="switch-word-mode")return toast("当前已在词卡学习中，可用左右按钮切换词目");
 if(a==="submit-word")return submitWord();
 if(a==="next-word-question"){if(state.wordPracticeIndex+1>=practicePool().length)return setState({wordPracticeResult:true});return setState({wordPracticeIndex:state.wordPracticeIndex+1,wordPracticeAnswer:"",wordPracticeFeedback:null});}
 if(a==="open-word-card"){state.wordMode="cards";return setState({screen:"wordHome",wordMode:"cards",wordFace:"back"});}
 if(a==="back-word-cards")return setState({screen:"wordHome",module:"words",wordMode:"cards",wordView:"cards",wordFace:"front",wordPracticeResult:false});
 if(a==="next-word-group")return startNextWordGroup();
 if(a==="retry-word")return openWordPractice(state.wordPracticeMode,state.wordPracticeOffset);
}
function submitDirect(){
 if(state.directResult)return;
 const p=currentPoem(),sentences=poemSentences(p);ensurePairPattern(p);
 const rate=directBlankRate(p);
 const questions=sentences.map((sentence,i)=>({question:sentence,userAnswer:String(state.directClozeAnswers[i]||"").trim(),correctAnswer:directBlankTarget(p,i),correct:normalizeAnswer(state.directClozeAnswers[i]||"")===normalizeAnswer(directBlankTarget(p,i))}));
 recordQuestions("direct",p,questions,rate);
 state.directStats={practiced:state.directStats.practiced+sentences.length,bestRate:Math.max(state.directStats.bestRate,rate)};
 state.directResult=true;
 state.directPerfectCountdown=rate===100?3:0;
 render();
 if(rate===100)startDirectPerfectCountdown();
}
function submitComp(){
 const p=currentPoem(),position=state.compQuestion,q=currentCompQuestion(p),answer=String(state.compAnswers[position]||"").trim();if(state.compResults[position])return;const rate=answerRate(answer,q.answer),correct=rate===100;state.compStats={practiced:state.compStats.practiced+1,correct:state.compStats.correct+(correct?1:0),totalRate:state.compStats.totalRate+rate};state.compResults[position]={correct,rate,unanswered:!answer};
 const finished=state.compRound.length>0&&state.compRound.every((_,index)=>state.compResults[index]);
 if(finished){const questions=state.compRound.map((questionIndex,index)=>{const item=p.comprehension[questionIndex],result=state.compResults[index];return {question:item.title,userAnswer:String(state.compAnswers[index]||"").trim(),correctAnswer:item.answer,correct:result.correct,poemTitle:p.title}});const totalRate=Math.round(questions.filter(item=>item.correct).length/questions.length*100);recordQuestions(state.compSessionType||"comprehension",p,questions,totalRate)}
 setState({compFeedback:{correct,rate,unanswered:!answer}});
}
function nextComp(){if(state.compQuestion>=4)return;setState({compQuestion:state.compQuestion+1,compFeedback:null});}
function currentWordForPractice(){const q=currentWordPracticeQuestion(),list=practicePool();return q?list[q.wordIndex]:list[0]}
function finishWordPractice(){const list=practicePool().slice();list.forEach(w=>{const key=wordKey(w);if(!state.learned[key]){state.learned[key]=true;const now=recordNow();appendLearningRecord({...now,category:"word",type:"wordCard",title:"“"+w.word+"”",wordKey:key,status:"learned"})}});state.wordPracticeResult=true;state.wordPracticeCard=false;state.wordPracticeCardQuestion=null;state.wordPracticeLocked=false;render()}
function startComparePractice(){state.wordPracticeStage="compare";state.wordPracticeQueue=createCompareQuestions(practicePool());state.wordPracticeRetryQueue=[];state.wordPracticeIndex=0;state.wordPracticeAnswer="";state.wordPracticeFeedback=null;state.wordPracticeLocked=false;render()}
function advanceWordPractice(){
 state.wordPracticeAnswer="";state.wordPracticeFeedback=null;state.wordPracticeLocked=false;
 if(state.wordPracticeIndex+1<state.wordPracticeQueue.length){state.wordPracticeIndex+=1;return render()}
 const retry=state.wordPracticeRetryQueue.slice();
 if(retry.length){state.wordPracticeStage=state.wordPracticeStage.startsWith("meaning")?"meaningRedo":"compareRedo";state.wordPracticeQueue=retry;state.wordPracticeRetryQueue=[];state.wordPracticeIndex=0;return render()}
 if(state.wordPracticeStage.startsWith("meaning"))return startComparePractice();
 finishWordPractice();
}
function answerWordChoice(choice){
 if(state.wordPracticeLocked||state.wordPracticeCard)return;
 const q=currentWordPracticeQuestion();if(!q)return;
 const correct=choice===q.correct;state.wordPracticeAnswer=choice;state.wordPracticeFeedback={correct};state.wordPracticeLocked=true;
 if(!correct){state.wordPracticeRetryQueue.push(q);state.wordPracticeMistakes+=1}
 render();
 clearTimeout(window.__wordPracticeTimer);
 const isFinal=correct&&state.wordPracticeStage.startsWith("compare")&&state.wordPracticeIndex===state.wordPracticeQueue.length-1&&state.wordPracticeRetryQueue.length===0;
 window.__wordPracticeTimer=setTimeout(()=>{if(!correct){state.wordPracticeCard=true;state.wordPracticeCardQuestion=q;state.wordPracticeLocked=false;render()}else advanceWordPractice()},isFinal?1000:500);
}
document.addEventListener("click",e=>{const c=e.target.closest("[data-word-choice]");if(c)answerWordChoice(c.dataset.wordChoice)});
document.addEventListener("click",e=>{const option=e.target.closest("[data-feedback-option]");if(!option)return;state.feedbackChoice=option.dataset.feedbackOption;document.querySelectorAll("[data-feedback-option]").forEach(x=>x.classList.toggle("selected",x===option));document.getElementById("feedbackOther").classList.toggle("show",state.feedbackChoice==="其他");});
render();
</script>
