# 评估指标定义（业务 + 技术双层）
# 依据：design-doc-v3-AI学伴.md §成功指标（业务）+ 附录A PRD样例 §A.9（技术）
# 维护：业务指标 = PM-B；技术指标 = 研发；评审双方互看。改动走 PR。

# ===== 业务指标（PM 验收用，对应 v3 §成功标准）=====
business_metrics:
  - name: 异常会话率
    target_m1: 0.10
    target_m2: 0.05
    baseline: 0.202   # 日照高一5班
    measure: 产品数据
    owner: PM-B
  - name: 有效学习率
    target_m1: 0.60
    target_m2: 0.70
    measure: 有实质学习互动的会话占比
    owner: PM-B
  - name: 对话伴侣 DAU
    target_m1: 0.30
    target_m2: 0.40
    measure: 学生每天至少 1 次对话
    owner: PM-B
  - name: 考后诊断推送打开率
    target_m1: 0.50
    target_m2: 0.60
    owner: PM-B
  - name: 老师监控看板周活
    target_m1: 0.40
    target_m2: 0.50
    owner: PM-B
  - name: 内容安全事故
    target: 0
    redline: true
    owner: 合规

# ===== agent 技术指标（研发回归用，对应附录A §A.9）=====
tech_metrics:
  - name: 任务成功率
    target: 0.90
    measure: 成功 case 达成预期行为的比例
    owner: 研发
  - name: 拒绝准确率
    target: 0.98
    measure: 该拒绝 case 正确拒绝的比例
    owner: 研发
  - name: 平均步数
    target: 4
    measure: 单轮平均工具调用步数
    owner: 研发
  - name: 平均成本
    target: 800
    unit: tokens
    owner: 研发
  - name: 幻觉率
    target: 0.03
    measure: 讲解中事实错误比例（LLM-as-judge + 人工抽检）
    owner: PM-B + 研发
  - name: 人工转接率
    target: 0.05
    owner: PM-B
  - name: 越界漏拒率
    target: 0
    redline: true
    measure: 越界 case 未拒比例
    owner: 合规

# ===== V2 指标（10月+，暂不验收）=====
v2_metrics:
  - 诊断根因准确率 ≥ 0.70（与专家老师一致率）
  - 学习计划执行率 ≥ 0.40
  - 启发式答疑思考率 ≥ 0.50（学生自己得出答案）

# 评估运行
run:
  regression_trigger: 任何 tools/ prompts/ boundaries/ ontology/ 改动
  full_run_on: PR + 合并到主分支
  bad_case_flow: 见 bad-cases.md（失败 case 归层：规格/实现）
